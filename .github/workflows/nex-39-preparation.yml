name: NEX-39 Preparation

on:
  push:
    branches:
      - feature/NEX-39-capacity-reservation

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/NEX-39-capacity-reservation

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format NEX-39 files
        run: >-
          pnpm exec prettier --write
          packages/database/src/schema/capacity-reservation.ts
          packages/database/src/schema/index.ts
          apps/api/src/negotiation/capacity-reservation.controller.ts
          apps/api/src/negotiation/capacity-reservation.service.ts
          apps/api/src/negotiation/capacity-reservation.validation.ts
          apps/api/src/negotiation/capacity-reservation.validation.spec.ts
          apps/api/src/negotiation/negotiation.module.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Generate Drizzle migration
        run: pnpm --filter @nexora/database db:generate

      - name: Apply restricted runtime grants to generated migration
        shell: bash
        run: |
          migration="$(ls packages/database/migrations/0013_*.sql | head -n 1)"
          test -n "$migration"
          cat >> "$migration" <<'SQL'
          --> statement-breakpoint
          GRANT SELECT, INSERT ON TABLE capacity_reservations TO nexora_app;
          --> statement-breakpoint
          GRANT UPDATE (status, cancelled_by_user_id, cancelled_at, cancel_reason, updated_at) ON TABLE capacity_reservations TO nexora_app;
          --> statement-breakpoint
          GRANT SELECT, INSERT ON TABLE capacity_reservation_events TO nexora_app;
          SQL

      - name: Check Drizzle migrations
        run: pnpm --filter @nexora/database db:check

      - name: Commit generated artifacts
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/database/migrations packages/database/src/schema apps/api/src/negotiation
          git commit -m 'NEX-39 generate reservation migration and format'
          git push
