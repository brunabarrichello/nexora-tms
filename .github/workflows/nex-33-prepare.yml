name: NEX-33 Finalize Neon Gate

on:
  push:
    branches:
      - feature/NEX-33-drivers

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/NEX-33-drivers

      - name: Patch permanent Neon gate
        run: python .github/scripts/nex33_finalize.py

      - name: Validate patch
        run: |
          grep -q 'apps/api/src/capacity/\*\*' .github/workflows/neon-pr-gate.yml
          grep -q 'Expected 25 application tables' .github/workflows/neon-pr-gate.yml
          grep -q 'Expected RLS on 22 tenant-scoped tables' .github/workflows/neon-pr-gate.yml
          grep -q 'Expected 10 Drizzle migration records' .github/workflows/neon-pr-gate.yml
          grep -q 'driver_registration_status' .github/workflows/neon-pr-gate.yml
          grep -q 'driver_audit' .github/workflows/neon-pr-gate.yml
          git diff --check

      - name: Remove temporary finalizer
        run: git rm .github/workflows/nex-33-prepare.yml .github/scripts/nex33_finalize.py

      - name: Commit permanent NEX-33 gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit -m "NEX-33 extend permanent Neon gate"
          git push origin HEAD:feature/NEX-33-drivers
