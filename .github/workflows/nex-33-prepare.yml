name: NEX-33 Render Neon Gate

on:
  push:
    branches:
      - feature/NEX-33-drivers

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/NEX-33-drivers

      - name: Render patched gate as non-workflow artifact
        run: |
          python .github/scripts/nex33_finalize.py
          mkdir -p .github/generated
          cp .github/workflows/neon-pr-gate.yml .github/generated/neon-pr-gate.yml.txt
          git checkout -- .github/workflows/neon-pr-gate.yml

      - name: Validate rendered gate
        run: |
          grep -q 'apps/api/src/capacity/\*\*' .github/generated/neon-pr-gate.yml.txt
          grep -q 'Expected 25 application tables' .github/generated/neon-pr-gate.yml.txt
          grep -q 'Expected RLS on 22 tenant-scoped tables' .github/generated/neon-pr-gate.yml.txt
          grep -q 'Expected 10 Drizzle migration records' .github/generated/neon-pr-gate.yml.txt
          grep -q 'driver_registration_status' .github/generated/neon-pr-gate.yml.txt
          grep -q 'driver_audit' .github/generated/neon-pr-gate.yml.txt
          git diff --check

      - name: Commit rendered artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/generated/neon-pr-gate.yml.txt
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit -m "NEX-33 render permanent Neon gate"
          git push origin HEAD:feature/NEX-33-drivers
