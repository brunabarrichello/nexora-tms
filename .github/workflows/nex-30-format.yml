name: NEX-30 Format

on:
  push:
    branches:
      - feature/NEX-30-route-stops

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/NEX-30-route-stops

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format NEX-30 files
        run: >-
          pnpm exec prettier --write
          packages/database/src/schema/freight.ts
          apps/api/src/freight/transport-route.validation.ts
          apps/api/src/freight/transport-route.validation.spec.ts
          apps/api/src/freight/transport-route.service.ts
          apps/api/src/freight/transport-route.controller.ts
          apps/api/src/freight/freight.module.ts
          apps/api/package.json

      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/schema apps/api/src/freight apps/api/package.json
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          SKIP_SIMPLE_GIT_HOOKS=1 git commit -m "NEX-30 style: format route stop vertical"
          SKIP_SIMPLE_GIT_HOOKS=1 git push origin HEAD:feature/NEX-30-route-stops
