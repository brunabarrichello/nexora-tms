name: Neon Production Migrate

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MIGRATE-PRODUCTION to apply versioned migrations to the canonical production branch
        required: true
        type: string
      release_sha:
        description: Exact 40-character Git commit SHA to qualify and migrate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: neon-production-migrate
  cancel-in-progress: false

env:
  NEON_PROJECT_ID: raspy-river-76339604
  MIN_PRODUCTION_HISTORY_SECONDS: 604800

jobs:
  migrate:
    name: Migrate canonical Neon production branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production

    steps:
      - name: Validate explicit production migration confirmation
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.confirmation }}" == "MIGRATE-PRODUCTION" ]] || {
            echo "Explicit confirmation MIGRATE-PRODUCTION is required." >&2
            exit 1
          }
          [[ "${{ inputs.release_sha }}" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "release_sha must be an exact 40-character Git SHA." >&2
            exit 1
          }

      - name: Checkout pinned release SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Verify release SHA belongs to main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "${{ inputs.release_sha }}" origin/main || {
            echo "release_sha is not contained in main history." >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "${{ inputs.release_sha }}" ]] || {
            echo "Checked out SHA does not match the requested release SHA." >&2
            exit 1
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Resolve canonical root/default/protected production branch
        id: production
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}" || {
            echo "NEON_API_KEY is not configured for the protected production environment." >&2
            exit 1
          }

          branches_json="$(curl -fsS \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches")"

          production_json="$(jq -ec '[.branches[] | select(.name == "production")][0]' <<<"$branches_json")" || {
            echo "Canonical Neon production branch does not exist." >&2
            exit 1
          }

          branch_id="$(jq -er '.id' <<<"$production_json")"
          parent_id="$(jq -r '.parent_id // ""' <<<"$production_json")"
          is_default="$(jq -er '.default' <<<"$production_json")"
          is_protected="$(jq -er '.protected' <<<"$production_json")"

          [[ -z "$parent_id" ]] || {
            echo "Production migration is blocked: production must be a root branch." >&2
            exit 1
          }
          [[ "$is_default" == "true" ]] || {
            echo "Production migration is blocked: production must be the default branch." >&2
            exit 1
          }
          [[ "$is_protected" == "true" ]] || {
            echo "Production migration is blocked: production branch protection is required." >&2
            exit 1
          }

          echo "branch_id=$branch_id" >> "$GITHUB_OUTPUT"

      - name: Verify production retention and permanent network perimeter
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          project_json="$(curl -fsS \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}")"

          history_seconds="$(jq -er '.project.history_retention_seconds' <<<"$project_json")"
          block_public="$(jq -er '.project.settings.block_public_connections' <<<"$project_json")"
          protected_only="$(jq -er '.project.settings.allowed_ips.protected_branches_only' <<<"$project_json")"
          allowed_ip_count="$(jq -er '.project.settings.allowed_ips.ips | length' <<<"$project_json")"

          [[ "$history_seconds" -ge "$MIN_PRODUCTION_HISTORY_SECONDS" ]] || {
            echo "Production migration is blocked: history window must be at least 7 days (${MIN_PRODUCTION_HISTORY_SECONDS}s), found ${history_seconds}s." >&2
            exit 1
          }
          [[ "$block_public" == "false" ]] || {
            echo "Production migration is blocked: this workflow requires public connectivity constrained by explicit IP Allow entries." >&2
            exit 1
          }
          [[ "$protected_only" == "true" ]] || {
            echo "Production migration is blocked: IP Allow must be scoped to protected branches only." >&2
            exit 1
          }
          [[ "$allowed_ip_count" -gt 0 ]] || {
            echo "Production migration is blocked: the permanent Railway static egress allowlist is empty." >&2
            exit 1
          }

      - name: Temporarily allow this GitHub runner IPv4
        id: runner_perimeter
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail

          runner_ip="$(curl -fsS --max-time 10 https://api.ipify.org)"
          python3 - "$runner_ip" <<'PY'
          import ipaddress
          import sys
          address = ipaddress.ip_address(sys.argv[1])
          if address.version != 4:
              raise SystemExit("GitHub runner did not resolve to an IPv4 address.")
          PY
          runner_cidr="${runner_ip}/32"

          project_json="$(curl -fsS \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}")"
          current_ips="$(jq -c '.project.settings.allowed_ips.ips' <<<"$project_json")"
          protected_only="$(jq -er '.project.settings.allowed_ips.protected_branches_only' <<<"$project_json")"

          [[ "$protected_only" == "true" ]] || {
            echo "Refusing temporary runner access because protected-branch-only IP Allow is not enabled." >&2
            exit 1
          }

          if jq -e --arg cidr "$runner_cidr" 'index($cidr) != null' <<<"$current_ips" >/dev/null; then
            echo "Runner IPv4 is already present in the allowlist; no temporary entry will be removed later."
            echo "added=false" >> "$GITHUB_OUTPUT"
          else
            updated_ips="$(jq -c --arg cidr "$runner_cidr" '. + [$cidr] | unique' <<<"$current_ips")"
            payload="$(jq -cn --argjson ips "$updated_ips" '{project:{settings:{allowed_ips:{ips:$ips,protected_branches_only:true}}}}')"

            curl -fsS -X PATCH \
              -H "Authorization: Bearer ${NEON_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}" >/dev/null

            verify_json="$(curl -fsS \
              -H "Authorization: Bearer ${NEON_API_KEY}" \
              "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}")"
            jq -e --arg cidr "$runner_cidr" '.project.settings.allowed_ips.ips | index($cidr) != null' <<<"$verify_json" >/dev/null || {
              echo "Temporary GitHub runner /32 was not applied." >&2
              exit 1
            }
            echo "added=true" >> "$GITHUB_OUTPUT"
          fi

          echo "runner_cidr=$runner_cidr" >> "$GITHUB_OUTPUT"
          echo "GitHub runner network access is constrained to one IPv4 /32 for this migration window."

      - name: Resolve production connection strings without creating branches
        id: connections
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PRODUCTION_BRANCH_ID: ${{ steps.production.outputs.branch_id }}
        run: |
          set -euo pipefail

          connection_uri() {
            local role_name="$1"
            curl -fsSG \
              -H "Authorization: Bearer ${NEON_API_KEY}" \
              --data-urlencode "branch_id=${PRODUCTION_BRANCH_ID}" \
              --data-urlencode "database_name=neondb" \
              --data-urlencode "role_name=${role_name}" \
              --data-urlencode "pooled=false" \
              "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri" \
              | jq -er '.uri'
          }

          admin_url="$(connection_uri neondb_owner)"
          migrator_url="$(connection_uri nexora_migrator)"
          app_url="$(connection_uri nexora_app)"

          for value in "$admin_url" "$migrator_url" "$app_url"; do
            test -n "$value" || { echo "Failed to resolve a required production connection string." >&2; exit 1; }
            echo "::add-mask::$value"
          done

          echo "admin_url=$admin_url" >> "$GITHUB_OUTPUT"
          echo "migrator_url=$migrator_url" >> "$GITHUB_OUTPUT"
          echo "app_url=$app_url" >> "$GITHUB_OUTPUT"

      - name: Validate production roles and migration capability
        shell: bash
        env:
          ADMIN_DATABASE_URL: ${{ steps.connections.outputs.admin_url }}
        run: |
          set -euo pipefail
          missing_roles="$(psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
            with required(role_name) as (
              values ('nexora_owner'), ('nexora_migrator'), ('nexora_app'), ('nexora_worker')
            )
            select coalesce(string_agg(role_name, ',' order by role_name), '')
              from required r
             where not exists (select 1 from pg_roles p where p.rolname = r.role_name);
          ")"
          [[ -z "$missing_roles" ]] || {
            echo "Missing required production roles: $missing_roles" >&2
            exit 1
          }
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT CREATE ON DATABASE neondb TO nexora_owner;
          GRANT USAGE, CREATE ON SCHEMA public TO nexora_owner;
          SQL

      - name: Apply pinned versioned Drizzle migrations
        shell: bash
        env:
          MIGRATOR_DATABASE_URL: ${{ steps.connections.outputs.migrator_url }}
        run: |
          set -euo pipefail
          if [[ "$MIGRATOR_DATABASE_URL" == *"?"* ]]; then
            OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}&options=-c%20role%3Dnexora_owner"
          else
            OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}?options=-c%20role%3Dnexora_owner"
          fi
          echo "::add-mask::$OWNER_DATABASE_URL"
          pnpm --filter @nexora/database db:check
          DATABASE_URL="$OWNER_DATABASE_URL" pnpm --filter @nexora/database db:migrate
          expected="$(jq '.entries | length' packages/database/migrations/meta/_journal.json)"
          actual="$(psql "$OWNER_DATABASE_URL" -Atqc 'select count(*) from drizzle.__drizzle_migrations')"
          [[ "$actual" == "$expected" ]] || {
            echo "Production migration ledger mismatch: expected $expected, found $actual" >&2
            exit 1
          }
          echo "EXPECTED_MIGRATIONS=$expected" >> "$GITHUB_ENV"
          echo "OWNER_DATABASE_URL=$OWNER_DATABASE_URL" >> "$GITHUB_ENV"

      - name: Verify Wave 0024 schema and audit invariants
        shell: bash
        run: |
          set -euo pipefail
          psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/ci/wave-0024-audit-schema.sql
          psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/ci/wave-0024-audit-immutability.sql

      - name: Verify runtime RLS and tenant isolation
        shell: bash
        env:
          APP_DATABASE_URL: ${{ steps.connections.outputs.app_url }}
        run: |
          set -euo pipefail
          psql "$APP_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/ci/wave-0024-audit-runtime.sql

      - name: Remove temporary GitHub runner IPv4
        if: ${{ always() && steps.runner_perimeter.outputs.added == 'true' }}
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          RUNNER_CIDR: ${{ steps.runner_perimeter.outputs.runner_cidr }}
        run: |
          set -euo pipefail
          test -n "${RUNNER_CIDR:-}" || {
            echo "Runner CIDR output is missing; refusing ambiguous allowlist mutation." >&2
            exit 1
          }

          project_json="$(curl -fsS \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}")"
          current_ips="$(jq -c '.project.settings.allowed_ips.ips' <<<"$project_json")"
          updated_ips="$(jq -c --arg cidr "$RUNNER_CIDR" 'map(select(. != $cidr))' <<<"$current_ips")"

          [[ "$(jq 'length' <<<"$updated_ips")" -gt 0 ]] || {
            echo "Refusing to remove the temporary runner entry because it would leave Production with an empty permanent allowlist." >&2
            exit 1
          }

          payload="$(jq -cn --argjson ips "$updated_ips" '{project:{settings:{allowed_ips:{ips:$ips,protected_branches_only:true}}}}')"
          curl -fsS -X PATCH \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}" >/dev/null

          verify_json="$(curl -fsS \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}")"
          if jq -e --arg cidr "$RUNNER_CIDR" '.project.settings.allowed_ips.ips | index($cidr) != null' <<<"$verify_json" >/dev/null; then
            echo "Temporary GitHub runner /32 remains in the allowlist after cleanup." >&2
            exit 1
          fi
          [[ "$(jq -er '.project.settings.allowed_ips.protected_branches_only' <<<"$verify_json")" == "true" ]] || {
            echo "Protected-branch-only IP Allow was not preserved during cleanup." >&2
            exit 1
          }
          echo "Temporary GitHub runner /32 removed; permanent Railway perimeter preserved."

      - name: Production migration summary
        shell: bash
        run: |
          {
            echo "## Neon Production migration passed"
            echo ""
            echo "- Branch: production"
            echo "- Branch type: root/default/protected"
            echo "- Minimum history window: >= 7 days"
            echo "- Permanent network perimeter: restricted to approved static egress IPs"
            echo "- Migration runner access: one temporary IPv4 /32, automatically removed when added by this run"
            echo "- Release SHA: ${{ inputs.release_sha }}"
            echo "- Versioned migrations: ${EXPECTED_MIGRATIONS}"
            echo "- Migration ledger: verified"
            echo "- Wave 0024 schema/audit invariants: verified"
            echo "- Runtime RLS and tenant isolation: verified"
            echo "- Railway variables changed: no"
            echo "- API redeployed: no"
          } >> "$GITHUB_STEP_SUMMARY"
