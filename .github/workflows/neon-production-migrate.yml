name: Neon Production Migrate

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MIGRATE-PRODUCTION to migrate or qualify canonical Production
        required: true
        type: string
      free_tier_acknowledgement:
        description: Type ACCEPT-FREE-TIER-RISKS to acknowledge the Free-tier restore and network limitations
        required: true
        type: string
      release_sha:
        description: Exact 40-character Git commit SHA to qualify and migrate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: neon-production-migrate
  cancel-in-progress: false

env:
  NEON_PROJECT_ID: raspy-river-76339604
  MIN_FREE_HISTORY_SECONDS: 21600
  FREE_BRANCH_LIMIT: 10
  PGSSLMODE: verify-full
  PGSSLROOTCERT: /etc/ssl/certs/ca-certificates.crt

jobs:
  migrate:
    name: Migrate or qualify canonical Neon Production on Free tier
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production

    steps:
      - name: Validate explicit Production migration confirmation
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.confirmation }}" == "MIGRATE-PRODUCTION" ]] || {
            echo "Explicit confirmation MIGRATE-PRODUCTION is required." >&2
            exit 1
          }
          [[ "${{ inputs.free_tier_acknowledgement }}" == "ACCEPT-FREE-TIER-RISKS" ]] || {
            echo "Explicit acknowledgement ACCEPT-FREE-TIER-RISKS is required for the Free-tier Production profile." >&2
            exit 1
          }
          [[ "${{ inputs.release_sha }}" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "release_sha must be an exact 40-character Git SHA." >&2
            exit 1
          }

      - name: Checkout pinned release SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Verify release SHA belongs to main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "${{ inputs.release_sha }}" origin/main || {
            echo "release_sha is not contained in main history." >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "${{ inputs.release_sha }}" ]] || {
            echo "Checked out SHA does not match the requested release SHA." >&2
            exit 1
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          test -r "$PGSSLROOTCERT" || {
            echo "System CA bundle is unavailable at $PGSSLROOTCERT." >&2
            exit 1
          }

      - name: Validate local migration artifacts before touching Production
        run: pnpm --filter @nexora/database db:check

      - name: Resolve canonical root/default Production and Free-tier posture
        id: production
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}" || {
            echo "NEON_API_KEY is not configured for the protected GitHub production environment." >&2
            exit 1
          }

          branches_json="$(curl -fsS \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches")"
          project_json="$(curl -fsS \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}")"

          production_json="$(jq -ec '[.branches[] | select(.name == "production")][0]' <<<"$branches_json")" || {
            echo "Canonical Neon production branch does not exist." >&2
            exit 1
          }

          branch_id="$(jq -er '.id' <<<"$production_json")"
          parent_id="$(jq -r '.parent_id // ""' <<<"$production_json")"
          is_default="$(jq -r '.default' <<<"$production_json")"
          branch_count="$(jq '.branches | length' <<<"$branches_json")"
          history_seconds="$(jq -er '.project.history_retention_seconds' <<<"$project_json")"

          [[ -z "$parent_id" ]] || {
            echo "Production migration is blocked: production must be a root branch." >&2
            exit 1
          }
          [[ "$is_default" == "true" ]] || {
            echo "Production migration is blocked: production must be the default branch." >&2
            exit 1
          }
          [[ "$history_seconds" -ge "$MIN_FREE_HISTORY_SECONDS" ]] || {
            echo "Production migration is blocked: expected at least the Free-tier restore window (${MIN_FREE_HISTORY_SECONDS}s), found ${history_seconds}s." >&2
            exit 1
          }

          echo "branch_id=$branch_id" >> "$GITHUB_OUTPUT"
          echo "branch_count=$branch_count" >> "$GITHUB_OUTPUT"
          echo "history_seconds=$history_seconds" >> "$GITHUB_OUTPUT"

      - name: Resolve Production connection strings
        id: connections
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PRODUCTION_BRANCH_ID: ${{ steps.production.outputs.branch_id }}
        run: |
          set -euo pipefail

          harden_connection_uri() {
            local raw_uri="$1"
            python3 - "$raw_uri" <<'PY'
          import sys
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit

          uri = urlsplit(sys.argv[1])
          query = [
              (key, value)
              for key, value in parse_qsl(uri.query, keep_blank_values=True)
              if key.lower() not in {"sslmode", "sslrootcert"}
          ]
          query.append(("sslmode", "verify-full"))
          print(urlunsplit((uri.scheme, uri.netloc, uri.path, urlencode(query), uri.fragment)))
          PY
          }

          connection_uri() {
            local role_name="$1"
            local raw_uri
            raw_uri="$(curl -fsSG \
              -H "Authorization: Bearer ${NEON_API_KEY}" \
              --data-urlencode "branch_id=${PRODUCTION_BRANCH_ID}" \
              --data-urlencode "database_name=neondb" \
              --data-urlencode "role_name=${role_name}" \
              --data-urlencode "pooled=false" \
              "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri" \
              | jq -er '.uri')"
            echo "::add-mask::$raw_uri" >&2
            harden_connection_uri "$raw_uri"
          }

          admin_url="$(connection_uri neondb_owner)"
          migrator_url="$(connection_uri nexora_migrator)"
          app_url="$(connection_uri nexora_app)"

          for value in "$admin_url" "$migrator_url" "$app_url"; do
            test -n "$value" || { echo "Failed to resolve a required Production connection string." >&2; exit 1; }
            [[ "$value" == *"sslmode=verify-full"* ]] || {
              echo "Production connection string is not hardened with sslmode=verify-full." >&2
              exit 1
            }
            echo "::add-mask::$value"
          done

          echo "admin_url=$admin_url" >> "$GITHUB_OUTPUT"
          echo "migrator_url=$migrator_url" >> "$GITHUB_OUTPUT"
          echo "app_url=$app_url" >> "$GITHUB_OUTPUT"

      - name: Verify client TLS, roles and migration capability
        shell: bash
        env:
          ADMIN_DATABASE_URL: ${{ steps.connections.outputs.admin_url }}
          MIGRATOR_DATABASE_URL: ${{ steps.connections.outputs.migrator_url }}
          APP_DATABASE_URL: ${{ steps.connections.outputs.app_url }}
        run: |
          set -euo pipefail

          verify_client_tls() {
            local connection_name="$1"
            local url="$2"
            local conninfo

            # Neon terminates client TLS at its proxy layer. The authoritative proof
            # for the GitHub-runner-to-Neon segment is therefore libpq client state,
            # not server-side pg_stat_ssl. sslmode=verify-full + the runner CA bundle
            # enforces encryption, CA validation and hostname verification.
            conninfo="$(psql "$url" -X -v ON_ERROR_STOP=1 -c '\conninfo' 2>&1)" || {
              echo "Production migration is blocked: ${connection_name} failed verified TLS connection." >&2
              exit 1
            }

            grep -Eq 'SSL connection \(protocol: TLSv1\.[23], cipher: [^,)]+' <<<"$conninfo" || {
              echo "Production migration is blocked: ${connection_name} did not report TLSv1.2/TLSv1.3 with a cipher from the libpq client." >&2
              exit 1
            }
          }

          verify_client_tls ADMIN_DATABASE_URL "$ADMIN_DATABASE_URL"
          verify_client_tls MIGRATOR_DATABASE_URL "$MIGRATOR_DATABASE_URL"
          verify_client_tls APP_DATABASE_URL "$APP_DATABASE_URL"

          missing_roles="$(psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
            with required(role_name) as (
              values ('nexora_owner'), ('nexora_migrator'), ('nexora_app'), ('nexora_worker')
            )
            select coalesce(string_agg(role_name, ',' order by role_name), '')
              from required r
             where not exists (select 1 from pg_roles p where p.rolname = r.role_name);
          ")"
          [[ -z "$missing_roles" ]] || {
            echo "Missing required Production roles: $missing_roles" >&2
            exit 1
          }

          posture="$(psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
            select count(*)
              from pg_roles
             where (rolname = 'nexora_owner' and rolcanlogin = false and rolsuper = false and rolbypassrls = false and rolcreatedb = false and rolcreaterole = false)
                or (rolname in ('nexora_migrator','nexora_app','nexora_worker') and rolcanlogin = true and rolsuper = false and rolbypassrls = false and rolcreatedb = false and rolcreaterole = false);
          ")"
          [[ "$posture" == "4" ]] || {
            echo "Production migration is blocked: minimum-privilege role posture is not satisfied." >&2
            exit 1
          }

          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT CREATE ON DATABASE neondb TO nexora_owner;
          GRANT USAGE, CREATE ON SCHEMA public TO nexora_owner;
          SQL

      - name: Inspect Production migration ledger
        id: ledger
        shell: bash
        env:
          MIGRATOR_DATABASE_URL: ${{ steps.connections.outputs.migrator_url }}
        run: |
          set -euo pipefail

          if [[ "$MIGRATOR_DATABASE_URL" == *"?"* ]]; then
            OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}&options=-c%20role%3Dnexora_owner"
          else
            OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}?options=-c%20role%3Dnexora_owner"
          fi
          echo "::add-mask::$OWNER_DATABASE_URL"

          expected="$(jq '.entries | length' packages/database/migrations/meta/_journal.json)"
          ledger_exists="$(psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc \
            "select (to_regclass('drizzle.__drizzle_migrations') is not null)::text;")"

          if [[ "$ledger_exists" == "true" ]]; then
            actual="$(psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc \
              'select count(*) from drizzle.__drizzle_migrations;')"
          else
            actual=0
          fi

          [[ "$actual" -le "$expected" ]] || {
            echo "Production migration is blocked: ledger has $actual entries but pinned release expects only $expected." >&2
            exit 1
          }

          migration_required=false
          if [[ "$actual" -lt "$expected" ]]; then
            migration_required=true
          fi

          echo "expected=$expected" >> "$GITHUB_OUTPUT"
          echo "actual_before=$actual" >> "$GITHUB_OUTPUT"
          echo "migration_required=$migration_required" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_MIGRATIONS=$expected" >> "$GITHUB_ENV"
          echo "OWNER_DATABASE_URL=$OWNER_DATABASE_URL" >> "$GITHUB_ENV"

          if [[ "$migration_required" == "true" ]]; then
            echo "Production ledger is $actual/$expected; migration is required."
          else
            echo "Production ledger is already $actual/$expected; entering qualification-only resume mode."
          fi

      - name: Create retained pre-migration Neon checkpoint
        if: steps.ledger.outputs.migration_required == 'true'
        id: checkpoint
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PRODUCTION_BRANCH_ID: ${{ steps.production.outputs.branch_id }}
          BRANCH_COUNT: ${{ steps.production.outputs.branch_count }}
        run: |
          set -euo pipefail

          [[ "$BRANCH_COUNT" -lt "$FREE_BRANCH_LIMIT" ]] || {
            echo "Production migration is blocked: ${BRANCH_COUNT}/${FREE_BRANCH_LIMIT} Neon branches are in use and one slot is required for the pre-migration checkpoint." >&2
            exit 1
          }

          checkpoint_name="production-pre-migration-${GITHUB_RUN_ID}"
          payload="$(jq -cn --arg name "$checkpoint_name" --arg parent "$PRODUCTION_BRANCH_ID" '{branch:{name:$name,parent_id:$parent}}')"

          response="$(curl -fsS -X POST \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches")"

          checkpoint_id="$(jq -er '.branch.id' <<<"$response")"
          checkpoint_parent="$(jq -er '.branch.parent_id' <<<"$response")"
          [[ "$checkpoint_parent" == "$PRODUCTION_BRANCH_ID" ]] || {
            echo "Pre-migration checkpoint was not created from canonical Production." >&2
            exit 1
          }

          echo "name=$checkpoint_name" >> "$GITHUB_OUTPUT"
          echo "id=$checkpoint_id" >> "$GITHUB_OUTPUT"
          echo "Created retained checkpoint ${checkpoint_name} (${checkpoint_id}) before schema migration."

      - name: Apply pinned versioned Drizzle migrations
        if: steps.ledger.outputs.migration_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL="$OWNER_DATABASE_URL" pnpm --filter @nexora/database db:migrate

      - name: Verify Production migration ledger
        shell: bash
        run: |
          set -euo pipefail
          actual="$(psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc \
            'select count(*) from drizzle.__drizzle_migrations;')"
          [[ "$actual" == "$EXPECTED_MIGRATIONS" ]] || {
            echo "Production migration ledger mismatch: expected $EXPECTED_MIGRATIONS, found $actual" >&2
            exit 1
          }
          echo "Migration ledger verified at ${actual}/${EXPECTED_MIGRATIONS}."

      - name: Verify Wave 0024 schema and audit invariants
        shell: bash
        run: |
          set -euo pipefail
          psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/ci/wave-0024-audit-schema.sql
          psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/ci/wave-0024-audit-immutability.sql

      - name: Verify runtime RLS and tenant isolation
        shell: bash
        env:
          APP_DATABASE_URL: ${{ steps.connections.outputs.app_url }}
        run: |
          set -euo pipefail
          psql "$APP_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/ci/wave-0024-audit-runtime.sql

      - name: Production migration summary
        shell: bash
        run: |
          {
            echo "## Neon Production migration/qualification passed — Free-tier profile"
            echo ""
            echo "- Branch: production"
            echo "- Branch type: root/default"
            echo "- Release SHA: ${{ inputs.release_sha }}"
            echo "- Free-tier risk acknowledgement: explicit"
            echo "- Restore/history window observed: ${{ steps.production.outputs.history_seconds }} seconds"
            echo "- Ledger before this run: ${{ steps.ledger.outputs.actual_before }}/${{ steps.ledger.outputs.expected }}"
            if [[ "${{ steps.ledger.outputs.migration_required }}" == "true" ]]; then
              echo "- Execution mode: migration + qualification"
              echo "- Pre-migration checkpoint retained: ${{ steps.checkpoint.outputs.name }} (${{ steps.checkpoint.outputs.id }})"
              echo "- Migrations applied this run: yes"
            else
              echo "- Execution mode: qualification-only resume"
              echo "- Pre-migration checkpoint created this run: no"
              echo "- Migrations applied this run: no"
            fi
            echo "- TLS: verified client-side for admin, migrator and runtime connections"
            echo "- TLS protocol policy: TLSv1.2 or TLSv1.3 only"
            echo "- Server authentication: CA + hostname verification (sslmode=verify-full)"
            echo "- Versioned migrations: ${EXPECTED_MIGRATIONS}"
            echo "- Migration ledger: verified"
            echo "- Wave 0024 schema/audit invariants: verified"
            echo "- Runtime RLS and tenant isolation: verified"
            echo "- Paid branch protection/IP Allow: not required by Free-tier profile"
            echo "- Railway variables changed: no"
            echo "- API redeployed: no"
            echo ""
            echo "Keep retained Production checkpoints until Railway/API Production qualification is complete; remove old checkpoints deliberately to remain within the 10-branch Free limit."
          } >> "$GITHUB_STEP_SUMMARY"
