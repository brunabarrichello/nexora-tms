name: NEX-43 Generate Trip Occurrence Migration

on:
  push:
    branches:
      - feat/nex-43-trip-occurrences
    paths:
      - 'packages/database/src/schema/trip-occurrences.ts'
      - '.github/workflows/nex43-generate-migration.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/nex-43-trip-occurrences

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Drizzle migration and runtime grants
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @nexora/database db:generate
          migration="$(find packages/database/migrations -maxdepth 1 -type f -name '0028_*.sql' -print -quit)"
          test -n "$migration" || { echo 'Expected generated 0028 migration was not found.' >&2; exit 1; }
          if ! grep -q 'GRANT SELECT, INSERT, UPDATE ON TABLE trip_occurrences' "$migration"; then
            cat >> "$migration" <<'SQL'
          --> statement-breakpoint
          GRANT SELECT, INSERT, UPDATE ON TABLE trip_occurrences TO nexora_app;
          --> statement-breakpoint
          GRANT SELECT, INSERT ON TABLE trip_occurrence_history, trip_occurrence_documents TO nexora_app;
          SQL
          fi

      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/database/migrations
          if git diff --cached --quiet; then
            echo 'Generated migration artifacts are already current.'
            exit 0
          fi
          git commit -m 'chore(db): generate NEX-43 trip occurrence migration'
          git push origin HEAD:feat/nex-43-trip-occurrences
