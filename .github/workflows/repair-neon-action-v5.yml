name: Repair Neon Branch Action

on:
  push:
    branches:
      - fix/gate-09-railway-config-remediation
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Pin Neon create-branch action to validated v5
        shell: bash
        run: |
          set -euo pipefail
          files=$(grep -RIl --include='*.yml' --include='*.yaml' 'neondatabase/create-branch-action@v6' .github/workflows || true)
          if [[ -z "$files" ]]; then
            echo 'No Neon create-branch-action@v6 references remain.'
            exit 0
          fi
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            sed -i 's#neondatabase/create-branch-action@v6#neondatabase/create-branch-action@v5#g' "$file"
          done <<< "$files"

      - name: Verify no v6 references remain
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --include='*.yml' --include='*.yaml' 'neondatabase/create-branch-action@v6' .github/workflows; then
            echo 'ERROR: Neon create-branch-action@v6 reference remains.' >&2
            exit 1
          fi
          echo 'Neon create-branch-action version gate: v5 only.'

      - name: Create repair branch and commit
        id: repair
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ github.head_ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          repair_branch="repair/gate-09-neon-v5-${PR_NUMBER}-${RUN_ID}"
          git switch -c "$repair_branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'fix(ci): pin Neon create-branch action to validated v5'
          git push origin "HEAD:${repair_branch}"
          echo "repair_branch=$repair_branch" >> "$GITHUB_OUTPUT"

      - name: Open repair PR against PR #195 branch
        if: steps.repair.outputs.repair_branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_BRANCH: ${{ steps.repair.outputs.repair_branch }}
          PR_HEAD_REF: ${{ github.head_ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr create \
            --base "$PR_HEAD_REF" \
            --head "$REPAIR_BRANCH" \
            --title "fix(ci): pin Neon create-branch action to validated v5" \
            --body "Automated Gate 09 remediation: replace all remaining neondatabase/create-branch-action@v6 references with validated @v5. This repair PR targets Nexora TMS PR #${PR_NUMBER}."

      - name: Evidence
        run: echo 'Neon create-branch-action v6 remediation branch prepared.'
