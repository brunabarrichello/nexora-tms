name: Repair Neon Branch Action

on:
  push:
    branches:
      - fix/gate-09-railway-config-remediation

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Pin Neon create-branch action to validated v5
        shell: bash
        run: |
          set -euo pipefail
          files=$(grep -RIl --include='*.yml' --include='*.yaml' 'neondatabase/create-branch-action@v6' .github/workflows || true)
          if [[ -z "$files" ]]; then
            echo 'No Neon create-branch-action@v6 references remain.'
            exit 0
          fi
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            sed -i 's#neondatabase/create-branch-action@v6#neondatabase/create-branch-action@v5#g' "$file"
          done <<< "$files"

      - name: Commit repaired workflow references
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'fix(ci): pin Neon create-branch action to validated v5'
          git push

      - name: Evidence
        run: echo 'Neon create-branch-action v6 remediation runner executed.'
