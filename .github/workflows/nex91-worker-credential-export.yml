name: NEX-91 Worker Credential Export

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/nex91-worker-credential-export.yml'

permissions:
  contents: read

env:
  NEON_PROJECT_ID: raspy-river-76339604

jobs:
  export:
    name: Export encrypted Development worker credential
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Resolve Development worker connection
        id: worker
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: production
          branch_name: development
          database: neondb
          role: nexora_worker
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Encrypt credential for one-shot transport
        shell: bash
        env:
          DB_URL: ${{ steps.worker.outputs.db_url }}
        run: |
          set -euo pipefail
          test -n "$DB_URL"
          echo "::add-mask::$DB_URL"
          cat > public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAp66R908zwlIsd687LHVF
          +ELR2213esQrQgNnXR/Cax0nkxhf1tMUCdvFtup6u3npc195ZpiM/dVOmJFfwp3I
          0thXxnfmSsrPJBUCeJEPAJU60IfnnFSGo8zukP4wrYINAundJ95y9eWnnJt53RPu
          qenhLXwZbbHg5mfzQzDSfUsNgNIsUk21xXNaKtjkn3bJkpGyozHF514mDNAeKW+v
          kP8081ltAIedeQcVDSiJcWXVt5MYJVFb5eUA/z8CeUlZMgccUJlcnrVcITSzoK6i
          NNBpqsRVpkQBCuDaqABpQ2wg0KrF6dLiZ1AFtD9yEpUeIhmE9hq9wBy0WB49QkAm
          gnwIJckETeltpbFbip8hWTc1o14aWEVWysgoaMLnS0e5Z4aOQUxV1tazZhlvVHsH
          xC19HBQfmYHjh6GtKlI1B1Kxmm3yRflmtRAZldY0Zn5A92wXXvwGonZ90wB1omK9
          To1Z65+J7cXcESixYVMhO07ozc3KU2zW4GuTpc3KrP3HkC6n7o+sbixM/9ISk92E
          GGaJNQu5KUANsvMNEcZMsipIaRD2pnotKnBZhUuoloxq0CS1kSNSMjPNgnYMHWMq
          SBxU1KLTWk27Ny5y/96uvd1cW5FD3H4Uet03+uRIfQ2MKlYpcxvLCvfG0UzhgeRu
          J5xeKGMMOkRiCgUxv3inzPsCAwEAAQ==
          -----END PUBLIC KEY-----
          PEM
          printf '%s' "$DB_URL" > credential.txt
          openssl rand -base64 48 > passphrase.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in credential.txt -out credential.enc -pass file:passphrase.txt
          openssl pkeyutl -encrypt -pubin -inkey public.pem -in passphrase.txt -out passphrase.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          echo "NEX91_ENCRYPTED_KEY=$(base64 -w0 passphrase.enc)"
          echo "NEX91_ENCRYPTED_DATA=$(base64 -w0 credential.enc)"
          rm -f credential.txt passphrase.txt credential.enc passphrase.enc public.pem
