name: NEX-53 Normalize Once

on:
  push:
    branches:
      - feat/nex-53-finance-reconciliation
    paths:
      - '.github/workflows/nex53-normalize-once.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/nex-53-finance-reconciliation
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Normalize PoolClient flow and NEX-53 formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/finance/finance-reconciliation.service.ts')
          text = path.read_text()
          old = '''    const [resolvedCandidates, matches, events] = await Promise.all([\n      candidates ? Promise.resolve(candidates) : this.computeCandidates(client, entry),\n      client.query<FinancialReconciliationMatchRecord>(\n        `${matchProjectionSql()} WHERE m.entry_id=$1::uuid ORDER BY m.matched_at DESC,m.id DESC`,\n        [entry.id],\n      ),\n      client.query<FinancialReconciliationEventRecord>(\n        `SELECT ev.id::text AS id,ev.entry_id::text AS "entryId",ev.match_id::text AS "matchId",\n                ev.event_type AS "eventType",ev.payload,ev.actor_user_id::text AS "actorUserId",\n                ev.created_at AS "createdAt"\n           FROM financial_reconciliation_events ev\n          WHERE ev.entry_id=$1::uuid\n          ORDER BY ev.created_at,ev.id`,\n        [entry.id],\n      ),\n    ]);\n'''
          new = '''    const resolvedCandidates =\n      candidates ?? (await this.computeCandidates(client, entry));\n    const matches = await client.query<FinancialReconciliationMatchRecord>(\n      `${matchProjectionSql()} WHERE m.entry_id=$1::uuid ORDER BY m.matched_at DESC,m.id DESC`,\n      [entry.id],\n    );\n    const events = await client.query<FinancialReconciliationEventRecord>(\n      `SELECT ev.id::text AS id,ev.entry_id::text AS "entryId",ev.match_id::text AS "matchId",\n              ev.event_type AS "eventType",ev.payload,ev.actor_user_id::text AS "actorUserId",\n              ev.created_at AS "createdAt"\n         FROM financial_reconciliation_events ev\n        WHERE ev.entry_id=$1::uuid\n        ORDER BY ev.created_at,ev.id`,\n      [entry.id],\n    );\n'''
          if old not in text:
              raise SystemExit('expected buildEntryDetail Promise.all block not found')
          path.write_text(text.replace(old, new, 1))
          PY

          pnpm exec prettier --write \
            apps/api/src/finance/finance-reconciliation.integration.ts \
            apps/api/src/finance/finance-reconciliation.service.ts \
            apps/api/src/finance/finance-reconciliation.types.ts \
            apps/api/src/finance/finance-reconciliation.validation.spec.ts \
            apps/api/src/finance/finance-reconciliation.validation.ts \
            apps/web/app/_actions/finance-reconciliation-actions.ts \
            'apps/web/app/financeiro/conciliacao/[id]/page.tsx'

          rm .github/workflows/nex53-normalize-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/finance/finance-reconciliation.integration.ts \
                  apps/api/src/finance/finance-reconciliation.service.ts \
                  apps/api/src/finance/finance-reconciliation.types.ts \
                  apps/api/src/finance/finance-reconciliation.validation.spec.ts \
                  apps/api/src/finance/finance-reconciliation.validation.ts \
                  apps/web/app/_actions/finance-reconciliation-actions.ts \
                  'apps/web/app/financeiro/conciliacao/[id]/page.tsx' \
                  .github/workflows/nex53-normalize-once.yml
          git diff --cached --check
          git commit -m 'style: normalize NEX-53 reconciliation changes'
          git config core.hooksPath /dev/null
          git push origin HEAD:feat/nex-53-finance-reconciliation
