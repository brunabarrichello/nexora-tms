name: NEX-57 format once

on:
  push:
    branches:
      - feat/nex-57-multichannel-communications

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/nex-57-multichannel-communications
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format NEX-57 TypeScript files
        run: |
          pnpm exec prettier --write \
            apps/api/src/notifications/outbound-communications.controller.ts \
            apps/api/src/notifications/outbound-communications.service.ts \
            apps/api/src/notifications/outbound-communications.types.ts \
            apps/api/src/notifications/outbound-communications.validation.ts

      - name: Remove temporary formatter workflow
        run: git rm .github/workflows/nex57-format-once.yml

      - name: Commit and push formatting
        env:
          BRANCH: feat/nex-57-multichannel-communications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/notifications/outbound-communications.controller.ts \
                  apps/api/src/notifications/outbound-communications.service.ts \
                  apps/api/src/notifications/outbound-communications.types.ts \
                  apps/api/src/notifications/outbound-communications.validation.ts
          git commit -m "chore(nex-57): apply Prettier formatting"
          git push origin "HEAD:${BRANCH}"
