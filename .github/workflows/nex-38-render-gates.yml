name: NEX-38 Render Gates

on:
  push:
    branches:
      - feature/NEX-38-freight-proposals
    paths:
      - "scripts/nex-38-render-gates.py"
      - ".github/workflows/nex-38-render-gates.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/NEX-38-freight-proposals

      - name: Render permanent gates
        run: python scripts/nex-38-render-gates.py

      - name: Validate rendered gates
        shell: bash
        run: |
          set -euo pipefail
          api=scripts/.nex-38-api-tenant-gate-rendered.yml
          neon=scripts/.nex-38-neon-gate-rendered.yml
          grep -q "Run Freight Proposal integration against Neon" "$api"
          grep -q "Freight proposal append-only history: verified" "$api"
          grep -q "Expected 30 application tables" "$neon"
          grep -q "Expected RLS on 27 tenant-scoped tables" "$neon"
          grep -q "Expected 13 Drizzle migration records" "$neon"
          grep -q "freight_proposals_capacity_assignment_fk" "$neon"
          grep -q "Freight proposal commercial terms must be append-only" "$neon"
          git diff --check -- "$api" "$neon"

      - name: Commit rendered gates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/.nex-38-api-tenant-gate-rendered.yml scripts/.nex-38-neon-gate-rendered.yml
          if git diff --cached --quiet; then
            echo 'Rendered gates already current.'
            exit 0
          fi
          git -c core.hooksPath=/dev/null commit -m 'NEX-38 render permanent negotiation gates'
          git push origin HEAD:feature/NEX-38-freight-proposals
