name: Wave 0019 Generate Migration

on:
  push:
    branches:
      - feat/database-wave-0019-freight-normalization
    paths:
      - packages/database/src/schema/**
      - .github/workflows/wave-0019-generate.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/database-wave-0019-freight-normalization

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Wave 0019 schema
        run: pnpm exec prettier --write packages/database/src/schema/freight-normalization.ts

      - name: Generate Drizzle migration
        run: pnpm --filter @nexora/database db:generate

      - name: Validate generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test -n "$(git status --short packages/database/migrations)" || {
            echo "No migration artifacts were generated for Wave 0019." >&2
            exit 1
          }

      - name: Commit formatted schema and generated migration artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/schema/freight-normalization.ts packages/database/migrations
          git commit -m "feat(database): generate Wave 0019 migration"
          git push origin HEAD:feat/database-wave-0019-freight-normalization
