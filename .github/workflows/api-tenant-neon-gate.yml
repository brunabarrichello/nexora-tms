name: API Tenant Neon Gate
on:
  pull_request:
    branches: [main]
    paths: ['apps/api/**', '.github/workflows/api-tenant-neon-gate.yml']
permissions:
  contents: read
concurrency:
  group: neon-ephemeral-branch-capacity
  cancel-in-progress: false
env:
  NEON_PROJECT_ID: raspy-river-76339604
  DATABASE_NAME: nexora
jobs:
  tenant-context-neon:
    name: TenantContext against nexora_app
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
      - run: pnpm install --frozen-lockfile
      - name: Validate Neon API secret
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: test -n "${NEON_API_KEY:-}"
      - name: Set ephemeral branch
        run: echo "NEON_TEST_BRANCH=pr-${{ github.event.pull_request.number }}-api-${{ github.run_id }}" >> "$GITHUB_ENV"
      - name: Create isolated branch from staging
        id: create-neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: staging
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: nexora
          role: neondb_owner
          api_key: ${{ secrets.NEON_API_KEY }}
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y postgresql-client; fi
      - name: Bootstrap migration capability
        env:
          ADMIN_DATABASE_URL: ${{ steps.create-neon.outputs.db_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ADMIN_DATABASE_URL"
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT CONNECT ON DATABASE nexora TO nexora_owner, nexora_migrator, nexora_app, nexora_worker;
          GRANT USAGE, CREATE ON SCHEMA public TO nexora_owner;
          SQL
      - name: Resolve migrator connection
        id: migrator
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: staging
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: nexora
          role: nexora_migrator
          api_key: ${{ secrets.NEON_API_KEY }}
      - name: Apply migrations through nexora_owner
        env:
          MIGRATOR_DATABASE_URL: ${{ steps.migrator.outputs.db_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$MIGRATOR_DATABASE_URL"
          if [[ "$MIGRATOR_DATABASE_URL" == *"?"* ]]; then
            OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}&options=-c%20role%3Dnexora_owner"
          else
            OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}?options=-c%20role%3Dnexora_owner"
          fi
          echo "::add-mask::$OWNER_DATABASE_URL"
          roles="$(psql "$OWNER_DATABASE_URL" -Atqc "select session_user || ':' || current_user")"
          [[ "$roles" == "nexora_migrator:nexora_owner" ]] || { echo "Unexpected migration role chain: $roles" >&2; exit 1; }
          echo "OWNER_DATABASE_URL=$OWNER_DATABASE_URL" >> "$GITHUB_ENV"
          DATABASE_URL="$OWNER_DATABASE_URL" pnpm --filter @nexora/database db:migrate
      - name: Seed deterministic integration fixtures
        env:
          DATABASE_URL: ${{ env.OWNER_DATABASE_URL }}
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO tenants (id,slug,name) VALUES
            ('51000000-0000-4000-8000-000000000001','api-gate-tenant-a','API Gate Tenant A'),
            ('51000000-0000-4000-8000-000000000002','api-gate-tenant-b','API Gate Tenant B') ON CONFLICT DO NOTHING;
          INSERT INTO users (id,display_name) VALUES ('51000000-0000-4000-8000-000000000101','API Gate User A') ON CONFLICT DO NOTHING;
          INSERT INTO organizations (id,tenant_id,code,name) VALUES
            ('51000000-0000-4000-8000-000000000201','51000000-0000-4000-8000-000000000001','API-A','Tenant A Organization'),
            ('51000000-0000-4000-8000-000000000202','51000000-0000-4000-8000-000000000002','API-B','Tenant B Organization') ON CONFLICT DO NOTHING;
          INSERT INTO memberships (id,tenant_id,user_id,status) VALUES ('51000000-0000-4000-8000-000000000301','51000000-0000-4000-8000-000000000001','51000000-0000-4000-8000-000000000101','active') ON CONFLICT DO NOTHING;
          INSERT INTO business_parties (id,tenant_id,tax_id,legal_name,email,status,homologation_status) VALUES
