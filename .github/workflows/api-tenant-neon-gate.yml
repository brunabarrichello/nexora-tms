            ('52000000-0000-4000-8000-000000000502','51000000-0000-4000-8000-000000000002','44444444444444','Matching Carrier B','carrier-b@example.test','active','approved') ON CONFLICT DO NOTHING;
          INSERT INTO business_party_roles (tenant_id,party_id,role) VALUES
            ('51000000-0000-4000-8000-000000000001','52000000-0000-4000-8000-000000000501','carrier'),('51000000-0000-4000-8000-000000000001','52000000-0000-4000-8000-000000000503','customer'),('51000000-0000-4000-8000-000000000001','52000000-0000-4000-8000-000000000503','shipper'),('51000000-0000-4000-8000-000000000001','52000000-0000-4000-8000-000000000504','consignee'),('51000000-0000-4000-8000-000000000002','52000000-0000-4000-8000-000000000502','carrier') ON CONFLICT DO NOTHING;
          INSERT INTO business_party_addresses (id,tenant_id,party_id,type,label,street,number,city,state,is_active) VALUES
            ('52000000-0000-4000-8000-000000000701','51000000-0000-4000-8000-000000000001','52000000-0000-4000-8000-000000000503','pickup','Matching Origin','Rua A','100','São Paulo','SP',true),
            ('52000000-0000-4000-8000-000000000702','51000000-0000-4000-8000-000000000001','52000000-0000-4000-8000-000000000504','delivery','Matching Destination','Rua B','200','Cuiabá','MT',true) ON CONFLICT DO NOTHING;
