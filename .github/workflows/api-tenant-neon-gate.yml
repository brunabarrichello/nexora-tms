            ('52000000-0000-4000-8000-000000000901','51000000-0000-4000-8000-000000000001','52000000-0000-4000-8000-000000000501','Compatible Driver','98765432111','11990000001','12345678911','E','2030-12-31','qualified','active',NULL,'51000000-0000-4000-8000-000000000101','51000000-0000-4000-8000-000000000101'),
            ('52000000-0000-4000-8000-000000000902','51000000-0000-4000-8000-000000000001','52000000-0000-4000-8000-000000000501','Mismatch Driver','98765432112','11990000002','12345678912','D','2030-12-31','qualified','active',NULL,'51000000-0000-4000-8000-000000000101','51000000-0000-4000-8000-000000000101'),
            ('52000000-0000-4000-8000-000000000903','51000000-0000-4000-8000-000000000001','52000000-0000-4000-8000-000000000501','Blocked Driver','98765432113','11990000003','12345678913','E','2030-12-31','qualified','blocked','Operational block for matching gate','51000000-0000-4000-8000-000000000101','51000000-0000-4000-8000-000000000101'),
            ('52000000-0000-4000-8000-000000000904','51000000-0000-4000-8000-000000000002','52000000-0000-4000-8000-000000000502','Tenant B Driver','98765432114','11990000004','12345678914','E','2030-12-31','qualified','active',NULL,'51000000-0000-4000-8000-000000000101','51000000-0000-4000-8000-000000000101') ON CONFLICT DO NOTHING;
          INSERT INTO capacity_assets (id,tenant_id,carrier_party_id,asset_kind,identifier,plate,vehicle_type,body_type,capacity_weight_kg,capacity_volume_m3,max_length_m,max_width_m,max_height_m,tracking_available,status,created_by_user_id,updated_by_user_id) VALUES
            ('52000000-0000-4000-8000-000000000911','51000000-0000-4000-8000-000000000001','52000000-0000-4000-8000-000000000501','vehicle','MATCH-COMPATIBLE','AAA1A11','carreta','sider',14000,85,14.8,2.6,2.9,true,'active','51000000-0000-4000-8000-000000000101','51000000-0000-4000-8000-000000000101'),
            ('52000000-0000-4000-8000-000000000912','51000000-0000-4000-8000-000000000001','52000000-0000-4000-8000-000000000501','vehicle','MATCH-INCOMPATIBLE','BBB2B22','toco','bau',4000,10,2,1,1.5,false,'active','51000000-0000-4000-8000-000000000101','51000000-0000-4000-8000-000000000101'),
            ('52000000-0000-4000-8000-000000000913','51000000-0000-4000-8000-000000000001','52000000-0000-4000-8000-000000000501','vehicle','MATCH-BLOCKED-DRIVER','CCC3C33','carreta','sider',14000,85,14.8,2.6,2.9,true,'active','51000000-0000-4000-8000-000000000101','51000000-0000-4000-8000-000000000101'),
            ('52000000-0000-4000-8000-000000000914','51000000-0000-4000-8000-000000000002','52000000-0000-4000-8000-000000000502','vehicle','MATCH-TENANT-B','DDD4D44','carreta','sider',14000,85,14.8,2.6,2.9,true,'active','51000000-0000-4000-8000-000000000101','51000000-0000-4000-8000-000000000101') ON CONFLICT DO NOTHING;
          INSERT INTO capacity_assignments (id,tenant_id,driver_id,vehicle_id,carrier_party_id,status,starts_at,created_by_user_id,updated_by_user_id) VALUES
            ('52000000-0000-4000-8000-000000000921','51000000-0000-4000-8000-000000000001','52000000-0000-4000-8000-000000000901','52000000-0000-4000-8000-000000000911','52000000-0000-4000-8000-000000000501','active','2026-09-01T08:00:00Z','51000000-0000-4000-8000-000000000101','51000000-0000-4000-8000-000000000101'),
            ('52000000-0000-4000-8000-000000000922','51000000-0000-4000-8000-000000000001','52000000-0000-4000-8000-000000000902','52000000-0000-4000-8000-000000000912','52000000-0000-4000-8000-000000000501','active','2026-09-01T08:00:00Z','51000000-0000-4000-8000-000000000101','51000000-0000-4000-8000-000000000101'),
            ('52000000-0000-4000-8000-000000000923','51000000-0000-4000-8000-000000000001','52000000-0000-4000-8000-000000000903','52000000-0000-4000-8000-000000000913','52000000-0000-4000-8000-000000000501','active','2026-09-01T08:00:00Z','51000000-0000-4000-8000-000000000101','51000000-0000-4000-8000-000000000101'),
            ('52000000-0000-4000-8000-000000000924','51000000-0000-4000-8000-000000000002','52000000-0000-4000-8000-000000000904','52000000-0000-4000-8000-000000000914','52000000-0000-4000-8000-000000000502','active','2026-09-01T08:00:00Z','51000000-0000-4000-8000-000000000101','51000000-0000-4000-8000-000000000101') ON CONFLICT DO NOTHING;
          SQL
      - name: Resolve nexora_app connection
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          url="$(npx --yes neonctl@v2 connection-string "$NEON_TEST_BRANCH" --project-id "$NEON_PROJECT_ID" --database-name "$DATABASE_NAME" --role-name nexora_app)"
          echo "::add-mask::$url"
          identity="$(psql "$url" -At -F '|' -c "select current_user,session_user,(select rolbypassrls from pg_roles where rolname=current_user)")"
          [[ "$identity" == "nexora_app|nexora_app|f" ]] || { echo "Unexpected API runtime identity: $identity" >&2; exit 1; }
          echo "APP_DATABASE_URL=$url" >> "$GITHUB_ENV"
      - name: Build API
        run: pnpm --filter @nexora/api build
      - name: Run API TenantContext integration against Neon
        env:
          DATABASE_URL: ${{ env.APP_DATABASE_URL }}
          DATABASE_POOL_MAX: '2'
        run: node apps/api/dist/tenancy/tenant-database.integration.js
      - name: Run Capacity Matching integration against Neon
        env:
          DATABASE_URL: ${{ env.APP_DATABASE_URL }}
          DATABASE_POOL_MAX: '2'
        run: node apps/api/dist/matching/capacity-matching.integration.js
      - name: Run Freight Proposal integration against Neon
        env:
          DATABASE_URL: ${{ env.APP_DATABASE_URL }}
          DATABASE_POOL_MAX: '2'
        run: node apps/api/dist/negotiation/freight-proposal.integration.js
      - name: Run Capacity Reservation integration against Neon
        env:
          DATABASE_URL: ${{ env.APP_DATABASE_URL }}
          DATABASE_POOL_MAX: '2'
        run: node apps/api/dist/negotiation/capacity-reservation.integration.js
      - name: Run Transport Contract integration against Neon
        env:
          DATABASE_URL: ${{ env.APP_DATABASE_URL }}
          DATABASE_POOL_MAX: '2'
        run: node apps/api/dist/negotiation/transport-contract.integration.js
      - name: Gate summary
        run: |
          echo '## API TenantContext ↔ Neon gate passed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Parent: staging' >> "$GITHUB_STEP_SUMMARY"
          echo '- Application database: nexora' >> "$GITHUB_STEP_SUMMARY"
          echo '- Migration role chain: nexora_migrator → nexora_owner' >> "$GITHUB_STEP_SUMMARY"
          echo '- Runtime role: nexora_app / BYPASSRLS=false' >> "$GITHUB_STEP_SUMMARY"
      - name: Delete isolated Neon branch
        if: ${{ always() && steps.create-neon.outputs.branch_id != '' }}
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: ${{ steps.create-neon.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
