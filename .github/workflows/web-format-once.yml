name: Web Format Once

on:
  push:
    branches:
      - feat/web-foundation-pages

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/web-foundation-pages

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format web application
        run: pnpm exec prettier --write apps/web/app

      - name: Remove one-time workflow
        run: rm .github/workflows/web-format-once.yml

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app .github/workflows/web-format-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(web): format application pages"
          git push origin HEAD:feat/web-foundation-pages
