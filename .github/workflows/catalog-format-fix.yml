name: Catalog format fix

on:
  push:
    branches:
      - docs/master-data-catalog-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/master-data-catalog-v1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format catalog documents
        run: pnpm exec prettier --write docs/data/master-data-catalog-v1.md docs/data/master-data-catalog-target-v1.md

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/master-data-catalog-v1.md docs/data/master-data-catalog-target-v1.md
          git commit -m "style(docs): format master data catalog"
          git push origin HEAD:docs/master-data-catalog-v1
