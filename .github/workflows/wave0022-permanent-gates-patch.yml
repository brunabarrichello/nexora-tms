name: Wave 0022 Permanent Gate Patch

on:
  push:
    branches:
      - feat/database-wave-0022-trips-core
    paths:
      - '.github/workflows/wave0022-permanent-gates-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/database-wave-0022-trips-core
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: pnpm install --frozen-lockfile
      - name: Patch permanent shared gates
        run: python3 .github/scripts/wave0022_patch_gates.py
      - name: Validate patched workflows
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write .github/workflows/neon-pr-gate.yml .github/workflows/neon-migrate.yml
          grep -q "migration_count <> 23" .github/workflows/neon-pr-gate.yml
          grep -q "apps/api/src/trips/\*\*" .github/workflows/neon-pr-gate.yml
          grep -q 'Wave 0022 trips tables incomplete' .github/workflows/neon-migrate.yml
          grep -q 'Wave 0022 trips core baseline: verified' .github/workflows/neon-migrate.yml
      - name: Commit patched gates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/neon-pr-gate.yml .github/workflows/neon-migrate.yml
          git diff --cached --check
          git commit -m 'ci(neon): extend shared gates through Wave 0022'
          echo "PATCH_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:feat/database-wave-0022-trips-core
