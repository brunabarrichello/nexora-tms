name: Wave 0018 schema generate

on:
  push:
    branches:
      - feat/database-wave-0018-documents
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/database-wave-0018-documents
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: pnpm install --frozen-lockfile
      - name: Patch Wave 0018 schema links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/database/src/schema/capacity-qualification.ts')
          text = path.read_text()
          if "import { documents } from './documents.js';" not in text:
              text = text.replace("import { currencies } from './currency.js';\n", "import { currencies } from './currency.js';\nimport { documents } from './documents.js';\n")

          driver_marker = "    driverId: uuid('driver_id').notNull(),\n    documentTypeId: uuid('document_type_id').notNull(),"
          if "driver_documents_document_fk" not in text:
              text = text.replace(driver_marker, "    driverId: uuid('driver_id').notNull(),\n    documentId: uuid('document_id'),\n    documentTypeId: uuid('document_type_id').notNull(),", 1)
              driver_fk_anchor = "    foreignKey({\n      columns: [table.tenantId, table.documentTypeId],\n      foreignColumns: [documentTypes.tenantId, documentTypes.id],\n      name: 'driver_documents_document_type_fk',\n    }).onDelete('restrict'),"
              driver_fk = "    foreignKey({\n      columns: [table.tenantId, table.documentId],\n      foreignColumns: [documents.tenantId, documents.id],\n      name: 'driver_documents_document_fk',\n    }).onDelete('restrict'),\n"
              text = text.replace(driver_fk_anchor, driver_fk + driver_fk_anchor, 1)
              driver_index_anchor = "    index('driver_documents_tenant_driver_status_idx').on("
              driver_unique = "    uniqueIndex('driver_documents_tenant_document_unique')\n      .on(table.tenantId, table.documentId)\n      .where(sql`${table.documentId} IS NOT NULL`),\n"
              text = text.replace(driver_index_anchor, driver_unique + driver_index_anchor, 1)

          asset_marker = "    assetId: uuid('asset_id').notNull(),\n    documentTypeId: uuid('document_type_id').notNull(),"
          if "capacity_asset_documents_document_fk" not in text:
              text = text.replace(asset_marker, "    assetId: uuid('asset_id').notNull(),\n    documentId: uuid('document_id'),\n    documentTypeId: uuid('document_type_id').notNull(),", 1)
              asset_fk_anchor = "    foreignKey({\n      columns: [table.tenantId, table.documentTypeId],\n      foreignColumns: [documentTypes.tenantId, documentTypes.id],\n      name: 'capacity_asset_documents_document_type_fk',\n    }).onDelete('restrict'),"
              asset_fk = "    foreignKey({\n      columns: [table.tenantId, table.documentId],\n      foreignColumns: [documents.tenantId, documents.id],\n      name: 'capacity_asset_documents_document_fk',\n    }).onDelete('restrict'),\n"
              text = text.replace(asset_fk_anchor, asset_fk + asset_fk_anchor, 1)
              asset_index_anchor = "    index('capacity_asset_documents_tenant_asset_status_idx').on("
              asset_unique = "    uniqueIndex('capacity_asset_documents_tenant_document_unique')\n      .on(table.tenantId, table.documentId)\n      .where(sql`${table.documentId} IS NOT NULL`),\n"
              text = text.replace(asset_index_anchor, asset_unique + asset_index_anchor, 1)
          path.write_text(text)

          index_path = Path('packages/database/src/schema/index.ts')
          index_text = index_path.read_text()
          export_line = "export * from './documents.js';\n"
          if export_line not in index_text:
              index_text = index_text.replace("export * from './currency.js';\n", "export * from './currency.js';\n" + export_line)
          index_path.write_text(index_text)

          docs_path = Path('packages/database/src/schema/documents.ts')
          docs_text = docs_path.read_text().replace('  uniqueIndex,\n', '')
          docs_path.write_text(docs_text)
          PY
      - name: Format schema
        run: pnpm exec prettier --write packages/database/src/schema/documents.ts packages/database/src/schema/capacity-qualification.ts packages/database/src/schema/index.ts
      - name: Typecheck database
        run: pnpm --filter @nexora/database typecheck
      - name: Generate migration
        run: pnpm --filter @nexora/database db:generate
      - name: Add runtime grants
        shell: bash
        run: |
          set -euo pipefail
          migration="$(ls packages/database/migrations/0018_*.sql)"
          cat >> "$migration" <<'SQL'

          GRANT SELECT, INSERT, UPDATE ON TABLE documents TO nexora_app;
          GRANT SELECT, INSERT ON TABLE document_versions, document_validations, business_party_documents, transport_request_documents TO nexora_app;
          SQL
      - name: Validate migration safety
        shell: bash
        run: |
          set -euo pipefail
          migration="$(ls packages/database/migrations/0018_*.sql)"
          if grep -Eiq '\b(DROP TABLE|DROP COLUMN|TRUNCATE|RENAME TABLE|ALTER TABLE .* RENAME)\b' "$migration"; then
            echo "Destructive DDL detected in $migration" >&2
            exit 1
          fi
          grep -q 'CREATE TABLE "documents"' "$migration"
          grep -q 'CREATE TABLE "document_versions"' "$migration"
          grep -q 'CREATE TABLE "document_validations"' "$migration"
          grep -q 'CREATE TABLE "business_party_documents"' "$migration"
          grep -q 'CREATE TABLE "transport_request_documents"' "$migration"
          grep -q 'ADD COLUMN "document_id" uuid' "$migration"
      - name: Check Drizzle
        run: pnpm --filter @nexora/database db:check
      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/schema packages/database/migrations
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(database): generate Wave 0018 document migration"
          git push origin HEAD:feat/database-wave-0018-documents
