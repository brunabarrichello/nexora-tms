name: NEX-91 Bootstrap Worker Dependencies

on:
  push:
    branches:
      - feat/nex-91-worker-runtime
    paths:
      - '.github/workflows/nex91-bootstrap-worker-deps.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/nex-91-worker-runtime

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Add Worker PostgreSQL dependencies
        run: |
          pnpm --filter @nexora/worker add pg@8.23.0
          pnpm --filter @nexora/worker add -D @types/pg@8.23.1

      - name: Commit dependency artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker/package.json pnpm-lock.yaml
          git diff --cached --quiet && { echo "No dependency changes generated." >&2; exit 1; }
          git commit -m "chore(nex-91): add worker postgres dependencies"
          git push origin HEAD:feat/nex-91-worker-runtime
