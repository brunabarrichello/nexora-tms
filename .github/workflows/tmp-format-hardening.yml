name: Temporary Hardening Formatter

on:
  push:
    branches:
      - hardening/nex-79-93-80-81-baseline
    paths:
      - '.github/workflows/tmp-format-hardening.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: hardening/nex-79-93-80-81-baseline
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply canonical Prettier output
        run: pnpm exec prettier --write apps/api/src/observability/http-observability.middleware.ts
      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/observability/http-observability.middleware.ts
          git commit -m 'style(api): apply canonical Prettier output'
          git push origin HEAD:hardening/nex-79-93-80-81-baseline
