name: Wave 0016 gate patch

on:
  push:
    branches:
      - feat/database-wave-0016-master-data-enrichment
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/database-wave-0016-master-data-enrichment

      - name: Evolve Neon gate for Wave 0016
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/neon-pr-gate.yml')
          text = path.read_text()

          path_anchor = "      - 'apps/api/src/negotiation/**'\n"
          if "apps/api/src/master-data/**" not in text:
              text = text.replace(path_anchor, path_anchor + "      - 'apps/api/src/master-data/**'\n", 1)

          old_global_tail = "'countries','states','cities','units_of_measure','vehicle_types','body_types','cargo_types','package_types','document_types','tags'"
          new_all_tail = old_global_tail + ",'currencies','departments','cost_centers','number_sequences','module_settings','feature_flags','locations','business_party_groups','business_party_group_members','business_party_requirements','business_party_document_requirements','business_party_service_areas','business_party_billing_rules','business_party_credit_limits','commodities','business_party_tags','driver_tags','capacity_asset_tags','transport_request_tags','custom_field_definitions','custom_field_values'"
          if text.count(old_global_tail) != 2:
              raise SystemExit(f'expected table/ownership tail twice, got {text.count(old_global_tail)}')
          text = text.replace(old_global_tail, new_all_tail)

          old_rls_block = "'vehicle_types','body_types','cargo_types','package_types','document_types','tags'\n               )\n               AND c.relrowsecurity;"
          new_rls_block = "'vehicle_types','body_types','cargo_types','package_types','document_types','tags',\n                 'departments','cost_centers','number_sequences','module_settings','feature_flags','locations','business_party_groups','business_party_group_members','business_party_requirements','business_party_document_requirements','business_party_service_areas','business_party_billing_rules','business_party_credit_limits','commodities','business_party_tags','driver_tags','capacity_asset_tags','transport_request_tags','custom_field_definitions','custom_field_values'\n               )\n               AND c.relrowsecurity;"
          if text.count(old_rls_block) != 1:
              raise SystemExit('RLS tail anchor not found exactly once')
          text = text.replace(old_rls_block, new_rls_block, 1)

          replacements = {
              'IF table_count <> 44 THEN': 'IF table_count <> 65 THEN',
              'Expected 44 application tables': 'Expected 65 application tables',
              'IF rls_count <> 37 THEN': 'IF rls_count <> 57 THEN',
              'Expected RLS on 37 tenant-scoped tables': 'Expected RLS on 57 tenant-scoped tables',
              'IF migration_count <> 16 THEN': 'IF migration_count <> 17 THEN',
              'Expected 16 Drizzle migration records': 'Expected 17 Drizzle migration records',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one marker for {old!r}, got {text.count(old)}')
              text = text.replace(old, new, 1)

          privilege_anchor = "               OR has_table_privilege('nexora_app','public.tags','DELETE') THEN"
          if text.count(privilege_anchor) != 1:
              raise SystemExit('privilege anchor not found exactly once')
          tenant_tables = [
              'departments','cost_centers','number_sequences','module_settings','feature_flags','locations',
              'business_party_groups','business_party_group_members','business_party_requirements',
              'business_party_document_requirements','business_party_service_areas','business_party_billing_rules',
              'business_party_credit_limits','commodities','business_party_tags','driver_tags','capacity_asset_tags',
              'transport_request_tags','custom_field_definitions','custom_field_values',
          ]
          lines = [
              "               OR has_table_privilege('nexora_app','public.tags','DELETE')",
              "               OR NOT has_table_privilege('nexora_app','public.currencies','SELECT')",
              "               OR has_table_privilege('nexora_app','public.currencies','INSERT')",
              "               OR has_table_privilege('nexora_app','public.currencies','UPDATE')",
              "               OR has_table_privilege('nexora_app','public.currencies','DELETE')",
          ]
          for table in tenant_tables:
              lines.extend([
                  f"               OR NOT has_table_privilege('nexora_app','public.{table}','SELECT')",
                  f"               OR NOT has_table_privilege('nexora_app','public.{table}','INSERT')",
                  f"               OR NOT has_table_privilege('nexora_app','public.{table}','UPDATE')",
                  f"               OR has_table_privilege('nexora_app','public.{table}','DELETE')",
              ])
          text = text.replace(privilege_anchor, '\n'.join(lines) + ' THEN', 1)

          step_anchor = "      - name: Validate NEX-39 capacity reservation runtime and isolation\n"
          if text.count(step_anchor) != 1:
              raise SystemExit('NEX-39 step anchor not found exactly once')
          app_expression = '$' + '{{ steps.app-connection.outputs.db_url }}'
          wave_step = (
              "      - name: Validate Wave 0016 master-data RLS and lifecycle\n"
              "        shell: bash\n"
              "        env:\n"
              f"          APP_DATABASE_URL: {app_expression}\n"
              "        run: |\n"
              "          set -euo pipefail\n"
              "          echo \"::add-mask::$APP_DATABASE_URL\"\n"
              "          psql \"$APP_DATABASE_URL\" -v ON_ERROR_STOP=1 <<'SQL'\n"
              "          DO $$\n"
              "          DECLARE\n"
              "            visible_count integer;\n"
              "          BEGIN\n"
              "            PERFORM set_config('app.tenant_id','',false);\n"
              "            PERFORM set_config('app.user_id','',false);\n"
              "            SELECT count(*) INTO visible_count FROM locations;\n"
              "            IF visible_count <> 0 THEN RAISE EXCEPTION 'Wave 0016 locations visible without tenant context: %', visible_count; END IF;\n"
              "            PERFORM set_config('app.tenant_id','00000000-0000-4000-8000-000000000001',false);\n"
              "            PERFORM set_config('app.user_id','00000000-0000-4000-8000-000000000101',false);\n"
              "            INSERT INTO locations (id, tenant_id, created_by_user_id, updated_by_user_id, party_id, address_id, code, name, type, is_active)\n"
              "            VALUES ('00000000-0000-4000-8000-000000001601','00000000-0000-4000-8000-000000000001','00000000-0000-4000-8000-000000000101','00000000-0000-4000-8000-000000000101','00000000-0000-4000-8000-000000000501','00000000-0000-4000-8000-000000000701','GATE-LOC-A','Gate Location A','warehouse',true);\n"
              "            SELECT count(*) INTO visible_count FROM locations WHERE id='00000000-0000-4000-8000-000000001601';\n"
              "            IF visible_count <> 1 THEN RAISE EXCEPTION 'Tenant A must see its Wave 0016 location'; END IF;\n"
              "            PERFORM set_config('app.tenant_id','00000000-0000-4000-8000-000000000002',false);\n"
              "            PERFORM set_config('app.user_id','00000000-0000-4000-8000-000000000102',false);\n"
              "            SELECT count(*) INTO visible_count FROM locations WHERE id='00000000-0000-4000-8000-000000001601';\n"
              "            IF visible_count <> 0 THEN RAISE EXCEPTION 'Tenant B can see Tenant A Wave 0016 location'; END IF;\n"
              "            BEGIN\n"
              "              INSERT INTO locations (id, tenant_id, created_by_user_id, updated_by_user_id, party_id, address_id, code, name, type, is_active)\n"
              "              VALUES ('00000000-0000-4000-8000-000000001602','00000000-0000-4000-8000-000000000001','00000000-0000-4000-8000-000000000101','00000000-0000-4000-8000-000000000101','00000000-0000-4000-8000-000000000501','00000000-0000-4000-8000-000000000701','GATE-CROSS','Cross Tenant Location','warehouse',true);\n"
              "              RAISE EXCEPTION 'Cross-tenant Wave 0016 insert unexpectedly succeeded';\n"
              "            EXCEPTION WHEN insufficient_privilege THEN NULL;\n"
              "            END;\n"
              "          END $$;\n"
              "          SQL\n\n"
          )
          text = text.replace(step_anchor, wave_step + step_anchor, 1)
          path.write_text(text)
          PY

      - name: Verify Wave 0016 gate markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q "apps/api/src/master-data/\*\*" .github/workflows/neon-pr-gate.yml
          grep -q "Expected 65 application tables" .github/workflows/neon-pr-gate.yml
          grep -q "Expected RLS on 57 tenant-scoped tables" .github/workflows/neon-pr-gate.yml
          grep -q "Expected 17 Drizzle migration records" .github/workflows/neon-pr-gate.yml
          grep -q "public.currencies" .github/workflows/neon-pr-gate.yml
          grep -q "public.custom_field_values" .github/workflows/neon-pr-gate.yml
          grep -q "Validate Wave 0016 master-data RLS and lifecycle" .github/workflows/neon-pr-gate.yml

      - name: Emit reviewed workflow git objects
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/neon-pr-gate.yml
          git diff --cached --check
          git commit -m "ci(database): validate Wave 0016 master data"
          echo "LOCAL_COMMIT=$(git rev-parse HEAD)"
          echo "LOCAL_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "WORKFLOW_BLOB=$(git rev-parse 'HEAD:.github/workflows/neon-pr-gate.yml')"
          git push origin HEAD:feat/database-wave-0016-master-data-enrichment
