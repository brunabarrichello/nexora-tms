name: Format NEX-70 recovery

on:
  push:
    branches:
      - feat/nex-70-web-auth0-pkce
    paths:
      - apps/web/app/_lib/web-auth.test.mjs
      - .github/workflows/format-nex70-recovery.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/nex-70-web-auth0-pkce
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier
        run: pnpm exec prettier --write apps/web/app/_lib/web-auth.test.mjs
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/_lib/web-auth.test.mjs
          git commit -m "style(iam): format Auth0 recovery tests"
          git push origin HEAD:feat/nex-70-web-auth0-pkce
