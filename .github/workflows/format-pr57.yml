name: Format PR57

on:
  push:
    branches:
      - feat/master-data-capacity-ui-integration

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'format master data CRUD')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/master-data-capacity-ui-integration
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: pnpm install --frozen-lockfile
      - name: Format only PR57 CRUD files
        run: >-
          pnpm exec prettier --write
          apps/web/app/_actions/record-actions.ts
          apps/web/app/_components/api-collection-page.tsx
          apps/web/app/_components/record-editor-page.tsx
          apps/web/app/_components/record-form.tsx
          apps/web/app/_lib/record-config.ts
          apps/web/app/cadastros/clientes/page.tsx
          'apps/web/app/cadastros/enriquecidos/novo/[resource]/page.tsx'
          apps/web/app/cadastros/grupos/page.tsx
          apps/web/app/cadastros/locais/page.tsx
          apps/web/app/cadastros/mercadorias/page.tsx
          apps/web/app/cadastros/motoristas/page.tsx
          'apps/web/app/cadastros/partes/editar/[profile]/[id]/page.tsx'
          'apps/web/app/cadastros/partes/novo/[profile]/page.tsx'
          apps/web/app/cadastros/transportadoras/page.tsx
          apps/web/app/cadastros/veiculos/page.tsx
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/app
          git commit -m 'chore(web): format master data CRUD'
          git push origin HEAD:feat/master-data-capacity-ui-integration
