name: Wave 0020 Web Format

on:
  push:
    branches:
      - feat/web-pages-wave-0020-matching
    paths:
      - .github/workflows/wave-0020-web-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-pages-wave-0020-matching
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/app/matching
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nexora-wave-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/app/matching
          git diff --cached --quiet && exit 0
          git commit -m "style(web): format Wave 0020 matching pages"
          git push origin HEAD:feat/web-pages-wave-0020-matching
