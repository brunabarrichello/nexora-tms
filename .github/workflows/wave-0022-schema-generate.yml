name: Wave 0022 Schema Generate

on:
  push:
    branches:
      - feat/database-wave-0022-trips-core
    paths:
      - .github/workflows/wave-0022-schema-generate.yml

permissions:
  contents: write

jobs:
  fix-migration-order:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/database-wave-0022-trips-core

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Move referenced unique before dependent FK
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          migration = Path('packages/database/migrations/0022_minor_tyrannus.sql')
          text = migration.read_text()
          unique_stmt = 'ALTER TABLE "transport_contracts" ADD CONSTRAINT "transport_contracts_tenant_request_id_unique" UNIQUE("tenant_id","transport_request_id","id");--> statement-breakpoint\n'
          fk_stmt = 'ALTER TABLE "trip_transport_requests" ADD CONSTRAINT "trip_transport_requests_contract_fk" FOREIGN KEY ("tenant_id","transport_request_id","transport_contract_id") REFERENCES "public"."transport_contracts"("tenant_id","transport_request_id","id") ON DELETE restrict ON UPDATE no action;--> statement-breakpoint\n'

          if unique_stmt not in text or fk_stmt not in text:
              raise SystemExit('Expected migration statements not found')
          if text.index(unique_stmt) > text.index(fk_stmt):
              text = text.replace(unique_stmt, '', 1)
              text = text.replace(fk_stmt, unique_stmt + fk_stmt, 1)
              migration.write_text(text)

          if migration.read_text().index(unique_stmt) > migration.read_text().index(fk_stmt):
              raise SystemExit('Referenced unique still appears after dependent FK')
          PY

      - name: Validate schema ledger
        run: |
          pnpm --filter @nexora/database typecheck
          pnpm --filter @nexora/database db:check
          git diff --check

      - name: Commit migration order correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/database/migrations/0022_minor_tyrannus.sql
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No migration order change required.'
            exit 0
          fi
          git commit -m 'fix(database): order Wave 0022 contract key before FK'
          git push --no-verify origin HEAD:feat/database-wave-0022-trips-core
