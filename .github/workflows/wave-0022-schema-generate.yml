name: Wave 0022 Schema Generate

on:
  push:
    branches:
      - feat/database-wave-0022-trips-core
    paths:
      - .github/workflows/wave-0022-schema-generate.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/database-wave-0022-trips-core

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Complete Wave 0022 schema wiring
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          contract = Path('packages/database/src/schema/transport-contract.ts')
          text = contract.read_text()
          old = "    unique('transport_contracts_tenant_id_unique').on(table.tenantId, table.id),\n"
          new = old + "    unique('transport_contracts_tenant_request_id_unique').on(\n      table.tenantId,\n      table.transportRequestId,\n      table.id,\n    ),\n"
          if 'transport_contracts_tenant_request_id_unique' not in text:
              if old not in text:
                  raise SystemExit('transport contract anchor not found')
              text = text.replace(old, new, 1)
              contract.write_text(text)

          index = Path('packages/database/src/schema/index.ts')
          text = index.read_text()
          export = "export * from './trips.js';\n"
          if export not in text:
              text += export
              index.write_text(text)
          PY

      - name: Format schema
        run: pnpm exec prettier --write packages/database/src/schema/trips.ts packages/database/src/schema/transport-contract.ts packages/database/src/schema/index.ts

      - name: Generate Drizzle migration
        run: pnpm --filter @nexora/database db:generate

      - name: Add runtime grants to generated migration
        shell: bash
        run: |
          set -euo pipefail
          migration="$(git status --short packages/database/migrations | awk '/\.sql$/ {print $2}' | tail -n1)"
          test -n "$migration" || { echo 'Generated migration SQL not found' >&2; exit 1; }
          cat >> "$migration" <<'SQL'

          GRANT SELECT, INSERT, UPDATE ON trips TO nexora_app;
          GRANT SELECT, INSERT, UPDATE ON trip_transport_requests TO nexora_app;
          GRANT SELECT, INSERT, UPDATE ON trip_stops TO nexora_app;
          GRANT SELECT, INSERT, UPDATE ON trip_drivers TO nexora_app;
          GRANT SELECT, INSERT, UPDATE ON trip_assets TO nexora_app;
          GRANT SELECT, INSERT ON trip_status_history TO nexora_app;
          SQL
          echo "Generated migration: $migration"

      - name: Validate schema and migration
        run: |
          pnpm exec prettier --write packages/database/src/schema/trips.ts packages/database/src/schema/transport-contract.ts packages/database/src/schema/index.ts
          pnpm lint
          pnpm --filter @nexora/database typecheck
          pnpm --filter @nexora/database db:check
          git diff --check

      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/database/src/schema/trips.ts packages/database/src/schema/transport-contract.ts packages/database/src/schema/index.ts packages/database/migrations
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No schema changes to commit.'
            exit 1
          fi
          git commit -m 'feat(database): generate Wave 0022 trips core migration'
          git push --no-verify origin HEAD:feat/database-wave-0022-trips-core
