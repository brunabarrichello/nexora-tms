name: NEX-54 Format Once

on:
  push:
    branches:
      - feat/nex-54-in-app-notifications
    paths:
      - '.github/workflows/nex54-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/nex-54-in-app-notifications
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format NEX-54 files and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            apps/api/src/notifications/in-app-notifications.integration.ts \
            apps/api/src/notifications/in-app-notifications.service.ts \
            apps/api/src/notifications/in-app-notifications.validation.spec.ts \
            apps/web/app/notificacoes/page.tsx \
            docs/data/nex-54-in-app-notifications.md
          rm .github/workflows/nex54-format-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/notifications/in-app-notifications.integration.ts \
                  apps/api/src/notifications/in-app-notifications.service.ts \
                  apps/api/src/notifications/in-app-notifications.validation.spec.ts \
                  apps/web/app/notificacoes/page.tsx \
                  docs/data/nex-54-in-app-notifications.md \
                  .github/workflows/nex54-format-once.yml
          git commit -m 'style: normalize NEX-54 notification files'
          git push origin HEAD:feat/nex-54-in-app-notifications
