name: Wave 0016 generate

on:
  push:
    branches:
      - feat/database-wave-0016-master-data-enrichment
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/database-wave-0016-master-data-enrichment

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Finalize Wave 0016 lifecycle invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/database/src/schema/master-data-enrichment.ts')
          text = path.read_text()
          for export_name in ['businessPartyTags', 'driverTags', 'capacityAssetTags', 'transportRequestTags']:
              start = text.index(f'export const {export_name}')
              end = text.index('\n);', start)
              block = text[start:end]
              marker = "    createdAt: timestamp('created_at', { withTimezone: true }).defaultNow().notNull(),\n"
              if "isActive: boolean('is_active')" not in block:
                  if marker not in block:
                      raise SystemExit(f'createdAt marker not found for {export_name}')
                  block = block.replace(
                      marker,
                      "    isActive: boolean('is_active').default(true).notNull(),\n" + marker,
                      1,
                  )
                  text = text[:start] + block + text[end:]
          text = text.replace(
              "sql`${table.stateId} IS NOT NULL OR ${table.cityId} IS NOT NULL`,",
              "sql`num_nonnulls(${table.stateId}, ${table.cityId}) = 1`,",
              1,
          )
          path.write_text(text)
          PY

      - name: Format Wave 0016 schema
        run: pnpm exec prettier --write packages/database/src/schema/currency.ts packages/database/src/schema/master-data-enrichment.ts packages/database/src/schema/index.ts

      - name: Typecheck database package
        run: pnpm --filter @nexora/database typecheck

      - name: Generate Drizzle migration
        run: pnpm --filter @nexora/database db:generate

      - name: Patch runtime privileges
        shell: bash
        run: |
          set -euo pipefail
          migration_file="$(find packages/database/migrations -maxdepth 1 -type f -name '0016_*.sql' -print -quit)"
          test -n "$migration_file"
          cat >> "$migration_file" <<'SQL'
          --> statement-breakpoint
          GRANT SELECT ON TABLE currencies TO nexora_app;
          --> statement-breakpoint
          GRANT SELECT, INSERT, UPDATE ON TABLE departments, cost_centers, number_sequences, module_settings, feature_flags, locations, business_party_groups, business_party_group_members, business_party_requirements, business_party_document_requirements, business_party_service_areas, business_party_billing_rules, business_party_credit_limits, commodities, business_party_tags, driver_tags, capacity_asset_tags, transport_request_tags, custom_field_definitions, custom_field_values TO nexora_app;
          SQL

      - name: Check Drizzle migrations
        run: pnpm --filter @nexora/database db:check

      - name: Verify generated Wave
        shell: bash
        run: |
          set -euo pipefail
          test -f packages/database/migrations/meta/0016_snapshot.json
          migration_file="$(find packages/database/migrations -maxdepth 1 -type f -name '0016_*.sql' -print -quit)"
          test -n "$migration_file"
          test "$(grep -c '^CREATE TABLE' "$migration_file" || true)" -eq 21
          test "$(grep -c 'ENABLE ROW LEVEL SECURITY' "$migration_file" || true)" -eq 20
          test "$(grep -c '^CREATE POLICY' "$migration_file" || true)" -eq 20
          grep -q 'GRANT SELECT ON TABLE currencies TO nexora_app' "$migration_file"
          grep -q 'GRANT SELECT, INSERT, UPDATE ON TABLE departments' "$migration_file"
          if grep -Eiq '^[[:space:]]*(DROP|TRUNCATE)[[:space:]]|RENAME[[:space:]]' "$migration_file"; then
            echo "Destructive DDL detected" >&2
            exit 1
          fi

      - name: Commit reviewed Wave 0016 artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/schema/currency.ts \
                  packages/database/src/schema/master-data-enrichment.ts \
                  packages/database/src/schema/index.ts \
                  packages/database/migrations/0016_*.sql \
                  packages/database/migrations/meta/0016_snapshot.json \
                  packages/database/migrations/meta/_journal.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "feat(database): generate Wave 0016 migration"
          git push origin HEAD:feat/database-wave-0016-master-data-enrichment
