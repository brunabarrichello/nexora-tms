name: Bootstrap validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate monorepo bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pinned pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.23.0
          runtime: node@24.20.0
          install: false
          cache: false

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version
          pnpm check:toolchain

      - name: Install dependencies and generate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Run quality gates
        run: pnpm validate

      - name: Build deployables
        run: pnpm build

      - name: Upload generated lockfile
        if: ${{ always() && hashFiles('pnpm-lock.yaml') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
          retention-days: 1
