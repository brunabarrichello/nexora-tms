name: Neon Trip Occurrence Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/database/**'
      - 'apps/api/src/trips/**'
      - '.github/workflows/neon-trip-occurrence-gate.yml'

permissions:
  contents: read

concurrency:
  group: neon-trip-occurrence-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  NEON_PROJECT_ID: raspy-river-76339604
  DATABASE_NAME: nexora
  PRODUCTION_BRANCH_ID: br-silent-feather-a5ku7uyi

jobs:
  trip-occurrence:
    name: NEX-43 occurrence schema, RLS, grants and API integration
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Neon API secret
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: test -n "${NEON_API_KEY:-}"
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y postgresql-client; fi
          psql --version
      - name: Create isolated Neon branch
        id: branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_NAME="pr-${{ github.event.pull_request.number }}-nex43-${{ github.run_id }}"
          BODY="$(jq -n --arg name "$BRANCH_NAME" '{branch:{name:$name},endpoints:[{type:"read_write"}]}')"
          RESPONSE_FILE="$RUNNER_TEMP/neon-branch.json"
          STATUS="$(curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            -H 'Accept: application/json' -H 'Content-Type: application/json' \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches" -d "$BODY")"
          if [[ "$STATUS" != 2* ]]; then
            echo "Neon branch creation failed with HTTP ${STATUS}." >&2
            jq -c '{code,message,details}' "$RESPONSE_FILE" >&2 || cat "$RESPONSE_FILE" >&2
            exit 1
          fi
          BRANCH_ID="$(jq -er '.branch.id' "$RESPONSE_FILE")"
          echo "NEON_BRANCH_ID=${BRANCH_ID}" >> "$GITHUB_ENV"
          echo "branch_id=${BRANCH_ID}" >> "$GITHUB_OUTPUT"
          echo "Created isolated Neon branch ${BRANCH_ID} with read-write endpoint."
      - name: Wait for isolated Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            STATE="$(curl -fsS -H "Authorization: Bearer ${NEON_API_KEY}" "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${NEON_BRANCH_ID}" | jq -r '.branch.current_state')"
            ENDPOINTS="$(curl -fsS -H "Authorization: Bearer ${NEON_API_KEY}" "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${NEON_BRANCH_ID}/endpoints" | jq '[.endpoints[] | select(.type=="read_write")] | length')"
            echo "attempt=${attempt} state=${STATE} read_write_endpoints=${ENDPOINTS}"
            [[ "$STATE" == ready && "$ENDPOINTS" -ge 1 ]] && exit 0
            sleep 2
          done
          exit 1
      - name: Resolve branch admin connection
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          URL="$(curl -fsS -G -H "Authorization: Bearer ${NEON_API_KEY}" \
            --data-urlencode "branch_id=${NEON_BRANCH_ID}" --data-urlencode "database_name=${DATABASE_NAME}" \
            --data-urlencode 'role_name=neondb_owner' \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri" | jq -er '.uri')"
          echo '::add-mask::'"$URL"
          echo "BRANCH_ADMIN_DATABASE_URL=$URL" >> "$GITHUB_ENV"
          psql "$URL" -v ON_ERROR_STOP=1 -Atqc 'SELECT current_user,current_database()' | grep -q '^neondb_owner|nexora$'
      - name: Bootstrap migration capability
        run: |
          set -euo pipefail
          psql "$BRANCH_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT CONNECT ON DATABASE nexora TO nexora_migrator;
          GRANT CONNECT ON DATABASE nexora TO nexora_owner;
          GRANT CONNECT ON DATABASE nexora TO nexora_app;
          GRANT nexora_owner TO nexora_migrator WITH INHERIT TRUE, SET TRUE;
          GRANT CREATE ON DATABASE nexora TO nexora_owner;
          GRANT USAGE, CREATE ON SCHEMA public TO nexora_owner;
          SQL
          test "$(psql "$BRANCH_ADMIN_DATABASE_URL" -Atqc "SELECT pg_has_role('nexora_migrator','nexora_owner','USAGE')")" = t
      - name: Resolve migrator connection
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          URL="$(curl -fsS -G -H "Authorization: Bearer ${NEON_API_KEY}" \
            --data-urlencode "branch_id=${NEON_BRANCH_ID}" --data-urlencode "database_name=${DATABASE_NAME}" \
            --data-urlencode 'role_name=nexora_migrator' \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri" | jq -er '.uri')"
          echo '::add-mask::'"$URL"
          echo "MIGRATOR_DATABASE_URL=$URL" >> "$GITHUB_ENV"
          psql "$URL" -v ON_ERROR_STOP=1 -Atqc 'SELECT current_user,current_database()' | grep -q '^nexora_migrator|nexora$'
      - name: Apply migrations
        run: |
          set -euo pipefail
          URL="$MIGRATOR_DATABASE_URL"
          if [[ "$URL" == *'?'* ]]; then URL="${URL}&options=-c%20role%3Dnexora_owner"; else URL="${URL}?options=-c%20role%3Dnexora_owner"; fi
          echo '::add-mask::'"$URL"
          echo "OWNER_DATABASE_URL=$URL" >> "$GITHUB_ENV"
          DATABASE_URL="$URL" pnpm --filter @nexora/database db:migrate
      - name: Verify NEX-43 schema, RLS and grants
        run: |
          set -euo pipefail
          psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $block$
          DECLARE n integer;
          BEGIN
            SELECT count(*) INTO n FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('trip_occurrences','trip_occurrence_history','trip_occurrence_documents');
            IF n <> 3 THEN RAISE EXCEPTION 'NEX-43 tables missing: %', n; END IF;
            SELECT count(*) INTO n FROM pg_class c JOIN pg_namespace s ON s.oid=c.relnamespace WHERE s.nspname='public' AND c.relname IN ('trip_occurrences','trip_occurrence_history','trip_occurrence_documents') AND c.relrowsecurity;
            IF n <> 3 THEN RAISE EXCEPTION 'NEX-43 RLS incomplete: %', n; END IF;
            IF NOT has_table_privilege('nexora_app','public.trip_occurrences','SELECT') OR NOT has_table_privilege('nexora_app','public.trip_occurrences','INSERT') OR NOT has_table_privilege('nexora_app','public.trip_occurrences','UPDATE') OR has_table_privilege('nexora_app','public.trip_occurrences','DELETE') THEN RAISE EXCEPTION 'trip_occurrences grants invalid'; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname='trip_occurrences_resolution_check') THEN RAISE EXCEPTION 'resolution constraint missing'; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname='trip_occurrence_history_occurrence_fk') THEN RAISE EXCEPTION 'history FK missing'; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname='trip_occurrence_documents_document_fk') THEN RAISE EXCEPTION 'document FK missing'; END IF;
          END $block$;
          SQL
      - name: Seed NEX-43 fixtures
        run: |
          set -euo pipefail
          psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO tenants (id,slug,name) VALUES ('73000000-0000-4000-8000-000000000001','nex43-a','NEX-43 Tenant A'),('73000000-0000-4000-8000-000000000002','nex43-b','NEX-43 Tenant B');
          INSERT INTO users (id,display_name) VALUES ('73000000-0000-4000-8000-000000000101','NEX-43 User A'),('73000000-0000-4000-8000-000000000102','NEX-43 User B');
          INSERT INTO memberships (tenant_id,user_id,status,joined_at) VALUES ('73000000-0000-4000-8000-000000000001','73000000-0000-4000-8000-000000000101','active',now()),('73000000-0000-4000-8000-000000000002','73000000-0000-4000-8000-000000000102','active',now());
          INSERT INTO countries (id,code,iso3,name) VALUES ('74000000-0000-4000-8000-000000000101','BR','BRA','Brazil');
          INSERT INTO states (id,country_id,code,name) VALUES ('74000000-0000-4000-8000-000000000102','74000000-0000-4000-8000-000000000101','SP','Sao Paulo');
          INSERT INTO cities (id,state_id,ibge_code,name) VALUES ('74000000-0000-4000-8000-000000000103','74000000-0000-4000-8000-000000000102','3550308','Sao Paulo');
          INSERT INTO locations (id,tenant_id,code,name,type,city_id,street,created_by_user_id,updated_by_user_id) VALUES ('74000000-0000-4000-8000-000000000111','73000000-0000-4000-8000-000000000001','NEX43-STOP','NEX-43 Stop','warehouse','74000000-0000-4000-8000-000000000103','Rua NEX-43','73000000-0000-4000-8000-000000000101','73000000-0000-4000-8000-000000000101');
          INSERT INTO document_types (id,tenant_id,code,name,subject_scope,has_expiry,requires_validation) VALUES ('74000000-0000-4000-8000-000000000041','73000000-0000-4000-8000-000000000001','OCC-EVIDENCE','Occurrence evidence','trip',false,false);
          INSERT INTO documents (id,tenant_id,document_type_id,title,status,created_by_user_id,updated_by_user_id) VALUES ('74000000-0000-4000-8000-000000000021','73000000-0000-4000-8000-000000000001','74000000-0000-4000-8000-000000000041','NEX-43 occurrence evidence','valid','73000000-0000-4000-8000-000000000101','73000000-0000-4000-8000-000000000101');
          INSERT INTO trips (id,tenant_id,code,status,planned_start_at,planned_end_at,origin_location_id,created_by_user_id,updated_by_user_id) VALUES ('74000000-0000-4000-8000-000000000001','73000000-0000-4000-8000-000000000001','NEX43-TRIP-001','ready','2026-09-02T12:00:00Z','2026-09-03T12:00:00Z','74000000-0000-4000-8000-000000000111','73000000-0000-4000-8000-000000000101','73000000-0000-4000-8000-000000000101');
          INSERT INTO trip_stops (id,tenant_id,trip_id,sequence,type,location_id,planned_arrival_at,planned_departure_at,created_by_user_id,updated_by_user_id) VALUES ('74000000-0000-4000-8000-000000000011','73000000-0000-4000-8000-000000000001','74000000-0000-4000-8000-000000000001',1,'pickup','74000000-0000-4000-8000-000000000111','2026-09-02T12:00:00Z','2026-09-02T13:00:00Z','73000000-0000-4000-8000-000000000101','73000000-0000-4000-8000-000000000101');
          SQL
      - name: Resolve app connection
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          URL="$(curl -fsS -G -H "Authorization: Bearer ${NEON_API_KEY}" \
            --data-urlencode "branch_id=${NEON_BRANCH_ID}" --data-urlencode "database_name=${DATABASE_NAME}" \
            --data-urlencode 'role_name=nexora_app' \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri" | jq -er '.uri')"
          echo '::add-mask::'"$URL"
          echo "APP_DATABASE_URL=$URL" >> "$GITHUB_ENV"
      - name: Build API
        run: pnpm --filter @nexora/api build
      - name: Run NEX-43 API integration
        env:
          DATABASE_POOL_MAX: '2'
        run: DATABASE_URL="$APP_DATABASE_URL" node apps/api/dist/trips/trip-occurrence.integration.js
      - name: Gate summary
        run: |
          echo '### NEX-43 Trip Occurrence Gate' >> "$GITHUB_STEP_SUMMARY"
          echo '- Neon ephemeral branch, migrations, RLS, grants and API integration: verified' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production: untouched' >> "$GITHUB_STEP_SUMMARY"
      - name: Delete isolated Neon branch
        if: ${{ always() && steps.branch.outputs.branch_id != '' }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          curl -fsS -X DELETE -H "Authorization: Bearer ${NEON_API_KEY}" "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${NEON_BRANCH_ID}" >/dev/null
          echo "Deleted isolated Neon branch ${NEON_BRANCH_ID}."
