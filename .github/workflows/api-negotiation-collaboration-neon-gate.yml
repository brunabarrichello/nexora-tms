name: API Negotiation Collaboration Neon Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'infrastructure/neon/**'
      - '.github/workflows/api-negotiation-collaboration-neon-gate.yml'

concurrency:
  group: api-negotiation-collaboration-neon-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NEON_PROJECT_ID: raspy-river-76339604
  DATABASE_NAME: nexora

jobs:
  integration:
    name: Negotiation collaboration API against nexora_app
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Neon API secret
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}" || { echo "NEON_API_KEY repository secret is not configured." >&2; exit 1; }

      - name: Set ephemeral branch
        run: |
          set -euo pipefail
          echo "NEON_TEST_BRANCH=pr-${{ github.event.pull_request.number }}-neg-api-${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "NEON_TEST_EXPIRES_AT=$(date -u --date '+2 hours' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create isolated Neon branch with bootstrap owner
        id: create-neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: production
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: ${{ env.DATABASE_NAME }}
          role: neondb_owner
          expires_at: ${{ env.NEON_TEST_EXPIRES_AT }}
          api_key: ${{ secrets.NEON_API_KEY }}
          api_host: https://console.neon.tech/api/v2
          prisma: false
          branch_type: default
          ssl: require
          suspend_timeout: 0
          get_auth_url: false
          get_data_api_url: false

      - name: Ensure PostgreSQL client
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Bootstrap and validate role capability
        shell: bash
        env:
          ADMIN_DATABASE_URL: ${{ steps.create-neon.outputs.db_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ADMIN_DATABASE_URL"
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT CREATE ON DATABASE nexora TO nexora_owner;
          GRANT USAGE, CREATE ON SCHEMA public TO nexora_owner;
          GRANT nexora_owner TO nexora_migrator;
          GRANT nexora_app TO neondb_owner;
          GRANT nexora_owner TO neondb_owner;
          SQL

          roles="$(psql "$ADMIN_DATABASE_URL" -Atqc "select session_user || ':' || current_user")"
          [[ "$roles" == "neondb_owner:neondb_owner" ]] || { echo "Unexpected bootstrap role: $roles" >&2; exit 1; }

          role_chain="$(psql "$ADMIN_DATABASE_URL" -Atqc "set role nexora_migrator; set role nexora_owner; select current_user")"
          [[ "$role_chain" == "nexora_owner" ]] || { echo "Unexpected Neon role chain: $role_chain" >&2; exit 1; }

          owner_capabilities="$(psql "$ADMIN_DATABASE_URL" -Atqc "select has_schema_privilege('nexora_owner','public','CREATE') || ':' || pg_has_role('nexora_migrator','nexora_owner','member')")"
          [[ "$owner_capabilities" == "t:t" ]] || { echo "Unexpected Neon owner capabilities: $owner_capabilities" >&2; exit 1; }

      - name: Resolve owner connection through bootstrap role
        id: owner
        shell: bash
        env:
          ADMIN_DATABASE_URL: ${{ steps.create-neon.outputs.db_url }}
        run: |
          set -euo pipefail
          if [[ "$ADMIN_DATABASE_URL" == *"?"* ]]; then
            OWNER_DATABASE_URL="${ADMIN_DATABASE_URL}&options=-c%20role%3Dnexora_owner"
          else
            OWNER_DATABASE_URL="${ADMIN_DATABASE_URL}?options=-c%20role%3Dnexora_owner"
          fi
          echo "OWNER_DATABASE_URL=$OWNER_DATABASE_URL" >> "$GITHUB_ENV"
          echo "::add-mask::$OWNER_DATABASE_URL"
          roles="$(psql "$OWNER_DATABASE_URL" -Atqc "select session_user || ':' || current_user")"
          [[ "$roles" == "neondb_owner:nexora_owner" ]] || { echo "Unexpected owner role chain: $roles" >&2; exit 1; }

      - name: Apply migrations and seed collaboration fixtures
        shell: bash
        env:
          DATABASE_URL: ${{ env.OWNER_DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::$DATABASE_URL"
          pnpm --filter @nexora/database db:migrate

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO tenants(id,slug,name,status) VALUES
            ('11111111-1111-4111-8111-111111111111','neg-api-a','Negotiation API A','active'),
            ('22222222-2222-4222-8222-222222222222','neg-api-b','Negotiation API B','active');

          INSERT INTO users(id,display_name,status) VALUES
            ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','Negotiation API User A','active'),
            ('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb','Negotiation API User B','active');

          INSERT INTO memberships(id,tenant_id,user_id,status,joined_at) VALUES
            ('aaaaaaaa-1111-4111-8111-aaaaaaaaaaaa','11111111-1111-4111-8111-111111111111','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','active',now()),
            ('bbbbbbbb-2222-4222-8222-bbbbbbbbbbbb','22222222-2222-4222-8222-222222222222','bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb','active',now());
          SQL

      - name: Resolve nexora_app connection
        id: app
        shell: bash
        env:
          ADMIN_DATABASE_URL: ${{ steps.create-neon.outputs.db_url }}
        run: |
          set -euo pipefail
          if [[ "$ADMIN_DATABASE_URL" == *"?"* ]]; then
            APP_DATABASE_URL="${ADMIN_DATABASE_URL}&options=-c%20role%3Dnexora_app"
          else
            APP_DATABASE_URL="${ADMIN_DATABASE_URL}?options=-c%20role%3Dnexora_app"
          fi
          echo "APP_DATABASE_URL=$APP_DATABASE_URL" >> "$GITHUB_ENV"
          echo "::add-mask::$APP_DATABASE_URL"
          roles="$(psql "$APP_DATABASE_URL" -Atqc "select session_user || ':' || current_user")"
          [[ "$roles" == "neondb_owner:nexora_app" ]] || { echo "Unexpected app role chain: $roles" >&2; exit 1; }

      - name: Build API
        run: pnpm --filter @nexora/api build

      - name: Run negotiation collaboration integration
        env:
          DATABASE_URL: ${{ env.APP_DATABASE_URL }}
          NODE_ENV: test
        run: pnpm --filter @nexora/api test:e2e -- --runInBand

      - name: Gate summary
        if: always()
        run: |
          echo "Negotiation collaboration Neon gate completed for database=${DATABASE_NAME}."

      - name: Delete isolated Neon branch
        if: always() && env.NEON_TEST_BRANCH != ''
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: ${{ env.NEON_TEST_BRANCH }}
          api_key: ${{ secrets.NEON_API_KEY }}
          api_host: https://console.neon.tech/api/v2
