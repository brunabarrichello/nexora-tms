name: Wave 0016 format

on:
  push:
    branches:
      - feat/database-wave-0016-master-data-enrichment
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/database-wave-0016-master-data-enrichment

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Wave 0016 API files
        run: pnpm exec prettier --write apps/api/src/master-data/master-data-enrichment.service.ts apps/api/src/master-data/master-data-enrichment.validation.ts apps/api/src/master-data/master-data-enrichment.validation.spec.ts apps/api/package.json

      - name: Compile API before commit
        run: pnpm --filter @nexora/api build

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/master-data/master-data-enrichment.service.ts \
                  apps/api/src/master-data/master-data-enrichment.validation.ts \
                  apps/api/src/master-data/master-data-enrichment.validation.spec.ts \
                  apps/api/package.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(api): format Wave 0016 master data"
          git push origin HEAD:feat/database-wave-0016-master-data-enrichment
