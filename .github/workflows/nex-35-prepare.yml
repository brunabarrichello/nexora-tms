name: NEX-35 Prepare

on:
  push:
    branches:
      - feature/NEX-35-driver-vehicle-carrier-links

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/NEX-35-driver-vehicle-carrier-links

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      - name: Test API
        run: pnpm --filter @nexora/api test

      - name: Generate migration
        run: pnpm --filter @nexora/database db:generate

      - name: Add runtime grants
        run: |
          latest="$(ls packages/database/migrations/*.sql | sort | tail -1)"
          if ! grep -q "GRANT SELECT, INSERT, UPDATE ON TABLE capacity_assignments TO nexora_app" "$latest"; then
            cat >> "$latest" <<'SQL'

          --> statement-breakpoint
          GRANT SELECT, INSERT, UPDATE ON TABLE capacity_assignments TO nexora_app;
          SQL
          fi

      - name: Check migration
        run: pnpm --filter @nexora/database db:check

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps packages
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c core.hooksPath=/dev/null commit -m "NEX-35 generate assignment migration and format"
          git push origin HEAD:feature/NEX-35-driver-vehicle-carrier-links
