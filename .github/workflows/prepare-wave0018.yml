name: Prepare Wave 0018

on:
  push:
    branches:
      - feat/documents-wave-0018

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/documents-wave-0018
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: pnpm install --frozen-lockfile
      - name: Extend document type subject scope
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          schema = Path('packages/database/src/schema/reference-data.ts')
          text = schema.read_text()
          old = "('party','driver','asset','request','trip','financial','other')"
          new = "('party','driver','asset','request','trip','financial','contract','other')"
          if old not in text and new not in text:
              raise SystemExit('document_types subject scope check was not found')
          schema.write_text(text.replace(old, new))

          validation = Path('apps/api/src/master-data/reference-data.validation.ts')
          text = validation.read_text()
          old = "  'financial',\n  'other',"
          new = "  'financial',\n  'contract',\n  'other',"
          if old not in text and new not in text:
              raise SystemExit('reference data subjectScopes set was not found')
          validation.write_text(text.replace(old, new))
          PY
      - name: Generate Wave 0018 migration
        run: pnpm --filter @nexora/database db:generate
      - name: Format Wave 0018 sources
        run: >-
          pnpm exec prettier --write
          packages/database/src/schema/documents.ts
          packages/database/src/schema/reference-data.ts
          packages/database/src/schema/index.ts
          apps/api/src/documents
          apps/api/src/app.module.ts
          apps/api/src/master-data/reference-data.validation.ts
          packages/database/migrations/meta/_journal.json
      - name: Typecheck Wave 0018 core
        run: pnpm typecheck
      - name: Remove temporary workflow and commit generated artifacts
        shell: bash
        run: |
          rm .github/workflows/prepare-wave0018.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(documents): generate Wave 0018 migration and normalize core'
          git push --no-verify origin HEAD:feat/documents-wave-0018
