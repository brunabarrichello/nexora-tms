name: Repair PR207 lockfile

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brunabarrichello-database-target-update
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Restore complete lockfile from pre-remediation parent
        run: git show cfde201d3e4ccaec4af505d08b0910fc64859db1:pnpm-lock.yaml > pnpm-lock.yaml
      - name: Regenerate lockfile for multer 2.3.0
        run: pnpm update multer@2.3.0 --lockfile-only
      - name: Verify lockfile integrity
        run: |
          test "$(grep -c '^  multer@2\.3\.0:' pnpm-lock.yaml)" = "1"
          test "$(grep -c '^  multer@2\.2\.0:' pnpm-lock.yaml || true)" = "0"
          test "$(grep -c '      multer: 2\.3\.0' pnpm-lock.yaml)" = "1"
          test "$(grep -c 'specifier: 12\.0\.1' pnpm-lock.yaml)" -ge "2"
          test "$(grep -c '^snapshots:' pnpm-lock.yaml)" = "1"
      - name: Commit corrected lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --quiet && exit 1
          git commit -m "fix(deps): regenerate complete lockfile for multer 2.3.0"
          git push origin HEAD:brunabarrichello-database-target-update
