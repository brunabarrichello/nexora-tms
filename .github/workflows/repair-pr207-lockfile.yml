name: Repair PR207 lockfile

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    if: github.event.pull_request.number == 207 && github.event.pull_request.head.ref == 'brunabarrichello-database-target-update'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: brunabarrichello-database-target-update
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Detect whether lockfile already satisfies repair invariants
        id: already_fixed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('pnpm-lock.yaml').read_text()
          ok = ('\n  multer@2.3.0:\n' in text
                and '\n  multer@2.2.0:\n' not in text
                and '\nsnapshots:\n' in text)
          print(f'ok={str(ok).lower()}')
          with open(__import__('os').environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'ok={str(ok).lower()}\n')
          PY
      - name: Stop because lockfile is already correct
        if: steps.already_fixed.outputs.ok == 'true'
        run: echo 'Lockfile already satisfies multer 2.3.0 / no 2.2.0 / snapshots invariants.'
      - name: Preserve original workspace files
        if: steps.already_fixed.outputs.ok != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp package.json /tmp/package.json.original
          cp pnpm-workspace.yaml /tmp/pnpm-workspace.yaml.original
      - name: Restore complete lockfile baseline
        if: steps.already_fixed.outputs.ok != 'true'
        run: git show cfde201d3e4ccaec4af505d08b0910fc64859db1:pnpm-lock.yaml > pnpm-lock.yaml
      - name: Temporarily override Multer for lockfile resolution
        if: steps.already_fixed.outputs.ok != 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '\noverrides:\n  multer: 2.3.0\n' >> pnpm-workspace.yaml
          pnpm install --lockfile-only
      - name: Validate generated lockfile and restore workspace files
        if: steps.already_fixed.outputs.ok != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('pnpm-lock.yaml').read_text()
          assert '\n  multer@2.3.0:\n' in text, 'multer@2.3.0 missing'
          assert '\n  multer@2.2.0:\n' not in text, 'multer@2.2.0 present'
          assert '\nsnapshots:\n' in text, 'snapshots section missing'
          PY
          cp /tmp/package.json.original package.json
          cp /tmp/pnpm-workspace.yaml.original pnpm-workspace.yaml
          test "$(git show HEAD:package.json)" = "$(cat package.json)"
          test "$(git show HEAD:pnpm-workspace.yaml)" = "$(cat pnpm-workspace.yaml)"
          test "$(git diff --name-only)" = "pnpm-lock.yaml"
      - name: Commit only corrected lockfile
        if: steps.already_fixed.outputs.ok != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          test "$(git diff --cached --name-only)" = "pnpm-lock.yaml"
          git commit -m "fix(deps): regenerate complete lockfile for multer 2.3.0"
          git push origin HEAD:brunabarrichello-database-target-update
