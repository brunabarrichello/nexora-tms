name: Repair PR207 lockfile

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    if: github.event.pull_request.number == 207 && github.event.pull_request.head.ref == 'brunabarrichello-database-target-update'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brunabarrichello-database-target-update
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Restore complete lockfile baseline
        run: git show cfde201d3e4ccaec4af505d08b0910fc64859db1:pnpm-lock.yaml > pnpm-lock.yaml
      - name: Temporarily override transitive Multer for lockfile resolution
        run: |
          cat >> pnpm-workspace.yaml <<'EOF'

overrides:
  multer@^2.2.0: 2.3.0
EOF
          pnpm install --lockfile-only
      - name: Remove temporary override
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pnpm-workspace.yaml')
          s = p.read_text()
          s = s.replace('\n\noverrides:\n  multer@^2.2.0: 2.3.0\n', '\n')
          p.write_text(s)
          PY
      - name: Validate corrected lockfile
        run: |
          test "$(grep -c '^  multer@2\.3\.0:' pnpm-lock.yaml)" = "1"
          test "$(grep -c '^  multer@2\.2\.0:' pnpm-lock.yaml || true)" = "0"
          test "$(grep -c '^snapshots:' pnpm-lock.yaml)" = "1"
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Production audit
        run: pnpm audit --prod --audit-level=high
      - name: Commit only corrected lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --quiet && exit 1
          git commit -m "fix(deps): regenerate complete lockfile for multer 2.3.0"
          git push origin HEAD:brunabarrichello-database-target-update
