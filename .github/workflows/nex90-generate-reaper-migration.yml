name: NEX-90 Generate Lease Reaper Migration

on:
  push:
    branches:
      - feat/nex-90-outbox-durable-jobs

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/nex-90-outbox-durable-jobs

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate custom Drizzle migration
        run: pnpm --filter @nexora/database exec drizzle-kit generate --custom --name nex90_lease_reaper

      - name: Commit generated migration artifacts
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/database/migrations; then
            echo "Custom migration generator produced no artifact." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/migrations
          git commit -m "chore(nex-90): generate lease reaper migration artifact"
          git push origin HEAD:feat/nex-90-outbox-durable-jobs
