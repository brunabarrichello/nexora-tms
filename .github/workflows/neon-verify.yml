name: Neon Verify

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Nexora environment to verify
        required: true
        default: development
        type: choice
        options:
          - development
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: neon-verify-${{ inputs.environment }}
  cancel-in-progress: false

env:
  NEON_PROJECT_ID: raspy-river-76339604

jobs:
  verify:
    name: Verify ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Neon API secret
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${NEON_API_KEY:-}" ]]; then
            echo "NEON_API_KEY repository secret is not configured." >&2
            exit 1
          fi

      - name: Resolve Neon branch
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail

          case "${{ inputs.environment }}" in
            production) branch_name="main" ;;
            staging) branch_name="staging" ;;
            development) branch_name="development" ;;
            *) echo "Unsupported environment" >&2; exit 1 ;;
          esac

          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            -H "Accept: application/json" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches")"

          branch_id="$(jq -r --arg name "$branch_name" '.branches[] | select(.name == $name) | .id' <<<"$response" | head -n1)"

          if [[ -z "$branch_id" || "$branch_id" == "null" ]]; then
            echo "Neon branch '$branch_name' was not found." >&2
            exit 1
          fi

          echo "NEON_BRANCH_NAME=$branch_name" >> "$GITHUB_ENV"
          echo "NEON_BRANCH_ID=$branch_id" >> "$GITHUB_ENV"
          echo "Resolved Neon branch: $branch_name"

      - name: Verify Neon database via API
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail

          databases="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            -H "Accept: application/json" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${NEON_BRANCH_ID}/databases")"

          jq -e '.databases | any(.name == "nexora")' <<<"$databases" >/dev/null || {
            echo "Database 'nexora' is missing on branch ${NEON_BRANCH_NAME}." >&2
            exit 1
          }

          echo "Neon project, branch and database are present."

      - name: Install Neon CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global neon
          neon --version

      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Verify PostgreSQL foundation
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          node scripts/neon/direct-sql.mjs \
            --environment "${{ inputs.environment }}" \
            --file scripts/neon/verify.sql

      - name: Verification summary
        shell: bash
        run: |
          {
            echo "## Neon verification passed"
            echo ""
            echo "- Environment: ${{ inputs.environment }}"
            echo "- Branch: ${NEON_BRANCH_NAME}"
            echo "- Database: nexora"
            echo "- Connection: generated dynamically via Neon CLI"
            echo "- SQL path: scripts/neon/direct-sql.mjs (MCP-independent)"
            echo "- Required roles: verified by PostgreSQL"
            echo "- Foundation schemas: verified"
          } >> "$GITHUB_STEP_SUMMARY"
