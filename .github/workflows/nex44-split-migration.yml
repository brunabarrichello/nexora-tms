name: NEX-44 Split Enum Migration

on:
  push:
    branches:
      - feat/nex-44-trip-completion
    paths:
      - '.github/workflows/nex44-split-migration.yml'

permissions:
  contents: write

jobs:
  split-migration:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/nex-44-trip-completion
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
      - run: pnpm install --frozen-lockfile
      - name: Split enum commit boundary
        shell: bash
        run: |
          set -euo pipefail
          MIGRATION='packages/database/migrations/0029_abnormal_dexter_bennett.sql'
          tail -n +5 "$MIGRATION" > /tmp/nex44-finalize.sql
          head -n 4 "$MIGRATION" > /tmp/nex44-enums.sql
          mv /tmp/nex44-enums.sql "$MIGRATION"
          pnpm --filter @nexora/database exec drizzle-kit generate --custom --name=nex44_finalize_lifecycle --config=drizzle.config.ts
          TARGET=$(find packages/database/migrations -maxdepth 1 -type f -name '0030_*.sql' -print -quit)
          test -n "$TARGET"
          cat /tmp/nex44-finalize.sql > "$TARGET"
          printf '0029=%s\n0030=%s\n' "$MIGRATION" "$TARGET"
      - name: Validate Drizzle artifacts
        run: pnpm --filter @nexora/database db:check
      - name: Commit migration split
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/database/migrations
          git commit -m 'fix(db): split NEX-44 enum migration boundary'
          git push origin HEAD:feat/nex-44-trip-completion
