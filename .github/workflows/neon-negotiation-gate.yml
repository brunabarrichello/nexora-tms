name: Neon Negotiation Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/database/**'
      - 'apps/api/src/negotiation/**'
      - '.github/workflows/neon-negotiation-gate.yml'

permissions:
  contents: read

concurrency:
  group: neon-negotiation-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  NEON_PROJECT_ID: raspy-river-76339604
  DATABASE_NAME: nexora
  NEON_PARENT_BRANCH_ID: br-autumn-frog-a5ticm98

jobs:
  negotiation-isolation:
    name: Negotiation schema, grants and RLS isolation
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Neon API secret
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: test -n "${NEON_API_KEY:-}"

      - name: Create isolated Neon branch
        id: create-neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: ${{ env.NEON_PARENT_BRANCH_ID }}
          branch_name: pr-${{ github.event.pull_request.number }}-negotiation-${{ github.run_id }}
          database: ${{ env.DATABASE_NAME }}
          role: neondb_owner
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Resolve isolated admin connection
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          BRANCH_ID: ${{ steps.create-neon.outputs.branch_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if URI_JSON="$(curl -fsS -H "Authorization: Bearer ${NEON_API_KEY}" -H 'Accept: application/json' "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri?branch_id=${BRANCH_ID}&database_name=${DATABASE_NAME}&role_name=neondb_owner")"; then
              ADMIN_DATABASE_URL="$(printf '%s' "$URI_JSON" | jq -r '.uri // .connection_uri // empty')"
              if [[ -n "$ADMIN_DATABASE_URL" && "$ADMIN_DATABASE_URL" != "null" ]]; then break; fi
            fi
            [[ "$attempt" -eq 10 ]] && { echo 'Neon API did not return admin URI.' >&2; exit 1; }
            sleep 3
          done
          echo '::add-mask::'"$ADMIN_DATABASE_URL"
          ADMIN_ID="$(psql "$ADMIN_DATABASE_URL" -Atqc 'select session_user || '"'"':'"'"' || current_user')"
          [[ "$ADMIN_ID" == 'neondb_owner:neondb_owner' ]]
          echo "ADMIN_DATABASE_URL=$ADMIN_DATABASE_URL" >> "$GITHUB_ENV"
          echo "Verified isolated admin identity: $ADMIN_ID"

      - name: Bootstrap migration and application capabilities
        run: |
          set -euo pipefail
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT nexora_migrator TO neondb_owner;
          GRANT nexora_owner TO neondb_owner;
          GRANT nexora_owner TO nexora_migrator;
          GRANT CONNECT ON DATABASE nexora TO nexora_migrator;
          GRANT CONNECT ON DATABASE nexora TO nexora_owner;
          GRANT CONNECT ON DATABASE nexora TO nexora_app;
          SQL

      - name: Resolve migrator connection
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          BRANCH_ID: ${{ steps.create-neon.outputs.branch_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if URI_JSON="$(curl -fsS -H "Authorization: Bearer ${NEON_API_KEY}" -H 'Accept: application/json' "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri?branch_id=${BRANCH_ID}&database_name=${DATABASE_NAME}&role_name=nexora_migrator&pooled=false")"; then
              MIGRATOR_DATABASE_URL="$(printf '%s' "$URI_JSON" | jq -r '.uri // .connection_uri // empty')"
              if [[ -n "$MIGRATOR_DATABASE_URL" && "$MIGRATOR_DATABASE_URL" != "null" ]]; then break; fi
            fi
            [[ "$attempt" -eq 10 ]] && { echo 'Neon API did not return migrator URI.' >&2; exit 1; }
            sleep 3
          done
          echo '::add-mask::'"$MIGRATOR_DATABASE_URL"
          echo "MIGRATOR_DATABASE_URL=$MIGRATOR_DATABASE_URL" >> "$GITHUB_ENV"

      - name: Resolve migration capability
        run: |
          set -euo pipefail
          if [[ "$MIGRATOR_DATABASE_URL" == *'?'* ]]; then
            OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}&options=-c%20role%3Dnexora_owner"
          else
            OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}?options=-c%20role%3Dnexora_owner"
          fi
          echo '::add-mask::'"$OWNER_DATABASE_URL"
          echo "OWNER_DATABASE_URL=$OWNER_DATABASE_URL" >> "$GITHUB_ENV"
          roles="$(psql "$OWNER_DATABASE_URL" -Atqc 'select session_user || '"'"':'"'"' || current_user')"
          [[ "$roles" == 'nexora_migrator:nexora_owner' ]]

      - name: Apply migrations for negotiation schema
        run: DATABASE_URL="$OWNER_DATABASE_URL" pnpm --filter @nexora/database db:migrate

      - name: Verify negotiation schema and grants
        run: |
          set -euo pipefail
          psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $block$
          DECLARE v_count integer;
          BEGIN
            SELECT count(*) INTO v_count FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('negotiation_threads','negotiation_participants','negotiation_messages');
            IF v_count <> 3 THEN RAISE EXCEPTION 'Expected 3 negotiation tables, found %', v_count; END IF;
            SELECT count(*) INTO v_count FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname IN ('negotiation_threads','negotiation_participants','negotiation_messages') AND c.relrowsecurity;
            IF v_count <> 3 THEN RAISE EXCEPTION 'Expected RLS on 3 negotiation tables, found %', v_count; END IF;
            IF NOT has_table_privilege('nexora_app','public.negotiation_threads','SELECT') OR NOT has_table_privilege('nexora_app','public.negotiation_threads','INSERT') OR NOT has_table_privilege('nexora_app','public.negotiation_threads','UPDATE') OR has_table_privilege('nexora_app','public.negotiation_threads','DELETE') THEN RAISE EXCEPTION 'negotiation_threads grants incorrect'; END IF;
            IF NOT has_table_privilege('nexora_app','public.negotiation_participants','SELECT') OR NOT has_table_privilege('nexora_app','public.negotiation_participants','INSERT') OR NOT has_table_privilege('nexora_app','public.negotiation_participants','UPDATE') OR has_table_privilege('nexora_app','public.negotiation_participants','DELETE') THEN RAISE EXCEPTION 'negotiation_participants grants incorrect'; END IF;
            IF NOT has_table_privilege('nexora_app','public.negotiation_messages','SELECT') OR NOT has_table_privilege('nexora_app','public.negotiation_messages','INSERT') OR has_table_privilege('nexora_app','public.negotiation_messages','UPDATE') OR has_table_privilege('nexora_app','public.negotiation_messages','DELETE') THEN RAISE EXCEPTION 'negotiation_messages grants incorrect'; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname='negotiation_messages' AND t.tgname='negotiation_messages_reply_scope_trigger' AND NOT t.tgisinternal) THEN RAISE EXCEPTION 'reply-scope trigger is missing'; END IF;
          END $block$;
          SQL

      - name: Resolve app connection
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          BRANCH_ID: ${{ steps.create-neon.outputs.branch_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if URI_JSON="$(curl -fsS -H "Authorization: Bearer ${NEON_API_KEY}" -H 'Accept: application/json' "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri?branch_id=${BRANCH_ID}&database_name=${DATABASE_NAME}&role_name=nexora_app")"; then
              APP_DATABASE_URL="$(printf '%s' "$URI_JSON" | jq -r '.uri // .connection_uri // empty')"
              if [[ -n "$APP_DATABASE_URL" && "$APP_DATABASE_URL" != "null" ]]; then break; fi
            fi
            [[ "$attempt" -eq 10 ]] && { echo 'Neon API did not return app URI.' >&2; exit 1; }
            sleep 3
          done
          echo '::add-mask::'"$APP_DATABASE_URL"
          echo "APP_DATABASE_URL=$APP_DATABASE_URL" >> "$GITHUB_ENV"

      - name: Verify runtime tenant isolation and reply scope
        run: |
          set -euo pipefail
          psql "$APP_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          SELECT set_config('app.tenant_id','11111111-1111-4111-8111-111111111111',true);
          SELECT count(*) FROM negotiation_threads;
          SELECT set_config('app.tenant_id','22222222-2222-4222-8222-222222222222',true);
          DO $block$
          BEGIN
            IF EXISTS (SELECT 1 FROM negotiation_threads WHERE tenant_id <> current_setting('app.tenant_id')::uuid) THEN RAISE EXCEPTION 'Cross-tenant negotiation visibility detected'; END IF;
          END $block$;
          ROLLBACK;
          SQL

      - name: Gate summary
        run: |
          {
            echo '### Neon Negotiation Gate'
            echo '- Isolated branch: create-branch-action@v6'
            echo '- Database: nexora'
            echo '- Negotiation schema, RLS and least-privilege grants: verified'
            echo '- Runtime tenant isolation and reply scope: verified'
            echo '- Production: untouched'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete ephemeral Neon branch
        if: ${{ always() && steps.create-neon.outputs.branch_id != '' }}
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch_id: ${{ steps.create-neon.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
