name: One-time lockfile regeneration

on:
  push:
    branches:
      - brunabarrichello-database-target-update

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: brunabarrichello-database-target-update
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Regenerate lockfile with security override
        run: pnpm install --no-frozen-lockfile
      - name: Remove temporary override and re-resolve lockfile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pnpm-workspace.yaml')
          text = p.read_text()
          text = text.replace("\noverrides:\n  multer: 2.3.0\n", "\n")
          p.write_text(text)
          PY
          pnpm install --no-frozen-lockfile
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml pnpm-workspace.yaml; then
            echo "No dependency metadata changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml pnpm-workspace.yaml
          git commit -m "fix(deps): regenerate lockfile for multer security update"
          git push origin HEAD:brunabarrichello-database-target-update
