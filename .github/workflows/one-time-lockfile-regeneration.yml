name: One-time lockfile regeneration

# Temporary maintenance workflow; explicitly updates the vulnerable transitive dependency.
on:
  pull_request:
    types:
      - synchronize
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.head_commit.message != 'fix(deps): update multer to patched release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: brunabarrichello-database-target-update
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Regenerate lockfile with explicit multer security update
        run: pnpm update multer@2.3.0 --lockfile-only
      - name: Verify resolved multer version
        run: |
          grep -n -A4 -B2 "multer@" pnpm-lock.yaml
          if ! grep -q "multer@2.3.0:" pnpm-lock.yaml; then
            echo "Expected multer 2.3.0 resolution not found."
            exit 1
          fi
      - name: Validate frozen install and production audit
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level=high
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "No lockfile changes were generated."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix(deps): update multer to patched release"
          git push origin HEAD:brunabarrichello-database-target-update
