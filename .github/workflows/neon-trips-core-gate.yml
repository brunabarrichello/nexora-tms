            ('62000000-0000-4000-8000-000000000602','61000000-0000-4000-8000-000000000001','62000000-0000-4000-8000-000000000503','delivery','Trips Destination','Rua Destino','200','Campinas','SP',true);

          INSERT INTO transport_requests (
            id,tenant_id,customer_party_id,shipper_party_id,consignee_party_id,
            origin_address_id,destination_address_id,planned_pickup_at,planned_delivery_at,
            cargo_description,status,created_by_user_id,updated_by_user_id
          ) VALUES (
            '62000000-0000-4000-8000-000000000701','61000000-0000-4000-8000-000000000001',
            '62000000-0000-4000-8000-000000000502','62000000-0000-4000-8000-000000000502','62000000-0000-4000-8000-000000000503',
            '62000000-0000-4000-8000-000000000601','62000000-0000-4000-8000-000000000602',
            '2026-09-10T08:00:00Z','2026-09-11T18:00:00Z','Trips integration cargo','contracted',
