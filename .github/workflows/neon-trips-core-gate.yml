      - name: Resolve nexora_app connection
        id: app
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: main
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: neondb
          role: nexora_app
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Build API
        run: pnpm --filter @nexora/api build

      - name: Run Trips Core integration against Neon
        shell: bash
        env:
          DATABASE_URL: ${{ steps.app.outputs.db_url }}
          DATABASE_POOL_MAX: '2'
        run: |
          set -euo pipefail
          node apps/api/dist/trips/trips.integration.js

      - name: Gate summary
        shell: bash
        run: |
          {
            echo '## Wave 0022 — Trips Core'
            echo '- schema and RLS: verified'
            echo '- runtime grants: verified'
            echo '- confirmed contract → trip creation: verified'
            echo '- request stops copied: verified'
            echo '- primary driver/vehicle assignment: verified'
            echo '- lifecycle planned → ready → in_transit → completed: verified'
            echo '- append-only status history: verified'
            echo '- cross-tenant visibility: rejected by RLS'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete isolated Neon branch
        if: ${{ always() && steps.admin.outputs.branch_id != '' }}
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: ${{ steps.admin.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
