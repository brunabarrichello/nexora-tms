name: Neon Trips Core Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/database/**'
      - 'apps/api/src/trips/**'
      - '.github/workflows/neon-trips-core-gate.yml'

permissions:
  contents: read

concurrency:
  group: neon-trips-core-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NEON_PROJECT_ID: raspy-river-76339604

jobs:
  trips-core:
    name: Trips Core schema, RLS and API integration
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Neon API secret
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}" || { echo "NEON_API_KEY repository secret is not configured." >&2; exit 1; }

      - name: Set ephemeral branch
        shell: bash
        run: |
          set -euo pipefail
          echo "NEON_TEST_BRANCH=pr-${{ github.event.pull_request.number }}-trips-${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "NEON_TEST_EXPIRES_AT=$(date -u --date '+2 hours' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create isolated Neon branch
        id: admin
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: main
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: neondb
          role: neondb_owner
          expires_at: ${{ env.NEON_TEST_EXPIRES_AT }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Bootstrap migration capability
        shell: bash
        env:
          ADMIN_DATABASE_URL: ${{ steps.admin.outputs.db_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ADMIN_DATABASE_URL"
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT CREATE ON DATABASE neondb TO nexora_owner;
          GRANT USAGE, CREATE ON SCHEMA public TO nexora_owner;
          SQL

      - name: Resolve migrator connection
        id: migrator
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: main
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: neondb
          role: nexora_migrator
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Apply migrations
        shell: bash
        env:
          MIGRATOR_DATABASE_URL: ${{ steps.migrator.outputs.db_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$MIGRATOR_DATABASE_URL"
          if [[ "$MIGRATOR_DATABASE_URL" == *"?"* ]]; then
            OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}&options=-c%20role%3Dnexora_owner"
          else
            OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}?options=-c%20role%3Dnexora_owner"
          fi
          echo "::add-mask::$OWNER_DATABASE_URL"
          echo "OWNER_DATABASE_URL=$OWNER_DATABASE_URL" >> "$GITHUB_ENV"
          DATABASE_URL="$OWNER_DATABASE_URL" pnpm --filter @nexora/database db:migrate

      - name: Verify Trips Core schema, RLS and grants
        shell: bash
        run: |
          set -euo pipefail
          psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $block$
          DECLARE
            v_count integer;
          BEGIN
            SELECT count(*) INTO v_count
              FROM information_schema.tables
             WHERE table_schema='public'
               AND table_name IN (
                 'trips','trip_transport_requests','trip_stops',
                 'trip_drivers','trip_assets','trip_status_history'
               );
            IF v_count <> 6 THEN
              RAISE EXCEPTION 'Expected 6 Trips Core tables, found %', v_count;
            END IF;

            SELECT count(*) INTO v_count
              FROM pg_class c
              JOIN pg_namespace n ON n.oid=c.relnamespace
             WHERE n.nspname='public'
               AND c.relname IN (
                 'trips','trip_transport_requests','trip_stops',
                 'trip_drivers','trip_assets','trip_status_history'
               )
               AND c.relrowsecurity;
            IF v_count <> 6 THEN
              RAISE EXCEPTION 'Expected RLS on 6 Trips Core tables, found %', v_count;
            END IF;

            IF EXISTS (
              SELECT 1
                FROM unnest(ARRAY[
                  'trips','trip_transport_requests','trip_stops','trip_drivers','trip_assets'
                ]) AS t(table_name)
               WHERE NOT has_table_privilege('nexora_app',format('public.%I',table_name),'SELECT')
                  OR NOT has_table_privilege('nexora_app',format('public.%I',table_name),'INSERT')
                  OR NOT has_table_privilege('nexora_app',format('public.%I',table_name),'UPDATE')
                  OR has_table_privilege('nexora_app',format('public.%I',table_name),'DELETE')
            ) THEN
              RAISE EXCEPTION 'Trips Core mutable-table grants are incorrect';
            END IF;

            IF NOT has_table_privilege('nexora_app','public.trip_status_history','SELECT')
               OR NOT has_table_privilege('nexora_app','public.trip_status_history','INSERT')
               OR has_table_privilege('nexora_app','public.trip_status_history','UPDATE')
               OR has_table_privilege('nexora_app','public.trip_status_history','DELETE') THEN
              RAISE EXCEPTION 'trip_status_history must remain append-only';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
               WHERE conname='transport_contracts_tenant_request_id_unique'
            ) THEN
              RAISE EXCEPTION 'Composite transport contract key required by Trips Core is missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
               WHERE conname='trip_transport_requests_contract_fk'
            ) THEN
              RAISE EXCEPTION 'Trip-to-contract tenant-aware FK is missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
               WHERE schemaname='public'
                 AND indexname='trip_transport_requests_active_request_unique'
            ) OR NOT EXISTS (
              SELECT 1 FROM pg_indexes
               WHERE schemaname='public'
                 AND indexname='trip_transport_requests_active_contract_unique'
            ) THEN
              RAISE EXCEPTION 'Active request/contract uniqueness indexes are missing';
            END IF;
          END
          $block$;
          SQL

