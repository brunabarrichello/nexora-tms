name: NEX-91 Staging Worker Credential Export

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/nex91-staging-credential-export.yml'

permissions:
  contents: read

env:
  NEON_PROJECT_ID: raspy-river-76339604

jobs:
  export:
    name: Export encrypted Staging worker credential
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Resolve Staging worker connection
        id: worker
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: production
          branch_name: staging
          database: neondb
          role: nexora_worker
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Encrypt credential for one-shot transport
        shell: bash
        env:
          DB_URL: ${{ steps.worker.outputs.db_url }}
        run: |
          set -euo pipefail
          test -n "$DB_URL"
          echo "::add-mask::$DB_URL"
          cat > public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAoQZG36gGW0BxpF35VrdR
          qUeh6JYJjrwZUGT4F92n8aVJzW/9otbNCTF3A84KGCOQ4zxyHY+ZVJVfo0n4OEvW
          22+CooSbhMcZVbLUiBv4a9npLBaLdTcm6O3Hf8HRQNu8JfUe4nnBSDxzc9LXjZI2
          wCpqjkQzPjoXFJBmhwqf6JpLN71GakXwuNV9XCzBAtP0u8CiSQtp1Y634nus69NF
          uy+h+FHTMaU/x1A/9xgrEOCPPGmoMfzBnjY94T5i7jDmT9nJqtA8Db2AsXaIQfjJ
          2X7kIwLFro2gKkBIuui1BIOW2hUB+xc6oFA/thFrt1JmHBhHoK6cZp/9kpygNjcZ
          PqkuDLiuzxgat0HqmR7nkjB3NJd1fXyVzs6WzMzv3hzZylHGM6P7DgsNyOmTxO+z
          1l/Z8NgfCUgqolYrAAYcTf6wkgsGGrAqdG96AMMduev3G7Z94AC8dk2mIj9nKGXu
          37JUhE6OnKs5Tn6WxmmRaKRImlpy1Yik4fvCqeKgpxVm66Ja4LCMRbUKp6A49coH
          ri23ctbdQmmBQZaAuclxkL1j63sK5LwTmzQXjGLoUDzjY2roRWOQquvK/UAIVA5X
          Vfm3YAo8BwKN4uj3jCt/DW+/CP5TAmymOYm+4f2L2zmjR+lueAVVJFJygFaas1pI
          3J2sAmDAcHysKXJf515LN48CAwEAAQ==
          -----END PUBLIC KEY-----
          PEM
          printf '%s' "$DB_URL" > credential.txt
          openssl rand -base64 48 > passphrase.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in credential.txt -out credential.enc -pass file:passphrase.txt
          openssl pkeyutl -encrypt -pubin -inkey public.pem -in passphrase.txt -out passphrase.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          echo "NEX91_STAGING_ENCRYPTED_KEY=$(base64 -w0 passphrase.enc)"
          echo "NEX91_STAGING_ENCRYPTED_DATA=$(base64 -w0 credential.enc)"
          rm -f credential.txt passphrase.txt credential.enc passphrase.enc public.pem
