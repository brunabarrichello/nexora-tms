name: Neon Database Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/database/**'
      - 'apps/api/src/freight/**'
      - 'apps/api/src/capacity/**'
      - 'apps/api/src/documents/**'
      - 'apps/api/src/negotiation/**'
      - 'apps/api/src/trips/**'
      - 'apps/api/src/master-data/**'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/neon-pr-gate.yml'

permissions:
  contents: read

concurrency:
  group: neon-db-gate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NEON_PROJECT_ID: raspy-river-76339604
  NEON_PARENT_BRANCH_ID: br-silent-feather-a5ku7uyi

jobs:
  isolated-migration-rls:
    name: Isolated migration and RLS
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Neon API secret
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}"

      - name: Resolve expected migration count
        run: |
          set -euo pipefail
          EXPECTED_MIGRATIONS="$(node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('packages/database/migrations/meta/_journal.json','utf8')); process.stdout.write(String(j.entries.length));")"
          test "$EXPECTED_MIGRATIONS" -gt 0
          echo "EXPECTED_MIGRATIONS=$EXPECTED_MIGRATIONS" >> "$GITHUB_ENV"
          echo "Expected Drizzle migrations: $EXPECTED_MIGRATIONS"

      - name: Set ephemeral branch name and expiry
        run: |
          set -euo pipefail
          echo "NEON_TEST_BRANCH=pr-${{ github.event.pull_request.number }}-db-${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "NEON_TEST_EXPIRES_AT=$(date -u --date '+2 hours' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create isolated Neon branch
        id: create-neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq
          payload="$(jq -nc \
            --arg parent_id "$NEON_PARENT_BRANCH_ID" \
            --arg branch_name "$NEON_TEST_BRANCH" \
            --arg expires_at "$NEON_TEST_EXPIRES_AT" \
            '{branch:{parent_id:$parent_id,name:$branch_name,expires_at:$expires_at},endpoints:[{type:"read_write"}]}')"
          response_file="$(mktemp)"
          status="$(curl -sS -o "$response_file" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches")"
          if [[ "$status" != "201" ]]; then
            echo "Neon branch creation failed with HTTP $status." >&2
            jq -c '{code,message,error,detail}' "$response_file" >&2 || cat "$response_file" >&2
            exit 1
          fi
          BRANCH_ID="$(jq -r '.branch.id // empty' "$response_file")"
          test -n "$BRANCH_ID"
          echo "branch_id=$BRANCH_ID" >> "$GITHUB_OUTPUT"
          echo "Created isolated Neon branch: $NEON_TEST_BRANCH ($BRANCH_ID)"

      - name: Resolve isolated admin connection
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          BRANCH_ID: ${{ steps.create-neon.outputs.branch_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if URI_JSON="$(curl -fsS -H "Authorization: Bearer ${NEON_API_KEY}" -H 'Accept: application/json' "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri?branch_id=${BRANCH_ID}&database_name=nexora&role_name=neondb_owner")"; then
              ADMIN_DATABASE_URL="$(printf '%s' "$URI_JSON" | jq -r '.uri // .connection_uri // empty')"
              if [[ -n "$ADMIN_DATABASE_URL" && "$ADMIN_DATABASE_URL" != "null" ]]; then break; fi
            fi
            [[ "$attempt" -eq 10 ]] && { echo 'Neon API did not return admin URI.' >&2; exit 1; }
            sleep 3
          done
          echo '::add-mask::'"$ADMIN_DATABASE_URL"
          ADMIN_ID="$(psql "$ADMIN_DATABASE_URL" -Atqc "select session_user || ':' || current_user")"
          [[ "$ADMIN_ID" == 'neondb_owner:neondb_owner' ]]
          echo "ADMIN_DATABASE_URL=$ADMIN_DATABASE_URL" >> "$GITHUB_ENV"
          echo "Verified isolated admin identity: $ADMIN_ID"

      - name: Bootstrap isolated DDL capability
        run: |
          set -euo pipefail
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          -- nexora is owned by nexora_owner; neondb_owner is the admin login.
          -- Schema creation must occur while neondb_owner can SET ROLE to the
          -- canonical migrator. Schema ACL changes must occur as its owner.
          GRANT nexora_owner TO nexora_migrator;
          GRANT nexora_migrator TO neondb_owner;
          CREATE SCHEMA IF NOT EXISTS nexora AUTHORIZATION nexora_migrator;
          SET ROLE nexora_migrator;
          GRANT USAGE, CREATE ON SCHEMA nexora TO nexora_owner;
          RESET ROLE;
          GRANT nexora_owner TO neondb_owner;
          SET ROLE nexora_owner;
          GRANT CONNECT ON DATABASE nexora TO nexora_migrator;
          GRANT CONNECT ON DATABASE nexora TO nexora_owner;
          GRANT CREATE ON DATABASE nexora TO nexora_owner;
          RESET ROLE;
          SQL
          diagnostics="$(psql "$ADMIN_DATABASE_URL" -At -F ':' -c "select r.rolname,r.rolcanlogin,r.rolinherit,r.rolbypassrls,pg_get_userbyid(d.datdba),coalesce(array_to_string(d.datacl,','),'') from pg_roles r cross join pg_database d where r.rolname='nexora_migrator' and d.datname='nexora'")"
          capabilities="$(psql "$ADMIN_DATABASE_URL" -At -F ':' -c "select has_database_privilege('nexora_migrator','nexora','CONNECT'),has_database_privilege('nexora_owner','nexora','CONNECT'),has_database_privilege('nexora_owner','nexora','CREATE'),has_schema_privilege('nexora_owner','nexora','CREATE')")"
          echo "Neon migrator ACL diagnostics: $diagnostics"
          echo "Verified isolated database capabilities: $capabilities"
          [[ "$capabilities" == 't:t:t:t' || "$capabilities" == 'f:t:t:t' ]]

      - name: Resolve migrator connection on isolated branch
        id: migrator-connection
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          BRANCH_ID: ${{ steps.create-neon.outputs.branch_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if URI_JSON="$(curl -fsS -H "Authorization: Bearer ${NEON_API_KEY}" -H 'Accept: application/json' "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri?branch_id=${BRANCH_ID}&database_name=nexora&role_name=nexora_migrator&pooled=false")"; then
              MIGRATOR_DATABASE_URL="$(printf '%s' "$URI_JSON" | jq -r '.uri // .connection_uri // empty')"
              if [[ -n "$MIGRATOR_DATABASE_URL" && "$MIGRATOR_DATABASE_URL" != "null" ]]; then break; fi
            fi
            [[ "$attempt" -eq 10 ]] && { echo 'Neon API did not return migrator URI.' >&2; exit 1; }
            sleep 3
          done
          echo '::add-mask::'"$MIGRATOR_DATABASE_URL"
          echo "MIGRATOR_DATABASE_URL=$MIGRATOR_DATABASE_URL" >> "$GITHUB_ENV"

      - name: Resolve migration capability
        run: |
          set -euo pipefail
          if [[ "$MIGRATOR_DATABASE_URL" == *'?'* ]]; then
            OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}&options=-c%20role%3Dnexora_owner"
          else
            OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}?options=-c%20role%3Dnexora_owner"
          fi
          echo '::add-mask::'"$OWNER_DATABASE_URL"
          roles="$(psql "$OWNER_DATABASE_URL" -Atqc 'select session_user || '"'"':'"'"' || current_user')"
          [[ "$roles" == 'nexora_migrator:nexora_owner' ]]
          echo "OWNER_DATABASE_URL=$OWNER_DATABASE_URL" >> "$GITHUB_ENV"
          echo "Verified migration role chain: $roles"

      - name: Apply full versioned Drizzle migration chain
        run: DATABASE_URL="$OWNER_DATABASE_URL" pnpm --filter @nexora/database db:migrate

      - name: Verify migration ledger
        run: |
          set -euo pipefail
          ACTUAL_MIGRATIONS="$(psql "$OWNER_DATABASE_URL" -Atqc 'select count(*) from drizzle.__drizzle_migrations')"
          [[ "$ACTUAL_MIGRATIONS" == "$EXPECTED_MIGRATIONS" ]]
          echo "Verified Drizzle migration ledger: $ACTUAL_MIGRATIONS/$EXPECTED_MIGRATIONS"

      - name: Verify schema ownership, RLS and policies
        run: |
          set -euo pipefail
          psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE unsecured_tables text; unprotected_tables text;
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='nexora_app' AND rolcanlogin AND NOT rolbypassrls) THEN
              RAISE EXCEPTION 'nexora_app must be LOGIN and must not BYPASSRLS';
            END IF;
            IF EXISTS (
              SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace JOIN pg_roles r ON r.oid=c.relowner
              WHERE n.nspname='nexora' AND c.relkind IN ('r','p') AND r.rolname='nexora_app'
            ) THEN RAISE EXCEPTION 'nexora_app must not own nexora application tables'; END IF;
            SELECT string_agg(format('%I.%I',n.nspname,c.relname),', ' ORDER BY c.relname) INTO unsecured_tables
            FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname='nexora' AND c.relkind IN ('r','p')
              AND EXISTS (SELECT 1 FROM pg_attribute a WHERE a.attrelid=c.oid AND a.attname='tenant_id' AND a.attnum>0 AND NOT a.attisdropped)
              AND NOT c.relrowsecurity;
            IF unsecured_tables IS NOT NULL THEN RAISE EXCEPTION 'Tenant-scoped tables without RLS: %',unsecured_tables; END IF;
            SELECT string_agg(format('%I.%I',n.nspname,c.relname),', ' ORDER BY c.relname) INTO unprotected_tables
            FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname='nexora' AND c.relkind IN ('r','p') AND c.relrowsecurity
              AND EXISTS (SELECT 1 FROM pg_attribute a WHERE a.attrelid=c.oid AND a.attname='tenant_id' AND a.attnum>0 AND NOT a.attisdropped)
              AND NOT EXISTS (SELECT 1 FROM pg_policy p WHERE p.polrelid=c.oid);
            IF unprotected_tables IS NOT NULL THEN RAISE EXCEPTION 'RLS-enabled tenant tables without policies: %',unprotected_tables; END IF;
            IF to_regclass('nexora.audit_events') IS NOT NULL AND (
              NOT has_table_privilege('nexora_app','nexora.audit_events','SELECT') OR NOT has_table_privilege('nexora_app','nexora.audit_events','INSERT') OR
              has_table_privilege('nexora_app','nexora.audit_events','UPDATE') OR has_table_privilege('nexora_app','nexora.audit_events','DELETE') OR
              NOT has_table_privilege('nexora_app','nexora.audit_changes','SELECT') OR NOT has_table_privilege('nexora_app','nexora.audit_changes','INSERT') OR
              has_table_privilege('nexora_app','nexora.audit_changes','UPDATE') OR has_table_privilege('nexora_app','nexora.audit_changes','DELETE')
            ) THEN RAISE EXCEPTION 'Wave 0024 audit runtime grants must be append-only'; END IF;
          END $$;
          SQL

      - name: Verify Drizzle schema remains consistent
        run: pnpm --filter @nexora/database db:check

      - name: Gate summary
        run: |
          {
            echo '### Neon Database Gate'
            echo "- Drizzle ledger: ${EXPECTED_MIGRATIONS}/${EXPECTED_MIGRATIONS}"
            echo '- Full migration chain: applied on isolated Neon branch'
            echo '- nexora_app LOGIN/BYPASSRLS and table ownership: verified'
            echo '- tenant_id tables: RLS and policy presence verified'
            echo '- Wave 0024 append-only audit grants: verified when present'
            echo '- Production: untouched'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete isolated Neon branch
        if: ${{ always() && steps.create-neon.outputs.branch_id != '' }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          BRANCH_ID: ${{ steps.create-neon.outputs.branch_id }}
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/neon-delete.json -w '%{http_code}' \
            -X DELETE \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            -H 'Accept: application/json' \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${BRANCH_ID}")"
          if [[ "$status" != '200' && "$status" != '202' && "$status" != '204' ]]; then
            echo "Failed to delete ephemeral branch $BRANCH_ID (HTTP $status)." >&2
            cat /tmp/neon-delete.json >&2 || true
            exit 1
          fi
          echo "Deleted isolated ephemeral branch: $BRANCH_ID"
