name: Neon Database Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/database/**'
      - 'apps/api/src/freight/**'
      - 'apps/api/src/capacity/**'
      - 'apps/api/src/documents/**'
      - 'apps/api/src/negotiation/**'
      - 'apps/api/src/trips/**'
      - 'apps/api/src/master-data/**'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/neon-pr-gate.yml'

permissions:
  contents: read

concurrency:
  group: neon-db-gate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NEON_PROJECT_ID: raspy-river-76339604
  NEON_PARENT_BRANCH_ID: br-autumn-frog-a5ticm98
  DATABASE_NAME: nexora

jobs:
  isolated-cross-cutting:
    name: Isolated cross-cutting database checks
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Neon API secret
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: test -n "${NEON_API_KEY:-}"

      - name: Create isolated Neon branch
        id: create-neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch_id: ${{ env.NEON_PARENT_BRANCH_ID }}
          branch_name: pr-${{ github.event.pull_request.number }}-db-${{ github.run_id }}
          database_name: ${{ env.DATABASE_NAME }}
          role: neondb_owner
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Resolve isolated admin connection
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          BRANCH_ID: ${{ steps.create-neon.outputs.branch_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if URI_JSON="$(curl -fsS -H "Authorization: Bearer ${NEON_API_KEY}" -H 'Accept: application/json' "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri?branch_id=${BRANCH_ID}&database_name=${DATABASE_NAME}&role_name=neondb_owner")"; then
              ADMIN_DATABASE_URL="$(printf '%s' "$URI_JSON" | jq -r '.uri // .connection_uri // empty')"
              if [[ -n "$ADMIN_DATABASE_URL" && "$ADMIN_DATABASE_URL" != "null" ]]; then break; fi
            fi
            [[ "$attempt" -eq 10 ]] && { echo 'Neon API did not return admin URI.' >&2; exit 1; }
            sleep 3
          done
          echo '::add-mask::'"$ADMIN_DATABASE_URL"
          ADMIN_ID="$(psql "$ADMIN_DATABASE_URL" -Atqc 'select session_user || '"'"':'"'"' || current_user')"
          [[ "$ADMIN_ID" == 'neondb_owner:neondb_owner' ]]
          echo "ADMIN_DATABASE_URL=$ADMIN_DATABASE_URL" >> "$GITHUB_ENV"
          echo "Verified isolated admin identity: $ADMIN_ID"

      - name: Bootstrap only the capabilities required by cross-cutting checks
        run: |
          set -euo pipefail
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT nexora_owner TO neondb_owner;
          GRANT nexora_migrator TO neondb_owner;
          GRANT nexora_owner TO nexora_migrator;
          GRANT CONNECT ON DATABASE nexora TO nexora_owner;
          GRANT CONNECT ON DATABASE nexora TO nexora_migrator;
          SQL

      - name: Resolve app connection
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          BRANCH_ID: ${{ steps.create-neon.outputs.branch_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if URI_JSON="$(curl -fsS -H "Authorization: Bearer ${NEON_API_KEY}" -H 'Accept: application/json' "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri?branch_id=${BRANCH_ID}&database_name=${DATABASE_NAME}&role_name=nexora_app")"; then
              APP_DATABASE_URL="$(printf '%s' "$URI_JSON" | jq -r '.uri // .connection_uri // empty')"
              if [[ -n "$APP_DATABASE_URL" && "$APP_DATABASE_URL" != "null" ]]; then break; fi
            fi
            [[ "$attempt" -eq 10 ]] && { echo 'Neon API did not return app URI.' >&2; exit 1; }
            sleep 3
          done
          echo '::add-mask::'"$APP_DATABASE_URL"
          echo "APP_DATABASE_URL=$APP_DATABASE_URL" >> "$GITHUB_ENV"

      - name: Verify application role security boundary
        run: |
          set -euo pipefail
          psql "$APP_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF current_user <> 'nexora_app' THEN RAISE EXCEPTION 'Expected nexora_app runtime role, got %', current_user; END IF;
            IF session_user <> 'nexora_app' THEN RAISE EXCEPTION 'Expected nexora_app session role, got %', session_user; END IF;
            IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname='nexora_app' AND rolbypassrls) THEN RAISE EXCEPTION 'nexora_app must not BYPASSRLS'; END IF;
            IF EXISTS (SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace JOIN pg_roles r ON r.oid=c.relowner WHERE n.nspname='nexora' AND c.relkind IN ('r','p') AND r.rolname='nexora_app') THEN RAISE EXCEPTION 'nexora_app must not own nexora application tables'; END IF;
          END $$;
          SQL

      - name: Verify audit append-only grants when the audit schema is present
        run: |
          set -euo pipefail
          psql "$APP_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('nexora.audit_events') IS NOT NULL AND (
              NOT has_table_privilege('nexora_app','nexora.audit_events','SELECT') OR
              NOT has_table_privilege('nexora_app','nexora.audit_events','INSERT') OR
              has_table_privilege('nexora_app','nexora.audit_events','UPDATE') OR
              has_table_privilege('nexora_app','nexora.audit_events','DELETE') OR
              NOT has_table_privilege('nexora_app','nexora.audit_changes','SELECT') OR
              NOT has_table_privilege('nexora_app','nexora.audit_changes','INSERT') OR
              has_table_privilege('nexora_app','nexora.audit_changes','UPDATE') OR
              has_table_privilege('nexora_app','nexora.audit_changes','DELETE')
            ) THEN
              RAISE EXCEPTION 'Wave 0024 audit runtime grants must be append-only';
            END IF;
          END $$;
          SQL

      - name: Gate summary
        run: |
          {
            echo '### Neon Database Gate'
            echo '- Canonical migration/ledger/RLS baseline: neon-migrate.yml'
            echo '- Isolated branch: create-branch-action@v6'
            echo '- Database: nexora'
            echo '- Runtime role boundary: nexora_app verified'
            echo '- Wave 0024 append-only grants: verified when present'
            echo '- Production: untouched'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete isolated Neon branch
        if: ${{ always() && steps.create-neon.outputs.branch_id != '' }}
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch_id: ${{ steps.create-neon.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
