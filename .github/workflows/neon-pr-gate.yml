            ('00000000-0000-4000-8000-000000000602','00000000-0000-4000-8000-000000000002','00000000-0000-4000-8000-000000000502','00000000-0000-4000-8000-000000000102','created','{"id":"00000000-0000-4000-8000-000000000502"}'::jsonb);

          INSERT INTO transport_requests (
            id, tenant_id, customer_party_id, shipper_party_id, consignee_party_id,
            origin_address_id, destination_address_id, planned_pickup_at, planned_delivery_at,
