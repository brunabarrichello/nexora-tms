name: Neon Database Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/database/**'
      - 'apps/api/src/freight/**'
      - 'apps/api/src/capacity/**'
      - 'apps/api/src/documents/**'
      - 'apps/api/src/negotiation/**'
      - 'apps/api/src/trips/**'
      - 'apps/api/src/master-data/**'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/neon-pr-gate.yml'

permissions:
  contents: read

concurrency:
  group: neon-db-gate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NEON_PROJECT_ID: raspy-river-76339604

jobs:
  isolated-migration-rls:
    name: Isolated migration and RLS
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout PR
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Neon API secret
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}" || {
            echo "NEON_API_KEY repository secret is not configured." >&2
            exit 1
          }

      - name: Resolve expected migration count
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_MIGRATIONS="$(node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('packages/database/migrations/meta/_journal.json','utf8')); process.stdout.write(String(j.entries.length));")"
          test "$EXPECTED_MIGRATIONS" -gt 0
          echo "EXPECTED_MIGRATIONS=$EXPECTED_MIGRATIONS" >> "$GITHUB_ENV"
          echo "Expected Drizzle migrations: $EXPECTED_MIGRATIONS"

      - name: Set ephemeral branch name and expiry
        shell: bash
        run: |
          set -euo pipefail
          echo "NEON_TEST_BRANCH=pr-${{ github.event.pull_request.number }}-db-${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "NEON_TEST_EXPIRES_AT=$(date -u --date '+2 hours' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create isolated Neon branch with admin connection
        id: create-neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: main
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: neondb
          role: neondb_owner
          expires_at: ${{ env.NEON_TEST_EXPIRES_AT }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Bootstrap isolated DDL capability
        shell: bash
        env:
          ADMIN_DATABASE_URL: ${{ steps.create-neon.outputs.db_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ADMIN_DATABASE_URL"
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT CREATE ON DATABASE neondb TO nexora_owner;
          GRANT USAGE, CREATE ON SCHEMA public TO nexora_owner;
          SQL
          capabilities="$(psql "$ADMIN_DATABASE_URL" -At -F ':' -c "select has_database_privilege('nexora_owner', current_database(), 'CREATE'), has_schema_privilege('nexora_owner','public','CREATE')")"
          [[ "$capabilities" == "t:t" ]] || {
            echo "nexora_owner DDL capability bootstrap failed: $capabilities" >&2
            exit 1
          }

      - name: Resolve migrator connection on isolated branch
        id: migrator-connection
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: main
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: neondb
          role: nexora_migrator
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Resolve migration capability
        shell: bash
        env:
          MIGRATOR_DATABASE_URL: ${{ steps.migrator-connection.outputs.db_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$MIGRATOR_DATABASE_URL"
          if [[ "$MIGRATOR_DATABASE_URL" == *"?"* ]]; then
            OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}&options=-c%20role%3Dnexora_owner"
          else
            OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}?options=-c%20role%3Dnexora_owner"
          fi
          echo "::add-mask::$OWNER_DATABASE_URL"
          roles="$(psql "$OWNER_DATABASE_URL" -Atqc "select session_user || ':' || current_user")"
          [[ "$roles" == "nexora_migrator:nexora_owner" ]] || {
            echo "Unexpected migration role chain: $roles" >&2
            exit 1
          }
          echo "OWNER_DATABASE_URL=$OWNER_DATABASE_URL" >> "$GITHUB_ENV"

      - name: Apply full versioned Drizzle migration chain
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL="$OWNER_DATABASE_URL" pnpm --filter @nexora/database db:migrate

      - name: Verify migration ledger
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_MIGRATIONS="$(psql "$OWNER_DATABASE_URL" -Atqc 'select count(*) from drizzle.__drizzle_migrations')"
          if [[ "$ACTUAL_MIGRATIONS" != "$EXPECTED_MIGRATIONS" ]]; then
            echo "Expected $EXPECTED_MIGRATIONS Drizzle migration records, found $ACTUAL_MIGRATIONS" >&2
            exit 1
          fi

      - name: Verify schema ownership, RLS and policies
        shell: bash
        run: |
          set -euo pipefail
          psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            unsecured_tables text;
            unprotected_tables text;
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_roles
               WHERE rolname = 'nexora_app'
                 AND rolcanlogin
                 AND NOT rolbypassrls
            ) THEN
              RAISE EXCEPTION 'nexora_app must be LOGIN and must not BYPASSRLS';
            END IF;

            IF EXISTS (
              SELECT 1
                FROM pg_class c
                JOIN pg_namespace n ON n.oid = c.relnamespace
                JOIN pg_roles r ON r.oid = c.relowner
               WHERE n.nspname = 'public'
                 AND c.relkind IN ('r','p')
                 AND r.rolname = 'nexora_app'
            ) THEN
              RAISE EXCEPTION 'nexora_app must not own public application tables';
            END IF;

            SELECT string_agg(format('%I.%I', n.nspname, c.relname), ', ' ORDER BY c.relname)
              INTO unsecured_tables
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
             WHERE n.nspname = 'public'
               AND c.relkind IN ('r','p')
               AND EXISTS (
                 SELECT 1
                   FROM pg_attribute a
                  WHERE a.attrelid = c.oid
                    AND a.attname = 'tenant_id'
                    AND a.attnum > 0
                    AND NOT a.attisdropped
               )
               AND NOT c.relrowsecurity;

            IF unsecured_tables IS NOT NULL THEN
              RAISE EXCEPTION 'Tenant-scoped tables without RLS: %', unsecured_tables;
            END IF;

            SELECT string_agg(format('%I.%I', n.nspname, c.relname), ', ' ORDER BY c.relname)
              INTO unprotected_tables
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
             WHERE n.nspname = 'public'
               AND c.relkind IN ('r','p')
               AND c.relrowsecurity
               AND EXISTS (
                 SELECT 1
                   FROM pg_attribute a
                  WHERE a.attrelid = c.oid
                    AND a.attname = 'tenant_id'
                    AND a.attnum > 0
                    AND NOT a.attisdropped
               )
               AND NOT EXISTS (
                 SELECT 1
                   FROM pg_policy p
                  WHERE p.polrelid = c.oid
               );

            IF unprotected_tables IS NOT NULL THEN
              RAISE EXCEPTION 'RLS-enabled tenant tables without policies: %', unprotected_tables;
            END IF;

            IF to_regclass('public.audit_events') IS NOT NULL THEN
              IF NOT has_table_privilege('nexora_app','public.audit_events','SELECT')
                 OR NOT has_table_privilege('nexora_app','public.audit_events','INSERT')
                 OR has_table_privilege('nexora_app','public.audit_events','UPDATE')
                 OR has_table_privilege('nexora_app','public.audit_events','DELETE')
                 OR NOT has_table_privilege('nexora_app','public.audit_changes','SELECT')
                 OR NOT has_table_privilege('nexora_app','public.audit_changes','INSERT')
                 OR has_table_privilege('nexora_app','public.audit_changes','UPDATE')
                 OR has_table_privilege('nexora_app','public.audit_changes','DELETE') THEN
                RAISE EXCEPTION 'Wave 0024 audit runtime grants must be append-only';
              END IF;
            END IF;
          END $$;
          SQL

      - name: Verify Drizzle schema remains consistent
        shell: bash
        run: pnpm --filter @nexora/database db:check

      - name: Gate summary
        shell: bash
        run: |
          {
            echo '### Neon Database Gate'
            echo "- Drizzle ledger: ${EXPECTED_MIGRATIONS}/${EXPECTED_MIGRATIONS} migrations"
            echo '- Full migration chain: applied on isolated Neon branch'
            echo '- nexora_app ownership/BYPASSRLS: verified'
            echo '- tenant_id tables: RLS required and verified'
            echo '- RLS tenant tables: policy presence verified'
            echo '- Wave 0024 append-only audit grants: verified when present'
            echo '- Production: untouched'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete isolated Neon branch
        if: ${{ always() && steps.create-neon.outputs.branch_id != '' }}
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: ${{ env.NEON_TEST_BRANCH }}
          api_key: ${{ secrets.NEON_API_KEY }}
