          ) VALUES (
            '00000000-0000-4000-8000-000000000801','00000000-0000-4000-8000-000000000001',
            '00000000-0000-4000-8000-000000000501','00000000-0000-4000-8000-000000000501',
            '00000000-0000-4000-8000-000000000503','00000000-0000-4000-8000-000000000701',
            '00000000-0000-4000-8000-000000000703','2026-09-01T08:00:00Z','2026-09-02T12:00:00Z',
            'Gate cargo request','draft','00000000-0000-4000-8000-000000000101','00000000-0000-4000-8000-000000000101'
          );

          INSERT INTO transport_request_stops (
            id, tenant_id, transport_request_id, sequence, type, party_id, address_id, contact_id,
            window_start_at, window_end_at, instructions
          ) VALUES
            ('00000000-0000-4000-8000-000000000811','00000000-0000-4000-8000-000000000001','00000000-0000-4000-8000-000000000801',1,'pickup','00000000-0000-4000-8000-000000000501','00000000-0000-4000-8000-000000000701','00000000-0000-4000-8000-000000000711','2026-09-01T08:00:00Z','2026-09-01T10:00:00Z','Portaria A'),
            ('00000000-0000-4000-8000-000000000812','00000000-0000-4000-8000-000000000001','00000000-0000-4000-8000-000000000801',2,'support','00000000-0000-4000-8000-000000000504','00000000-0000-4000-8000-000000000704','00000000-0000-4000-8000-000000000713','2026-09-01T18:00:00Z','2026-09-01T19:00:00Z','Apoio'),
            ('00000000-0000-4000-8000-000000000813','00000000-0000-4000-8000-000000000001','00000000-0000-4000-8000-000000000801',3,'delivery','00000000-0000-4000-8000-000000000503','00000000-0000-4000-8000-000000000703',NULL,'2026-09-02T08:00:00Z','2026-09-02T12:00:00Z','Doca C');
          SQL

      - name: Resolve nexora_app connection on isolated branch
        id: app-connection
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: main
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: neondb
          role: nexora_app
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Validate positive and negative RLS scenarios
        shell: bash
        env:
          APP_DATABASE_URL: ${{ steps.app-connection.outputs.db_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$APP_DATABASE_URL"
          psql "$APP_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            visible_count integer;
            ordered_sequences text;
          BEGIN
            PERFORM set_config('app.tenant_id','',false);
            PERFORM set_config('app.user_id','',false);
            SELECT count(*) INTO visible_count FROM transport_requests;
            IF visible_count <> 0 THEN RAISE EXCEPTION 'No-context transport requests must be 0, got %', visible_count; END IF;
            SELECT count(*) INTO visible_count FROM transport_request_stops;
            IF visible_count <> 0 THEN RAISE EXCEPTION 'No-context route stops must be 0, got %', visible_count; END IF;
            SELECT count(*) INTO visible_count FROM transport_request_cargo_profiles;
            IF visible_count <> 0 THEN RAISE EXCEPTION 'No-context cargo profiles must be 0, got %', visible_count; END IF;
            SELECT count(*) INTO visible_count FROM transport_request_commercial_terms;
            IF visible_count <> 0 THEN RAISE EXCEPTION 'No-context commercial terms must be 0, got %', visible_count; END IF;
            SELECT count(*) INTO visible_count FROM transport_request_commercial_history;
            IF visible_count <> 0 THEN RAISE EXCEPTION 'No-context commercial history must be 0, got %', visible_count; END IF;

            PERFORM set_config('app.user_id','00000000-0000-4000-8000-000000000101',false);
            SELECT count(*) INTO visible_count FROM memberships;
            IF visible_count <> 2 THEN RAISE EXCEPTION 'User discovery must return 2 memberships, got %', visible_count; END IF;
            SELECT count(*) INTO visible_count FROM transport_request_stops;
            IF visible_count <> 0 THEN RAISE EXCEPTION 'User-only context must not expose route stops, got %', visible_count; END IF;
            SELECT count(*) INTO visible_count FROM transport_request_cargo_profiles;
            IF visible_count <> 0 THEN RAISE EXCEPTION 'User-only context must not expose cargo profiles, got %', visible_count; END IF;
            SELECT count(*) INTO visible_count FROM transport_request_commercial_terms;
            IF visible_count <> 0 THEN RAISE EXCEPTION 'User-only context must not expose commercial terms, got %', visible_count; END IF;
            SELECT count(*) INTO visible_count FROM transport_request_commercial_history;
            IF visible_count <> 0 THEN RAISE EXCEPTION 'User-only context must not expose commercial history, got %', visible_count; END IF;

            PERFORM set_config('app.tenant_id','00000000-0000-4000-8000-000000000001',false);
            SELECT count(*) INTO visible_count FROM transport_requests;
            IF visible_count <> 1 THEN RAISE EXCEPTION 'Tenant A must see one transport request, got %', visible_count; END IF;
            SELECT count(*) INTO visible_count FROM transport_request_stops;
            IF visible_count <> 3 THEN RAISE EXCEPTION 'Tenant A must see three route stops, got %', visible_count; END IF;
            SELECT string_agg(sequence::text, ',' ORDER BY sequence) INTO ordered_sequences
              FROM transport_request_stops
             WHERE transport_request_id='00000000-0000-4000-8000-000000000801';
            IF ordered_sequences <> '1,2,3' THEN RAISE EXCEPTION 'Route sequence must be 1,2,3, got %', ordered_sequences; END IF;
          END $$;

          DELETE FROM transport_request_stops
           WHERE transport_request_id='00000000-0000-4000-8000-000000000801';

          INSERT INTO transport_request_stops (
            tenant_id, transport_request_id, sequence, type, party_id, address_id, contact_id,
            window_start_at, window_end_at, instructions
          ) VALUES
            ('00000000-0000-4000-8000-000000000001','00000000-0000-4000-8000-000000000801',1,'pickup','00000000-0000-4000-8000-000000000501','00000000-0000-4000-8000-000000000701','00000000-0000-4000-8000-000000000711','2026-09-01T08:30:00Z','2026-09-01T10:30:00Z','Runtime pickup'),
            ('00000000-0000-4000-8000-000000000001','00000000-0000-4000-8000-000000000801',2,'delivery','00000000-0000-4000-8000-000000000503','00000000-0000-4000-8000-000000000703',NULL,'2026-09-02T08:30:00Z','2026-09-02T12:00:00Z','Runtime delivery');

          UPDATE transport_request_stops
             SET instructions='Updated pickup instruction', updated_at=now()
           WHERE transport_request_id='00000000-0000-4000-8000-000000000801'
             AND sequence=1;

          DO $$ DECLARE c integer; note text; BEGIN
            SELECT count(*) INTO c FROM transport_request_stops
             WHERE transport_request_id='00000000-0000-4000-8000-000000000801';
            IF c <> 2 THEN RAISE EXCEPTION 'Route replacement must leave 2 stops, got %', c; END IF;
            SELECT instructions INTO note FROM transport_request_stops
             WHERE transport_request_id='00000000-0000-4000-8000-000000000801' AND sequence=1;
            IF note <> 'Updated pickup instruction' THEN RAISE EXCEPTION 'Runtime route stop update failed'; END IF;
          END $$;

          INSERT INTO transport_request_cargo_profiles (
            tenant_id, transport_request_id, material, cargo_type, total_weight_kg,
            volume_count, pallet_count, cubage_m3, max_length_m, max_width_m, max_height_m,
            tracking_required, vehicle_type, body_type, non_stackable, special_cargo, special_instructions
          ) VALUES (
            '00000000-0000-4000-8000-000000000001','00000000-0000-4000-8000-000000000801',
            'Eletrônicos gerais','general',5000,20,4,18.5,2.4,1.2,1.8,true,'carreta','sider',true,false,NULL
          );

          UPDATE transport_request_cargo_profiles
             SET total_weight_kg=5250, pallet_count=5, updated_at=now()
           WHERE transport_request_id='00000000-0000-4000-8000-000000000801';

          DO $$ DECLARE c integer; weight numeric; pallets integer; BEGIN
            SELECT count(*), max(total_weight_kg), max(pallet_count) INTO c, weight, pallets
              FROM transport_request_cargo_profiles
             WHERE transport_request_id='00000000-0000-4000-8000-000000000801';
            IF c <> 1 THEN RAISE EXCEPTION 'Cargo profile must contain one row, got %', c; END IF;
            IF weight <> 5250 OR pallets <> 5 THEN RAISE EXCEPTION 'Runtime cargo profile update failed'; END IF;
          END $$;

          INSERT INTO transport_request_commercial_terms (
            tenant_id,transport_request_id,currency_code,customer_price,target_carrier_freight,toll_amount,additional_amount,
            payment_terms,commercial_notes,created_by_user_id,updated_by_user_id
          ) VALUES (
            '00000000-0000-4000-8000-000000000001','00000000-0000-4000-8000-000000000801','BRL',18500,16000,313.80,250,
            '70% coleta / 30% entrega via Pix','Gate commercial terms','00000000-0000-4000-8000-000000000101','00000000-0000-4000-8000-000000000101'
          );

          INSERT INTO transport_request_commercial_history (
            tenant_id,transport_request_id,commercial_terms_id,version,event_type,status,actor_user_id,snapshot
          ) SELECT tenant_id,transport_request_id,id,1,'created','draft','00000000-0000-4000-8000-000000000101','{"status":"draft"}'::jsonb
              FROM transport_request_commercial_terms
             WHERE transport_request_id='00000000-0000-4000-8000-000000000801';

          UPDATE transport_request_commercial_terms
             SET status='pending_approval', version=2, updated_by_user_id='00000000-0000-4000-8000-000000000101', updated_at=now()
           WHERE transport_request_id='00000000-0000-4000-8000-000000000801';
          INSERT INTO transport_request_commercial_history (
            tenant_id,transport_request_id,commercial_terms_id,version,event_type,status,actor_user_id,snapshot
          ) SELECT tenant_id,transport_request_id,id,2,'submitted','pending_approval','00000000-0000-4000-8000-000000000101','{"status":"pending_approval"}'::jsonb
              FROM transport_request_commercial_terms
             WHERE transport_request_id='00000000-0000-4000-8000-000000000801';

          UPDATE transport_request_commercial_terms
             SET status='approved', approval_note='Gate approved', approved_by_user_id='00000000-0000-4000-8000-000000000101',
                 approved_at=now(), version=3, updated_by_user_id='00000000-0000-4000-8000-000000000101', updated_at=now()
           WHERE transport_request_id='00000000-0000-4000-8000-000000000801';
          INSERT INTO transport_request_commercial_history (
            tenant_id,transport_request_id,commercial_terms_id,version,event_type,status,actor_user_id,snapshot,note
          ) SELECT tenant_id,transport_request_id,id,3,'approved','approved','00000000-0000-4000-8000-000000000101','{"status":"approved"}'::jsonb,'Gate approved'
              FROM transport_request_commercial_terms
             WHERE transport_request_id='00000000-0000-4000-8000-000000000801';

          DO $$ DECLARE s text; v integer; h integer; BEGIN
            SELECT status::text, version INTO s, v FROM transport_request_commercial_terms
             WHERE transport_request_id='00000000-0000-4000-8000-000000000801';
            SELECT count(*) INTO h FROM transport_request_commercial_history
             WHERE transport_request_id='00000000-0000-4000-8000-000000000801';
            IF s <> 'approved' OR v <> 3 THEN RAISE EXCEPTION 'Commercial approval state is invalid: % v%', s, v; END IF;
            IF h <> 3 THEN RAISE EXCEPTION 'Commercial history must contain 3 versions, got %', h; END IF;
          END $$;
          SQL

          set +e
          commercial_cross_tenant_output="$(psql "$APP_DATABASE_URL" -v ON_ERROR_STOP=1 2>&1 <<'SQL'
          SELECT set_config('app.user_id','00000000-0000-4000-8000-000000000101',false);
          SELECT set_config('app.tenant_id','00000000-0000-4000-8000-000000000001',false);
          INSERT INTO transport_request_commercial_terms (tenant_id,transport_request_id,target_carrier_freight,payment_terms,created_by_user_id,updated_by_user_id)
          VALUES ('00000000-0000-4000-8000-000000000002','00000000-0000-4000-8000-000000000801',1000,'Pix','00000000-0000-4000-8000-000000000101','00000000-0000-4000-8000-000000000101');
