name: Neon Database Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "packages/database/**"
      - "apps/api/src/freight/**"
      - "pnpm-workspace.yaml"
      - ".github/workflows/neon-pr-gate.yml"

permissions:
  contents: read

concurrency:
  group: neon-db-gate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NEON_PROJECT_ID: raspy-river-76339604

jobs:
  isolated-migration-rls:
    name: Isolated migration and RLS
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Neon API secret
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}" || {
            echo "NEON_API_KEY repository secret is not configured." >&2
            exit 1
          }

      - name: Set ephemeral branch name and expiry
        shell: bash
        run: |
          set -euo pipefail
          echo "NEON_TEST_BRANCH=pr-${{ github.event.pull_request.number }}-db-${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "NEON_TEST_EXPIRES_AT=$(date -u --date '+2 hours' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create isolated Neon branch with admin connection
        id: create-neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: main
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: neondb
          role: neondb_owner
          expires_at: ${{ env.NEON_TEST_EXPIRES_AT }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Bootstrap isolated DDL capability
        shell: bash
        env:
          ADMIN_DATABASE_URL: ${{ steps.create-neon.outputs.db_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ADMIN_DATABASE_URL"
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT CREATE ON DATABASE neondb TO nexora_owner;
          GRANT USAGE, CREATE ON SCHEMA public TO nexora_owner;
          SQL
          capabilities="$(psql "$ADMIN_DATABASE_URL" -At -F ':' -c "select has_database_privilege('nexora_owner', current_database(), 'CREATE'), has_schema_privilege('nexora_owner','public','CREATE')")"
          [[ "$capabilities" == "t:t" ]] || {
            echo "nexora_owner DDL capability bootstrap failed: $capabilities" >&2
            exit 1
          }

      - name: Resolve migrator connection on isolated branch
        id: migrator-connection
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: main
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: neondb
          role: nexora_migrator
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Resolve migration capability
        shell: bash
        env:
          MIGRATOR_DATABASE_URL: ${{ steps.migrator-connection.outputs.db_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$MIGRATOR_DATABASE_URL"
          if [[ "$MIGRATOR_DATABASE_URL" == *"?"* ]]; then
            OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}&options=-c%20role%3Dnexora_owner"
          else
            OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}?options=-c%20role%3Dnexora_owner"
          fi
          echo "::add-mask::$OWNER_DATABASE_URL"
          roles="$(psql "$OWNER_DATABASE_URL" -Atqc "select session_user || ':' || current_user")"
          [[ "$roles" == "nexora_migrator:nexora_owner" ]] || {
            echo "Unexpected migration role chain: $roles" >&2
            exit 1
          }
          echo "OWNER_DATABASE_URL=$OWNER_DATABASE_URL" >> "$GITHUB_ENV"

      - name: Apply full versioned Drizzle migration chain
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL="$OWNER_DATABASE_URL" pnpm --filter @nexora/database db:migrate

      - name: Verify migration ledger, schema, RLS and runtime grants
        shell: bash
        run: |
          set -euo pipefail
          psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            table_count integer;
            rls_count integer;
            migration_count integer;
            request_enum_count integer;
            stop_enum_count integer;
            commercial_enum_count integer;
          BEGIN
            SELECT count(*) INTO table_count
              FROM information_schema.tables
             WHERE table_schema='public'
               AND table_name IN (
                 'tenants','tenant_settings','organizations','business_units','users',
                 'external_identities','memberships','permissions','roles','role_permissions',
                 'membership_roles','membership_organization_scopes','membership_business_unit_scopes',
                 'business_parties','business_party_roles','business_party_audit',
                 'business_party_addresses','business_party_contacts','transport_requests',
                 'transport_request_stops','transport_request_cargo_profiles',
                 'transport_request_commercial_terms','transport_request_commercial_history'
               );
            IF table_count <> 23 THEN
              RAISE EXCEPTION 'Expected 23 application tables, found %', table_count;
            END IF;

            SELECT count(*) INTO rls_count
              FROM pg_class c
              JOIN pg_namespace n ON n.oid=c.relnamespace
             WHERE n.nspname='public'
               AND c.relname IN (
                 'tenants','tenant_settings','organizations','business_units','memberships',
                 'roles','role_permissions','membership_roles',
                 'membership_organization_scopes','membership_business_unit_scopes',
                 'business_parties','business_party_roles','business_party_audit',
                 'business_party_addresses','business_party_contacts','transport_requests',
                 'transport_request_stops','transport_request_cargo_profiles',
                 'transport_request_commercial_terms','transport_request_commercial_history'
               )
               AND c.relrowsecurity;
            IF rls_count <> 20 THEN
              RAISE EXCEPTION 'Expected RLS on 20 tenant-scoped tables, found %', rls_count;
            END IF;

            SELECT count(*) INTO migration_count FROM drizzle.__drizzle_migrations;
            IF migration_count <> 9 THEN
              RAISE EXCEPTION 'Expected 9 Drizzle migration records, found %', migration_count;
            END IF;

            SELECT count(*) INTO request_enum_count
              FROM pg_type t JOIN pg_enum e ON e.enumtypid=t.oid
             WHERE t.typname='transport_request_status'
               AND e.enumlabel IN ('draft','ready_for_quote','in_negotiation','contracted','cancelled');
            IF request_enum_count <> 5 THEN
              RAISE EXCEPTION 'Expected five transport request status values, found %', request_enum_count;
            END IF;

            SELECT count(*) INTO stop_enum_count
              FROM pg_type t JOIN pg_enum e ON e.enumtypid=t.oid
             WHERE t.typname='transport_stop_type'
               AND e.enumlabel IN ('pickup','delivery','support');
            IF stop_enum_count <> 3 THEN
              RAISE EXCEPTION 'Expected three transport stop type values, found %', stop_enum_count;
            END IF;

            SELECT count(*) INTO commercial_enum_count
              FROM pg_type t JOIN pg_enum e ON e.enumtypid=t.oid
             WHERE t.typname='commercial_terms_status'
               AND e.enumlabel IN ('draft','pending_approval','approved','rejected');
            IF commercial_enum_count <> 4 THEN
              RAISE EXCEPTION 'Expected four commercial terms status values, found %', commercial_enum_count;
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_roles
               WHERE rolname='nexora_app' AND rolcanlogin AND NOT rolbypassrls
            ) THEN
              RAISE EXCEPTION 'nexora_app must be LOGIN and must not BYPASSRLS';
            END IF;

            IF EXISTS (
              SELECT 1
                FROM pg_class c
                JOIN pg_namespace n ON n.oid=c.relnamespace
                JOIN pg_roles r ON r.oid=c.relowner
               WHERE n.nspname='public'
                 AND c.relname IN (
                   'tenants','organizations','business_units','memberships','roles',
                   'business_parties','business_party_roles','business_party_audit',
                   'business_party_addresses','business_party_contacts','transport_requests',
                   'transport_request_stops','transport_request_cargo_profiles',
                   'transport_request_commercial_terms','transport_request_commercial_history'
                 )
                 AND r.rolname='nexora_app'
            ) THEN
              RAISE EXCEPTION 'nexora_app must not own application tables';
            END IF;

            IF NOT has_table_privilege('nexora_app','public.tenants','SELECT')
               OR has_table_privilege('nexora_app','public.tenants','INSERT')
               OR NOT has_table_privilege('nexora_app','public.business_parties','SELECT')
               OR NOT has_table_privilege('nexora_app','public.business_parties','INSERT')
               OR NOT has_table_privilege('nexora_app','public.business_parties','UPDATE')
               OR has_table_privilege('nexora_app','public.business_parties','DELETE')
               OR NOT has_table_privilege('nexora_app','public.business_party_addresses','SELECT')
               OR NOT has_table_privilege('nexora_app','public.business_party_addresses','INSERT')
               OR NOT has_table_privilege('nexora_app','public.business_party_addresses','UPDATE')
               OR has_table_privilege('nexora_app','public.business_party_addresses','DELETE')
               OR NOT has_table_privilege('nexora_app','public.business_party_contacts','SELECT')
               OR NOT has_table_privilege('nexora_app','public.business_party_contacts','INSERT')
               OR NOT has_table_privilege('nexora_app','public.business_party_contacts','UPDATE')
               OR has_table_privilege('nexora_app','public.business_party_contacts','DELETE')
               OR NOT has_table_privilege('nexora_app','public.transport_requests','SELECT')
               OR NOT has_table_privilege('nexora_app','public.transport_requests','INSERT')
               OR NOT has_table_privilege('nexora_app','public.transport_requests','UPDATE')
               OR has_table_privilege('nexora_app','public.transport_requests','DELETE')
               OR NOT has_table_privilege('nexora_app','public.transport_request_stops','SELECT')
               OR NOT has_table_privilege('nexora_app','public.transport_request_stops','INSERT')
               OR NOT has_table_privilege('nexora_app','public.transport_request_stops','UPDATE')
               OR NOT has_table_privilege('nexora_app','public.transport_request_stops','DELETE')
               OR NOT has_table_privilege('nexora_app','public.transport_request_cargo_profiles','SELECT')
               OR NOT has_table_privilege('nexora_app','public.transport_request_cargo_profiles','INSERT')
               OR NOT has_table_privilege('nexora_app','public.transport_request_cargo_profiles','UPDATE')
               OR has_table_privilege('nexora_app','public.transport_request_cargo_profiles','DELETE')
               OR NOT has_table_privilege('nexora_app','public.transport_request_commercial_terms','SELECT')
               OR NOT has_table_privilege('nexora_app','public.transport_request_commercial_terms','INSERT')
               OR NOT has_table_privilege('nexora_app','public.transport_request_commercial_terms','UPDATE')
               OR has_table_privilege('nexora_app','public.transport_request_commercial_terms','DELETE')
               OR NOT has_table_privilege('nexora_app','public.transport_request_commercial_history','SELECT')
               OR NOT has_table_privilege('nexora_app','public.transport_request_commercial_history','INSERT')
               OR has_table_privilege('nexora_app','public.transport_request_commercial_history','UPDATE')
               OR has_table_privilege('nexora_app','public.transport_request_commercial_history','DELETE') THEN
              RAISE EXCEPTION 'nexora_app runtime privilege matrix is incorrect';
            END IF;
          END $$;
          SQL

      - name: Seed isolated tenant fixtures
        shell: bash
        run: |
          set -euo pipefail
          psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO tenants (id, slug, name) VALUES
            ('00000000-0000-4000-8000-000000000001','gate-tenant-a','Gate Tenant A'),
            ('00000000-0000-4000-8000-000000000002','gate-tenant-b','Gate Tenant B');

          INSERT INTO users (id, display_name) VALUES
            ('00000000-0000-4000-8000-000000000101','Gate User A'),
            ('00000000-0000-4000-8000-000000000102','Gate User B');

          INSERT INTO organizations (id, tenant_id, code, name) VALUES
            ('00000000-0000-4000-8000-000000000201','00000000-0000-4000-8000-000000000001','ORG-A','Tenant A Org'),
            ('00000000-0000-4000-8000-000000000202','00000000-0000-4000-8000-000000000002','ORG-B','Tenant B Org');

          INSERT INTO memberships (id, tenant_id, user_id, status) VALUES
            ('00000000-0000-4000-8000-000000000301','00000000-0000-4000-8000-000000000001','00000000-0000-4000-8000-000000000101','active'),
            ('00000000-0000-4000-8000-000000000302','00000000-0000-4000-8000-000000000002','00000000-0000-4000-8000-000000000101','active'),
            ('00000000-0000-4000-8000-000000000303','00000000-0000-4000-8000-000000000002','00000000-0000-4000-8000-000000000102','active');

          INSERT INTO business_units (id, tenant_id, organization_id, code, name) VALUES
            ('00000000-0000-4000-8000-000000000401','00000000-0000-4000-8000-000000000001','00000000-0000-4000-8000-000000000201','UNIT-A','Tenant A Unit');

          INSERT INTO business_parties (
            id, tenant_id, tax_id, legal_name, email, homologation_status, homologation_notes
          ) VALUES
            ('00000000-0000-4000-8000-000000000501','00000000-0000-4000-8000-000000000001','12345678901','Tenant A Customer Shipper','shipper-a@example.test','approved','Approved carrier-capable shipper'),
            ('00000000-0000-4000-8000-000000000503','00000000-0000-4000-8000-000000000001','12345678903','Tenant A Consignee','consignee-a@example.test',NULL,NULL),
            ('00000000-0000-4000-8000-000000000504','00000000-0000-4000-8000-000000000001','12345678904','Tenant A Support','support-a@example.test',NULL,NULL),
            ('00000000-0000-4000-8000-000000000502','00000000-0000-4000-8000-000000000002','12345678902','Tenant B Supplier','supplier-b@example.test','pending','Pending supplier');

          INSERT INTO business_party_roles (tenant_id, party_id, role) VALUES
            ('00000000-0000-4000-8000-000000000001','00000000-0000-4000-8000-000000000501','customer'),
            ('00000000-0000-4000-8000-000000000001','00000000-0000-4000-8000-000000000501','shipper'),
            ('00000000-0000-4000-8000-000000000001','00000000-0000-4000-8000-000000000501','carrier'),
            ('00000000-0000-4000-8000-000000000001','00000000-0000-4000-8000-000000000503','consignee'),
            ('00000000-0000-4000-8000-000000000001','00000000-0000-4000-8000-000000000504','partner'),
            ('00000000-0000-4000-8000-000000000002','00000000-0000-4000-8000-000000000502','supplier');

          INSERT INTO business_party_addresses (
            id, tenant_id, party_id, type, label, postal_code, street, number, city, state,
            operational_reference, is_active
          ) VALUES
            ('00000000-0000-4000-8000-000000000701','00000000-0000-4000-8000-000000000001','00000000-0000-4000-8000-000000000501','pickup','Tenant A Pickup','01234-567','Avenida A','100','São Paulo','SP','Portaria A',true),
            ('00000000-0000-4000-8000-000000000703','00000000-0000-4000-8000-000000000001','00000000-0000-4000-8000-000000000503','delivery','Tenant A Delivery','78000-000','Rua C','300','Cuiabá','MT','Doca C',true),
            ('00000000-0000-4000-8000-000000000704','00000000-0000-4000-8000-000000000001','00000000-0000-4000-8000-000000000504','operational','Tenant A Support','74000-000','Rua D','400','Goiânia','GO','Ponto de apoio',true),
            ('00000000-0000-4000-8000-000000000702','00000000-0000-4000-8000-000000000002','00000000-0000-4000-8000-000000000502','delivery','Tenant B Delivery','80000-000','Rua B','200','Curitiba','PR','Doca B',true);

          INSERT INTO business_party_contacts (
            id, tenant_id, party_id, address_id, type, name, email, is_active
          ) VALUES
            ('00000000-0000-4000-8000-000000000711','00000000-0000-4000-8000-000000000001','00000000-0000-4000-8000-000000000501','00000000-0000-4000-8000-000000000701','logistics','Gate Logistics A','ops-a@example.test',true),
            ('00000000-0000-4000-8000-000000000713','00000000-0000-4000-8000-000000000001','00000000-0000-4000-8000-000000000504','00000000-0000-4000-8000-000000000704','operational','Gate Support A','support-a@example.test',true),
            ('00000000-0000-4000-8000-000000000712','00000000-0000-4000-8000-000000000002','00000000-0000-4000-8000-000000000502','00000000-0000-4000-8000-000000000702','delivery','Gate Delivery B','ops-b@example.test',true);

          INSERT INTO business_party_audit (
            id, tenant_id, party_id, actor_user_id, change_type, after_snapshot
          ) VALUES
