name: Neon Database Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/database/**'
      - 'apps/api/src/freight/**'
      - 'apps/api/src/capacity/**'
      - 'apps/api/src/documents/**'
      - 'apps/api/src/negotiation/**'
      - 'apps/api/src/trips/**'
      - 'apps/api/src/master-data/**'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/neon-pr-gate.yml'

permissions:
  contents: read

concurrency:
  group: neon-db-gate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NEON_PROJECT_ID: raspy-river-76339604
  NEON_PARENT_BRANCH_ID: br-autumn-frog-a5ticm98
  DATABASE_NAME: nexora

jobs:
  isolated-cross-cutting:
    name: Isolated cross-cutting database checks
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Neon API secret
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: test -n "${NEON_API_KEY:-}"

      - name: Create isolated Neon branch
        id: create-neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: ${{ env.NEON_PARENT_BRANCH_ID }}
          branch_name: pr-${{ github.event.pull_request.number }}-db-${{ github.run_id }}
          database: ${{ env.DATABASE_NAME }}
          role: neondb_owner
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Ensure PostgreSQL client and Neon CLI
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version
          npx --yes neonctl@v2 --version

      - name: Resolve isolated admin connection
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          BRANCH_ID: ${{ steps.create-neon.outputs.branch_id }}
        run: |
          set -euo pipefail
          ADMIN_DATABASE_URL="$(npx --yes neonctl@v2 connection-string "$BRANCH_ID" \
            --project-id "$NEON_PROJECT_ID" \
            --database-name "$DATABASE_NAME" \
            --role-name neondb_owner)"
          test -n "$ADMIN_DATABASE_URL"
          echo '::add-mask::'"$ADMIN_DATABASE_URL"
          ADMIN_ID="$(psql "$ADMIN_DATABASE_URL" -Atqc 'select session_user || '"'"':'"'"' || current_user')"
          [[ "$ADMIN_ID" == 'neondb_owner:neondb_owner' ]]
          echo "ADMIN_DATABASE_URL=$ADMIN_DATABASE_URL" >> "$GITHUB_ENV"
          echo "Verified isolated admin identity: $ADMIN_ID"

      - name: Bootstrap only the capabilities required by cross-cutting checks
        run: |
          set -euo pipefail
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT nexora_owner TO neondb_owner;
          GRANT nexora_migrator TO neondb_owner;
          GRANT nexora_owner TO nexora_migrator;
          GRANT CONNECT ON DATABASE nexora TO nexora_owner;
          GRANT CONNECT ON DATABASE nexora TO nexora_migrator;
          SQL

      - name: Resolve runtime role connections
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          BRANCH_ID: ${{ steps.create-neon.outputs.branch_id }}
        run: |
          set -euo pipefail
          for role in nexora_migrator nexora_app; do
            url="$(npx --yes neonctl@v2 connection-string "$BRANCH_ID" \
              --project-id "$NEON_PROJECT_ID" \
              --database-name "$DATABASE_NAME" \
              --role-name "$role")"
            test -n "$url"
            echo "::add-mask::$url"
            case "$role" in
              nexora_migrator) echo "MIGRATOR_DATABASE_URL=$url" >> "$GITHUB_ENV" ;;
              nexora_app) echo "APP_DATABASE_URL=$url" >> "$GITHUB_ENV" ;;
            esac
          done

      - name: Verify runtime role security boundaries
        run: |
          set -euo pipefail
          psql "$APP_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            app_role pg_roles%ROWTYPE;
            migrator_role pg_roles%ROWTYPE;
            owner_role pg_roles%ROWTYPE;
          BEGIN
            SELECT * INTO app_role FROM pg_roles WHERE rolname='nexora_app';
            SELECT * INTO migrator_role FROM pg_roles WHERE rolname='nexora_migrator';
            SELECT * INTO owner_role FROM pg_roles WHERE rolname='nexora_owner';

            IF current_user <> 'nexora_app' OR session_user <> 'nexora_app' THEN
              RAISE EXCEPTION 'Expected nexora_app runtime identity, got current=% session=%', current_user, session_user;
            END IF;
            IF app_role.rolbypassrls OR app_role.rolcreaterole OR app_role.rolcreatedb OR NOT app_role.rolcanlogin THEN
              RAISE EXCEPTION 'nexora_app has unsafe role attributes';
            END IF;
            IF migrator_role.rolbypassrls OR migrator_role.rolcreaterole OR migrator_role.rolcreatedb OR NOT migrator_role.rolcanlogin OR migrator_role.rolinherit THEN
              RAISE EXCEPTION 'nexora_migrator has unsafe role attributes';
            END IF;
            IF owner_role.rolcanlogin OR owner_role.rolbypassrls OR owner_role.rolcreaterole OR owner_role.rolcreatedb OR owner_role.rolinherit THEN
              RAISE EXCEPTION 'nexora_owner must remain NOLOGIN, non-bypass, non-inheriting capability role';
            END IF;
            IF EXISTS (
              SELECT 1
              FROM pg_class c
              JOIN pg_namespace n ON n.oid=c.relnamespace
              JOIN pg_roles r ON r.oid=c.relowner
              WHERE n.nspname='public'
                AND c.relkind IN ('r','p')
                AND r.rolname IN ('nexora_app','nexora_migrator','nexora_worker')
            ) THEN
              RAISE EXCEPTION 'Runtime roles must not own application tables';
            END IF;
          END $$;
          SQL

      - name: Verify audit append-only grants when the audit schema is present
        run: |
          set -euo pipefail
          psql "$APP_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('nexora.audit_events') IS NOT NULL AND (
              NOT has_table_privilege('nexora_app','nexora.audit_events','SELECT') OR
              NOT has_table_privilege('nexora_app','nexora.audit_events','INSERT') OR
              has_table_privilege('nexora_app','nexora.audit_events','UPDATE') OR
              has_table_privilege('nexora_app','nexora.audit_events','DELETE') OR
              NOT has_table_privilege('nexora_app','nexora.audit_changes','SELECT') OR
              NOT has_table_privilege('nexora_app','nexora.audit_changes','INSERT') OR
              has_table_privilege('nexora_app','nexora.audit_changes','UPDATE') OR
              has_table_privilege('nexora_app','nexora.audit_changes','DELETE')
            ) THEN
              RAISE EXCEPTION 'Wave 0024 audit runtime grants must be append-only';
            END IF;
          END $$;
          SQL

      - name: Gate summary
        run: |
          {
            echo '### Neon Database Gate'
            echo '- Canonical migration/ledger/RLS baseline: neon-migrate.yml'
            echo '- Isolated branch: create-branch-action@v6'
            echo '- Connection resolution: neonctl@v2'
            echo '- Database: nexora'
            echo '- Runtime role boundaries: app/migrator/owner verified'
            echo '- Runtime roles do not own application tables'
            echo '- Wave 0024 append-only grants: verified when present'
            echo '- Production: untouched'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete isolated Neon branch
        if: ${{ always() && steps.create-neon.outputs.branch_id != '' }}
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch_id: ${{ steps.create-neon.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
