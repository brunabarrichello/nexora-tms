name: Neon Database Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "packages/database/**"
      - "pnpm-workspace.yaml"
      - ".github/workflows/neon-pr-gate.yml"

permissions:
  contents: read

concurrency:
  group: neon-db-gate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NEON_PROJECT_ID: raspy-river-76339604

jobs:
  isolated-migration-rls:
    name: Isolated migration and RLS
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate Neon API secret
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}" || { echo "NEON_API_KEY repository secret is not configured." >&2; exit 1; }

      - name: Set ephemeral branch name and expiry
        shell: bash
        run: |
          set -euo pipefail
          echo "NEON_TEST_BRANCH=pr-${{ github.event.pull_request.number }}-db-${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "NEON_TEST_EXPIRES_AT=$(date -u --date '+2 hours' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create isolated Neon branch with admin connection
        id: create-neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: main
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: neondb
          role: neondb_owner
          expires_at: ${{ env.NEON_TEST_EXPIRES_AT }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Bootstrap isolated DDL capability
        shell: bash
        env:
          ADMIN_DATABASE_URL: ${{ steps.create-neon.outputs.db_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ADMIN_DATABASE_URL"
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT CREATE ON DATABASE neondb TO nexora_owner;
          GRANT USAGE, CREATE ON SCHEMA public TO nexora_owner;
          SQL

          capabilities="$(psql "$ADMIN_DATABASE_URL" -At -F ':' -c "select has_database_privilege('nexora_owner', current_database(), 'CREATE'), has_schema_privilege('nexora_owner','public','CREATE')")"
          [[ "$capabilities" == "t:t" ]] || { echo "nexora_owner DDL capability bootstrap failed: $capabilities" >&2; exit 1; }

      - name: Resolve migrator connection on isolated branch
        id: migrator-connection
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: main
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: neondb
          role: nexora_migrator
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Resolve migration capability
        shell: bash
        env:
          MIGRATOR_DATABASE_URL: ${{ steps.migrator-connection.outputs.db_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$MIGRATOR_DATABASE_URL"
          if [[ "$MIGRATOR_DATABASE_URL" == *"?"* ]]; then
            OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}&options=-c%20role%3Dnexora_owner"
          else
            OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}?options=-c%20role%3Dnexora_owner"
          fi
          echo "::add-mask::$OWNER_DATABASE_URL"
          roles="$(psql "$OWNER_DATABASE_URL" -Atqc "select session_user || ':' || current_user")"
          [[ "$roles" == "nexora_migrator:nexora_owner" ]] || { echo "Unexpected migration role chain: $roles" >&2; exit 1; }
          echo "OWNER_DATABASE_URL=$OWNER_DATABASE_URL" >> "$GITHUB_ENV"

      - name: Apply full versioned Drizzle migration chain
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL="$OWNER_DATABASE_URL" pnpm --filter @nexora/database db:migrate

      - name: Verify migration ledger, schema, RLS and runtime grants
        shell: bash
        run: |
          set -euo pipefail
          psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE table_count integer; rls_count integer; migration_count integer;
          BEGIN
            SELECT count(*) INTO table_count
              FROM information_schema.tables
             WHERE table_schema='public'
               AND table_name IN (
                 'tenants','tenant_settings','organizations','business_units','users',
                 'external_identities','memberships','permissions','roles','role_permissions',
                 'membership_roles','membership_organization_scopes','membership_business_unit_scopes'
               );
            IF table_count <> 13 THEN RAISE EXCEPTION 'Expected 13 foundation tables, found %', table_count; END IF;

            SELECT count(*) INTO rls_count
              FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
             WHERE n.nspname='public'
               AND c.relname IN (
                 'tenants','tenant_settings','organizations','business_units','memberships',
                 'roles','role_permissions','membership_roles',
                 'membership_organization_scopes','membership_business_unit_scopes'
               ) AND c.relrowsecurity;
            IF rls_count <> 10 THEN RAISE EXCEPTION 'Expected RLS on 10 tenant-scoped tables, found %', rls_count; END IF;

            SELECT count(*) INTO migration_count FROM drizzle.__drizzle_migrations;
            IF migration_count <> 2 THEN RAISE EXCEPTION 'Expected 2 Drizzle migration records, found %', migration_count; END IF;

            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='nexora_app' AND rolcanlogin AND NOT rolbypassrls) THEN
              RAISE EXCEPTION 'nexora_app must be LOGIN and must not BYPASSRLS';
            END IF;

            IF EXISTS (
              SELECT 1 FROM pg_class c
              JOIN pg_namespace n ON n.oid=c.relnamespace
              JOIN pg_roles r ON r.oid=c.relowner
              WHERE n.nspname='public'
                AND c.relname IN ('tenants','organizations','business_units','memberships','roles')
                AND r.rolname='nexora_app'
            ) THEN RAISE EXCEPTION 'nexora_app must not own application tables'; END IF;

            IF NOT has_table_privilege('nexora_app','public.tenants','SELECT')
               OR has_table_privilege('nexora_app','public.tenants','INSERT')
               OR NOT has_table_privilege('nexora_app','public.users','SELECT')
               OR has_table_privilege('nexora_app','public.users','INSERT')
               OR NOT has_table_privilege('nexora_app','public.permissions','SELECT')
               OR NOT has_table_privilege('nexora_app','public.organizations','SELECT')
               OR NOT has_table_privilege('nexora_app','public.organizations','INSERT')
               OR NOT has_table_privilege('nexora_app','public.memberships','UPDATE') THEN
              RAISE EXCEPTION 'nexora_app runtime privilege matrix is incorrect';
            END IF;
          END $$;
          SQL

      - name: Seed isolated tenant fixtures
        shell: bash
        run: |
          set -euo pipefail
          psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO tenants (id, slug, name) VALUES
            ('00000000-0000-4000-8000-000000000001', 'gate-tenant-a', 'Gate Tenant A'),
            ('00000000-0000-4000-8000-000000000002', 'gate-tenant-b', 'Gate Tenant B');
          INSERT INTO users (id, display_name) VALUES
            ('00000000-0000-4000-8000-000000000101', 'Gate User A'),
            ('00000000-0000-4000-8000-000000000102', 'Gate User B');
          INSERT INTO organizations (id, tenant_id, code, name) VALUES
            ('00000000-0000-4000-8000-000000000201', '00000000-0000-4000-8000-000000000001', 'ORG-A', 'Tenant A Org'),
            ('00000000-0000-4000-8000-000000000202', '00000000-0000-4000-8000-000000000002', 'ORG-B', 'Tenant B Org');
          INSERT INTO memberships (id, tenant_id, user_id, status) VALUES
            ('00000000-0000-4000-8000-000000000301', '00000000-0000-4000-8000-000000000001', '00000000-0000-4000-8000-000000000101', 'active'),
            ('00000000-0000-4000-8000-000000000302', '00000000-0000-4000-8000-000000000002', '00000000-0000-4000-8000-000000000101', 'active'),
            ('00000000-0000-4000-8000-000000000303', '00000000-0000-4000-8000-000000000002', '00000000-0000-4000-8000-000000000102', 'active');
          INSERT INTO business_units (id, tenant_id, organization_id, code, name) VALUES
            ('00000000-0000-4000-8000-000000000401', '00000000-0000-4000-8000-000000000001', '00000000-0000-4000-8000-000000000201', 'UNIT-A', 'Tenant A Unit');
          SQL

      - name: Resolve nexora_app connection on isolated branch
        id: app-connection
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: main
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: neondb
          role: nexora_app
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Validate positive and negative RLS scenarios
        shell: bash
        env:
          APP_DATABASE_URL: ${{ steps.app-connection.outputs.db_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$APP_DATABASE_URL"
          psql "$APP_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE visible_count integer;
          BEGIN
            PERFORM set_config('app.tenant_id', '', false);
            PERFORM set_config('app.user_id', '', false);
            SELECT count(*) INTO visible_count FROM organizations;
            IF visible_count <> 0 THEN RAISE EXCEPTION 'No-context organizations must be 0, got %', visible_count; END IF;
            SELECT count(*) INTO visible_count FROM memberships;
            IF visible_count <> 0 THEN RAISE EXCEPTION 'No-context memberships must be 0, got %', visible_count; END IF;

            PERFORM set_config('app.user_id', '00000000-0000-4000-8000-000000000101', false);
            SELECT count(*) INTO visible_count FROM memberships;
            IF visible_count <> 2 THEN RAISE EXCEPTION 'User-only membership discovery must return 2, got %', visible_count; END IF;
            SELECT count(*) INTO visible_count FROM organizations;
            IF visible_count <> 0 THEN RAISE EXCEPTION 'User-only context must not expose organizations, got %', visible_count; END IF;

            PERFORM set_config('app.user_id', '', false);
            PERFORM set_config('app.tenant_id', '00000000-0000-4000-8000-000000000001', false);
            SELECT count(*) INTO visible_count FROM tenants;
            IF visible_count <> 1 THEN RAISE EXCEPTION 'Tenant A must see exactly its tenant row, got %', visible_count; END IF;
            SELECT count(*) INTO visible_count FROM organizations;
            IF visible_count <> 1 THEN RAISE EXCEPTION 'Tenant A must see exactly one organization, got %', visible_count; END IF;
            SELECT count(*) INTO visible_count FROM business_units;
            IF visible_count <> 1 THEN RAISE EXCEPTION 'Tenant A must see exactly one business unit, got %', visible_count; END IF;
            SELECT count(*) INTO visible_count FROM memberships;
            IF visible_count <> 1 THEN RAISE EXCEPTION 'Tenant A must see exactly one membership, got %', visible_count; END IF;
          END $$;
          SQL

          set +e
          cross_tenant_output="$(psql "$APP_DATABASE_URL" -v ON_ERROR_STOP=1 2>&1 <<'SQL'
          SELECT set_config('app.user_id', '', false);
          SELECT set_config('app.tenant_id', '00000000-0000-4000-8000-000000000001', false);
          INSERT INTO organizations (tenant_id, code, name)
          VALUES ('00000000-0000-4000-8000-000000000002', 'ILLEGAL', 'Cross Tenant');
          SQL
          )"
          cross_tenant_status=$?
          set -e
          if [[ "$cross_tenant_status" -eq 0 ]] || ! grep -qi "row-level security policy" <<<"$cross_tenant_output"; then
            echo "Cross-tenant RLS rejection did not behave as expected." >&2
            echo "$cross_tenant_output" >&2
            exit 1
          fi

      - name: Validate tenant-aware foreign-key rejection
        shell: bash
        run: |
          set -euo pipefail
          set +e
          fk_output="$(psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 2>&1 <<'SQL'
          INSERT INTO business_units (tenant_id, organization_id, code, name)
          VALUES ('00000000-0000-4000-8000-000000000001','00000000-0000-4000-8000-000000000202','ILLEGAL-FK','Cross Tenant FK');
          SQL
          )"
          fk_status=$?
          set -e
          if [[ "$fk_status" -eq 0 ]] || ! grep -qi "business_units_tenant_org_fk" <<<"$fk_output"; then
            echo "Cross-tenant FK rejection did not behave as expected." >&2
            echo "$fk_output" >&2
            exit 1
          fi

      - name: Gate summary
        shell: bash
        run: |
          {
            echo "## Neon isolated database gate passed"
            echo ""
            echo "- Parent branch: main"
            echo "- Database: neondb"
            echo "- Login role: nexora_migrator"
            echo "- Effective DDL role: nexora_owner"
            echo "- DDL capability: explicit CREATE on database/public schema"
            echo "- Drizzle migration chain: applied from journal"
            echo "- Migration ledger: verified"
            echo "- Runtime privileges: verified"
            echo "- RLS and tenant isolation: verified"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete isolated Neon branch
        if: ${{ always() && steps.create-neon.outputs.branch_id != '' }}
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: ${{ steps.create-neon.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
