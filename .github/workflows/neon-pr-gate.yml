name: Neon Database Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "packages/database/**"
      - "pnpm-workspace.yaml"
      - ".github/workflows/neon-pr-gate.yml"

permissions:
  contents: read

concurrency:
  group: neon-db-gate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NEON_PROJECT_ID: raspy-river-76339604

jobs:
  isolated-migration-rls:
    name: Isolated migration and RLS
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Validate Neon API secret
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${NEON_API_KEY:-}" ]]; then
            echo "NEON_API_KEY repository secret is not configured." >&2
            exit 1
          fi

      - name: Set ephemeral branch name and expiry
        shell: bash
        run: |
          set -euo pipefail
          echo "NEON_TEST_BRANCH=pr-${{ github.event.pull_request.number }}-db-${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "NEON_TEST_EXPIRES_AT=$(date -u --date '+2 hours' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create isolated Neon branch
        id: create-neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: main
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: neondb
          role: neondb_owner
          expires_at: ${{ env.NEON_TEST_EXPIRES_AT }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Apply versioned Drizzle migration
        shell: bash
        env:
          OWNER_DATABASE_URL: ${{ steps.create-neon.outputs.db_url }}
        run: |
          set -euo pipefail
          mapfile -t migrations < <(find packages/database/migrations -maxdepth 1 -type f -name '*.sql' -print | sort)
          if [[ "${#migrations[@]}" -ne 1 ]]; then
            echo "Expected exactly one foundation SQL migration, found ${#migrations[@]}." >&2
            printf '%s\n' "${migrations[@]}" >&2
            exit 1
          fi
          echo "Applying ${migrations[0]} to isolated branch ${NEON_TEST_BRANCH}."
          sed 's/--> statement-breakpoint//g' "${migrations[0]}" | psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 -f -

      - name: Seed isolated tenant fixtures and validate foundation
        shell: bash
        env:
          OWNER_DATABASE_URL: ${{ steps.create-neon.outputs.db_url }}
        run: |
          set -euo pipefail
          psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            rls_count integer;
          BEGIN
            SELECT count(*)
              INTO rls_count
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
             WHERE n.nspname = 'public'
               AND c.relname IN (
                 'membership_business_unit_scopes',
                 'membership_organization_scopes',
                 'membership_roles',
                 'role_permissions',
                 'roles',
                 'memberships',
                 'business_units',
                 'organizations',
                 'tenant_settings',
                 'tenants'
               )
               AND c.relrowsecurity;

            IF rls_count <> 10 THEN
              RAISE EXCEPTION 'Expected RLS on 10 tenant-scoped tables, found %', rls_count;
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_roles
               WHERE rolname = 'nexora_app'
                 AND rolcanlogin
                 AND NOT rolbypassrls
            ) THEN
              RAISE EXCEPTION 'nexora_app must exist, LOGIN and not BYPASSRLS';
            END IF;

            IF EXISTS (
              SELECT 1
                FROM pg_class c
                JOIN pg_namespace n ON n.oid = c.relnamespace
                JOIN pg_roles r ON r.oid = c.relowner
               WHERE n.nspname = 'public'
                 AND c.relname IN ('tenants', 'organizations', 'business_units', 'memberships', 'roles')
                 AND r.rolname = 'nexora_app'
            ) THEN
              RAISE EXCEPTION 'nexora_app must not own application tables';
            END IF;
          END $$;

          INSERT INTO tenants (id, slug, name) VALUES
            ('00000000-0000-4000-8000-000000000001', 'pr9-tenant-a', 'PR9 Tenant A'),
            ('00000000-0000-4000-8000-000000000002', 'pr9-tenant-b', 'PR9 Tenant B');

          INSERT INTO users (id, display_name) VALUES
            ('00000000-0000-4000-8000-000000000101', 'PR9 User A'),
            ('00000000-0000-4000-8000-000000000102', 'PR9 User B');

          INSERT INTO organizations (id, tenant_id, code, name) VALUES
            ('00000000-0000-4000-8000-000000000201', '00000000-0000-4000-8000-000000000001', 'ORG-A', 'Tenant A Org'),
            ('00000000-0000-4000-8000-000000000202', '00000000-0000-4000-8000-000000000002', 'ORG-B', 'Tenant B Org');

          INSERT INTO memberships (id, tenant_id, user_id, status) VALUES
            ('00000000-0000-4000-8000-000000000301', '00000000-0000-4000-8000-000000000001', '00000000-0000-4000-8000-000000000101', 'active'),
            ('00000000-0000-4000-8000-000000000302', '00000000-0000-4000-8000-000000000002', '00000000-0000-4000-8000-000000000101', 'active'),
            ('00000000-0000-4000-8000-000000000303', '00000000-0000-4000-8000-000000000002', '00000000-0000-4000-8000-000000000102', 'active');

          INSERT INTO business_units (id, tenant_id, organization_id, code, name) VALUES
            ('00000000-0000-4000-8000-000000000401', '00000000-0000-4000-8000-000000000001', '00000000-0000-4000-8000-000000000201', 'UNIT-A', 'Tenant A Unit');

          GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE
            tenants, organizations, business_units, memberships, users
          TO nexora_app;
          SQL

      - name: Resolve nexora_app connection on isolated branch
        id: app-connection
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: main
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: neondb
          role: nexora_app
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Validate positive and negative RLS scenarios
        shell: bash
        env:
          APP_DATABASE_URL: ${{ steps.app-connection.outputs.db_url }}
        run: |
          set -euo pipefail

          psql "$APP_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            visible_count integer;
          BEGIN
            PERFORM set_config('app.tenant_id', '', false);
            PERFORM set_config('app.user_id', '', false);

            SELECT count(*) INTO visible_count FROM organizations;
            IF visible_count <> 0 THEN
              RAISE EXCEPTION 'No-context organization visibility must be 0, got %', visible_count;
            END IF;

            SELECT count(*) INTO visible_count FROM memberships;
            IF visible_count <> 0 THEN
              RAISE EXCEPTION 'No-context membership visibility must be 0, got %', visible_count;
            END IF;

            PERFORM set_config('app.user_id', '00000000-0000-4000-8000-000000000101', false);
            SELECT count(*) INTO visible_count FROM memberships;
            IF visible_count <> 2 THEN
              RAISE EXCEPTION 'User-only membership discovery must return 2 rows, got %', visible_count;
            END IF;

            SELECT count(*) INTO visible_count FROM organizations;
            IF visible_count <> 0 THEN
              RAISE EXCEPTION 'User-only context must not expose organizations, got %', visible_count;
            END IF;

            PERFORM set_config('app.user_id', '', false);
            PERFORM set_config('app.tenant_id', '00000000-0000-4000-8000-000000000001', false);

            SELECT count(*) INTO visible_count FROM tenants;
            IF visible_count <> 1 THEN
              RAISE EXCEPTION 'Tenant A must see exactly its tenant row, got %', visible_count;
            END IF;

            SELECT count(*) INTO visible_count FROM organizations;
            IF visible_count <> 1 THEN
              RAISE EXCEPTION 'Tenant A must see exactly one organization, got %', visible_count;
            END IF;

            SELECT count(*) INTO visible_count FROM business_units;
            IF visible_count <> 1 THEN
              RAISE EXCEPTION 'Tenant A must see exactly one business unit, got %', visible_count;
            END IF;

            SELECT count(*) INTO visible_count FROM memberships;
            IF visible_count <> 1 THEN
              RAISE EXCEPTION 'Tenant A must see exactly one membership without user override, got %', visible_count;
            END IF;
          END $$;
          SQL

          set +e
          cross_tenant_output="$(psql "$APP_DATABASE_URL" -v ON_ERROR_STOP=1 2>&1 <<'SQL'
          SELECT set_config('app.user_id', '', false);
          SELECT set_config('app.tenant_id', '00000000-0000-4000-8000-000000000001', false);
          INSERT INTO organizations (tenant_id, code, name)
          VALUES ('00000000-0000-4000-8000-000000000002', 'ILLEGAL', 'Cross Tenant');
          SQL
          )"
          cross_tenant_status=$?
          set -e

          if [[ "$cross_tenant_status" -eq 0 ]]; then
            echo "Cross-tenant insert unexpectedly succeeded." >&2
            exit 1
          fi
          if ! grep -qi "row-level security policy" <<<"$cross_tenant_output"; then
            echo "Cross-tenant insert failed for an unexpected reason:" >&2
            echo "$cross_tenant_output" >&2
            exit 1
          fi
          echo "Cross-tenant write correctly rejected by RLS."

      - name: Validate tenant-aware foreign-key rejection
        shell: bash
        env:
          OWNER_DATABASE_URL: ${{ steps.create-neon.outputs.db_url }}
        run: |
          set -euo pipefail
          set +e
          fk_output="$(psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 2>&1 <<'SQL'
          INSERT INTO business_units (tenant_id, organization_id, code, name)
          VALUES (
            '00000000-0000-4000-8000-000000000001',
            '00000000-0000-4000-8000-000000000202',
            'ILLEGAL-FK',
            'Cross Tenant FK'
          );
          SQL
          )"
          fk_status=$?
          set -e

          if [[ "$fk_status" -eq 0 ]]; then
            echo "Cross-tenant FK insert unexpectedly succeeded." >&2
            exit 1
          fi
          if ! grep -qi "business_units_tenant_org_fk" <<<"$fk_output"; then
            echo "Cross-tenant FK insert failed for an unexpected reason:" >&2
            echo "$fk_output" >&2
            exit 1
          fi
          echo "Cross-tenant association correctly rejected by composite FK."

      - name: Gate summary
        shell: bash
        run: |
          {
            echo "## Neon isolated database gate passed"
            echo ""
            echo "- Source branch: main"
            echo "- Ephemeral branch: ${NEON_TEST_BRANCH}"
            echo "- Database: neondb"
            echo "- Versioned Drizzle migration: applied"
            echo "- RLS enabled tables: verified"
            echo "- No-context visibility: denied"
            echo "- User-only membership discovery: verified"
            echo "- Tenant-scoped reads: verified"
            echo "- Cross-tenant write: denied by RLS"
            echo "- Cross-tenant association: denied by composite FK"
            echo "- nexora_app: LOGIN, no BYPASSRLS, non-owner"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete isolated Neon branch
        if: ${{ always() && steps.create-neon.outputs.branch_id != '' }}
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: ${{ steps.create-neon.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
