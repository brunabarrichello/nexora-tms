name: NEX-40 Render Gates

on:
  push:
    branches:
      - feature/NEX-40-transport-contract

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/NEX-40-transport-contract
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format NEX-40 integration
        run: pnpm exec prettier --write apps/api/src/negotiation/transport-contract.integration.ts

      - name: Validate API typecheck and tests
        run: |
          pnpm --filter @nexora/api typecheck
          pnpm --filter @nexora/api test

      - name: Validate Drizzle migration chain
        run: pnpm --filter @nexora/database db:check

      - name: Render permanent gates
        run: node scripts/render-nex-40-gates.mjs

      - name: Format rendered YAML
        run: pnpm exec prettier --write scripts/.nex-40-api-tenant-neon-gate.yml scripts/.nex-40-neon-pr-gate.yml

      - name: Validate rendered markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Run Transport Contract integration against Neon' scripts/.nex-40-api-tenant-neon-gate.yml
          grep -q 'Expected 34 application tables' scripts/.nex-40-neon-pr-gate.yml
          grep -q 'Expected RLS on 31 tenant-scoped tables' scripts/.nex-40-neon-pr-gate.yml
          grep -q 'Expected 15 Drizzle migration records' scripts/.nex-40-neon-pr-gate.yml
          grep -q 'Validate NEX-40 transport contract runtime and isolation' scripts/.nex-40-neon-pr-gate.yml

      - name: Commit rendered artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/negotiation/transport-contract.integration.ts scripts/.nex-40-api-tenant-neon-gate.yml scripts/.nex-40-neon-pr-gate.yml
          if git diff --cached --quiet; then
            echo 'No rendered changes to commit.'
            exit 0
          fi
          git commit --no-verify -m 'NEX-40 render validated permanent gates'
          git push --no-verify origin HEAD:feature/NEX-40-transport-contract
