name: NEX-39 Format Integration

on:
  push:
    branches:
      - feature/NEX-39-capacity-reservation
    paths:
      - .github/workflows/nex-39-format-integration.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/NEX-39-capacity-reservation

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format exact integration file
        run: pnpm exec prettier --write apps/api/src/negotiation/capacity-reservation.integration.ts

      - name: Stage formatted artifact
        run: cp apps/api/src/negotiation/capacity-reservation.integration.ts scripts/.nex-39-formatted-integration.ts

      - name: Commit formatted artifact
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/.nex-39-formatted-integration.ts
          git commit -m 'NEX-39 render exact Prettier integration artifact'
          git push --no-verify

# activation
