name: Wave 0022 Trip Status Cast Fix

on:
  push:
    branches:
      - chore/wave-0022-trips-core-gate
    paths:
      - '.github/workflows/wave0022-status-cast-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/wave-0022-trips-core-gate
          fetch-depth: 0

      - name: Patch trip status enum casts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/trips/trips.service.ts')
          text = path.read_text()
          replacements = [
              ('SET status=$1,', 'SET status=$1::trip_status,'),
              ("actual_start_at=CASE WHEN $1='in_transit' AND actual_start_at IS NULL THEN now() ELSE actual_start_at END,", "actual_start_at=CASE WHEN $1::trip_status='in_transit' THEN coalesce(actual_start_at,now()) ELSE actual_start_at END,"),
              ("actual_end_at=CASE WHEN $1='completed' AND actual_end_at IS NULL THEN now() ELSE actual_end_at END,", "actual_end_at=CASE WHEN $1::trip_status='completed' THEN coalesce(actual_end_at,now()) ELSE actual_end_at END,"),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one occurrence: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check
          git diff -- apps/api/src/trips/trips.service.ts

      - name: Commit status cast fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/trips/trips.service.ts
          git commit -m 'fix(trips): cast status parameter to trip_status'
          git push origin HEAD:chore/wave-0022-trips-core-gate
