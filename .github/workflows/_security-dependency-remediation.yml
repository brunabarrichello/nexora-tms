name: Temporary security dependency remediation

on:
  push:
    branches:
      - brunabarrichello-database-target-update

permissions:
  contents: write

jobs:
  remediate:
    if: "!contains(github.event.head_commit.message, '[security-remediation]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: brunabarrichello-database-target-update
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Update multer lockfile only
        run: pnpm update multer@2.3.0 --lockfile-only

      - name: Remove temporary remediation workflow
        run: rm -f .github/workflows/_security-dependency-remediation.yml

      - name: Commit lockfile remediation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml .github/workflows/_security-dependency-remediation.yml
          git diff --cached --exit-code && { echo 'No lockfile change produced'; exit 1; } || true
          git commit -m 'fix(security): remediate multer vulnerability [security-remediation]'
          git push origin HEAD:brunabarrichello-database-target-update
