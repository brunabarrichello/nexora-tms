name: Wave 0024 Generate Migration

on:
  push:
    branches:
      - feat/database-wave-0024-cross-cutting-audit

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[skip wave0024-generator]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/database-wave-0024-cross-cutting-audit
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Drizzle artifacts
        run: pnpm --filter @nexora/database db:generate

      - name: Commit generated migration
        shell: bash
        run: |
          if git diff --quiet -- packages/database/migrations; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/migrations
          git commit -m "chore(database): version Wave 0024 Drizzle artifacts [skip wave0024-generator]"
          git push origin HEAD:feat/database-wave-0024-cross-cutting-audit
