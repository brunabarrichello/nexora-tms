name: NEX-49 Normalize Once

on:
  push:
    branches:
      - feat/nex-49-risk-assessment-compliance
    paths:
      - '.github/workflows/nex49-normalize-once.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/nex-49-risk-assessment-compliance

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Normalize decision rule and formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/documents/compliance-risk.service.ts')
          text = path.read_text()
          old = "if (signals.some((item) => item.severity === 'high') || score >= 40) return 'review';"
          new = "if (signals.some((item) => item.severity === 'high' || item.severity === 'medium') || score >= 40) return 'review';"
          if old not in text:
              raise SystemExit('expected decision rule not found')
          path.write_text(text.replace(old, new))
          PY
          pnpm exec prettier --write \
            apps/api/src/documents/compliance-risk-provider.port.ts \
            apps/api/src/documents/unconfigured-compliance-risk-provider.adapter.ts \
            apps/api/src/documents/compliance-risk.validation.ts \
            apps/api/src/documents/compliance-risk.validation.spec.ts \
            apps/api/src/documents/compliance-risk-rbac.controller.spec.ts \
            apps/api/src/documents/compliance-risk.service.ts \
            apps/api/src/documents/compliance-risk.controller.ts \
            apps/api/src/documents/compliance-risk.integration.ts \
            apps/api/src/documents/documents.module.ts \
            packages/database/migrations/meta/_journal.json \
            .github/workflows/neon-compliance-risk-gate.yml
          rm .github/workflows/nex49-normalize-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'style: normalize NEX-49 compliance risk changes'
          git push origin HEAD:feat/nex-49-risk-assessment-compliance
