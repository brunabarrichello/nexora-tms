name: Neon External Integrations Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/api/src/integrations/**'
      - 'apps/api/src/app.module.ts'
      - 'apps/api/src/tenancy/tenant-database.service.ts'
      - 'apps/worker/src/**'
      - 'apps/web/app/administracao/integracoes/**'
      - 'packages/database/migrations/**'
      - 'packages/database/ci/nex56-external-integrations-*.sql'
      - '.github/workflows/neon-external-integrations-gate.yml'

permissions:
  contents: read

concurrency:
  group: neon-external-integrations-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NEON_PROJECT_ID: raspy-river-76339604

jobs:
  external-integrations:
    name: External API auth, signed webhook, retry and reprocess
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout PR
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Neon API secret
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}" || { echo "NEON_API_KEY repository secret is not configured." >&2; exit 1; }

      - name: Set ephemeral branch
        shell: bash
        run: |
          set -euo pipefail
          echo "NEON_TEST_BRANCH=pr-${{ github.event.pull_request.number }}-external-integrations-${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "NEON_TEST_EXPIRES_AT=$(date -u --date '+2 hours' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create isolated Neon branch — attempt 1
        id: ext1
        continue-on-error: true
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: production
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: neondb
          role: neondb_owner
          expires_at: ${{ env.NEON_TEST_EXPIRES_AT }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Back off after transient Neon capacity failure
        if: ${{ steps.ext1.outcome != 'success' }}
        shell: bash
        run: sleep 30

      - name: Create isolated Neon branch — attempt 2
        id: ext2
        if: ${{ steps.ext1.outcome != 'success' }}
        continue-on-error: true
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: production
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: neondb
          role: neondb_owner
          expires_at: ${{ env.NEON_TEST_EXPIRES_AT }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Back off before final Neon branch attempt
        if: ${{ steps.ext1.outcome != 'success' && steps.ext2.outcome != 'success' }}
        shell: bash
        run: sleep 60

      - name: Create isolated Neon branch — attempt 3
        id: ext3
        if: ${{ steps.ext1.outcome != 'success' && steps.ext2.outcome != 'success' }}
        continue-on-error: true
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: production
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: neondb
          role: neondb_owner
          expires_at: ${{ env.NEON_TEST_EXPIRES_AT }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Require isolated Neon branch
        env:
          BRANCH_ID: ${{ steps.ext1.outputs.branch_id || steps.ext2.outputs.branch_id || steps.ext3.outputs.branch_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${BRANCH_ID:-}" || { echo "Unable to allocate an isolated Neon branch after bounded retries." >&2; exit 1; }

      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Bootstrap migration capability
        env:
          ADMIN_DATABASE_URL: ${{ steps.ext1.outputs.db_url || steps.ext2.outputs.db_url || steps.ext3.outputs.db_url }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$ADMIN_DATABASE_URL"
          echo "OWNER_DATABASE_URL=$ADMIN_DATABASE_URL" >> "$GITHUB_ENV"
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT CREATE ON DATABASE neondb TO nexora_owner;
          GRANT USAGE, CREATE ON SCHEMA public TO nexora_owner;
          SQL

      - name: Resolve migrator connection
        id: migrator
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: production
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: neondb
          role: nexora_migrator
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Apply full migration chain
        env:
          MIGRATOR_DATABASE_URL: ${{ steps.migrator.outputs.db_url }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$MIGRATOR_DATABASE_URL"
          if [[ "$MIGRATOR_DATABASE_URL" == *"?"* ]]; then
            OWNER_MIGRATOR_URL="${MIGRATOR_DATABASE_URL}&options=-c%20role%3Dnexora_owner"
          else
            OWNER_MIGRATOR_URL="${MIGRATOR_DATABASE_URL}?options=-c%20role%3Dnexora_owner"
          fi
          echo "::add-mask::$OWNER_MIGRATOR_URL"
          DATABASE_URL="$OWNER_MIGRATOR_URL" pnpm --filter @nexora/database db:migrate

      - name: Verify NEX-56 secret, RLS and privilege boundary
        shell: bash
        run: psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/ci/nex56-external-integrations-security.sql

      - name: Seed NEX-56 integration fixtures and transactional fan-out
        shell: bash
        run: psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/ci/nex56-external-integrations-fixtures.sql

      - name: Resolve nexora_app connection
        id: app
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: production
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: neondb
          role: nexora_app
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Resolve nexora_worker connection
        id: worker
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: production
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: neondb
          role: nexora_worker
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Build API and Worker
        run: |
          pnpm --filter @nexora/api build
          pnpm --filter @nexora/worker build

      - name: Verify auth scopes, endpoint validation and signed Worker contract
        run: |
          pnpm --filter @nexora/api test
          pnpm --filter @nexora/worker test

      - name: Run NEX-56 authentication and durable delivery lifecycle
        env:
          DATABASE_URL: ${{ steps.app.outputs.db_url }}
          WORKER_DATABASE_URL: ${{ steps.worker.outputs.db_url }}
          DATABASE_POOL_MAX: 2
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$DATABASE_URL"
          echo "::add-mask::$WORKER_DATABASE_URL"
          node apps/api/dist/integrations/external-integrations.integration.js

      - name: Verify audit, idempotency and eventual webhook success
        shell: bash
        run: psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/ci/nex56-external-integrations-assertions.sql

      - name: Gate summary
        shell: bash
        run: |
          echo "NEX-56 qualified: external credentials are hash-only; scopes and API v1 are explicit; webhook secrets stay encrypted; Outbox fan-out uses Durable Jobs; signed delivery retry/dead-letter/reprocess/success preserves audit and idempotency."

      - name: Delete isolated Neon branch
        if: ${{ always() && (steps.ext1.outputs.branch_id != '' || steps.ext2.outputs.branch_id != '' || steps.ext3.outputs.branch_id != '') }}
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: ${{ steps.ext1.outputs.branch_id || steps.ext2.outputs.branch_id || steps.ext3.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}