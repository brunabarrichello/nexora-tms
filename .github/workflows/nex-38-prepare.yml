name: NEX-38 Prepare

on:
  push:
    branches:
      - feature/NEX-38-freight-proposals

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/NEX-38-freight-proposals

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      - name: Test API
        run: pnpm --filter @nexora/api test

      - name: Generate migration
        run: pnpm --filter @nexora/database db:generate

      - name: Add append-only runtime grants
        shell: bash
        run: |
          set -euo pipefail
          migration="$(ls packages/database/migrations/[0-9][0-9][0-9][0-9]_*.sql | sort | tail -1)"
          if ! grep -q 'GRANT SELECT, INSERT ON TABLE freight_proposals TO nexora_app' "$migration"; then
            cat >> "$migration" <<'SQL'
          --> statement-breakpoint
          GRANT SELECT, INSERT ON TABLE freight_proposals TO nexora_app;
          --> statement-breakpoint
          GRANT SELECT, INSERT ON TABLE freight_proposal_events TO nexora_app;
          SQL
          fi
          echo "Generated migration: $migration"

      - name: Check migrations
        run: pnpm --filter @nexora/database db:check

      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api packages/database
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git -c core.hooksPath=/dev/null commit -m 'NEX-38 format and generate proposal migration'
          git push origin HEAD:feature/NEX-38-freight-proposals
