name: Wave 0018 API check

on:
  push:
    branches:
      - feat/database-wave-0018-documents
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/database-wave-0018-documents
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: pnpm install --frozen-lockfile
      - name: Format Wave 0018 API
        run: pnpm exec prettier --write apps/api/src/documents apps/api/src/app.module.ts apps/api/package.json packages/database/src/schema/documents.ts packages/database/src/schema/capacity-qualification.ts packages/database/src/schema/index.ts
      - name: Typecheck database
        run: pnpm --filter @nexora/database typecheck
      - name: Typecheck API
        run: pnpm --filter @nexora/api typecheck
      - name: Test API
        run: pnpm --filter @nexora/api test
      - name: Check Drizzle
        run: pnpm --filter @nexora/database db:check
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api packages/database/src/schema
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(documents): format Wave 0018 API"
          git push origin HEAD:feat/database-wave-0018-documents
