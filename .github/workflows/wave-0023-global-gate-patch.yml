name: Wave 0023 Global Gate Patcher

on:
  push:
    branches:
      - feat/database-wave-0023-trip-execution
    paths:
      - '.github/workflows/wave-0023-global-gate-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/database-wave-0023-trip-execution
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch and validate global database gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/neon-pr-gate.yml')
          text = path.read_text()
          replacements = {
              "IF migration_count <> 23 THEN": "IF migration_count <> 24 THEN",
              "Expected 23 Drizzle migration records, found %": "Expected 24 Drizzle migration records, found %",
              "Neon database gate passed through Wave 0017 driver/asset qualification plus NEX-40 transport contracts.": "Neon database gate passed through Wave 0023; Trips Core and Trip Execution remain covered by their dedicated Neon gates.",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected text: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          pnpm exec prettier --check .github/workflows/neon-pr-gate.yml
          git diff --check

      - name: Commit and expose Git object ids
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/neon-pr-gate.yml
          git commit -m "ci(database): advance global migration ledger through Wave 0023"
          echo "PATCH_COMMIT=$(git rev-parse HEAD)"
          echo "PATCH_TREE=$(git rev-parse HEAD^{tree})"
          echo "PATCH_BLOB=$(git rev-parse HEAD:.github/workflows/neon-pr-gate.yml)"
          git push origin HEAD:feat/database-wave-0023-trip-execution
