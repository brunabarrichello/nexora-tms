name: Wave 0017 doc format

on:
  push:
    branches:
      - feat/database-wave-0017-driver-assets
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/database-wave-0017-driver-assets
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/data/wave-0017-driver-assets.md docs/adr/0014-driver-asset-qualification-document-boundary.md docs/adr/README.md
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/wave-0017-driver-assets.md docs/adr/0014-driver-asset-qualification-document-boundary.md docs/adr/README.md
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(docs): format Wave 0017 documentation"
          git push origin HEAD:feat/database-wave-0017-driver-assets
