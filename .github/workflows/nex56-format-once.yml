name: NEX-56 Format Once

on:
  push:
    branches:
      - feat/nex-56-external-api-webhooks
    paths:
      - '.github/workflows/nex56-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/nex-56-external-api-webhooks
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
      - run: pnpm install --frozen-lockfile
      - name: Format exact CI findings
        run: |
          pnpm exec prettier --write \
            apps/api/src/integrations/external-api.service.ts \
            apps/api/src/integrations/external-authorized.decorator.ts \
            apps/api/src/integrations/external-integrations.integration.ts \
            apps/api/src/integrations/integration-auth.spec.ts \
            apps/api/src/integrations/integration-scope.guard.ts \
            apps/api/src/integrations/integrations-rbac.controller.spec.ts \
            apps/api/src/integrations/integrations.service.ts \
            apps/api/src/integrations/integrations.validation.ts \
            apps/worker/src/webhook-delivery.ts \
            docs/data/nex-56-external-api-webhooks.md
      - name: Commit formatted files and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/nex56-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/integrations/external-api.service.ts \
            apps/api/src/integrations/external-authorized.decorator.ts \
            apps/api/src/integrations/external-integrations.integration.ts \
            apps/api/src/integrations/integration-auth.spec.ts \
            apps/api/src/integrations/integration-scope.guard.ts \
            apps/api/src/integrations/integrations-rbac.controller.spec.ts \
            apps/api/src/integrations/integrations.service.ts \
            apps/api/src/integrations/integrations.validation.ts \
            apps/worker/src/webhook-delivery.ts \
            docs/data/nex-56-external-api-webhooks.md \
            .github/workflows/nex56-format-once.yml
          git commit -m "chore(integrations): apply NEX-56 formatting"
          git push origin HEAD:feat/nex-56-external-api-webhooks