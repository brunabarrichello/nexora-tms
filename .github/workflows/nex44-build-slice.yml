name: NEX-44 Build Completion Slice

on:
  push:
    branches:
      - feat/nex-44-trip-completion
    paths:
      - '.github/workflows/nex44-build-slice.yml'
      - 'ops/nex44-build.py'

permissions:
  contents: write

jobs:
  build-slice:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/nex-44-trip-completion
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
      - run: pnpm install --frozen-lockfile
      - name: Apply NEX-44 source changes
        run: python ops/nex44-build.py
      - name: Format sources
        run: pnpm exec prettier --write packages/database/src/schema/capacity-reservation.ts packages/database/src/schema/transport-contract.ts apps/api/src/trips/trips.service.ts apps/api/src/negotiation/capacity-reservation.service.ts apps/api/src/negotiation/transport-contract.service.ts
      - name: Generate Drizzle migration
        run: pnpm --filter @nexora/database db:generate
      - name: Commit slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/database/src/schema packages/database/migrations apps/api/src/trips/trips.service.ts apps/api/src/negotiation/capacity-reservation.service.ts apps/api/src/negotiation/transport-contract.service.ts
          git commit -m 'feat(trips): enforce NEX-44 trip finalization' || exit 0
          git push origin HEAD:feat/nex-44-trip-completion
