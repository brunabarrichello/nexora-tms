name: NEX-51 Format Once

on:
  push:
    branches:
      - feat/nex-51-carrier-payments
    paths:
      - '.github/workflows/nex51-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/nex-51-carrier-payments

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format, validate and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            apps/api/src/finance/finance-payment-rbac.controller.spec.ts \
            apps/api/src/finance/finance-payment.integration.ts \
            apps/api/src/finance/finance-payment.service.ts \
            apps/api/src/finance/finance-payment.validation.ts \
            'apps/web/app/financeiro/pagamentos/[id]/page.tsx' \
            apps/web/app/financeiro/pagamentos/page.tsx
          rm .github/workflows/nex51-format-once.yml
          pnpm validate
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: normalize NEX-51 payment files'
          git push origin HEAD:feat/nex-51-carrier-payments
