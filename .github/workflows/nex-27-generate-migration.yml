name: NEX-27 Generate Migration

on:
  push:
    branches:
      - feature/NEX-27-addresses-contacts

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/NEX-27-addresses-contacts

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test API
        run: pnpm --filter @nexora/api test

      - name: Generate Drizzle migration
        run: pnpm --filter @nexora/database db:generate

      - name: Add runtime grants to generated migration
        shell: bash
        run: |
          migration="$(find packages/database/migrations -maxdepth 1 -type f -name '*.sql' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          if [[ -z "$migration" ]]; then
            echo "No generated migration found."
            exit 1
          fi
          cat >> "$migration" <<'SQL'
          --> statement-breakpoint
          GRANT SELECT, INSERT, UPDATE ON TABLE business_party_addresses TO nexora_app;
          --> statement-breakpoint
          GRANT SELECT, INSERT, UPDATE ON TABLE business_party_contacts TO nexora_app;
          SQL

      - name: Commit generated migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/migrations
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          SKIP_SIMPLE_GIT_HOOKS=1 git commit -m "NEX-27 feat(db): generate address and contact migration"
          SKIP_SIMPLE_GIT_HOOKS=1 git push origin HEAD:feature/NEX-27-addresses-contacts
