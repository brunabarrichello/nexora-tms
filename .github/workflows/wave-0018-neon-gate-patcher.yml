name: Wave 0018 Neon gate patcher

on:
  push:
    branches:
      - feat/database-wave-0018-documents
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/database-wave-0018-documents
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: pnpm install --frozen-lockfile
      - name: Patch permanent Neon baseline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/neon-pr-gate.yml')
          text = path.read_text()

          api_path = "      - 'apps/api/src/documents/**'\n"
          if api_path not in text:
              anchor = "      - 'apps/api/src/capacity/**'\n"
              assert anchor in text
              text = text.replace(anchor, anchor + api_path, 1)

          new_tables = "'capacity_asset_locations','capacity_asset_blocks','documents','document_versions','document_validations','business_party_documents','transport_request_documents'"
          old_tables = "'capacity_asset_locations','capacity_asset_blocks'"

          def patch_segment(source: str, start_marker: str, end_marker: str) -> str:
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              segment = source[start:end]
              assert old_tables in segment, (start_marker, segment[-500:])
              segment = segment.replace(old_tables, new_tables, 1)
              return source[:start] + segment + source[end:]

          text = patch_segment(
              text,
              '            SELECT count(*) INTO table_count',
              '            IF table_count <> 84',
          )
          text = patch_segment(
              text,
              '            SELECT count(*) INTO rls_count',
              '            IF rls_count <> 76',
          )

          owner_start = text.index("            IF EXISTS (\n              SELECT 1\n                FROM pg_class c")
          owner_end = text.index("            IF NOT has_table_privilege('nexora_app','public.tenants','SELECT')", owner_start)
          owner_segment = text[owner_start:owner_end]
          assert old_tables in owner_segment
          owner_segment = owner_segment.replace(old_tables, new_tables, 1)
          text = text[:owner_start] + owner_segment + text[owner_end:]

          replacements = {
              "IF table_count <> 84 THEN": "IF table_count <> 89 THEN",
              "Expected 84 application tables": "Expected 89 application tables",
              "IF rls_count <> 76 THEN": "IF rls_count <> 81 THEN",
              "Expected RLS on 76 tenant-scoped tables": "Expected RLS on 81 tenant-scoped tables",
              "IF migration_count <> 18 THEN": "IF migration_count <> 19 THEN",
              "Expected 18 Drizzle migration records": "Expected 19 Drizzle migration records",
          }
          for old, new in replacements.items():
              assert old in text, old
              text = text.replace(old, new, 1)

          assert "IF table_count <> 89 THEN" in text
          assert "IF rls_count <> 81 THEN" in text
          assert "IF migration_count <> 19 THEN" in text
          assert text.count("'documents','document_versions','document_validations','business_party_documents','transport_request_documents'") >= 3
          path.write_text(text)
          PY
      - name: Format permanent Neon gate
        run: pnpm exec prettier --write .github/workflows/neon-pr-gate.yml
      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q "table_count <> 89" .github/workflows/neon-pr-gate.yml
          grep -q "rls_count <> 81" .github/workflows/neon-pr-gate.yml
          grep -q "migration_count <> 19" .github/workflows/neon-pr-gate.yml
          grep -q "apps/api/src/documents" .github/workflows/neon-pr-gate.yml
          git diff --check
      - name: Materialize patch commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/neon-pr-gate.yml
          git commit -m "ci(database): extend Neon baseline through Wave 0018"
          echo "PATCH_COMMIT=$(git rev-parse HEAD)"
          echo "PATCH_TREE=$(git rev-parse HEAD^{tree})"
          echo "PATCH_BLOB=$(git rev-parse HEAD:.github/workflows/neon-pr-gate.yml)"
          set +e
          git push --no-verify origin HEAD:feat/database-wave-0018-documents
          status=$?
          set -e
          echo "PUSH_STATUS=$status"
          exit 0
