name: Wave 0017 API check

on:
  push:
    branches:
      - feat/database-wave-0017-driver-assets
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/database-wave-0017-driver-assets
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: pnpm install --frozen-lockfile
      - name: Format Wave 0017 files
        run: pnpm exec prettier --write apps/api/src/capacity/capacity-qualification.controller.ts apps/api/src/capacity/capacity-qualification.service.ts apps/api/src/capacity/capacity-qualification.validation.ts apps/api/src/capacity/capacity-qualification.validation.spec.ts apps/api/src/capacity/capacity.module.ts apps/api/package.json packages/database/src/schema/capacity-qualification.ts packages/database/src/schema/capacity.ts packages/database/src/schema/index.ts
      - name: Typecheck database
        run: pnpm --filter @nexora/database typecheck
      - name: Typecheck API
        run: pnpm --filter @nexora/api typecheck
      - name: Test API
        run: pnpm --filter @nexora/api test
      - name: Check Drizzle
        run: pnpm --filter @nexora/database db:check
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api packages/database/src/schema
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(api): format Wave 0017 capacity qualification"
          git push origin HEAD:feat/database-wave-0017-driver-assets
