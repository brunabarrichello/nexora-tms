name: Auth0 Development E2E Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'apps/api/scripts/**'
      - 'packages/auth/**'
      - '.github/workflows/auth0-development-e2e-gate.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '24.20.0'
  PNPM_VERSION: '11.24.0'
  API_BASE_URL: 'http://127.0.0.1:3011'
  OIDC_ISSUER: 'https://127.0.0.1:9443/'
  OIDC_AUDIENCE: 'urn:nexora:tms:api:ci-e2e'

jobs:
  auth0-development-e2e:
    name: Auth0-compatible authenticated tenant E2E
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @nexora/api build

      - name: Create local OIDC fixture
        shell: bash
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/nexora-ci-tls-key.pem \
            -out /tmp/nexora-ci-tls-cert.pem \
            -days 1 -subj '/CN=127.0.0.1' \
            -addext 'subjectAltName=IP:127.0.0.1' >/dev/null 2>&1
          OIDC_FIXTURE_ISSUER="$OIDC_ISSUER" \
          OIDC_FIXTURE_AUDIENCE="$OIDC_AUDIENCE" \
          OIDC_FIXTURE_SUBJECT='subject-user-a' \
          OIDC_FIXTURE_TOKEN_FILE='/tmp/nexora-ci-access-token' \
          OIDC_FIXTURE_CERT_FILE='/tmp/nexora-ci-tls-cert.pem' \
          OIDC_FIXTURE_TLS_KEY_FILE='/tmp/nexora-ci-tls-key.pem' \
          node apps/api/scripts/ci-oidc-fixture.mjs > /tmp/nexora-ci-oidc.log 2>&1 &
          echo $! >/tmp/nexora-ci-oidc.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --cacert /tmp/nexora-ci-tls-cert.pem \
              https://127.0.0.1:9443/health >/dev/null 2>&1 && \
              test -s /tmp/nexora-ci-access-token; then exit 0; fi
            sleep 1
          done
          cat /tmp/nexora-ci-oidc.log >&2 || true
          exit 1

      - name: Start API
        shell: bash
        run: |
          set -euo pipefail
          APP_ENV=ci APP_NAME=nexora-tms-api NODE_ENV=test TZ=UTC PORT=3011 \
          DATABASE_URL="${DATABASE_URL:-}" \
          OIDC_PROVIDER_KEY=ci-auth-e2e \
          OIDC_ISSUER_URL="$OIDC_ISSUER" \
          OIDC_JWKS_URL='https://127.0.0.1:9443/.well-known/jwks.json' \
          OIDC_AUDIENCE="$OIDC_AUDIENCE" \
          OIDC_ALLOWED_ALGORITHMS=RS256 \
          NODE_EXTRA_CA_CERTS=/tmp/nexora-ci-tls-cert.pem \
          node apps/api/dist/main.js >/tmp/nexora-ci-api.log 2>&1 &
          echo $! >/tmp/nexora-ci-api.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$API_BASE_URL/health/ready" >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat /tmp/nexora-ci-api.log >&2 || true
          exit 1

      - name: Run authenticated E2E
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat /tmp/nexora-ci-access-token)"
          status="$(curl --silent --show-error -o /tmp/no-auth.json -w '%{http_code}' \
            "$API_BASE_URL/api/v1/tenant/runtime-gate" -H 'x-nexora-tenant-id: 53000000-0000-4000-8000-000000000001')"
          test "$status" = 401
          status="$(curl --silent --show-error -o /tmp/auth.json -w '%{http_code}' \
            "$API_BASE_URL/api/v1/tenant/runtime-gate" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'x-nexora-tenant-id: 53000000-0000-4000-8000-000000000001')"
          test "$status" = 200
          jq -e '.data.authenticated == true and .data.rlsIsolated == true' /tmp/auth.json >/dev/null
          status="$(curl --silent --show-error -o /tmp/cross.json -w '%{http_code}' \
            "$API_BASE_URL/api/v1/tenant/runtime-gate" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'x-nexora-tenant-id: 53000000-0000-4000-8000-000000000002')"
          test "$status" = 403

      - name: Summary
        run: |
          echo '## Auth0 Development E2E gate passed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Unauthenticated request: 401' >> "$GITHUB_STEP_SUMMARY"
          echo '- Authenticated Tenant A: 200 + RLS isolated' >> "$GITHUB_STEP_SUMMARY"
          echo '- Cross-tenant Tenant B selection: 403' >> "$GITHUB_STEP_SUMMARY"
