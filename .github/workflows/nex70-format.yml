name: NEX-70 Exact Formatting

on:
  push:
    branches:
      - feat/nex-70-web-auth0-pkce

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Format NEX-70 test
        run: pnpm exec prettier apps/web/app/_lib/web-auth.test.mjs --write

      - name: Commit exact formatter output
        shell: bash
        run: |
          if git diff --quiet -- apps/web/app/_lib/web-auth.test.mjs; then
            echo "File already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/_lib/web-auth.test.mjs
          git commit -m "style(iam): apply repository Prettier output"
          git push origin "HEAD:${GITHUB_REF_NAME}"
