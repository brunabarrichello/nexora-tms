name: Reference Data CRUD Format Once

on:
  push:
    branches:
      - feat/reference-data-wave-0015-integration

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/reference-data-wave-0015-integration
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format CRUD layer
        run: >-
          pnpm exec prettier --write
          apps/web/app/cadastros/catalogos/_actions/reference-catalog-actions.ts
          apps/web/app/cadastros/catalogos/_components/reference-catalog-editor-page.tsx
          apps/web/app/cadastros/catalogos/_components/reference-catalog-form.tsx
          apps/web/app/cadastros/catalogos/_components/reference-catalog-page.tsx
          apps/web/app/cadastros/catalogos/_lib/reference-catalog-config.ts
          'apps/web/app/cadastros/catalogos/novo/[catalog]/page.tsx'
          'apps/web/app/cadastros/catalogos/editar/[catalog]/[id]/page.tsx'

      - name: Remove one-time workflow
        run: rm .github/workflows/reference-data-crud-format-once.yml

      - name: Commit formatted CRUD files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/cadastros/catalogos .github/workflows/reference-data-crud-format-once.yml
          git commit --no-verify -m "style(reference-data): format catalog CRUD flows"
          git push --no-verify origin HEAD:feat/reference-data-wave-0015-integration
