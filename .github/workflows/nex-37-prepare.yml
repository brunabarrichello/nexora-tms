name: NEX-37 Prepare

on:
  push:
    branches:
      - feature/NEX-37-compatible-capacity-search

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/NEX-37-compatible-capacity-search

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      - name: Test API
        run: pnpm --filter @nexora/api test

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c core.hooksPath=/dev/null commit -m "NEX-37 format matching artifacts"
          git push origin HEAD:feature/NEX-37-compatible-capacity-search
