name: NEX-70 Lockfile Regeneration

on:
  push:
    branches:
      - feat/nex-70-web-auth0-pkce

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: nex70-pnpm-lock
          path: pnpm-lock.yaml

      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(iam): regenerate lockfile for Auth0 SDK"
          git push origin "HEAD:${GITHUB_REF_NAME}"
