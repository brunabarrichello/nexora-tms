name: Neon Production Restore Qualification

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/neon-production-restore-qualification.yml'
      - 'scripts/neon/qualify-production-restore.sh'
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type QUALIFY-PRODUCTION-RESTORE
        required: true
        type: string
      source_minutes_ago:
        description: Historical restore point in minutes (1-300; Free window is 360 minutes)
        required: true
        default: '5'
        type: string

permissions:
  contents: read

concurrency:
  group: neon-production-restore-qualification
  cancel-in-progress: false

env:
  NEON_PROJECT_ID: raspy-river-76339604
  PRODUCTION_BRANCH_ID: br-silent-feather-a5ku7uyi
  FREE_HISTORY_SECONDS: 21600
  FREE_BRANCH_LIMIT: 10
  PGSSLMODE: verify-full
  PGSSLROOTCERT: /etc/ssl/certs/ca-certificates.crt

jobs:
  restore-qualification:
    name: Qualify controlled Production PITR on Free tier
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production

    steps:
      - name: Validate invocation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ "${{ inputs.confirmation }}" == "QUALIFY-PRODUCTION-RESTORE" ]] || {
              echo "Explicit confirmation QUALIFY-PRODUCTION-RESTORE is required." >&2
              exit 1
            }
          fi

          minutes="${{ inputs.source_minutes_ago || '5' }}"
          [[ "$minutes" =~ ^[0-9]+$ ]] || { echo "source_minutes_ago must be numeric." >&2; exit 1; }
          [[ "$minutes" -ge 1 && "$minutes" -le 300 ]] || {
            echo "source_minutes_ago must stay between 1 and 300 minutes, leaving safety margin inside the 6-hour Free history window." >&2
            exit 1
          }
          echo "SOURCE_MINUTES_AGO=$minutes" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure PostgreSQL client and CA bundle
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          test -r "$PGSSLROOTCERT"

      - name: Qualify Production historical restore
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: bash scripts/neon/qualify-production-restore.sh
