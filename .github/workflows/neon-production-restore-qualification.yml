name: Neon Production Restore Qualification

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/neon-production-restore-qualification.yml'
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type QUALIFY-PRODUCTION-RESTORE
        required: true
        type: string
      source_minutes_ago:
        description: Historical restore point in minutes (1-300; Free window is 360 minutes)
        required: true
        default: '5'
        type: string

permissions:
  contents: read

concurrency:
  group: neon-production-restore-qualification
  cancel-in-progress: false

env:
  NEON_PROJECT_ID: raspy-river-76339604
  PRODUCTION_BRANCH_ID: br-silent-feather-a5ku7uyi
  FREE_HISTORY_SECONDS: 21600
  FREE_BRANCH_LIMIT: 10
  PGSSLMODE: verify-full
  PGSSLROOTCERT: /etc/ssl/certs/ca-certificates.crt

jobs:
  restore-qualification:
    name: Qualify controlled Production PITR on Free tier
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production

    steps:
      - name: Validate invocation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ "${{ inputs.confirmation }}" == "QUALIFY-PRODUCTION-RESTORE" ]] || {
              echo "Explicit confirmation QUALIFY-PRODUCTION-RESTORE is required." >&2
              exit 1
            }
          fi

          minutes="${{ inputs.source_minutes_ago || '5' }}"
          [[ "$minutes" =~ ^[0-9]+$ ]] || { echo "source_minutes_ago must be numeric." >&2; exit 1; }
          [[ "$minutes" -ge 1 && "$minutes" -le 300 ]] || {
            echo "source_minutes_ago must stay between 1 and 300 minutes, leaving safety margin inside the 6-hour Free history window." >&2
            exit 1
          }
          echo "SOURCE_MINUTES_AGO=$minutes" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure PostgreSQL client and CA bundle
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          test -r "$PGSSLROOTCERT"

      - name: Validate canonical Production and restore capacity
        id: posture
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}" || { echo "NEON_API_KEY is unavailable." >&2; exit 1; }

          project_json="$(curl -fsS -H "Authorization: Bearer ${NEON_API_KEY}" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}")"
          branches_json="$(curl -fsS -H "Authorization: Bearer ${NEON_API_KEY}" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches")"

          production_json="$(jq -ec --arg id "$PRODUCTION_BRANCH_ID" '[.branches[] | select(.id == $id)][0]' <<<"$branches_json")"
          [[ "$(jq -r '.name' <<<"$production_json")" == "production" ]]
          [[ "$(jq -r '.default' <<<"$production_json")" == "true" ]]
          [[ -z "$(jq -r '.parent_id // ""' <<<"$production_json")" ]]

          history_seconds="$(jq -er '.project.history_retention_seconds' <<<"$project_json")"
          [[ "$history_seconds" -ge "$FREE_HISTORY_SECONDS" ]] || {
            echo "Restore qualification blocked: history window is ${history_seconds}s." >&2
            exit 1
          }

          branch_count="$(jq '.branches | length' <<<"$branches_json")"
          [[ "$branch_count" -lt "$FREE_BRANCH_LIMIT" ]] || {
            echo "Restore qualification blocked: ${branch_count}/${FREE_BRANCH_LIMIT} branches already exist." >&2
            exit 1
          }

          echo "history_seconds=$history_seconds" >> "$GITHUB_OUTPUT"
          echo "branch_count=$branch_count" >> "$GITHUB_OUTPUT"

      - name: Create historical restore branch with isolated compute
        id: restore
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          started_epoch="$(date +%s)"
          source_timestamp="$(date -u -d "${SOURCE_MINUTES_AGO} minutes ago" +'%Y-%m-%dT%H:%M:%S.000Z')"
          restore_name="dr-pitr-${GITHUB_RUN_ID}"

          payload="$(jq -cn \
            --arg name "$restore_name" \
            --arg parent "$PRODUCTION_BRANCH_ID" \
            --arg timestamp "$source_timestamp" \
            '{branch:{name:$name,parent_id:$parent,parent_timestamp:$timestamp},endpoints:[{type:"read_write"}]}')"

          response="$(curl -fsS -X POST \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches")"

          branch_id="$(jq -er '.branch.id' <<<"$response")"
          branch_parent="$(jq -er '.branch.parent_id' <<<"$response")"
          [[ "$branch_parent" == "$PRODUCTION_BRANCH_ID" ]] || {
            echo "Restore branch parent mismatch." >&2
            exit 1
          }

          echo "branch_id=$branch_id" >> "$GITHUB_OUTPUT"
          echo "branch_name=$restore_name" >> "$GITHUB_OUTPUT"
          echo "source_timestamp=$source_timestamp" >> "$GITHUB_OUTPUT"
          echo "started_epoch=$started_epoch" >> "$GITHUB_OUTPUT"
          echo "Historical restore branch created at ${source_timestamp}."

      - name: Resolve hardened restore connection strings
        id: connections
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          RESTORE_BRANCH_ID: ${{ steps.restore.outputs.branch_id }}
        run: |
          set -euo pipefail

          harden_connection_uri() {
            python3 - "$1" <<'PY'
          import sys
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit
          uri = urlsplit(sys.argv[1])
          query = [(k, v) for k, v in parse_qsl(uri.query, keep_blank_values=True) if k.lower() != 'sslmode']
          query.append(('sslmode', 'verify-full'))
          print(urlunsplit((uri.scheme, uri.netloc, uri.path, urlencode(query), uri.fragment)))
          PY
          }

          connection_uri() {
            local role_name="$1"
            local raw_uri
            raw_uri="$(curl -fsSG \
              -H "Authorization: Bearer ${NEON_API_KEY}" \
              --data-urlencode "branch_id=${RESTORE_BRANCH_ID}" \
              --data-urlencode 'database_name=neondb' \
              --data-urlencode "role_name=${role_name}" \
              --data-urlencode 'pooled=false' \
              "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri" | jq -er '.uri')"
            echo "::add-mask::$raw_uri" >&2
            harden_connection_uri "$raw_uri"
          }

          admin_url="$(connection_uri neondb_owner)"
          migrator_url="$(connection_uri nexora_migrator)"
          app_url="$(connection_uri nexora_app)"
          for value in "$admin_url" "$migrator_url" "$app_url"; do
            echo "::add-mask::$value"
            [[ "$value" == *'sslmode=verify-full'* ]]
          done

          if [[ "$migrator_url" == *'?'* ]]; then
            owner_url="${migrator_url}&options=-c%20role%3Dnexora_owner"
          else
            owner_url="${migrator_url}?options=-c%20role%3Dnexora_owner"
          fi
          echo "::add-mask::$owner_url"

          echo "admin_url=$admin_url" >> "$GITHUB_OUTPUT"
          echo "owner_url=$owner_url" >> "$GITHUB_OUTPUT"
          echo "app_url=$app_url" >> "$GITHUB_OUTPUT"

      - name: Measure restored database readiness and TLS
        id: rto
        shell: bash
        env:
          ADMIN_DATABASE_URL: ${{ steps.connections.outputs.admin_url }}
          STARTED_EPOCH: ${{ steps.restore.outputs.started_epoch }}
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 30); do
            if psql "$ADMIN_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atqc 'select 1' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          [[ "$ready" == "true" ]] || { echo "Restored database did not become queryable." >&2; exit 1; }

          conninfo="$(psql "$ADMIN_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c '\conninfo' 2>&1)"
          grep -Eq 'SSL connection \(protocol: TLSv1\.[23], cipher: [^,)]+' <<<"$conninfo" || {
            echo "Restored database connection did not prove TLSv1.2/TLSv1.3 with cipher." >&2
            exit 1
          }

          rto_seconds="$(( $(date +%s) - STARTED_EPOCH ))"
          echo "rto_seconds=$rto_seconds" >> "$GITHUB_OUTPUT"
          echo "Restored database became queryable in ${rto_seconds}s."

      - name: Validate restored schema, roles, ledger, audit and RLS
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          RESTORE_BRANCH_ID: ${{ steps.restore.outputs.branch_id }}
          ADMIN_DATABASE_URL: ${{ steps.connections.outputs.admin_url }}
          OWNER_DATABASE_URL: ${{ steps.connections.outputs.owner_url }}
          APP_DATABASE_URL: ${{ steps.connections.outputs.app_url }}
        run: |
          set -euo pipefail

          expected="$(jq '.entries | length' packages/database/migrations/meta/_journal.json)"
          actual="$(psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc 'select count(*) from drizzle.__drizzle_migrations;')"
          [[ "$actual" == "$expected" ]] || {
            echo "Restored migration ledger mismatch: ${actual}/${expected}." >&2
            exit 1
          }

          posture="$(psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "
            select count(*) from pg_roles
             where (rolname = 'nexora_owner' and rolcanlogin = false and rolsuper = false and rolbypassrls = false and rolcreatedb = false and rolcreaterole = false)
                or (rolname in ('nexora_migrator','nexora_app','nexora_worker') and rolcanlogin = true and rolsuper = false and rolbypassrls = false and rolcreatedb = false and rolcreaterole = false);")"
          [[ "$posture" == '4' ]] || { echo "Restored role posture mismatch." >&2; exit 1; }

          psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/ci/wave-0024-audit-schema.sql
          psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/ci/wave-0024-audit-immutability.sql
          psql "$APP_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/ci/wave-0024-audit-runtime.sql

          schema_diff="$(curl -fsSG \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            --data-urlencode "base_branch_id=${PRODUCTION_BRANCH_ID}" \
            --data-urlencode 'db_name=neondb' \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${RESTORE_BRANCH_ID}/compare_schema" | jq -r '.diff // ""')"
          [[ -z "$schema_diff" ]] || {
            echo "Restored schema differs from current Production schema:" >&2
            printf '%s\n' "$schema_diff" >&2
            exit 1
          }

          echo "Restored branch verified: ledger ${actual}/${expected}, minimum-privilege roles, Audit immutability and runtime RLS."

      - name: Smoke API against restored database
        shell: bash
        env:
          APP_DATABASE_URL: ${{ steps.connections.outputs.app_url }}
        run: |
          set -euo pipefail
          pnpm --filter @nexora/api build

          DATABASE_URL="$APP_DATABASE_URL" \
          PORT=3101 \
          APP_ENV=dr-restore \
          NODE_ENV=test \
          OIDC_PROVIDER_KEY=restore-gate \
          OIDC_ISSUER_URL=https://restore.invalid/ \
          OIDC_JWKS_URL=https://restore.invalid/.well-known/jwks.json \
          OIDC_AUDIENCE=urn:nexora:tms:api:restore \
          pnpm --filter @nexora/api start > /tmp/nexora-dr-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3101/health/ready >/tmp/readiness.json 2>/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "true" ]]; then
            cat /tmp/nexora-dr-api.log >&2
            exit 1
          fi

          curl -fsS http://127.0.0.1:3101/health/live >/dev/null
          headers="$(curl -fsS -D - -o /dev/null -H 'x-correlation-id: dr-restore-gate' http://127.0.0.1:3101/health)"
          grep -qi '^x-correlation-id: dr-restore-gate' <<<"$headers"
          grep -qi '^x-content-type-options: nosniff' <<<"$headers"

          status="$(curl -sS -o /tmp/negative-auth.json -w '%{http_code}' http://127.0.0.1:3101/api/v1/documents)"
          [[ "$status" == '401' ]] || { echo "Expected negative auth HTTP 401, found ${status}." >&2; exit 1; }

          echo "Restored API smoke passed: liveness, database readiness, correlation/security headers and fail-closed auth."

      - name: Qualification summary
        shell: bash
        run: |
          {
            echo '## Neon Production restore qualification'
            echo ''
            echo "- Source branch: production (${PRODUCTION_BRANCH_ID})"
            echo "- Historical source timestamp: ${{ steps.restore.outputs.source_timestamp }}"
            echo "- Tested recovery-point lag: ${SOURCE_MINUTES_AGO} minutes"
            echo "- Database-ready RTO: ${{ steps.rto.outputs.rto_seconds }} seconds"
            echo "- Free history window: ${{ steps.posture.outputs.history_seconds }} seconds"
            echo '- Migration ledger, minimum-privilege roles, Audit immutability and RLS: PASS'
            echo '- API liveness/readiness and negative auth smoke: PASS'
            echo '- Production branch was not modified.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete only the exact temporary restore branch
        if: ${{ always() && steps.restore.outputs.branch_id != '' }}
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          RESTORE_BRANCH_ID: ${{ steps.restore.outputs.branch_id }}
          RESTORE_BRANCH_NAME: ${{ steps.restore.outputs.branch_name }}
        run: |
          set -euo pipefail
          branch_json="$(curl -fsS -H "Authorization: Bearer ${NEON_API_KEY}" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${RESTORE_BRANCH_ID}")"
          [[ "$(jq -r '.branch.name' <<<"$branch_json")" == "$RESTORE_BRANCH_NAME" ]]
          [[ "$(jq -r '.branch.parent_id' <<<"$branch_json")" == "$PRODUCTION_BRANCH_ID" ]]
          [[ "$RESTORE_BRANCH_ID" != "$PRODUCTION_BRANCH_ID" ]]

          curl -fsS -X DELETE \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${RESTORE_BRANCH_ID}" >/dev/null

          branches_json="$(curl -fsS -H "Authorization: Bearer ${NEON_API_KEY}" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches")"
          remaining="$(jq --arg id "$RESTORE_BRANCH_ID" '[.branches[] | select(.id == $id)] | length' <<<"$branches_json")"
          [[ "$remaining" == '0' ]] || { echo "Temporary restore branch still exists." >&2; exit 1; }
          echo "Temporary restore branch cleanup verified."
