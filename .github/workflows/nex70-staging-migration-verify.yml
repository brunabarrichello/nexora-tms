name: NEX-70 Staging migration verify

on:
  push:
    branches:
      - feat/nex-70-web-auth0-pkce
    paths:
      - '.github/workflows/nex70-staging-migration-verify.yml'

permissions:
  contents: read

env:
  NEON_PROJECT_ID: raspy-river-76339604

jobs:
  verify:
    name: Reconcile Staging migration baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout main application baseline
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Staging admin connection
        id: admin
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: production
          branch_name: staging
          database: neondb
          role: neondb_owner
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Resolve Staging migrator connection
        id: migrator
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: production
          branch_name: staging
          database: neondb
          role: nexora_migrator
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Resolve Staging runtime connection
        id: runtime
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: production
          branch_name: staging
          database: neondb
          role: nexora_app
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Reconcile versioned migrations and verify audit runtime
        shell: bash
        env:
          ADMIN_DATABASE_URL: ${{ steps.admin.outputs.db_url }}
          MIGRATOR_DATABASE_URL: ${{ steps.migrator.outputs.db_url }}
          RUNTIME_DATABASE_URL: ${{ steps.runtime.outputs.db_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ADMIN_DATABASE_URL"
          echo "::add-mask::$MIGRATOR_DATABASE_URL"
          echo "::add-mask::$RUNTIME_DATABASE_URL"

          if [[ "$MIGRATOR_DATABASE_URL" == *"?"* ]]; then
            OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}&options=-c%20role%3Dnexora_owner"
          else
            OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}?options=-c%20role%3Dnexora_owner"
          fi
          echo "::add-mask::$OWNER_DATABASE_URL"

          pnpm --filter @nexora/database db:check
          DATABASE_URL="$OWNER_DATABASE_URL" pnpm --filter @nexora/database db:migrate

          expected="$(jq '.entries | length' packages/database/migrations/meta/_journal.json)"
          actual="$(psql "$OWNER_DATABASE_URL" -Atqc 'select count(*) from drizzle.__drizzle_migrations')"
          [[ "$actual" == "$expected" ]] || {
            echo "Migration ledger mismatch: expected $expected, found $actual" >&2
            exit 1
          }

          table_exists="$(psql "$ADMIN_DATABASE_URL" -Atqc "select to_regclass('public.pretenant_auth_events') is not null")"
          [[ "$table_exists" == "t" ]] || {
            echo "pretenant_auth_events is missing" >&2
            exit 1
          }

          can_insert="$(psql "$ADMIN_DATABASE_URL" -Atqc "select has_table_privilege('nexora_app','public.pretenant_auth_events','INSERT')")"
          [[ "$can_insert" == "t" ]] || {
            echo "nexora_app lacks INSERT on pretenant_auth_events" >&2
            exit 1
          }

          psql "$RUNTIME_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          INSERT INTO pretenant_auth_events (
            id, event_type, outcome, occurred_at
          ) VALUES (
            '57000000-0000-7000-8000-000000000001',
            'auth.staging.migration.verify',
            'accepted',
            now()
          );
          ROLLBACK;
          SQL

          echo "staging_migrations=$actual/$expected"
          echo "pretenant_auth_events=present"
          echo "runtime_audit_insert=rollback_ok"
