name: Wave 0023 Runtime Grants Fix

on:
  push:
    branches:
      - feat/database-wave-0023-trip-execution
    paths:
      - .github/workflows/wave-0023-grants-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Wave 0023 branch
        uses: actions/checkout@v4
        with:
          ref: feat/database-wave-0023-trip-execution

      - name: Append runtime grants
        shell: bash
        run: |
          set -euo pipefail
          cat >> packages/database/migrations/0023_moaning_iron_fist.sql <<'SQL'
          --> statement-breakpoint
          GRANT SELECT, INSERT ON TABLE
            trip_events,
            trip_checkins,
            trip_locations,
            trip_documents,
            trip_tolls,
            trip_fuel,
            trip_proofs,
            trip_delivery_proofs
          TO nexora_app;
          --> statement-breakpoint
          GRANT SELECT, INSERT, UPDATE ON TABLE
            trip_checklists,
            trip_expenses
          TO nexora_app;
          SQL
          git diff --check

      - name: Commit grants
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/database/migrations/0023_moaning_iron_fist.sql
          git commit -m 'fix(database): grant Wave 0023 runtime privileges'
          git push --no-verify origin HEAD:feat/database-wave-0023-trip-execution
