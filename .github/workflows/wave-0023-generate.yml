name: Wave 0023 Drizzle Generate

on:
  push:
    branches:
      - feat/database-wave-0023-trip-execution
    paths:
      - .github/workflows/wave-0023-generate.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Wave 0023 branch
        uses: actions/checkout@v4
        with:
          ref: feat/database-wave-0023-trip-execution

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Wave 0023 migration
        run: |
          pnpm --filter @nexora/database db:generate
          pnpm --filter @nexora/database db:check

      - name: Commit generated migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/database/migrations packages/database/migrations/meta
          git diff --cached --check
          git commit -m 'feat(database): generate Wave 0023 migration'
          git push --no-verify origin HEAD:feat/database-wave-0023-trip-execution
