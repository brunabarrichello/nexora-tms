name: Neon Audit Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/database/**'
      - '.github/workflows/neon-audit-gate.yml'

permissions:
  contents: read

concurrency:
  group: neon-audit-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NEON_PROJECT_ID: raspy-river-76339604
  DATABASE_NAME: nexora

jobs:
  audit:
    name: Audit schema, immutability, grants and RLS isolation
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Neon API secret
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}" || { echo "NEON_API_KEY repository secret is not configured." >&2; exit 1; }
      - name: Set ephemeral branch
        shell: bash
        run: |
          set -euo pipefail
          echo "NEON_TEST_BRANCH=pr-${{ github.event.pull_request.number }}-audit-${{ github.run_id }}" >> "$GITHUB_ENV"
      - name: Create isolated Neon branch
        id: admin
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: production
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: neondb
          role: neondb_owner
          api_key: ${{ secrets.NEON_API_KEY }}
      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: Bootstrap nexora database access
        env:
          ADMIN_DATABASE_URL: ${{ steps.admin.outputs.db_url }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$ADMIN_DATABASE_URL"
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SET ROLE neon_superuser;
          GRANT CONNECT ON DATABASE nexora TO nexora_migrator, nexora_app, nexora_worker;
          GRANT USAGE, CREATE ON SCHEMA public TO nexora_migrator;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO nexora_migrator;
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO nexora_migrator;
          RESET ROLE;
          SQL
      - name: Resolve migrator connection
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          MIGRATOR_DATABASE_URL="$(npx --yes neonctl@v2 connection-string "$NEON_TEST_BRANCH" \
            --project-id "$NEON_PROJECT_ID" \
            --database-name "$DATABASE_NAME" \
            --role-name nexora_migrator)"
          test -n "$MIGRATOR_DATABASE_URL"
          echo "::add-mask::$MIGRATOR_DATABASE_URL"
          echo "MIGRATOR_DATABASE_URL=$MIGRATOR_DATABASE_URL" >> "$GITHUB_ENV"
      - name: Verify migration connection and journal
        shell: bash
        run: |
          set -euo pipefail
          psql "$MIGRATOR_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT current_database() AS database, session_user, current_user, current_setting('role') AS role;
          SELECT has_schema_privilege(current_user, 'public', 'CREATE') AS public_create;
          SELECT to_regclass('drizzle.__drizzle_migrations') AS migration_journal;
          SELECT COALESCE((SELECT count(*) FROM drizzle.__drizzle_migrations), 0) AS applied_migrations;
          SQL
      - name: Apply migrations
        shell: bash
        env:
          DEBUG: drizzle-kit:*
        run: |
          set -euo pipefail
          DATABASE_URL="$MIGRATOR_DATABASE_URL" pnpm --filter @nexora/database db:migrate
      - name: Verify Wave 0024 schema, RLS and grants
        shell: bash
        run: psql "$MIGRATOR_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/ci/wave-0024-audit-schema.sql
      - name: Resolve nexora_app connection
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          APP_DATABASE_URL="$(npx --yes neonctl@v2 connection-string "$NEON_TEST_BRANCH" \
            --project-id "$NEON_PROJECT_ID" \
            --database-name "$DATABASE_NAME" \
            --role-name nexora_app)"
          test -n "$APP_DATABASE_URL"
          echo "::add-mask::$APP_DATABASE_URL"
          echo "APP_DATABASE_URL=$APP_DATABASE_URL" >> "$GITHUB_ENV"
      - name: Verify runtime writes, sensitive payload guard and tenant isolation
        shell: bash
        run: |
          set -euo pipefail
          psql "$APP_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/ci/wave-0024-audit-runtime.sql
      - name: Verify owner cannot mutate audit history
        shell: bash
        run: psql "$MIGRATOR_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/ci/wave-0024-audit-immutability.sql
      - name: Gate summary
        shell: bash
        run: |
          {
            echo '### Wave 0024 Cross-Cutting Audit Gate'
            echo '- audit_events + audit_changes: verified'
            echo '- tenant RLS policies: verified'
            echo '- nexora_app SELECT/INSERT-only grants: verified'
            echo '- Tenant A → Tenant B read isolation: verified'
            echo '- cross-tenant writes: blocked'
            echo '- sensitive before/after payload persistence: blocked'
            echo '- UPDATE/DELETE under owner: blocked by immutable triggers'
            echo '- Production: untouched'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Delete isolated Neon branch
        if: ${{ always() && steps.admin.outputs.branch_id != '' }}
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: ${{ env.NEON_TEST_BRANCH }}
          api_key: ${{ secrets.NEON_API_KEY }}

# Re-run marker: migrator uses explicit ephemeral-branch database/schema ACLs; production remains untouched.
