name: Neon Audit Gate

# Neon audit gate: serialized to respect the project's 10-branch limit.
# Application database is always nexora; neondb is administrative only.
on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/database/**'
      - '.github/workflows/neon-audit-gate.yml'

permissions:
  contents: read

concurrency:
  group: neon-ephemeral-branch-capacity
  cancel-in-progress: false

env:
  NEON_PROJECT_ID: raspy-river-76339604
  DATABASE_NAME: nexora

jobs:
  audit:
    name: Audit schema, immutability, grants and RLS isolation
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
      - run: pnpm install --frozen-lockfile
      - name: Validate Neon API secret
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: test -n "${NEON_API_KEY:-}"
      - name: Set ephemeral branch
        run: echo "NEON_TEST_BRANCH=pr-${{ github.event.pull_request.number }}-audit-${{ github.run_id }}" >> "$GITHUB_ENV"
      - name: Create isolated Neon branch
        id: admin
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: production
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: neondb
          role: neondb_owner
          api_key: ${{ secrets.NEON_API_KEY }}
      - name: Ensure PostgreSQL client
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y postgresql-client; fi
      - name: Bootstrap nexora database access
        env:
          ADMIN_DATABASE_URL: ${{ steps.admin.outputs.db_url }}
        run: |
          set -euo pipefail
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT CONNECT ON DATABASE nexora TO nexora_migrator, nexora_app, nexora_worker;
          GRANT USAGE, CREATE ON SCHEMA public TO nexora_migrator;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO nexora_migrator;
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO nexora_migrator;
          SQL
      - name: Resolve migrator connection
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          url="$(npx --yes neonctl@v2 connection-string "$NEON_TEST_BRANCH" --project-id "$NEON_PROJECT_ID" --database-name "$DATABASE_NAME" --role-name nexora_migrator)"
          echo "::add-mask::$url"
          echo "MIGRATOR_DATABASE_URL=$url" >> "$GITHUB_ENV"
      - name: Verify migration connection and journal
        run: psql "$MIGRATOR_DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT current_database(),session_user,current_user; SELECT has_schema_privilege(current_user,'public','CREATE');"
      - name: Apply migrations
        run: DATABASE_URL="$MIGRATOR_DATABASE_URL" pnpm --filter @nexora/database db:migrate
      - name: Verify Wave 0024 schema, RLS and grants
        run: psql "$MIGRATOR_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/ci/wave-0024-audit-schema.sql
      - name: Resolve nexora_app connection
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          url="$(npx --yes neonctl@v2 connection-string "$NEON_TEST_BRANCH" --project-id "$NEON_PROJECT_ID" --database-name "$DATABASE_NAME" --role-name nexora_app)"
          echo "::add-mask::$url"
          echo "APP_DATABASE_URL=$url" >> "$GITHUB_ENV"
      - name: Verify runtime writes, sensitive payload guard and tenant isolation
        run: psql "$APP_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/ci/wave-0024-audit-runtime.sql
      - name: Verify owner cannot mutate audit history
        run: psql "$MIGRATOR_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/ci/wave-0024-audit-immutability.sql
      - name: Gate summary
        run: |
          echo '### Wave 0024 Cross-Cutting Audit Gate' >> "$GITHUB_STEP_SUMMARY"
          echo '- schema/RLS/grants/tenant isolation/immutability: verified' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production: untouched' >> "$GITHUB_STEP_SUMMARY"
      - name: Delete isolated Neon branch
        if: ${{ always() && steps.admin.outputs.branch_id != '' }}
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: ${{ steps.admin.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
