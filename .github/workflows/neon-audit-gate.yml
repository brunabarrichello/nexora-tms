name: Neon Audit Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/database/**'
      - '.github/workflows/neon-audit-gate.yml'

permissions:
  contents: read

concurrency:
  group: neon-audit-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  NEON_PROJECT_ID: raspy-river-76339604
  DATABASE_NAME: nexora

jobs:
  audit:
    name: Audit schema, immutability, grants and RLS isolation
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Neon API secret
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}" || { echo "NEON_API_KEY repository secret is not configured." >&2; exit 1; }

      - name: Set ephemeral branch name and expiry
        shell: bash
        run: |
          set -euo pipefail
          echo "NEON_TEST_BRANCH=pr-${{ github.event.pull_request.number }}-audit-${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "NEON_TEST_EXPIRES_AT=$(date -u --date '+2 hours' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create isolated branch from staging
        id: create-neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: staging
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: ${{ env.DATABASE_NAME }}
          role: neondb_owner
          expires_at: ${{ env.NEON_TEST_EXPIRES_AT }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Install Neon CLI
        shell: bash
        run: npm i -g neonctl@2

      - name: Bootstrap migration capability
        shell: bash
        env:
          ADMIN_DATABASE_URL: ${{ steps.create-neon.outputs.db_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ADMIN_DATABASE_URL"
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT nexora_migrator TO neondb_owner;
          GRANT nexora_owner TO nexora_migrator;
          GRANT CONNECT ON DATABASE nexora TO nexora_migrator;
          GRANT CONNECT ON DATABASE nexora TO nexora_owner;
          GRANT CREATE ON DATABASE nexora TO nexora_owner;
          CREATE SCHEMA IF NOT EXISTS nexora AUTHORIZATION nexora_migrator;
          GRANT USAGE, CREATE ON SCHEMA nexora TO nexora_owner;
          SQL

      - name: Resolve nexora_migrator connection
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          MIGRATOR_DATABASE_URL="$(neonctl connection-string "$NEON_TEST_BRANCH" \
            --project-id "$NEON_PROJECT_ID" \
            --database-name "$DATABASE_NAME" \
            --role-name nexora_migrator)"
          test -n "$MIGRATOR_DATABASE_URL"
          echo "::add-mask::$MIGRATOR_DATABASE_URL"
          echo "MIGRATOR_DATABASE_URL=$MIGRATOR_DATABASE_URL" >> "$GITHUB_ENV"
          identity="$(psql "$MIGRATOR_DATABASE_URL" -At -F '|' -c "select current_user, session_user, (select rolbypassrls from pg_roles where rolname=current_user)")"
          [[ "$identity" == "nexora_migrator|nexora_migrator|f" ]] || { echo "Unexpected migration identity: $identity" >&2; exit 1; }

      - name: Apply migrations
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MIGRATOR_DATABASE_URL" == *"?"* ]]; then OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}&options=-c%20role%3Dnexora_owner"; else OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}?options=-c%20role%3Dnexora_owner"; fi
          echo "::add-mask::$OWNER_DATABASE_URL"
          echo "OWNER_DATABASE_URL=$OWNER_DATABASE_URL" >> "$GITHUB_ENV"
          DATABASE_URL="$OWNER_DATABASE_URL" pnpm --filter @nexora/database db:migrate

      - name: Verify Wave 0024 schema, immutability, grants and RLS
        shell: bash
        run: psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/ci/wave-0024-audit-schema.sql

      - name: Resolve nexora_app connection
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          APP_DATABASE_URL="$(neonctl connection-string "$NEON_TEST_BRANCH" \
            --project-id "$NEON_PROJECT_ID" \
            --database-name "$DATABASE_NAME" \
            --role-name nexora_app)"
          test -n "$APP_DATABASE_URL"
          echo "::add-mask::$APP_DATABASE_URL"
          identity="$(psql "$APP_DATABASE_URL" -At -F '|' -c "select current_user, session_user, (select rolbypassrls from pg_roles where rolname=current_user)")"
          [[ "$identity" == "nexora_app|nexora_app|f" ]] || { echo "Unexpected API runtime identity: $identity" >&2; exit 1; }
          echo "APP_DATABASE_URL=$APP_DATABASE_URL" >> "$GITHUB_ENV"

      - name: Verify runtime writes, sensitive payload guard and tenant isolation
        shell: bash
        run: psql "$APP_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/ci/wave-0024-audit-runtime.sql

      - name: Verify owner cannot mutate audit history
        shell: bash
        run: psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/ci/wave-0024-audit-immutability.sql

      - name: Gate summary
        shell: bash
        run: |
          {
            echo '### Wave 0024 Cross-Cutting Audit Gate'
            echo '- Parent branch: staging'
            echo '- Single ephemeral branch creation: verified'
            echo '- audit_events + audit_changes: verified'
            echo '- tenant RLS policies: verified'
            echo '- nexora_app SELECT/INSERT-only grants: verified'
            echo '- Tenant A → Tenant B read isolation: verified'
            echo '- cross-tenant writes: blocked'
            echo '- sensitive before/after payload persistence: blocked'
            echo '- UPDATE/DELETE under owner: blocked by immutable triggers'
            echo '- Production: untouched'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete isolated Neon branch
        if: ${{ always() && steps.create-neon.outputs.branch_id != '' }}
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: ${{ steps.create-neon.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
