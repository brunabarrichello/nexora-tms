name: NEX-26 Format

on:
  push:
    branches:
      - feature/NEX-26-partners-suppliers

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/NEX-26-partners-suppliers

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format NEX-26 TypeScript files
        run: >-
          pnpm exec prettier --write
          packages/database/src/schema/master-data.ts
          apps/api/src/master-data/business-party.validation.ts
          apps/api/src/master-data/business-party.validation.spec.ts
          apps/api/src/master-data/business-party.service.ts

      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/schema/master-data.ts apps/api/src/master-data
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          SKIP_SIMPLE_GIT_HOOKS=1 git commit -m "NEX-26 style: format partner master data"
          SKIP_SIMPLE_GIT_HOOKS=1 git push origin HEAD:feature/NEX-26-partners-suppliers
