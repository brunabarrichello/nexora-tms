name: Wave 0017 gate patch

on:
  push:
    branches:
      - feat/database-wave-0017-driver-assets
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/database-wave-0017-driver-assets
          fetch-depth: 0

      - name: Patch Neon gate for Wave 0017
        shell: bash
        env:
          PRIVILEGE_EXTENSION_B64: ""
          WAVE_STEP_B64: ""
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('.github/workflows/neon-pr-gate.yml')
          s = p.read_text()
          new_tables = [
              'driver_documents','driver_qualifications','driver_courses','driver_availability',
              'driver_unavailability_periods','driver_emergency_contacts','driver_blocks','driver_ratings',
              'capacity_asset_capabilities','capacity_asset_documents','capacity_asset_maintenance_plans',
              'capacity_asset_maintenance','capacity_asset_maintenance_items','capacity_asset_insurances',
              'capacity_asset_inspections','capacity_asset_availability','capacity_asset_unavailability_periods',
              'capacity_asset_locations','capacity_asset_blocks'
          ]
          needle = "'custom_field_values'"
          assert s.count(needle) == 3, s.count(needle)
          s = s.replace(needle, needle + ",\n                 " + ','.join(repr(x) for x in new_tables))
          replacements = {
              'IF table_count <> 65 THEN':'IF table_count <> 84 THEN',
              'Expected 65 application tables':'Expected 84 application tables',
              'IF rls_count <> 57 THEN':'IF rls_count <> 76 THEN',
              'Expected RLS on 57 tenant-scoped tables':'Expected RLS on 76 tenant-scoped tables',
              'IF migration_count <> 17 THEN':'IF migration_count <> 18 THEN',
              'Expected 17 Drizzle migration records':'Expected 18 Drizzle migration records',
          }
          for old,new in replacements.items():
              assert old in s, old
              s = s.replace(old,new)
          anchor = "              RAISE EXCEPTION 'nexora_app runtime privilege matrix is incorrect';\n            END IF;\n          END $$;\n          SQL\n"
          assert s.count(anchor) == 1, s.count(anchor)
          s = s.replace(anchor, base64.b64decode(os.environ['PRIVILEGE_EXTENSION_B64']).decode())
          step_anchor = '      - name: Validate NEX-39 capacity reservation runtime and isolation\n'
          assert s.count(step_anchor) == 1, s.count(step_anchor)
          step = base64.b64decode(os.environ['WAVE_STEP_B64']).decode()
          s = s.replace(step_anchor, step + step_anchor)
          s = s.replace(
              'Neon database gate passed through NEX-40 frozen transport contracts, refusals, cancellations and capacity release.',
              'Neon database gate passed through Wave 0017 driver/asset qualification plus NEX-40 transport contracts.'
          )
          p.write_text(s)
          PY
          git diff --check
          grep -q "Expected 84 application tables" .github/workflows/neon-pr-gate.yml
          grep -q "Expected RLS on 76 tenant-scoped tables" .github/workflows/neon-pr-gate.yml
          grep -q "Expected 18 Drizzle migration records" .github/workflows/neon-pr-gate.yml
          grep -q "Validate Wave 0017 driver and asset qualification" .github/workflows/neon-pr-gate.yml

      - name: Commit patched workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/neon-pr-gate.yml
          git commit -m "ci(database): extend Neon gate through Wave 0017"
          echo "PATCH_COMMIT=$(git rev-parse HEAD)"
          echo "PATCH_TREE=$(git rev-parse HEAD^{tree})"
          echo "PATCH_BLOB=$(git rev-parse HEAD:.github/workflows/neon-pr-gate.yml)"
          git push origin HEAD:feat/database-wave-0017-driver-assets || true
