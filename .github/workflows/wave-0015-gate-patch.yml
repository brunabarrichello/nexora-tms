name: Wave 0015 gate patch

on:
  push:
    branches:
      - feat/database-wave-0015-foundations

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/database-wave-0015-foundations

      - name: Update Neon database gate contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/neon-pr-gate.yml')
          text = path.read_text()

          def sub_once(pattern, replacement, label, flags=0):
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')

          sub_once(
              r"'transport_contract_events'(\s*\n\s*\);\s*\n\s*IF table_count <> 34 THEN)",
              "'transport_contract_events',\n                 'countries','states','cities','units_of_measure','vehicle_types','body_types','cargo_types','package_types','document_types','tags'\\1",
              'table inventory list',
          )
          sub_once(r'IF table_count <> 34 THEN', 'IF table_count <> 44 THEN', 'table count')
          sub_once(r'Expected 34 application tables', 'Expected 44 application tables', 'table count message')

          sub_once(
              r"'transport_contract_events'(\s*\n\s*\)\s*\n\s*AND c\.relrowsecurity;\s*\n\s*IF rls_count <> 31 THEN)",
              "'transport_contract_events',\n                 'vehicle_types','body_types','cargo_types','package_types','document_types','tags'\\1",
              'RLS inventory list',
          )
          sub_once(r'IF rls_count <> 31 THEN', 'IF rls_count <> 37 THEN', 'RLS count')
          sub_once(r'Expected RLS on 31 tenant-scoped tables', 'Expected RLS on 37 tenant-scoped tables', 'RLS count message')

          sub_once(r'IF migration_count <> 15 THEN', 'IF migration_count <> 16 THEN', 'migration count')
          sub_once(r'Expected 15 Drizzle migration records', 'Expected 16 Drizzle migration records', 'migration count message')

          sub_once(
              r"'transport_contract_events'(\s*\n\s*\)\s*\n\s*AND r\.rolname='nexora_app')",
              "'transport_contract_events',\n                   'countries','states','cities','units_of_measure','vehicle_types','body_types','cargo_types','package_types','document_types','tags'\\1",
              'ownership inventory',
          )

          privilege_anchor = "OR has_table_privilege('nexora_app','public.transport_contract_events','DELETE') THEN"
          privilege_lines = [
              "OR has_table_privilege('nexora_app','public.transport_contract_events','DELETE')",
              "OR NOT has_table_privilege('nexora_app','public.countries','SELECT')",
              "OR has_table_privilege('nexora_app','public.countries','INSERT')",
              "OR has_table_privilege('nexora_app','public.countries','UPDATE')",
              "OR has_table_privilege('nexora_app','public.countries','DELETE')",
              "OR NOT has_table_privilege('nexora_app','public.states','SELECT')",
              "OR has_table_privilege('nexora_app','public.states','INSERT')",
              "OR has_table_privilege('nexora_app','public.states','UPDATE')",
              "OR has_table_privilege('nexora_app','public.states','DELETE')",
              "OR NOT has_table_privilege('nexora_app','public.cities','SELECT')",
              "OR has_table_privilege('nexora_app','public.cities','INSERT')",
              "OR has_table_privilege('nexora_app','public.cities','UPDATE')",
              "OR has_table_privilege('nexora_app','public.cities','DELETE')",
              "OR NOT has_table_privilege('nexora_app','public.units_of_measure','SELECT')",
              "OR has_table_privilege('nexora_app','public.units_of_measure','INSERT')",
              "OR has_table_privilege('nexora_app','public.units_of_measure','UPDATE')",
              "OR has_table_privilege('nexora_app','public.units_of_measure','DELETE')",
          ]
          for table in ['vehicle_types','body_types','cargo_types','package_types','document_types','tags']:
              privilege_lines.extend([
                  f"OR NOT has_table_privilege('nexora_app','public.{table}','SELECT')",
                  f"OR NOT has_table_privilege('nexora_app','public.{table}','INSERT')",
                  f"OR NOT has_table_privilege('nexora_app','public.{table}','UPDATE')",
                  f"OR has_table_privilege('nexora_app','public.{table}','DELETE')",
              ])
          privilege_replacement = ('\n               '.join(privilege_lines)) + ' THEN'
          if text.count(privilege_anchor) != 1:
              raise SystemExit(f'privilege matrix anchor: expected one match, found {text.count(privilege_anchor)}')
          text = text.replace(privilege_anchor, privilege_replacement, 1)

          path.write_text(text)
          PY

      - name: Verify patched contract markers
        run: |
          grep -q "Expected 44 application tables" .github/workflows/neon-pr-gate.yml
          grep -q "Expected RLS on 37 tenant-scoped tables" .github/workflows/neon-pr-gate.yml
          grep -q "Expected 16 Drizzle migration records" .github/workflows/neon-pr-gate.yml
          grep -q "public.vehicle_types" .github/workflows/neon-pr-gate.yml
          grep -q "public.countries" .github/workflows/neon-pr-gate.yml

      - name: Commit gate evolution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/neon-pr-gate.yml
          git commit -m "ci(database): validate wave 0015 catalogs"
          git push origin HEAD:feat/database-wave-0015-foundations
