name: Format Documents Web Once

on:
  push:
    branches:
      - feat/documents-wave-0018-web

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/documents-wave-0018-web
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: pnpm install --frozen-lockfile
      - name: Format Documents Web
        run: pnpm exec prettier --write apps/web/app/_actions/document-actions.ts apps/web/app/_components/document-forms.tsx apps/web/app/_lib/document-ui.ts apps/web/app/documentos
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/format-documents-web-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app .github/workflows/format-documents-web-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(web): format canonical document UI"
          git push origin HEAD:feat/documents-wave-0018-web
