name: NEX-48 Format Once

on:
  push:
    branches:
      - feat/nex-48-trip-proof-stop-integrity
    paths:
      - 'docs/data/nex-48-trip-proof-stop-integrity.md'
      - '.github/workflows/nex48-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/nex-48-trip-proof-stop-integrity

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format NEX-48 documentation and remove formatter
        run: |
          set -euo pipefail
          pnpm exec prettier --write docs/data/nex-48-trip-proof-stop-integrity.md
          rm .github/workflows/nex48-format-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/nex-48-trip-proof-stop-integrity.md .github/workflows/nex48-format-once.yml
          git diff --cached --quiet && exit 0
          git commit -m 'style: format NEX-48 documentation'
          git push origin HEAD:feat/nex-48-trip-proof-stop-integrity