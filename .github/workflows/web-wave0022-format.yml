name: Format Wave 0022 Web
on:
  push:
    branches:
      - feat/web-pages-wave-0022-trips-core
    paths:
      - '.github/workflows/web-wave0022-format.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-pages-wave-0022-trips-core
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/app/viagens/detalhe/page.tsx
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/app/viagens/detalhe/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'style(web): format trip detail page'
          git push --no-verify origin HEAD:feat/web-pages-wave-0022-trips-core
