name: Wave 0020 Generate Migration

on:
  push:
    branches:
      - feat/database-wave-0020-matching-persistence
    paths:
      - .github/workflows/wave-0020-generate-migration.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/database-wave-0020-matching-persistence
          fetch-depth: 0

      - name: Harden runtime privileges and migration ledger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          migration = Path('packages/database/migrations/0020_dapper_zuras.sql')
          text = migration.read_text()
          marker = 'GRANT SELECT, INSERT, UPDATE ON TABLE matching_rules, matching_preferences, matching_runs TO nexora_app;'
          if marker not in text:
              text = text.rstrip() + '''\nGRANT SELECT, INSERT, UPDATE ON TABLE matching_rules, matching_preferences, matching_runs TO nexora_app;\nGRANT SELECT, INSERT ON TABLE matching_candidates, matching_candidate_scores, matching_rule_results, matching_rejections TO nexora_app;\n'''
              migration.write_text(text)

          gate = Path('.github/workflows/neon-pr-gate.yml')
          gate_text = gate.read_text()
          old_if = 'IF migration_count <> 20 THEN'
          old_msg = "Expected 20 Drizzle migration records, found %"
          if gate_text.count(old_if) != 1 or gate_text.count(old_msg) != 1:
              raise SystemExit('Unexpected Neon gate migration baseline shape')
          gate_text = gate_text.replace(old_if, 'IF migration_count <> 21 THEN')
          gate_text = gate_text.replace(old_msg, 'Expected 21 Drizzle migration records, found %')
          gate.write_text(gate_text)
          PY

          grep -q "GRANT SELECT, INSERT, UPDATE ON TABLE matching_rules, matching_preferences, matching_runs TO nexora_app" packages/database/migrations/0020_dapper_zuras.sql
          grep -q "GRANT SELECT, INSERT ON TABLE matching_candidates, matching_candidate_scores, matching_rule_results, matching_rejections TO nexora_app" packages/database/migrations/0020_dapper_zuras.sql
          grep -q "IF migration_count <> 21 THEN" .github/workflows/neon-pr-gate.yml

      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nexora-wave-bot"
          git config user.email "actions@users.noreply.github.com"
          git add packages/database/migrations/0020_dapper_zuras.sql .github/workflows/neon-pr-gate.yml
          git diff --cached --quiet && exit 0
          git commit -m "ci(database): harden Wave 0020 matching runtime contract"
          git push origin HEAD:feat/database-wave-0020-matching-persistence
