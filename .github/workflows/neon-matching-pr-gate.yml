name: Neon Matching Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/database/**'
      - 'apps/api/src/matching/**'
      - '.github/workflows/neon-matching-pr-gate.yml'

permissions:
  contents: read

concurrency:
  group: neon-ephemeral-branch-capacity
  cancel-in-progress: false

env:
  NEON_PROJECT_ID: raspy-river-76339604
  DATABASE_NAME: nexora

jobs:
  matching-runtime:
    name: Matching persistence migration and isolation
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set isolated branch name and expiry
        shell: bash
        run: |
          set -euo pipefail
          echo "NEON_TEST_BRANCH=pr-${{ github.event.pull_request.number }}-matching-0020-${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "NEON_TEST_EXPIRES_AT=$(date -u --date '+2 hours' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create isolated Neon branch
        id: create-neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: production
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: nexora
          role: neondb_owner
          expires_at: ${{ env.NEON_TEST_EXPIRES_AT }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Temporarily assign ephemeral database ownership to migrator
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          BRANCH_ID: ${{ steps.create-neon.outputs.branch_id }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Content-Type: application/json" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${BRANCH_ID}/databases/${DATABASE_NAME}" \
            --data '{"database":{"owner_name":"nexora_migrator"}}' >/dev/null

      - name: Resolve migrator connection
        id: migrator
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: production
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: nexora
          role: nexora_migrator
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Bootstrap database ACL and owner invariants
        env:
          MIGRATOR_DATABASE_URL: ${{ steps.migrator.outputs.db_url }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$MIGRATOR_DATABASE_URL"
          psql "$MIGRATOR_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT current_user, session_user, current_database();
          GRANT CONNECT ON DATABASE nexora TO nexora_migrator, nexora_app, nexora_worker;
          SQL

          if [[ "$MIGRATOR_DATABASE_URL" == *"?"* ]]; then
            OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}&options=-c%20role%3Dnexora_owner"
          else
            OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}?options=-c%20role%3Dnexora_owner"
          fi
          echo "::add-mask::$OWNER_DATABASE_URL"
          roles="$(psql "$OWNER_DATABASE_URL" -Atqc "select session_user || ':' || current_user")"
          [[ "$roles" == "nexora_migrator:nexora_owner" ]] || { echo "Unexpected migration role chain: $roles" >&2; exit 1; }
          psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE, CREATE ON SCHEMA public TO nexora_owner;
          SQL
          echo "OWNER_DATABASE_URL=$OWNER_DATABASE_URL" >> "$GITHUB_ENV"

      - name: Apply full migration chain and owner invariants
        shell: bash
        env:
          OWNER_DATABASE_URL: ${{ env.OWNER_DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::$OWNER_DATABASE_URL"
          DATABASE_URL="$OWNER_DATABASE_URL" pnpm --filter @nexora/database db:migrate
          psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/ci/wave-0020-matching-owner.sql

      - name: Resolve runtime connection
        id: app
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: production
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: nexora
          role: nexora_app
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Validate Wave 0020 runtime invariants
        env:
          APP_DATABASE_URL: ${{ steps.app.outputs.db_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$APP_DATABASE_URL"
          psql "$APP_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/ci/wave-0020-matching-runtime.sql

      - name: Restore canonical database owner
        if: ${{ always() && steps.create-neon.outputs.branch_id != '' }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          BRANCH_ID: ${{ steps.create-neon.outputs.branch_id }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Content-Type: application/json" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${BRANCH_ID}/databases/${DATABASE_NAME}" \
            --data '{"database":{"owner_name":"nexora_owner"}}' >/dev/null

      - name: Cleanup isolated Neon branch
        if: ${{ always() && steps.create-neon.outputs.branch_id != '' }}
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: ${{ steps.create-neon.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
