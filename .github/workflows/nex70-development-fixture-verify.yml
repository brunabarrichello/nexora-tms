name: NEX-70 Development Identity Verify

on:
  push:
    branches:
      - feat/nex-70-web-auth0-pkce
    paths:
      - .github/workflows/nex70-development-fixture-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Qualify Development runtime identity read on neondb
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}"
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update >/dev/null
            sudo apt-get install -y postgresql-client >/dev/null
          fi

          RUNTIME_URL="$(npx --yes neonctl@v2 connection-string development --project-id raspy-river-76339604 --database-name neondb --role-name nexora_app)"
          echo "::add-mask::$RUNTIME_URL"

          result="$(psql "$RUNTIME_URL" -X -At -v ON_ERROR_STOP=1 -c "SELECT json_build_object('runtime_database','neondb','runtime_identity_rows',(SELECT count(*) FROM external_identities JOIN users ON users.id=external_identities.user_id WHERE external_identities.user_id='57000000-0000-4000-8000-000000000101' AND external_identities.provider='auth0' AND users.status='active'),'membership_active',EXISTS(SELECT 1 FROM memberships WHERE tenant_id='57000000-0000-4000-8000-000000000001' AND user_id='57000000-0000-4000-8000-000000000101' AND status='active'),'tenant_read_granted',EXISTS(SELECT 1 FROM membership_roles mr JOIN role_permissions rp ON rp.tenant_id=mr.tenant_id AND rp.role_id=mr.role_id JOIN permissions p ON p.id=rp.permission_id WHERE mr.tenant_id='57000000-0000-4000-8000-000000000001' AND mr.membership_id='57000000-0000-4000-8000-000000000121' AND p.key='tenant.read')); ")"
          echo "$result"
          [[ "$result" == *'"runtime_database" : "neondb"'* ]]
          [[ "$result" == *'"runtime_identity_rows" : 1'* ]]
          [[ "$result" == *'"membership_active" : true'* ]]
          [[ "$result" == *'"tenant_read_granted" : true'* ]]
