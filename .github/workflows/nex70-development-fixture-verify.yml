name: NEX-70 Development Identity Verify

on:
  push:
    branches:
      - feat/nex-70-web-auth0-pkce
    paths:
      - .github/workflows/nex70-development-fixture-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect Development Drizzle migration history
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}"

          MIGRATOR_URL="$(npx --yes neonctl@v2 connection-string development --project-id raspy-river-76339604 --database-name neondb --role-name nexora_migrator)"
          echo "::add-mask::$MIGRATOR_URL"

          history_relation="$(psql "$MIGRATOR_URL" -X -At -v ON_ERROR_STOP=1 -c "SELECT COALESCE(to_regclass('drizzle.__drizzle_migrations')::text, to_regclass('public.__drizzle_migrations')::text, '');")"
          public_tables="$(psql "$MIGRATOR_URL" -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_catalog.pg_tables WHERE schemaname='public';")"
          audit_table="$(psql "$MIGRATOR_URL" -X -At -v ON_ERROR_STOP=1 -c "SELECT to_regclass('public.pretenant_auth_events') IS NOT NULL;")"

          history_rows=0
          last_migration_created_at=0
          if [[ -n "$history_relation" ]]; then
            history_rows="$(psql "$MIGRATOR_URL" -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM $history_relation;")"
            last_migration_created_at="$(psql "$MIGRATOR_URL" -X -At -v ON_ERROR_STOP=1 -c "SELECT COALESCE(max(created_at),0) FROM $history_relation;")"
          fi

          printf '{"history_relation_present":%s,"history_rows":%s,"last_migration_created_at":%s,"public_tables":%s,"audit_table":%s}\n' \
            "$([[ -n "$history_relation" ]] && echo true || echo false)" \
            "$history_rows" \
            "$last_migration_created_at" \
            "$public_tables" \
            "$audit_table"
