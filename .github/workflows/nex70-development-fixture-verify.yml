name: NEX-70 Development Identity Verify

on:
  push:
    branches:
      - feat/nex-70-web-auth0-pkce
    paths:
      - .github/workflows/nex70-development-fixture-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Qualify Development auth audit runtime insert
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}"
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update >/dev/null
            sudo apt-get install -y postgresql-client >/dev/null
          fi

          RUNTIME_URL="$(npx --yes neonctl@v2 connection-string development --project-id raspy-river-76339604 --database-name neondb --role-name nexora_app)"
          echo "::add-mask::$RUNTIME_URL"

          audit_insert_privilege="$(psql "$RUNTIME_URL" -X -At -v ON_ERROR_STOP=1 -c "SELECT has_table_privilege(current_user, 'public.pretenant_auth_events', 'INSERT');")"

          audit_insert_rollback=false
          if psql "$RUNTIME_URL" -X -v ON_ERROR_STOP=1 >/dev/null <<'SQL'
          BEGIN;
          INSERT INTO pretenant_auth_events
            (id, event_type, outcome, provider_key, subject_fingerprint, user_id, request_id, correlation_id)
          VALUES
            ('57000000-0000-4000-8000-000000000199'::uuid,
             'auth.identity.accepted',
             'success',
             'auth0',
             repeat('0', 64),
             '57000000-0000-4000-8000-000000000101'::uuid,
             'nex70-audit-probe',
             'nex70-audit-probe');
          ROLLBACK;
          SQL
          then
            audit_insert_rollback=true
          fi

          printf '{"audit_insert_privilege":%s,"audit_insert_rollback":%s}\n' "$audit_insert_privilege" "$audit_insert_rollback"
          [[ "$audit_insert_privilege" == 't' ]]
          [[ "$audit_insert_rollback" == 'true' ]]
