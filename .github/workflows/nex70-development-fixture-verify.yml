name: NEX-70 Development Fixture Provision

on:
  push:
    branches:
      - feat/nex-70-web-auth0-pkce
    paths:
      - .github/workflows/nex70-development-fixture-verify.yml

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Provision sanitized Development tenant/user/RBAC skeleton
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}"
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update >/dev/null
            sudo apt-get install -y postgresql-client >/dev/null
          fi

          MIGRATOR_URL="$(npx --yes neonctl@v2 connection-string development \
            --project-id raspy-river-76339604 \
            --database-name neondb \
            --role-name nexora_migrator)"
          echo "::add-mask::$MIGRATOR_URL"
          if [[ "$MIGRATOR_URL" == *'?'* ]]; then
            OWNER_URL="${MIGRATOR_URL}&options=-c%20role%3Dnexora_owner"
          else
            OWNER_URL="${MIGRATOR_URL}?options=-c%20role%3Dnexora_owner"
          fi
          echo "::add-mask::$OWNER_URL"

          psql "$OWNER_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;

          INSERT INTO tenants (id, slug, name, status) VALUES
            ('57000000-0000-4000-8000-000000000001', 'nex70-auth-dev-a', 'NEX-70 Auth Development A', 'active'),
            ('57000000-0000-4000-8000-000000000002', 'nex70-auth-dev-b', 'NEX-70 Auth Development B', 'active')
          ON CONFLICT (id) DO UPDATE
          SET name = EXCLUDED.name, status = EXCLUDED.status, updated_at = now();

          INSERT INTO users (id, display_name, status) VALUES
            ('57000000-0000-4000-8000-000000000101', 'NEX-70 Auth Development User', 'active')
          ON CONFLICT (id) DO UPDATE
          SET display_name = EXCLUDED.display_name, status = EXCLUDED.status, updated_at = now();

          INSERT INTO memberships (id, tenant_id, user_id, status, joined_at) VALUES
            ('57000000-0000-4000-8000-000000000121', '57000000-0000-4000-8000-000000000001', '57000000-0000-4000-8000-000000000101', 'active', now())
          ON CONFLICT (tenant_id, user_id) DO UPDATE
          SET status = 'active', joined_at = COALESCE(memberships.joined_at, now()), updated_at = now();

          INSERT INTO permissions (key, description) VALUES
            ('tenant.read', 'Read tenant context')
          ON CONFLICT (key) DO NOTHING;

          INSERT INTO roles (id, tenant_id, code, name, description) VALUES
            ('57000000-0000-4000-8000-000000000131', '57000000-0000-4000-8000-000000000001', 'nex70_auth_reader', 'NEX-70 Auth Reader', 'Least-privilege NEX-70 Development validation role')
          ON CONFLICT (tenant_id, code) DO UPDATE
          SET name = EXCLUDED.name, description = EXCLUDED.description, updated_at = now();

          INSERT INTO role_permissions (tenant_id, role_id, permission_id)
          SELECT
            '57000000-0000-4000-8000-000000000001'::uuid,
            r.id,
            p.id
          FROM roles r
          JOIN permissions p ON p.key = 'tenant.read'
          WHERE r.tenant_id = '57000000-0000-4000-8000-000000000001'::uuid
            AND r.code = 'nex70_auth_reader'
          ON CONFLICT DO NOTHING;

          INSERT INTO membership_roles (tenant_id, membership_id, role_id)
          SELECT
            '57000000-0000-4000-8000-000000000001'::uuid,
            m.id,
            r.id
          FROM memberships m
          JOIN roles r ON r.tenant_id = m.tenant_id AND r.code = 'nex70_auth_reader'
          WHERE m.tenant_id = '57000000-0000-4000-8000-000000000001'::uuid
            AND m.user_id = '57000000-0000-4000-8000-000000000101'::uuid
          ON CONFLICT DO NOTHING;

          COMMIT;
          SQL

          result="$(psql "$OWNER_URL" -X -At -v ON_ERROR_STOP=1 -c "SELECT json_build_object('users',(SELECT count(*) FROM users WHERE id='57000000-0000-4000-8000-000000000101'),'tenants',(SELECT count(*) FROM tenants WHERE id IN ('57000000-0000-4000-8000-000000000001','57000000-0000-4000-8000-000000000002')),'identity_linked',EXISTS(SELECT 1 FROM external_identities WHERE user_id='57000000-0000-4000-8000-000000000101' AND provider='auth0'),'membership_active',EXISTS(SELECT 1 FROM memberships WHERE tenant_id='57000000-0000-4000-8000-000000000001' AND user_id='57000000-0000-4000-8000-000000000101' AND status='active'),'tenant_read_granted',EXISTS(SELECT 1 FROM membership_roles mr JOIN role_permissions rp ON rp.tenant_id=mr.tenant_id AND rp.role_id=mr.role_id JOIN permissions p ON p.id=rp.permission_id WHERE mr.tenant_id='57000000-0000-4000-8000-000000000001' AND mr.membership_id='57000000-0000-4000-8000-000000000121' AND p.key='tenant.read')); ")"
          echo "$result"
          [[ "$result" == *'"users" : 1'* ]]
          [[ "$result" == *'"tenants" : 2'* ]]
          [[ "$result" == *'"identity_linked" : false'* ]]
          [[ "$result" == *'"membership_active" : true'* ]]
          [[ "$result" == *'"tenant_read_granted" : true'* ]]
