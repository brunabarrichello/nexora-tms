name: NEX-70 Development Migrator Transport

on:
  push:
    branches:
      - feat/nex-70-web-auth0-pkce
    paths:
      - .github/workflows/nex70-development-fixture-verify.yml

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Encrypt Development migrator connection for one-shot provisioning
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}"
          MIGRATOR_URL="$(npx --yes neonctl@v2 connection-string development --project-id raspy-river-76339604 --database-name neondb --role-name nexora_migrator)"
          test -n "$MIGRATOR_URL"
          echo "::add-mask::$MIGRATOR_URL"
          cat > /tmp/nex70-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAm7DB+J+L1AViuhfQRiAE
          5yEVBFiDJzUm3MVtcgq5KV0RzyPrMav13EYOwR2FAHcgf65wg+F+Hs+kx25euyUH
          JhH9hGgS6iT55znR0/0W4vFnw/3hZr1gB1XpWG3ykwzxPffF0Aosn6pmOSQnldJy
          B1flaxPTRmUOiZ11SUP1cpPegG72VOpr8kC1nzxLNj9m/obseh5R2UpnAuXyo7gC
          +Q840IdCRvI8asmOqN3o6Uc/xo3Pf4Xm7fSyI6H15l+Lh6jFi+tuMfuCtjt7Zg6n
          ab/u7t/G0IpXr/gFeUJkuzjBkGQS7DOgf34JcTvrnBBap2BmewtRbRk86/Ot2Iw8
          1joIT1J+zUpfTIxb9WMpfe321EKSasu00xz/CKQ8VCvMHxfNDjSu1hlplb3Q1MYj
          WCRQTM2puB2eSz1Y7e85xl2DTJCcaXRjGr8h8QIz5BHSZyQXwmHxwTIkEyfdjSGK
          Iw1ePv/w3apTFwpi4ZNmxJJyLAVWfdLkEfQzYt/PZCi1hLcbmypqqa9wpXLOGgVQ
          2V49fMvups3iCMaVFzzbnKVqs7MAFchYfpcVnoYFtf9dzwsE+d2EfNChKFEqs+na
          LpCvRVoTv5t50jclNZbV4kk3WeIyxWZ9sgYqc5ubHRJx3ax20yOadYQ1AeqU1wqe
          LDl6xZv156kqkimWq1JYisUCAwEAAQ==
          -----END PUBLIC KEY-----
          PEM
          CIPHER="$(printf '%s' "$MIGRATOR_URL" | openssl pkeyutl -encrypt -pubin -inkey /tmp/nex70-public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 | base64 -w0)"
          test -n "$CIPHER"
          echo "NEX70_ENCRYPTED_MIGRATOR_URL=$CIPHER"
