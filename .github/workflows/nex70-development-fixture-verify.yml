name: NEX-70 Development Identity Verify

on:
  push:
    branches:
      - feat/nex-70-web-auth0-pkce
    paths:
      - .github/workflows/nex70-development-fixture-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply and qualify pending Development migration
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}"

          MIGRATOR_URL="$(npx --yes neonctl@v2 connection-string development --project-id raspy-river-76339604 --database-name neondb --role-name nexora_migrator)"
          RUNTIME_URL="$(npx --yes neonctl@v2 connection-string development --project-id raspy-river-76339604 --database-name neondb --role-name nexora_app)"
          echo "::add-mask::$MIGRATOR_URL"
          echo "::add-mask::$RUNTIME_URL"

          if [[ "$MIGRATOR_URL" == *"?"* ]]; then
            OWNER_DATABASE_URL="${MIGRATOR_URL}&options=-c%20role%3Dnexora_owner"
          else
            OWNER_DATABASE_URL="${MIGRATOR_URL}?options=-c%20role%3Dnexora_owner"
          fi
          echo "::add-mask::$OWNER_DATABASE_URL"

          roles="$(psql "$OWNER_DATABASE_URL" -X -At -v ON_ERROR_STOP=1 -c "SELECT session_user || ':' || current_user;")"
          [[ "$roles" == 'nexora_migrator:nexora_owner' ]]

          DATABASE_URL="$OWNER_DATABASE_URL" pnpm --filter @nexora/database db:migrate

          expected="$(jq '.entries | length' packages/database/migrations/meta/_journal.json)"
          actual="$(psql "$OWNER_DATABASE_URL" -X -At -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM drizzle.__drizzle_migrations;')"
          audit_table="$(psql "$RUNTIME_URL" -X -At -v ON_ERROR_STOP=1 -c "SELECT to_regclass('public.pretenant_auth_events') IS NOT NULL;")"
          audit_insert_privilege="$(psql "$RUNTIME_URL" -X -At -v ON_ERROR_STOP=1 -c "SELECT has_table_privilege(current_user, 'public.pretenant_auth_events', 'INSERT');")"
          identity_rows="$(psql "$RUNTIME_URL" -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM external_identities JOIN users ON users.id=external_identities.user_id WHERE external_identities.user_id='57000000-0000-4000-8000-000000000101' AND external_identities.provider='auth0' AND users.status='active';")"

          audit_insert_rollback=false
          if psql "$RUNTIME_URL" -X -v ON_ERROR_STOP=1 >/dev/null <<'SQL'
          BEGIN;
          INSERT INTO pretenant_auth_events
            (id, event_type, outcome, provider_key, subject_fingerprint, user_id, request_id, correlation_id)
          VALUES
            ('57000000-0000-4000-8000-000000000199'::uuid,
             'auth.identity.accepted',
             'success',
             'auth0',
             repeat('0', 64),
             '57000000-0000-4000-8000-000000000101'::uuid,
             'nex70-audit-probe',
             'nex70-audit-probe');
          ROLLBACK;
          SQL
          then
            audit_insert_rollback=true
          fi

          printf '{"migration_rows":%s,"expected_migrations":%s,"audit_table":%s,"audit_insert_privilege":%s,"audit_insert_rollback":%s,"identity_rows":%s}\n' \
            "$actual" "$expected" "$audit_table" "$audit_insert_privilege" "$audit_insert_rollback" "$identity_rows"

          [[ "$actual" == "$expected" ]]
          [[ "$expected" == '26' ]]
          [[ "$audit_table" == 't' ]]
          [[ "$audit_insert_privilege" == 't' ]]
          [[ "$audit_insert_rollback" == 'true' ]]
          [[ "$identity_rows" == '1' ]]
