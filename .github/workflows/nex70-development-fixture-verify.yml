name: NEX-70 Development Identity Verify

on:
  push:
    branches:
      - feat/nex-70-web-auth0-pkce
    paths:
      - .github/workflows/nex70-development-fixture-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify Development negative bearer gates and audit sink
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}"

          API_BASE_URL='https://nexora-tms-api-development.up.railway.app'
          OWNER_URL="$(npx --yes neonctl@v2 connection-string development --project-id raspy-river-76339604 --database-name neondb --role-name neondb_owner)"
          echo "::add-mask::$OWNER_URL"

          before="$(psql "$OWNER_URL" -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pretenant_auth_events WHERE event_type IN ('auth.bearer.missing','auth.bearer.rejected');")"

          missing_status="$(curl --silent --show-error -o /tmp/missing.json -w '%{http_code}' "$API_BASE_URL/api/v1/auth/me")"
          invalid_status="$(curl --silent --show-error -o /tmp/invalid.json -w '%{http_code}' "$API_BASE_URL/api/v1/auth/me" -H 'Authorization: Bearer not-a-valid-jwt')"

          [[ "$missing_status" == '401' ]]
          [[ "$invalid_status" == '401' ]]

          sleep 2
          after="$(psql "$OWNER_URL" -X -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pretenant_auth_events WHERE event_type IN ('auth.bearer.missing','auth.bearer.rejected');")"
          delta=$((after - before))

          printf '{"missing_bearer_status":%s,"invalid_bearer_status":%s,"audit_event_delta":%s}\n' "$missing_status" "$invalid_status" "$delta"
          (( delta >= 2 ))
