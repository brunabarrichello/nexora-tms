name: Format Wave 0017 UI

on:
  push:
    branches:
      - feat/master-data-capacity-ui-integration

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'format Wave 0017 UI')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/master-data-capacity-ui-integration
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: pnpm install --frozen-lockfile
      - name: Format Wave 0017 UI
        run: >-
          pnpm exec prettier --write
          apps/web/app/_actions/qualification-actions.ts
          apps/web/app/_components/qualification-editor-page.tsx
          apps/web/app/_components/qualification-form.tsx
          apps/web/app/_components/qualification-resource-page.tsx
          apps/web/app/_lib/qualification-config.ts
          apps/web/app/cadastros/motoristas/avaliacoes/page.tsx
          apps/web/app/cadastros/motoristas/bloqueios/page.tsx
          apps/web/app/cadastros/motoristas/contatos-emergencia/page.tsx
          apps/web/app/cadastros/motoristas/cursos/page.tsx
          apps/web/app/cadastros/motoristas/disponibilidade/page.tsx
          apps/web/app/cadastros/motoristas/documentos/page.tsx
          apps/web/app/cadastros/motoristas/indisponibilidades/page.tsx
          apps/web/app/cadastros/motoristas/qualificacoes/page.tsx
          apps/web/app/cadastros/veiculos/bloqueios/page.tsx
          apps/web/app/cadastros/veiculos/capabilities/page.tsx
          apps/web/app/cadastros/veiculos/disponibilidade/page.tsx
          apps/web/app/cadastros/veiculos/documentos/page.tsx
          apps/web/app/cadastros/veiculos/indisponibilidades/page.tsx
          apps/web/app/cadastros/veiculos/inspecoes/page.tsx
          apps/web/app/cadastros/veiculos/localizacoes/page.tsx
          apps/web/app/cadastros/veiculos/manutencoes/itens/page.tsx
          apps/web/app/cadastros/veiculos/manutencoes/page.tsx
          apps/web/app/cadastros/veiculos/planos-manutencao/page.tsx
          apps/web/app/cadastros/veiculos/seguros/page.tsx
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/app
          git commit -m 'chore(web): format Wave 0017 UI'
          git push --no-verify origin HEAD:feat/master-data-capacity-ui-integration
