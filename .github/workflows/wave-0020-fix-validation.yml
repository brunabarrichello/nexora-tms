name: Wave 0020 Fix Validation

on:
  push:
    branches:
      - feat/database-wave-0020-matching-persistence
    paths:
      - .github/workflows/wave-0020-fix-validation.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/database-wave-0020-matching-persistence
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fix Wave 0019 forward-compatible baseline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/database/ci/wave-0019-freight-normalization-owner.sql')
          text = path.read_text()
          old = """  SELECT count(*) INTO c FROM drizzle.__drizzle_migrations;\n  IF c <> 20 THEN\n    RAISE EXCEPTION 'Expected 20 Drizzle migrations after Wave 0019, found %', c;\n  END IF;"""
          new = """  SELECT count(*) INTO c FROM drizzle.__drizzle_migrations;\n  IF c < 20 THEN\n    RAISE EXCEPTION 'Expected at least 20 Drizzle migrations including Wave 0019, found %', c;\n  END IF;"""
          if text.count(old) != 1:
              raise SystemExit('Unexpected Wave 0019 migration-count assertion')
          path.write_text(text.replace(old, new))
          PY

      - name: Format Wave 0020 files
        run: >-
          pnpm exec prettier --write
          apps/api/src/matching/capacity-matching.controller.ts
          apps/api/src/matching/matching-persistence.service.ts
          docs/adr/0017-persistent-explainable-matching.md
          docs/data/wave-0020-matching-persistence.md

      - name: Verify fixes
        shell: bash
        run: |
          set -euo pipefail
          grep -q "IF c < 20 THEN" packages/database/ci/wave-0019-freight-normalization-owner.sql
          grep -q "Expected at least 20 Drizzle migrations including Wave 0019" packages/database/ci/wave-0019-freight-normalization-owner.sql
          pnpm exec prettier --check \
            apps/api/src/matching/capacity-matching.controller.ts \
            apps/api/src/matching/matching-persistence.service.ts \
            docs/adr/0017-persistent-explainable-matching.md \
            docs/data/wave-0020-matching-persistence.md

      - name: Commit validation fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nexora-wave-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/api/src/matching/capacity-matching.controller.ts \
            apps/api/src/matching/matching-persistence.service.ts \
            docs/adr/0017-persistent-explainable-matching.md \
            docs/data/wave-0020-matching-persistence.md \
            packages/database/ci/wave-0019-freight-normalization-owner.sql
          git diff --cached --quiet && exit 0
          git commit -m "fix(matching): satisfy Wave 0020 validation gates"
          git push origin HEAD:feat/database-wave-0020-matching-persistence
