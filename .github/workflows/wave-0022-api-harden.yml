name: Wave 0022 Consolidated Harden

on:
  push:
    branches:
      - feat/database-wave-0022-trips-core
    paths:
      - '.github/workflows/wave-0022-api-harden.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/database-wave-0022-trips-core
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: pnpm install --frozen-lockfile

      - name: Harden Trips API and schema
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import glob, json

          service = Path('apps/api/src/trips/trips.service.ts')
          s = service.read_text()
          if "../freight/transport-request.validation.js" not in s:
              s = s.replace(
                  "import { ConflictException, Injectable, NotFoundException } from '@nestjs/common';\n\n",
                  "import { ConflictException, Injectable, NotFoundException } from '@nestjs/common';\n\nimport { requireUuid } from '../freight/transport-request.validation.js';\n",
                  1,
              )

          old = """  async addRequest(tripId: string, transportRequestId: string, input: unknown): Promise<void> {\n    const link = parseTripRequestLink(input);\n    const context = this.tenantContext.require();\n"""
          new = """  async addRequest(tripId: string, transportRequestId: string, input: unknown): Promise<void> {\n    const requestId = requireUuid(transportRequestId, 'transportRequestId');\n    const link = parseTripRequestLink(input);\n    const context = this.tenantContext.require();\n"""
          if old in s:
              s = s.replace(old, new, 1)
          s = s.replace("contract.transport_request_id !== transportRequestId", "contract.transport_request_id !== requestId", 1)

          old = """  async removeRequest(tripId: string, transportRequestId: string, input: unknown): Promise<void> {\n    const reason = parseTripReason(input);\n    const context = this.tenantContext.require();\n"""
          new = """  async removeRequest(tripId: string, transportRequestId: string, input: unknown): Promise<void> {\n    const requestId = requireUuid(transportRequestId, 'transportRequestId');\n    const reason = parseTripReason(input);\n    const context = this.tenantContext.require();\n"""
          if old in s:
              s = s.replace(old, new, 1)
          s = s.replace("[context.userId, reason, trip.id, transportRequestId]", "[context.userId, reason, trip.id, requestId]", 1)

          marker = """      const current = await this.requireTrip(client, tripId, true);\n      this.requireTransition(current.status, transition.status);\n\n      await client.query(\n"""
          replacement = """      const current = await this.requireTrip(client, tripId, true);\n      this.requireTransition(current.status, transition.status);\n      if (transition.status === 'ready') {\n        await this.requireReadyPrerequisites(client, current.id);\n      }\n\n      await client.query(\n"""
          if marker in s:
              s = s.replace(marker, replacement, 1)

          marker = """  private async requireTrip(\n    client: TenantQueryClient,\n    tripId: string,\n    forUpdate: boolean,\n  ): Promise<TripRow> {\n    const result = await client.query<TripRow>(\n"""
          replacement = """  private async requireTrip(\n    client: TenantQueryClient,\n    tripId: string,\n    forUpdate: boolean,\n  ): Promise<TripRow> {\n    const id = requireUuid(tripId, 'tripId');\n    const result = await client.query<TripRow>(\n"""
          if marker in s:
              s = s.replace(marker, replacement, 1)
              start = s.index("  private async requireTrip(")
              end = s.index("  private async requireMutableTrip", start)
              chunk = s[start:end].replace("      [tripId],", "      [id],", 1)
              s = s[:start] + chunk + s[end:]

          if 'private async requireReadyPrerequisites' not in s:
              marker = "  private async loadActiveTripCapacity(\n"
              method = """  private async requireReadyPrerequisites(\n    client: TenantQueryClient,\n    tripId: string,\n  ): Promise<void> {\n    const result = await client.query<{\n      request_count: number;\n      stop_count: number;\n      primary_driver_count: number;\n      vehicle_count: number;\n    }>(\n      `SELECT\n         (SELECT count(*)::int FROM trip_transport_requests WHERE trip_id=$1::uuid AND removed_at IS NULL) AS request_count,\n         (SELECT count(*)::int FROM trip_stops WHERE trip_id=$1::uuid AND status <> 'cancelled') AS stop_count,\n         (SELECT count(*)::int FROM trip_drivers WHERE trip_id=$1::uuid AND role='primary' AND ends_at IS NULL) AS primary_driver_count,\n         (SELECT count(*)::int FROM trip_assets WHERE trip_id=$1::uuid AND role='vehicle' AND ends_at IS NULL) AS vehicle_count`,\n      [tripId],\n    );\n    const readiness = result.rows[0];\n    if (!readiness || readiness.request_count < 1) {\n      throw new ConflictException('Trip requires at least one active contracted transport request');\n    }\n    if (readiness.stop_count < 2) {\n      throw new ConflictException('Trip requires at least two active planned stops');\n    }\n    if (readiness.primary_driver_count !== 1) {\n      throw new ConflictException('Trip requires exactly one active primary driver');\n    }\n    if (readiness.vehicle_count < 1) {\n      throw new ConflictException('Trip requires at least one active vehicle');\n    }\n  }\n\n"""
              if marker not in s:
                  raise SystemExit('loadActiveTripCapacity marker missing')
              s = s.replace(marker, method + marker, 1)
          service.write_text(s)

          schema = Path('packages/database/src/schema/trips.ts')
          t = schema.read_text()
          if 'trip_transport_requests_active_request_unique' not in t:
              marker = """    uniqueIndex('trip_transport_requests_active_sequence_unique')\n      .on(table.tenantId, table.tripId, table.sequence)\n      .where(sql`${table.removedAt} IS NULL`),\n"""
              addition = marker + """    uniqueIndex('trip_transport_requests_active_request_unique')\n      .on(table.tenantId, table.transportRequestId)\n      .where(sql`${table.removedAt} IS NULL`),\n"""
              if marker not in t:
                  raise SystemExit('trip request active sequence index marker missing')
              t = t.replace(marker, addition, 1)
              schema.write_text(t)

          for filename in glob.glob('packages/database/migrations/0022_*.sql'):
              Path(filename).unlink()
          snapshot = Path('packages/database/migrations/meta/0022_snapshot.json')
          if snapshot.exists():
              snapshot.unlink()
          journal = Path('packages/database/migrations/meta/_journal.json')
          data = json.loads(journal.read_text())
          entries = data.get('entries', [])
          if entries and entries[-1].get('idx') == 22:
              entries.pop()
          data['entries'] = entries
          journal.write_text(json.dumps(data, indent=2) + '\n')
          PY

          pnpm exec prettier --write apps/api/src/trips packages/database/src/schema/trips.ts packages/database/migrations/meta/_journal.json
          pnpm --filter @nexora/database typecheck
          pnpm --filter @nexora/database db:generate

          migration="$(find packages/database/migrations -maxdepth 1 -type f -name '0022_*.sql' | head -n1)"
          test -n "$migration"
          cat >> "$migration" <<'SQL'
          GRANT SELECT, INSERT, UPDATE ON trips TO nexora_app;
          GRANT SELECT, INSERT, UPDATE ON trip_transport_requests TO nexora_app;
          GRANT SELECT, INSERT, UPDATE ON trip_stops TO nexora_app;
          GRANT SELECT, INSERT, UPDATE ON trip_drivers TO nexora_app;
          GRANT SELECT, INSERT, UPDATE ON trip_assets TO nexora_app;
          GRANT SELECT, INSERT ON trip_status_history TO nexora_app;
          SQL
          grep -q 'trip_transport_requests_active_request_unique' "$migration"
          if grep -Eiq '(^|[[:space:]])(DROP[[:space:]]|TRUNCATE[[:space:]]|ALTER[[:space:]].*RENAME)' "$migration"; then
            echo 'Destructive DDL detected in Wave 0022 migration' >&2
            exit 1
          fi

          pnpm --filter @nexora/database db:check
          pnpm validate

      - name: Commit consolidated Wave 0022 changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/trips apps/api/package.json apps/api/src/app.module.ts packages/database/src/schema packages/database/migrations
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No consolidated changes to commit'
            exit 0
          fi
          git commit -m 'fix(trips): consolidate Wave 0022 core invariants'
          git restore apps/web/tsconfig.json 2>/dev/null || true
          rm -f apps/web/next-env.d.ts
          git status --short
          git push --no-verify origin HEAD:feat/database-wave-0022-trips-core
