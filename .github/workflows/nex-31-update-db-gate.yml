name: NEX-31 Update Database Gate

on:
  push:
    branches:
      - feature/NEX-31-cargo-requirements

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/NEX-31-cargo-requirements

      - name: Extend permanent Neon gate
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/neon-pr-gate.yml')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f'Anchor not found: {old[:80]!r}')
              text = text.replace(old, new, 1)

          table_anchor = "                 'business_party_addresses','business_party_contacts','transport_requests',\n                 'transport_request_stops'\n"
          table_new = "                 'business_party_addresses','business_party_contacts','transport_requests',\n                 'transport_request_stops','transport_request_cargo_profiles'\n"
          replace_once(table_anchor, table_new)
          replace_once(
              "            IF table_count <> 20 THEN\n              RAISE EXCEPTION 'Expected 20 application tables, found %', table_count;\n",
              "            IF table_count <> 21 THEN\n              RAISE EXCEPTION 'Expected 21 application tables, found %', table_count;\n",
          )
          replace_once(table_anchor, table_new)
          replace_once(
              "            IF rls_count <> 17 THEN\n              RAISE EXCEPTION 'Expected RLS on 17 tenant-scoped tables, found %', rls_count;\n",
              "            IF rls_count <> 18 THEN\n              RAISE EXCEPTION 'Expected RLS on 18 tenant-scoped tables, found %', rls_count;\n",
          )
          replace_once(
              "            IF migration_count <> 7 THEN\n              RAISE EXCEPTION 'Expected 7 Drizzle migration records, found %', migration_count;\n",
              "            IF migration_count <> 8 THEN\n              RAISE EXCEPTION 'Expected 8 Drizzle migration records, found %', migration_count;\n",
          )
          replace_once(
              "                   'business_party_addresses','business_party_contacts','transport_requests',\n                   'transport_request_stops'\n",
              "                   'business_party_addresses','business_party_contacts','transport_requests',\n                   'transport_request_stops','transport_request_cargo_profiles'\n",
          )
          replace_once(
              "               OR NOT has_table_privilege('nexora_app','public.transport_request_stops','DELETE') THEN\n",
              "               OR NOT has_table_privilege('nexora_app','public.transport_request_stops','DELETE')\n               OR NOT has_table_privilege('nexora_app','public.transport_request_cargo_profiles','SELECT')\n               OR NOT has_table_privilege('nexora_app','public.transport_request_cargo_profiles','INSERT')\n               OR NOT has_table_privilege('nexora_app','public.transport_request_cargo_profiles','UPDATE')\n               OR has_table_privilege('nexora_app','public.transport_request_cargo_profiles','DELETE') THEN\n",
          )
          replace_once(
              "            SELECT count(*) INTO visible_count FROM transport_request_stops;\n            IF visible_count <> 0 THEN RAISE EXCEPTION 'No-context route stops must be 0, got %', visible_count; END IF;\n",
              "            SELECT count(*) INTO visible_count FROM transport_request_stops;\n            IF visible_count <> 0 THEN RAISE EXCEPTION 'No-context route stops must be 0, got %', visible_count; END IF;\n            SELECT count(*) INTO visible_count FROM transport_request_cargo_profiles;\n            IF visible_count <> 0 THEN RAISE EXCEPTION 'No-context cargo profiles must be 0, got %', visible_count; END IF;\n",
          )
          replace_once(
              "            SELECT count(*) INTO visible_count FROM transport_request_stops;\n            IF visible_count <> 0 THEN RAISE EXCEPTION 'User-only context must not expose route stops, got %', visible_count; END IF;\n",
              "            SELECT count(*) INTO visible_count FROM transport_request_stops;\n            IF visible_count <> 0 THEN RAISE EXCEPTION 'User-only context must not expose route stops, got %', visible_count; END IF;\n            SELECT count(*) INTO visible_count FROM transport_request_cargo_profiles;\n            IF visible_count <> 0 THEN RAISE EXCEPTION 'User-only context must not expose cargo profiles, got %', visible_count; END IF;\n",
          )
          replace_once(
              "          END $$;\n          SQL\n\n          set +e\n          cross_tenant_output=\"$(psql \"$APP_DATABASE_URL\" -v ON_ERROR_STOP=1 2>&1 <<'SQL'\n",
              "          END $$;\n\n          INSERT INTO transport_request_cargo_profiles (\n            tenant_id, transport_request_id, material, cargo_type, total_weight_kg,\n            volume_count, pallet_count, cubage_m3, max_length_m, max_width_m, max_height_m,\n            tracking_required, vehicle_type, body_type, non_stackable, special_cargo, special_instructions\n          ) VALUES (\n            '00000000-0000-4000-8000-000000000001','00000000-0000-4000-8000-000000000801',\n            'Eletrônicos gerais','general',5000,20,4,18.5,2.4,1.2,1.8,true,'carreta','sider',true,false,NULL\n          );\n\n          UPDATE transport_request_cargo_profiles\n             SET total_weight_kg=5250, pallet_count=5, updated_at=now()\n           WHERE transport_request_id='00000000-0000-4000-8000-000000000801';\n\n          DO $$ DECLARE c integer; weight numeric; pallets integer; BEGIN\n            SELECT count(*), max(total_weight_kg), max(pallet_count) INTO c, weight, pallets\n              FROM transport_request_cargo_profiles\n             WHERE transport_request_id='00000000-0000-4000-8000-000000000801';\n            IF c <> 1 THEN RAISE EXCEPTION 'Cargo profile must contain one row, got %', c; END IF;\n            IF weight <> 5250 OR pallets <> 5 THEN RAISE EXCEPTION 'Runtime cargo profile update failed'; END IF;\n          END $$;\n          SQL\n\n          set +e\n          cargo_cross_tenant_output=\"$(psql \"$APP_DATABASE_URL\" -v ON_ERROR_STOP=1 2>&1 <<'SQL'\n          SELECT set_config('app.user_id','00000000-0000-4000-8000-000000000101',false);\n          SELECT set_config('app.tenant_id','00000000-0000-4000-8000-000000000001',false);\n          INSERT INTO transport_request_cargo_profiles (tenant_id, transport_request_id, material, cargo_type, total_weight_kg, volume_count, vehicle_type, body_type)\n          VALUES ('00000000-0000-4000-8000-000000000002','00000000-0000-4000-8000-000000000801','Cross tenant cargo','general',1000,1,'toco','bau');\n          SQL\n          )\"\n          cargo_cross_tenant_status=$?\n          set -e\n          if [[ \"$cargo_cross_tenant_status\" -eq 0 ]] || ! grep -qi \"row-level security policy\" <<<\"$cargo_cross_tenant_output\"; then\n            echo \"Cross-tenant cargo-profile RLS rejection did not behave as expected.\" >&2\n            echo \"$cargo_cross_tenant_output\" >&2\n            exit 1\n          fi\n\n          set +e\n          cross_tenant_output=\"$(psql \"$APP_DATABASE_URL\" -v ON_ERROR_STOP=1 2>&1 <<'SQL'\n",
          )
          replace_once(
              "          set +e\n          request_fk_output=\"$(psql \"$OWNER_DATABASE_URL\" -v ON_ERROR_STOP=1 2>&1 <<'SQL'\n",
              "          set +e\n          cargo_request_fk_output=\"$(psql \"$OWNER_DATABASE_URL\" -v ON_ERROR_STOP=1 2>&1 <<'SQL'\n          INSERT INTO transport_request_cargo_profiles (tenant_id, transport_request_id, material, cargo_type, total_weight_kg, volume_count, vehicle_type, body_type)\n          VALUES ('00000000-0000-4000-8000-000000000002','00000000-0000-4000-8000-000000000801','Invalid cross tenant cargo','general',1000,1,'toco','bau');\n          SQL\n          )\"\n          cargo_request_fk_status=$?\n          set -e\n          if [[ \"$cargo_request_fk_status\" -eq 0 ]] || ! grep -qi \"transport_request_cargo_profiles_request_fk\" <<<\"$cargo_request_fk_output\"; then\n            echo \"Cross-tenant cargo request FK rejection did not behave as expected.\" >&2\n            echo \"$cargo_request_fk_output\" >&2\n            exit 1\n          fi\n\n          set +e\n          request_fk_output=\"$(psql \"$OWNER_DATABASE_URL\" -v ON_ERROR_STOP=1 2>&1 <<'SQL'\n",
          )
          replace_once(
              '      - name: Gate summary\n        run: echo "Neon database gate passed through NEX-30 route stops."\n',
              '      - name: Gate summary\n        run: echo "Neon database gate passed through NEX-31 cargo profiles."\n',
          )

          path.write_text(text)
          PY

      - name: Publish rendered gate as Git blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(base64 -w0 .github/workflows/neon-pr-gate.yml)"
          body="$(python - "$payload" <<'PY'
          import json, sys
          print(json.dumps({'content': sys.argv[1], 'encoding': 'base64'}))
          PY
          )"
          response="$(curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/git/blobs \
            -d "$body")"
          sha="$(python - "$response" <<'PY'
          import json, sys
          print(json.loads(sys.argv[1])['sha'])
          PY
          )"
          echo "RENDERED_GATE_BLOB_SHA=$sha"
