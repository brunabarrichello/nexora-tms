name: NEX-32 Render Database Gate

on:
  push:
    branches:
      - feature/NEX-32-commercial-terms

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/NEX-32-commercial-terms

      - name: Extend permanent Neon gate
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/neon-pr-gate.yml')
          text = path.read_text()

          def once(old: str, new: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f'Anchor not found: {old[:100]!r}')
              text = text.replace(old, new, 1)

          tables = "                 'transport_request_stops','transport_request_cargo_profiles'\n"
          tables_new = "                 'transport_request_stops','transport_request_cargo_profiles',\n                 'transport_request_commercial_terms','transport_request_commercial_history'\n"
          once(tables, tables_new)
          once("            IF table_count <> 21 THEN\n              RAISE EXCEPTION 'Expected 21 application tables, found %', table_count;\n",
               "            IF table_count <> 23 THEN\n              RAISE EXCEPTION 'Expected 23 application tables, found %', table_count;\n")
          once(tables, tables_new)
          once("            IF rls_count <> 18 THEN\n              RAISE EXCEPTION 'Expected RLS on 18 tenant-scoped tables, found %', rls_count;\n",
               "            IF rls_count <> 20 THEN\n              RAISE EXCEPTION 'Expected RLS on 20 tenant-scoped tables, found %', rls_count;\n")
          once("            IF migration_count <> 8 THEN\n              RAISE EXCEPTION 'Expected 8 Drizzle migration records, found %', migration_count;\n",
               "            IF migration_count <> 9 THEN\n              RAISE EXCEPTION 'Expected 9 Drizzle migration records, found %', migration_count;\n")
          once("            stop_enum_count integer;\n", "            stop_enum_count integer;\n            commercial_enum_count integer;\n")
          once("            IF stop_enum_count <> 3 THEN\n              RAISE EXCEPTION 'Expected three transport stop type values, found %', stop_enum_count;\n            END IF;\n",
               "            IF stop_enum_count <> 3 THEN\n              RAISE EXCEPTION 'Expected three transport stop type values, found %', stop_enum_count;\n            END IF;\n\n            SELECT count(*) INTO commercial_enum_count\n              FROM pg_type t JOIN pg_enum e ON e.enumtypid=t.oid\n             WHERE t.typname='commercial_terms_status'\n               AND e.enumlabel IN ('draft','pending_approval','approved','rejected');\n            IF commercial_enum_count <> 4 THEN\n              RAISE EXCEPTION 'Expected four commercial terms status values, found %', commercial_enum_count;\n            END IF;\n")
          once("                   'transport_request_stops','transport_request_cargo_profiles'\n",
               "                   'transport_request_stops','transport_request_cargo_profiles',\n                   'transport_request_commercial_terms','transport_request_commercial_history'\n")
          once("               OR has_table_privilege('nexora_app','public.transport_request_cargo_profiles','DELETE') THEN\n",
               "               OR has_table_privilege('nexora_app','public.transport_request_cargo_profiles','DELETE')\n               OR NOT has_table_privilege('nexora_app','public.transport_request_commercial_terms','SELECT')\n               OR NOT has_table_privilege('nexora_app','public.transport_request_commercial_terms','INSERT')\n               OR NOT has_table_privilege('nexora_app','public.transport_request_commercial_terms','UPDATE')\n               OR has_table_privilege('nexora_app','public.transport_request_commercial_terms','DELETE')\n               OR NOT has_table_privilege('nexora_app','public.transport_request_commercial_history','SELECT')\n               OR NOT has_table_privilege('nexora_app','public.transport_request_commercial_history','INSERT')\n               OR has_table_privilege('nexora_app','public.transport_request_commercial_history','UPDATE')\n               OR has_table_privilege('nexora_app','public.transport_request_commercial_history','DELETE') THEN\n")
          once("            SELECT count(*) INTO visible_count FROM transport_request_cargo_profiles;\n            IF visible_count <> 0 THEN RAISE EXCEPTION 'No-context cargo profiles must be 0, got %', visible_count; END IF;\n",
               "            SELECT count(*) INTO visible_count FROM transport_request_cargo_profiles;\n            IF visible_count <> 0 THEN RAISE EXCEPTION 'No-context cargo profiles must be 0, got %', visible_count; END IF;\n            SELECT count(*) INTO visible_count FROM transport_request_commercial_terms;\n            IF visible_count <> 0 THEN RAISE EXCEPTION 'No-context commercial terms must be 0, got %', visible_count; END IF;\n            SELECT count(*) INTO visible_count FROM transport_request_commercial_history;\n            IF visible_count <> 0 THEN RAISE EXCEPTION 'No-context commercial history must be 0, got %', visible_count; END IF;\n")
          once("            SELECT count(*) INTO visible_count FROM transport_request_cargo_profiles;\n            IF visible_count <> 0 THEN RAISE EXCEPTION 'User-only context must not expose cargo profiles, got %', visible_count; END IF;\n",
               "            SELECT count(*) INTO visible_count FROM transport_request_cargo_profiles;\n            IF visible_count <> 0 THEN RAISE EXCEPTION 'User-only context must not expose cargo profiles, got %', visible_count; END IF;\n            SELECT count(*) INTO visible_count FROM transport_request_commercial_terms;\n            IF visible_count <> 0 THEN RAISE EXCEPTION 'User-only context must not expose commercial terms, got %', visible_count; END IF;\n            SELECT count(*) INTO visible_count FROM transport_request_commercial_history;\n            IF visible_count <> 0 THEN RAISE EXCEPTION 'User-only context must not expose commercial history, got %', visible_count; END IF;\n")

          anchor = "          DO $$ DECLARE c integer; weight numeric; pallets integer; BEGIN\n            SELECT count(*), max(total_weight_kg), max(pallet_count) INTO c, weight, pallets\n              FROM transport_request_cargo_profiles\n             WHERE transport_request_id='00000000-0000-4000-8000-000000000801';\n            IF c <> 1 THEN RAISE EXCEPTION 'Cargo profile must contain one row, got %', c; END IF;\n            IF weight <> 5250 OR pallets <> 5 THEN RAISE EXCEPTION 'Runtime cargo profile update failed'; END IF;\n          END $$;\n          SQL\n"
          commercial = "          DO $$ DECLARE c integer; weight numeric; pallets integer; BEGIN\n            SELECT count(*), max(total_weight_kg), max(pallet_count) INTO c, weight, pallets\n              FROM transport_request_cargo_profiles\n             WHERE transport_request_id='00000000-0000-4000-8000-000000000801';\n            IF c <> 1 THEN RAISE EXCEPTION 'Cargo profile must contain one row, got %', c; END IF;\n            IF weight <> 5250 OR pallets <> 5 THEN RAISE EXCEPTION 'Runtime cargo profile update failed'; END IF;\n          END $$;\n\n          INSERT INTO transport_request_commercial_terms (\n            tenant_id,transport_request_id,currency_code,customer_price,target_carrier_freight,toll_amount,additional_amount,\n            payment_terms,commercial_notes,created_by_user_id,updated_by_user_id\n          ) VALUES (\n            '00000000-0000-4000-8000-000000000001','00000000-0000-4000-8000-000000000801','BRL',18500,16000,313.80,250,\n            '70% coleta / 30% entrega via Pix','Gate commercial terms','00000000-0000-4000-8000-000000000101','00000000-0000-4000-8000-000000000101'\n          );\n\n          INSERT INTO transport_request_commercial_history (\n            tenant_id,transport_request_id,commercial_terms_id,version,event_type,status,actor_user_id,snapshot\n          ) SELECT tenant_id,transport_request_id,id,1,'created','draft','00000000-0000-4000-8000-000000000101','{\"status\":\"draft\"}'::jsonb\n              FROM transport_request_commercial_terms\n             WHERE transport_request_id='00000000-0000-4000-8000-000000000801';\n\n          UPDATE transport_request_commercial_terms\n             SET status='pending_approval', version=2, updated_by_user_id='00000000-0000-4000-8000-000000000101', updated_at=now()\n           WHERE transport_request_id='00000000-0000-4000-8000-000000000801';\n          INSERT INTO transport_request_commercial_history (\n            tenant_id,transport_request_id,commercial_terms_id,version,event_type,status,actor_user_id,snapshot\n          ) SELECT tenant_id,transport_request_id,id,2,'submitted','pending_approval','00000000-0000-4000-8000-000000000101','{\"status\":\"pending_approval\"}'::jsonb\n              FROM transport_request_commercial_terms\n             WHERE transport_request_id='00000000-0000-4000-8000-000000000801';\n\n          UPDATE transport_request_commercial_terms\n             SET status='approved', approval_note='Gate approved', approved_by_user_id='00000000-0000-4000-8000-000000000101',\n                 approved_at=now(), version=3, updated_by_user_id='00000000-0000-4000-8000-000000000101', updated_at=now()\n           WHERE transport_request_id='00000000-0000-4000-8000-000000000801';\n          INSERT INTO transport_request_commercial_history (\n            tenant_id,transport_request_id,commercial_terms_id,version,event_type,status,actor_user_id,snapshot,note\n          ) SELECT tenant_id,transport_request_id,id,3,'approved','approved','00000000-0000-4000-8000-000000000101','{\"status\":\"approved\"}'::jsonb,'Gate approved'\n              FROM transport_request_commercial_terms\n             WHERE transport_request_id='00000000-0000-4000-8000-000000000801';\n\n          DO $$ DECLARE s text; v integer; h integer; BEGIN\n            SELECT status::text, version INTO s, v FROM transport_request_commercial_terms\n             WHERE transport_request_id='00000000-0000-4000-8000-000000000801';\n            SELECT count(*) INTO h FROM transport_request_commercial_history\n             WHERE transport_request_id='00000000-0000-4000-8000-000000000801';\n            IF s <> 'approved' OR v <> 3 THEN RAISE EXCEPTION 'Commercial approval state is invalid: % v%', s, v; END IF;\n            IF h <> 3 THEN RAISE EXCEPTION 'Commercial history must contain 3 versions, got %', h; END IF;\n          END $$;\n          SQL\n"
          once(anchor, commercial)

          once("          set +e\n          cargo_cross_tenant_output=\"$(psql \"$APP_DATABASE_URL\" -v ON_ERROR_STOP=1 2>&1 <<'SQL'\n",
               "          set +e\n          commercial_cross_tenant_output=\"$(psql \"$APP_DATABASE_URL\" -v ON_ERROR_STOP=1 2>&1 <<'SQL'\n          SELECT set_config('app.user_id','00000000-0000-4000-8000-000000000101',false);\n          SELECT set_config('app.tenant_id','00000000-0000-4000-8000-000000000001',false);\n          INSERT INTO transport_request_commercial_terms (tenant_id,transport_request_id,target_carrier_freight,payment_terms,created_by_user_id,updated_by_user_id)\n          VALUES ('00000000-0000-4000-8000-000000000002','00000000-0000-4000-8000-000000000801',1000,'Pix','00000000-0000-4000-8000-000000000101','00000000-0000-4000-8000-000000000101');\n          SQL\n          )\"\n          commercial_cross_tenant_status=$?\n          set -e\n          if [[ \"$commercial_cross_tenant_status\" -eq 0 ]] || ! grep -qi \"row-level security policy\" <<<\"$commercial_cross_tenant_output\"; then\n            echo \"Cross-tenant commercial terms RLS rejection did not behave as expected.\" >&2\n            echo \"$commercial_cross_tenant_output\" >&2\n            exit 1\n          fi\n\n          set +e\n          history_update_output=\"$(psql \"$APP_DATABASE_URL\" -v ON_ERROR_STOP=1 2>&1 <<'SQL'\n          SELECT set_config('app.user_id','00000000-0000-4000-8000-000000000101',false);\n          SELECT set_config('app.tenant_id','00000000-0000-4000-8000-000000000001',false);\n          UPDATE transport_request_commercial_history SET note='tampered';\n          SQL\n          )\"\n          history_update_status=$?\n          set -e\n          if [[ \"$history_update_status\" -eq 0 ]] || ! grep -qi \"permission denied\" <<<\"$history_update_output\"; then\n            echo \"Commercial history must be append-only for nexora_app.\" >&2\n            echo \"$history_update_output\" >&2\n            exit 1\n          fi\n\n          set +e\n          cargo_cross_tenant_output=\"$(psql \"$APP_DATABASE_URL\" -v ON_ERROR_STOP=1 2>&1 <<'SQL'\n")

          once("          set +e\n          cargo_request_fk_output=\"$(psql \"$OWNER_DATABASE_URL\" -v ON_ERROR_STOP=1 2>&1 <<'SQL'\n",
               "          set +e\n          commercial_request_fk_output=\"$(psql \"$OWNER_DATABASE_URL\" -v ON_ERROR_STOP=1 2>&1 <<'SQL'\n          INSERT INTO transport_request_commercial_terms (tenant_id,transport_request_id,target_carrier_freight,payment_terms,created_by_user_id,updated_by_user_id)\n          VALUES ('00000000-0000-4000-8000-000000000002','00000000-0000-4000-8000-000000000801',1000,'Pix','00000000-0000-4000-8000-000000000101','00000000-0000-4000-8000-000000000101');\n          SQL\n          )\"\n          commercial_request_fk_status=$?\n          set -e\n          if [[ \"$commercial_request_fk_status\" -eq 0 ]] || ! grep -qi \"transport_request_commercial_terms_request_fk\" <<<\"$commercial_request_fk_output\"; then\n            echo \"Cross-tenant commercial request FK rejection did not behave as expected.\" >&2\n            echo \"$commercial_request_fk_output\" >&2\n            exit 1\n          fi\n\n          set +e\n          cargo_request_fk_output=\"$(psql \"$OWNER_DATABASE_URL\" -v ON_ERROR_STOP=1 2>&1 <<'SQL'\n")

          once('      - name: Gate summary\n        run: echo "Neon database gate passed through NEX-31 cargo profiles."\n',
               '      - name: Gate summary\n        run: echo "Neon database gate passed through NEX-32 commercial terms."\n')
          path.write_text(text)
          PY

      - name: Publish rendered gate as Git blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(base64 -w0 .github/workflows/neon-pr-gate.yml)"
          body="$(python - "$payload" <<'PY'
          import json, sys
          print(json.dumps({'content': sys.argv[1], 'encoding': 'base64'}))
          PY
          )"
          response="$(curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/git/blobs \
            -d "$body")"
          sha="$(python - "$response" <<'PY'
          import json, sys
          print(json.loads(sys.argv[1])['sha'])
          PY
          )"
          echo "RENDERED_GATE_BLOB_SHA=$sha"
