name: Wave 0023 Lint Fix

on:
  push:
    branches:
      - feat/database-wave-0023-trip-execution
    paths:
      - .github/workflows/wave-0023-lint-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/database-wave-0023-trip-execution
      - name: Remove unused import
        run: |
          sed -i '/^  integer,$/d' packages/database/src/schema/trip-execution.ts
          git diff --check
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/database/src/schema/trip-execution.ts
          git commit -m 'fix(database): remove unused Wave 0023 import'
          git push --no-verify origin HEAD:feat/database-wave-0023-trip-execution
