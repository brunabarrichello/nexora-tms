name: NEX-45 Build Tracking Slice

on:
  push:
    branches:
      - feat/nex-45-tracking-eta
    paths:
      - '.github/workflows/nex45-build.yml'
      - 'ops/nex45-build.py'

permissions:
  contents: write

jobs:
  build-slice:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/nex-45-tracking-eta
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NEX-45 slice and qualify locally
        run: python3 ops/nex45-build.py

      - name: Commit generated slice
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/trips packages/database/src/schema/trip-execution.ts packages/database/migrations docs/data/nex-45-tracking-eta.md
          git diff --cached --quiet && { echo 'No generated changes'; exit 1; }
          git commit -m 'feat(trips): implement NEX-45 external tracking and ETA'
          git push origin HEAD:feat/nex-45-tracking-eta
