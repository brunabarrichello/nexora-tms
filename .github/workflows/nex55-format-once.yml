name: NEX-55 Format Once

on:
  push:
    branches:
      - feat/nex-55-async-retries-idempotency
    paths:
      - '.github/workflows/nex55-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/nex-55-async-retries-idempotency
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format NEX-55 files and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            apps/api/src/reliability/async-admin.controller.ts \
            apps/api/src/reliability/async-admin.integration.ts \
            apps/api/src/reliability/async-admin.service.ts \
            apps/api/src/reliability/async-admin.types.ts \
            apps/web/app/_actions/async-admin-actions.ts \
            apps/web/app/administracao/integracoes/processamento/page.tsx
          rm .github/workflows/nex55-format-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config core.hooksPath /dev/null
          git add -A
          git commit -m 'style(async): normalize NEX-55 files'
          git push origin HEAD:feat/nex-55-async-retries-idempotency
