name: RBAC Format Preview

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/api/src/tenancy/tenant-rbac.integration.ts'
      - '.github/workflows/rbac-format-preview.yml'

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
      - run: pnpm install --frozen-lockfile
      - name: Print canonical formatted file
        run: |
          pnpm exec prettier --write apps/api/src/tenancy/tenant-rbac.integration.ts
          cat apps/api/src/tenancy/tenant-rbac.integration.ts
