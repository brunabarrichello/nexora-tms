name: Wave 0021 API Lint Fix

on:
  push:
    branches:
      - feat/database-wave-0021-negotiation-complement
    paths:
      - .github/workflows/wave-0021-api-lint-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/database-wave-0021-negotiation-complement

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove unused type import
        shell: bash
        run: |
          set -euo pipefail
          target='apps/api/src/negotiation/negotiation-collaboration.service.ts'
          grep -q "  type NegotiationUserMessageKind," "$target"
          sed -i "/  type NegotiationUserMessageKind,/d" "$target"
          ! grep -q "type NegotiationUserMessageKind" "$target"

      - name: Lint
        run: pnpm lint

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/negotiation/negotiation-collaboration.service.ts
          git diff --cached --check
          git commit -m 'fix(api): remove unused negotiation type import'
          git push origin HEAD:feat/database-wave-0021-negotiation-complement
