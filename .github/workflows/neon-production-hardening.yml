name: Neon Production Hardening

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type HARDEN-PRODUCTION to configure canonical Production retention, protection and perimeter
        required: true
        type: string
      allowed_ips:
        description: Comma-separated Railway Production static outbound IPv4 addresses (individual IPs or /32 CIDRs only)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: neon-production-hardening
  cancel-in-progress: false

env:
  NEON_PROJECT_ID: raspy-river-76339604
  PRODUCTION_HISTORY_SECONDS: 2592000

jobs:
  harden:
    name: Harden canonical Neon production branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production

    steps:
      - name: Validate explicit hardening confirmation
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.confirmation }}" == "HARDEN-PRODUCTION" ]] || {
            echo "Explicit confirmation HARDEN-PRODUCTION is required." >&2
            exit 1
          }

      - name: Validate and normalize permanent Railway egress IPs
        id: perimeter
        shell: bash
        env:
          ALLOWED_IPS_INPUT: ${{ inputs.allowed_ips }}
        run: |
          set -euo pipefail
          normalized="$(python3 - <<'PY'
          import ipaddress
          import json
          import os
          import sys

          raw = os.environ.get("ALLOWED_IPS_INPUT", "")
          items = [item.strip() for item in raw.split(",") if item.strip()]
          if not items:
              raise SystemExit("At least one Railway static outbound IPv4 address is required.")

          normalized = []
          for item in items:
              try:
                  if "/" in item:
                      network = ipaddress.ip_network(item, strict=False)
                      if network.version != 4 or network.prefixlen != 32:
                          raise ValueError("only individual IPv4 /32 entries are accepted")
                      value = f"{network.network_address}/32"
                  else:
                      address = ipaddress.ip_address(item)
                      if address.version != 4:
                          raise ValueError("only IPv4 addresses are accepted")
                      value = f"{address}/32"
              except ValueError as exc:
                  print(f"Invalid allowed IP '{item}': {exc}", file=sys.stderr)
                  raise SystemExit(1)

              if value == "0.0.0.0/32":
                  raise SystemExit("0.0.0.0 is not an approved Production egress address.")
              if value not in normalized:
                  normalized.append(value)

          print(json.dumps(normalized, separators=(",", ":")))
          PY
          )"
          [[ "$(jq 'length' <<<"$normalized")" -gt 0 ]] || {
            echo "Normalized allowlist is empty." >&2
            exit 1
          }
          echo "ips_json=$normalized" >> "$GITHUB_OUTPUT"
          echo "Permanent Railway egress allowlist validated with $(jq 'length' <<<"$normalized") IPv4 /32 entrie(s)."

      - name: Resolve canonical root/default production branch
        id: production
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}" || {
            echo "NEON_API_KEY is not configured for the protected production environment." >&2
            exit 1
          }

          branches_json="$(curl -fsS \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches")"
          production_json="$(jq -ec '[.branches[] | select(.name == "production")][0]' <<<"$branches_json")" || {
            echo "Canonical Neon production branch does not exist." >&2
            exit 1
          }

          branch_id="$(jq -er '.id' <<<"$production_json")"
          parent_id="$(jq -r '.parent_id // ""' <<<"$production_json")"
          is_default="$(jq -er '.default' <<<"$production_json")"

          [[ -z "$parent_id" ]] || {
            echo "Hardening is blocked: production must be a root branch." >&2
            exit 1
          }
          [[ "$is_default" == "true" ]] || {
            echo "Hardening is blocked: production must be the default branch." >&2
            exit 1
          }

          echo "branch_id=$branch_id" >> "$GITHUB_OUTPUT"

      - name: Configure 30-day restore window and protected-branch IP perimeter
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          ALLOWED_IPS_JSON: ${{ steps.perimeter.outputs.ips_json }}
        run: |
          set -euo pipefail
          payload="$(jq -cn \
            --argjson history "$PRODUCTION_HISTORY_SECONDS" \
            --argjson ips "$ALLOWED_IPS_JSON" \
            '{project:{history_retention_seconds:$history,settings:{allowed_ips:{ips:$ips,protected_branches_only:true},block_public_connections:false}}}')"

          curl -fsS -X PATCH \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}" >/dev/null

      - name: Protect canonical production branch
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PRODUCTION_BRANCH_ID: ${{ steps.production.outputs.branch_id }}
        run: |
          set -euo pipefail
          curl -fsS -X PATCH \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"branch":{"protected":true}}' \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${PRODUCTION_BRANCH_ID}" >/dev/null

      - name: Verify retention, protection and permanent perimeter
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PRODUCTION_BRANCH_ID: ${{ steps.production.outputs.branch_id }}
          EXPECTED_IPS_JSON: ${{ steps.perimeter.outputs.ips_json }}
        run: |
          set -euo pipefail

          project_json="$(curl -fsS \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}")"
          branches_json="$(curl -fsS \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches")"

          history_seconds="$(jq -er '.project.history_retention_seconds' <<<"$project_json")"
          protected_only="$(jq -er '.project.settings.allowed_ips.protected_branches_only' <<<"$project_json")"
          block_public="$(jq -er '.project.settings.block_public_connections' <<<"$project_json")"
          actual_ips="$(jq -c '.project.settings.allowed_ips.ips | sort' <<<"$project_json")"
          expected_ips="$(jq -c 'sort' <<<"$EXPECTED_IPS_JSON")"

          production_json="$(jq -ec --arg id "$PRODUCTION_BRANCH_ID" '[.branches[] | select(.id == $id)][0]' <<<"$branches_json")"
          parent_id="$(jq -r '.parent_id // ""' <<<"$production_json")"
          is_default="$(jq -er '.default' <<<"$production_json")"
          is_protected="$(jq -er '.protected' <<<"$production_json")"

          [[ "$history_seconds" -eq "$PRODUCTION_HISTORY_SECONDS" ]] || {
            echo "Expected 30-day history (${PRODUCTION_HISTORY_SECONDS}s), found ${history_seconds}s." >&2
            exit 1
          }
          [[ "$protected_only" == "true" ]] || {
            echo "IP Allow must apply only to protected branches." >&2
            exit 1
          }
          [[ "$block_public" == "false" ]] || {
            echo "Public database connectivity must remain enabled for the explicit IP Allow perimeter." >&2
            exit 1
          }
          [[ "$actual_ips" == "$expected_ips" ]] || {
            echo "Configured IP allowlist does not match the approved Railway static egress set." >&2
            exit 1
          }
          [[ -z "$parent_id" && "$is_default" == "true" && "$is_protected" == "true" ]] || {
            echo "Canonical production must be root/default/protected after hardening." >&2
            exit 1
          }

      - name: Production hardening summary
        shell: bash
        run: |
          {
            echo "## Neon Production hardening passed"
            echo ""
            echo "- Branch: production"
            echo "- Topology: root/default/protected"
            echo "- Restore window: 30 days"
            echo "- Permanent perimeter: explicit Railway Production static outbound IPv4 /32 allowlist"
            echo "- IP Allow scope: protected branches only"
            echo "- Versioned migrations applied: no"
            echo "- Railway DATABASE_URL changed: no"
            echo "- API redeployed: no"
          } >> "$GITHUB_STEP_SUMMARY"
