name: NEX-33 Render Neon Gate

on:
  push:
    branches:
      - feature/NEX-33-drivers

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/NEX-33-drivers

      - name: Render permanent gate
        run: python scripts/nex-33-render-neon-gate.py

      - name: Create rendered Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/blob.json
          import json
          from pathlib import Path
          print(json.dumps({
              'content': Path('.github/workflows/neon-pr-gate.yml').read_text(),
              'encoding': 'utf-8',
          }))
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input /tmp/blob.json
