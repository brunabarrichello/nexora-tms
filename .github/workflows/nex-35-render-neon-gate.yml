name: NEX-35 Render Neon Gate

on:
  push:
    branches:
      - feature/NEX-35-driver-vehicle-carrier-links

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/NEX-35-driver-vehicle-carrier-links

      - name: Render NEX-35 permanent Neon gate
        run: |
          python scripts/nex-35-render-neon-gate.py
          cp .github/workflows/neon-pr-gate.yml scripts/.nex-35-neon-gate-rendered.yml
          git checkout -- .github/workflows/neon-pr-gate.yml

      - name: Validate rendered gate
        run: |
          grep -q 'Expected 28 application tables' scripts/.nex-35-neon-gate-rendered.yml
          grep -q 'Expected RLS on 25 tenant-scoped tables' scripts/.nex-35-neon-gate-rendered.yml
          grep -q 'Expected 12 Drizzle migration records' scripts/.nex-35-neon-gate-rendered.yml
          grep -q 'capacity_assignment_status' scripts/.nex-35-neon-gate-rendered.yml
          grep -q 'has_column_privilege' scripts/.nex-35-neon-gate-rendered.yml
          grep -q 'capacity_assignments_active_' scripts/.nex-35-neon-gate-rendered.yml
          grep -q 'capacity_assignments_carrier_party_fk' scripts/.nex-35-neon-gate-rendered.yml
          grep -q 'capacity_assignments_driver_fk' scripts/.nex-35-neon-gate-rendered.yml
          git diff --check

      - name: Commit rendered artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/.nex-35-neon-gate-rendered.yml
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit -m "NEX-35 render permanent Neon gate"
          git push origin HEAD:feature/NEX-35-driver-vehicle-carrier-links
