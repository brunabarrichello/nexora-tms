name: Wave 0023 Format

on:
  push:
    branches:
      - feat/database-wave-0023-trip-execution
    paths:
      - .github/workflows/wave-0023-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/database-wave-0023-trip-execution
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Wave 0023 files
        run: >-
          pnpm exec prettier --write
          apps/api/src/trips/trip-execution.controller.ts
          apps/api/src/trips/trip-execution.integration.ts
          apps/api/src/trips/trip-execution.service.ts
          apps/api/src/trips/trip-execution.validation.spec.ts
          apps/api/src/trips/trip-execution.validation.ts
          packages/database/src/schema/trip-execution.ts

      - name: Commit formatted files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/trips/trip-execution.controller.ts \
            apps/api/src/trips/trip-execution.integration.ts \
            apps/api/src/trips/trip-execution.service.ts \
            apps/api/src/trips/trip-execution.validation.spec.ts \
            apps/api/src/trips/trip-execution.validation.ts \
            packages/database/src/schema/trip-execution.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style(trips): format Wave 0023 implementation"
          git push origin HEAD:feat/database-wave-0023-trip-execution
