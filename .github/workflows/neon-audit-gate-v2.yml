name: Neon Audit Gate v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: neon-ephemeral-branch-capacity
  cancel-in-progress: false

env:
  NEON_PROJECT_ID: raspy-river-76339604
  DATABASE_NAME: nexora

jobs:
  audit:
    name: Audit schema, grants, RLS and immutability
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
      - run: pnpm install --frozen-lockfile
      - name: Create isolated Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: production
          branch_name: pr-${{ github.event.pull_request.number }}-audit-v2-${{ github.run_id }}
          database: neondb
          role: neondb_owner
          api_key: ${{ secrets.NEON_API_KEY }}
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y postgresql-client; fi
      - name: Grant migrator access to nexora
        env:
          ADMIN_DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: |
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SET ROLE nexora_owner;
          GRANT CONNECT ON DATABASE nexora TO nexora_migrator;
          GRANT USAGE, CREATE ON SCHEMA public TO nexora_migrator;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO nexora_migrator;
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO nexora_migrator;
          RESET ROLE;
          SQL
      - name: Resolve migrator connection
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          url="$(npx --yes neonctl@v2 connection-string "pr-${{ github.event.pull_request.number }}-audit-v2-${{ github.run_id }}" --project-id "$NEON_PROJECT_ID" --database-name "$DATABASE_NAME" --role-name nexora_migrator)"
          echo "::add-mask::$url"
          echo "MIGRATOR_DATABASE_URL=$url" >> "$GITHUB_ENV"
      - name: Apply migrations
        run: DATABASE_URL="$MIGRATOR_DATABASE_URL" pnpm --filter @nexora/database db:migrate
      - name: Verify schema, grants and RLS
        run: psql "$MIGRATOR_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/ci/wave-0024-audit-schema.sql
      - name: Verify immutable audit history
        run: psql "$MIGRATOR_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/ci/wave-0024-audit-immutability.sql
      - name: Resolve app connection
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          url="$(npx --yes neonctl@v2 connection-string "pr-${{ github.event.pull_request.number }}-audit-v2-${{ github.run_id }}" --project-id "$NEON_PROJECT_ID" --database-name "$DATABASE_NAME" --role-name nexora_app)"
          echo "::add-mask::$url"
          echo "APP_DATABASE_URL=$url" >> "$GITHUB_ENV"
      - name: Verify runtime RLS isolation
        run: psql "$APP_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/ci/wave-0024-audit-runtime.sql
      - name: Gate summary
        run: |
          echo '## Neon Audit Gate v2 passed' >> "$GITHUB_STEP_SUMMARY"
          echo '- database: nexora' >> "$GITHUB_STEP_SUMMARY"
          echo '- production: untouched' >> "$GITHUB_STEP_SUMMARY"
      - name: Delete isolated Neon branch
        if: ${{ always() && steps.neon.outputs.branch_id != '' }}
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: ${{ steps.neon.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
