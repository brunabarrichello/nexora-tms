name: Reference Data Format Once

on:
  push:
    branches:
      - feat/reference-data-wave-0015-integration

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/reference-data-wave-0015-integration
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format reference-data integration
        run: >-
          pnpm exec prettier --write
          apps/api/src/master-data/master-data.module.ts
          apps/api/src/master-data/reference-data.controller.ts
          apps/api/src/master-data/reference-data.service.ts
          apps/api/src/master-data/reference-data.validation.ts
          apps/api/src/master-data/reference-data.validation.spec.ts
          apps/web/app/_lib/api-client.ts
          apps/web/app/_components/operational-page.tsx
          apps/web/app/cadastros/catalogos/_components/reference-catalog-page.tsx
          apps/web/app/cadastros/catalogos/tipos-veiculo/page.tsx
          apps/web/app/cadastros/catalogos/tipos-carroceria/page.tsx
          apps/web/app/cadastros/catalogos/tipos-carga/page.tsx
          apps/web/app/cadastros/catalogos/tipos-embalagem/page.tsx
          apps/web/app/cadastros/catalogos/tipos-documento/page.tsx
          apps/web/app/cadastros/catalogos/tags/page.tsx
          apps/web/app/cadastros/catalogos/unidades-medida/page.tsx
          apps/web/app/cadastros/catalogos/paises/page.tsx
          apps/web/app/cadastros/catalogos/estados/page.tsx
          apps/web/app/cadastros/catalogos/cidades/page.tsx

      - name: Remove one-time workflow
        run: rm .github/workflows/reference-data-format-once.yml

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/master-data apps/web/app/_lib/api-client.ts apps/web/app/_components/operational-page.tsx apps/web/app/cadastros/catalogos .github/workflows/reference-data-format-once.yml
          git commit -m "style(reference-data): format Wave 0015 integration"
          git push origin HEAD:feat/reference-data-wave-0015-integration
