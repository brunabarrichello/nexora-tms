name: NEX-25 Format

on:
  push:
    branches:
      - feature/NEX-25-business-parties

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/NEX-25-business-parties

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format NEX-25 TypeScript files
        run: >-
          pnpm exec prettier --write
          apps/api/src/master-data/business-party.service.ts
          apps/api/src/master-data/business-party.validation.ts
          apps/api/src/master-data/business-party.validation.spec.ts

      - name: Commit formatted files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/master-data/business-party.service.ts apps/api/src/master-data/business-party.validation.ts apps/api/src/master-data/business-party.validation.spec.ts
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          SKIP_SIMPLE_GIT_HOOKS=1 git commit -m "NEX-25 style(api): format business party implementation"
          SKIP_SIMPLE_GIT_HOOKS=1 git push origin HEAD:feature/NEX-25-business-parties
