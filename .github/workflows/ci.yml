name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nex57-fix:
    if: ${{ github.event.pull_request.number == 175 }}
    name: NEX-57 apply formatting and worker contract fix
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply exact Prettier formatting
        run: |
          pnpm exec prettier --write \
            apps/api/src/notifications/outbound-communications.controller.ts \
            apps/api/src/notifications/outbound-communications.service.ts \
            apps/api/src/notifications/outbound-communications.types.ts \
            apps/api/src/notifications/outbound-communications.validation.ts

      - name: Update worker FakeStore contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/worker/src/runtime.test.ts')
          text = path.read_text()
          if 'async getCommunicationDelivery()' not in text:
              needle = """  async recordWebhookAttempt(): Promise<boolean> {
              return true;
            }
          """
              replacement = needle + """
            async getCommunicationDelivery(): Promise<null> {
              return null;
            }

            async recordCommunicationAttempt(): Promise<boolean> {
              return true;
            }
          """
              if needle not in text:
                  raise SystemExit('FakeStore insertion point not found')
              path.write_text(text.replace(needle, replacement))
          PY
          pnpm exec prettier --write apps/worker/src/runtime.test.ts

      - name: Commit fixes to PR head
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            echo "No NEX-57 fixes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/notifications/outbound-communications.controller.ts \
            apps/api/src/notifications/outbound-communications.service.ts \
            apps/api/src/notifications/outbound-communications.types.ts \
            apps/api/src/notifications/outbound-communications.validation.ts \
            apps/worker/src/runtime.test.ts
          git commit -m "fix(nex-57): satisfy formatting and worker store contract"
          git push origin "HEAD:${BRANCH}"

      - name: Validate corrected tree
        run: |
          pnpm format:check
          pnpm typecheck
