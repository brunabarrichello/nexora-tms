name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Toolchain doctor
        run: node scripts/doctor.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production dependency security audit
        run: pnpm audit:prod

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Commit deterministic formatting
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/nex-61-advanced-kpis' }}
        run: |
          if git diff --quiet; then
            echo "No formatting changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/analytics/advanced-kpis.controller.ts apps/api/src/analytics/advanced-kpis.service.ts apps/api/src/analytics/advanced-kpis.validation.spec.ts apps/api/src/analytics/analytics.module.ts apps/api/src/analytics/financial-analytics.integration.ts apps/api/src/analytics/financial-analytics.service.ts apps/api/src/analytics/operational-report.controller.ts apps/api/src/analytics/operational-report.service.ts apps/api/src/analytics/operational-report.validation.spec.ts apps/web/app/analytics/executivo/page.tsx apps/web/app/analytics/operacoes/page.tsx
          git commit -m "style: format analytics sources"
          git push

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Docker Compose model
        run: docker compose config --quiet

      - name: Generate Drizzle migrations
        if: ${{ hashFiles('packages/database/drizzle.config.ts') != '' }}
        run: pnpm --filter @nexora/database db:generate

      - name: Check Drizzle migrations
        if: ${{ hashFiles('packages/database/drizzle.config.ts') != '' }}
        run: pnpm --filter @nexora/database db:check

      - name: Verify Drizzle artifacts are versioned
        if: ${{ hashFiles('packages/database/drizzle.config.ts') != '' }}
        run: git diff --exit-code -- packages/database/migrations
