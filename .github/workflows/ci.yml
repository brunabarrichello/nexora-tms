name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Toolchain doctor
        run: node scripts/doctor.mjs

      - name: Configure npm registry
        run: pnpm config set registry https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production dependency security audit
        shell: bash
        run: |
          set -uo pipefail

          for attempt in 1 2 3; do
            echo "Security audit attempt ${attempt}/3"
            audit_log="$(mktemp)"

            if pnpm audit:prod 2>&1 | tee "$audit_log"; then
              rm -f "$audit_log"
              echo "Production dependency security audit: PASS"
              exit 0
            fi

            if grep -Eiq 'timeout|timed out|operation was aborted|ECONNRESET|ECONNREFUSED|ETIMEDOUT|ENETUNREACH|EAI_AGAIN|registry.npmjs.org' "$audit_log"; then
              if [ "$attempt" -lt 3 ]; then
                echo "npm advisory registry/network failure detected; retrying in 30 seconds..."
                rm -f "$audit_log"
                sleep 30
                continue
              fi
              echo "Production dependency security audit: FAIL — advisory registry/network unavailable after 3 attempts."
              rm -f "$audit_log"
              exit 2
            fi

            echo "Production dependency security audit: FAIL — vulnerability audit returned a non-network failure."
            rm -f "$audit_log"
            exit 1
          done

          exit 2

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm exec prettier --check . --ignore-unknown

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Docker Compose model
        run: docker compose config --quiet

      - name: Generate Drizzle migrations
        if: ${{ hashFiles('packages/database/drizzle.config.ts') != '' }}
        run: pnpm --filter @nexora/database db:generate

      - name: Check Drizzle migrations
        if: ${{ hashFiles('packages/database/drizzle.config.ts') != '' }}
        run: pnpm --filter @nexora/database db:check

      - name: Verify Drizzle artifacts are versioned
        if: ${{ hashFiles('packages/database/drizzle.config.ts') != '' }}
        run: git diff --exit-code -- packages/database/migrations
