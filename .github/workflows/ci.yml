name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  quality:
    name: Build, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Generate Drizzle migrations
        if: ${{ hashFiles('packages/database/drizzle.config.ts') != '' }}
        run: pnpm --filter @nexora/database db:generate

      - name: Check Drizzle migrations
        if: ${{ hashFiles('packages/database/drizzle.config.ts') != '' }}
        run: pnpm --filter @nexora/database db:check

      - name: Capture generated Drizzle artifacts
        if: ${{ hashFiles('packages/database/drizzle.config.ts') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          find packages/database/migrations -type f -print | sort
          while IFS= read -r file; do
            if [ "$(basename "$file")" = "README.md" ]; then
              continue
            fi
            echo "===BEGIN:${file}==="
            base64 -w0 "$file"
            echo
            echo "===END:${file}==="
          done < <(find packages/database/migrations -type f -print | sort)

      - name: Persist generated Drizzle artifacts to PR branch
        if: ${{ github.event_name == 'pull_request' && hashFiles('packages/database/drizzle.config.ts') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          cp -R packages/database/migrations "$temp_dir/migrations"
          git fetch origin "${GITHUB_HEAD_REF}:${GITHUB_HEAD_REF}"
          git checkout "${GITHUB_HEAD_REF}"
          rm -rf packages/database/migrations
          cp -R "$temp_dir/migrations" packages/database/migrations
          git add packages/database/migrations
          if git diff --cached --quiet; then
            echo "Drizzle artifacts are already versioned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(db): commit generated Drizzle migration artifacts"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
