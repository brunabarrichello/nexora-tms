name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Patch general Neon gate for Wave 0024
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/neon-pr-gate.yml')
          s = p.read_text()
          old = "IF migration_count <> 24 THEN\n              RAISE EXCEPTION 'Expected 24 Drizzle migration records, found %', migration_count;"
          new = "IF migration_count <> 25 THEN\n              RAISE EXCEPTION 'Expected 25 Drizzle migration records, found %', migration_count;"
          if old not in s:
              raise SystemExit('Expected Wave 0023 migration-count guard not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/neon-pr-gate.yml
          git commit -m "chore(ci): expect 25 migrations after Wave 0024"
          git push origin HEAD:${{ github.head_ref }}
