name: Wave 0021 Format Fix

# Temporary formatter trigger; remove after clean formatting is committed.
on:
  push:
    branches:
      - feat/database-wave-0021-negotiation-complement
    paths:
      - .github/workflows/wave-0021-format-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/database-wave-0021-negotiation-complement

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Wave 0021 API files
        run: |
          pnpm exec prettier --write \
            apps/api/src/negotiation/negotiation-collaboration.service.ts \
            apps/api/src/negotiation/negotiation-collaboration.validation.ts
          pnpm lint
          pnpm format:check

      - name: Show formatting diff
        if: always()
        run: git diff -- apps/api/src/negotiation/negotiation-collaboration.service.ts apps/api/src/negotiation/negotiation-collaboration.validation.ts || true

      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/negotiation/negotiation-collaboration.service.ts apps/api/src/negotiation/negotiation-collaboration.validation.ts
          git diff --cached --check
          git commit -m 'style(api): format Wave 0021 negotiation collaboration'
          git push --no-verify origin HEAD:feat/database-wave-0021-negotiation-complement
