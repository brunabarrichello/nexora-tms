name: Temporary NEX-81 Formatter

on:
  push:
    branches:
      - hardening/nex-81-api-security

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip-nex81-format]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hardening/nex-81-api-security
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
      - run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier
        run: >-
          pnpm exec prettier --write
          apps/api/src/security/api-security.middleware.ts
          apps/api/src/security/api-security.middleware.spec.ts
          docs/operations/api-security-and-secret-rotation.md
      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/security/api-security.middleware.ts \
            apps/api/src/security/api-security.middleware.spec.ts \
            docs/operations/api-security-and-secret-rotation.md
          git commit -m 'chore: apply canonical NEX-81 formatting [skip-nex81-format]'
          git push origin HEAD:hardening/nex-81-api-security
