name: Feature request
description: Propose a new capability or improvement for Nexora TMS
title: '[Feature]: '
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user, operational, product, or technical problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior or capability without over-constraining implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that define success.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and risks
      description: Note relevant modules, integrations, security, tenant isolation, migration, or rollout concerns.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, references, or related issues when useful.
