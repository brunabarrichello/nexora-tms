name: nexora-tms

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: nexora
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: local-only-nexora
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./ops/docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-nexora-runtime-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    profiles: ["application"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://nexora:local-only-nexora@postgres:5432/nexora
    command: ["pnpm", "--filter", "@nexora/database", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["application"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://nexora_app:local-only-nexora-app@postgres:5432/nexora
      DATABASE_POOL_MAX: 10
      AUTH_DATABASE_POOL_MAX: 4
      OIDC_PROVIDER_KEY: ${OIDC_PROVIDER_KEY:-auth0}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_ALLOWED_ALGORITHMS: ${OIDC_ALLOWED_ALGORITHMS:-RS256}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3001:3001"

  web:
    profiles: ["application"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: development
      NEXORA_API_BASE_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

  worker:
    profiles: ["application"]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://nexora_app:local-only-nexora-app@postgres:5432/nexora
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
