name: Neon Database Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "packages/database/**"
      - "apps/api/src/freight/**"
      - "apps/api/src/capacity/**"
      - "apps/api/src/negotiation/**"
      - "pnpm-workspace.yaml"
      - ".github/workflows/neon-pr-gate.yml"

permissions:
  contents: read

concurrency:
  group: neon-db-gate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NEON_PROJECT_ID: raspy-river-76339604

jobs:
  isolated-migration-rls:
    name: Isolated migration and RLS
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Neon API secret
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}" || {
            echo "NEON_API_KEY repository secret is not configured." >&2
            exit 1
          }

      - name: Set ephemeral branch name and expiry
        shell: bash
        run: |
          set -euo pipefail
          echo "NEON_TEST_BRANCH=pr-${{ github.event.pull_request.number }}-db-${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "NEON_TEST_EXPIRES_AT=$(date -u --date '+2 hours' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create isolated Neon branch with admin connection
        id: create-neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: main
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: neondb
          role: neondb_owner
          expires_at: ${{ env.NEON_TEST_EXPIRES_AT }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Bootstrap isolated DDL capability
        shell: bash
        env:
          ADMIN_DATABASE_URL: ${{ steps.create-neon.outputs.db_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ADMIN_DATABASE_URL"
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT CREATE ON DATABASE neondb TO nexora_owner;
          GRANT USAGE, CREATE ON SCHEMA public TO nexora_owner;
          SQL
          capabilities="$(psql "$ADMIN_DATABASE_URL" -At -F ':' -c "select has_database_privilege('nexora_owner', current_database(), 'CREATE'), has_schema_privilege('nexora_owner','public','CREATE')")"
          [[ "$capabilities" == "t:t" ]] || {
            echo "nexora_owner DDL capability bootstrap failed: $capabilities" >&2
            exit 1
          }

      - name: Resolve migrator connection on isolated branch
        id: migrator-connection
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: main
          branch_name: ${{ env.NEON_TEST_BRANCH }}
          database: neondb
          role: nexora_migrator
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Resolve migration capability
        shell: bash
        env:
          MIGRATOR_DATABASE_URL: ${{ steps.migrator-connection.outputs.db_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$MIGRATOR_DATABASE_URL"
          if [[ "$MIGRATOR_DATABASE_URL" == *"?"* ]]; then
            OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}&options=-c%20role%3Dnexora_owner"
          else
            OWNER_DATABASE_URL="${MIGRATOR_DATABASE_URL}?options=-c%20role%3Dnexora_owner"
          fi
          echo "::add-mask::$OWNER_DATABASE_URL"
          roles="$(psql "$OWNER_DATABASE_URL" -Atqc "select session_user || ':' || current_user")"
          [[ "$roles" == "nexora_migrator:nexora_owner" ]] || {
            echo "Unexpected migration role chain: $roles" >&2
            exit 1
          }
          echo "OWNER_DATABASE_URL=$OWNER_DATABASE_URL" >> "$GITHUB_ENV"

      - name: Apply full versioned Drizzle migration chain
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL="$OWNER_DATABASE_URL" pnpm --filter @nexora/database db:migrate

      - name: Verify migration ledger, schema, RLS and runtime grants
        shell: bash
        run: |
          set -euo pipefail
          psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            table_count integer;
            rls_count integer;
            migration_count integer;
            request_enum_count integer;
            stop_enum_count integer;
            commercial_enum_count integer;
            driver_registration_enum_count integer;
            driver_operational_enum_count integer;
            capacity_asset_kind_enum_count integer;
            capacity_asset_status_enum_count integer;
            capacity_assignment_enum_count integer;
            freight_proposal_kind_enum_count integer;
            freight_proposal_status_enum_count integer;
          BEGIN
            SELECT count(*) INTO table_count
              FROM information_schema.tables
             WHERE table_schema='public'
               AND table_name IN (
                 'tenants','tenant_settings','organizations','business_units','users',
                 'external_identities','memberships','permissions','roles','role_permissions',
                 'membership_roles','membership_organization_scopes','membership_business_unit_scopes',
                 'business_parties','business_party_roles','business_party_audit',
                 'business_party_addresses','business_party_contacts','transport_requests',
                 'transport_request_stops','transport_request_cargo_profiles',
                 'transport_request_commercial_terms','transport_request_commercial_history','drivers','driver_audit','capacity_assets','capacity_asset_audit','capacity_assignments','freight_proposals','freight_proposal_events'
               );
            IF table_count <> 30 THEN
              RAISE EXCEPTION 'Expected 30 application tables, found %', table_count;
            END IF;

            SELECT count(*) INTO rls_count
              FROM pg_class c
              JOIN pg_namespace n ON n.oid=c.relnamespace
             WHERE n.nspname='public'
               AND c.relname IN (
                 'tenants','tenant_settings','organizations','business_units','memberships',
                 'roles','role_permissions','membership_roles',
                 'membership_organization_scopes','membership_business_unit_scopes',
                 'business_parties','business_party_roles','business_party_audit',
                 'business_party_addresses','business_party_contacts','transport_requests',
                 'transport_request_stops','transport_request_cargo_profiles',
                 'transport_request_commercial_terms','transport_request_commercial_history','drivers','driver_audit','capacity_assets','capacity_asset_audit','capacity_assignments','freight_proposals','freight_proposal_events'
               )
               AND c.relrowsecurity;
            IF rls_count <> 27 THEN
              RAISE EXCEPTION 'Expected RLS on 27 tenant-scoped tables, found %', rls_count;
            END IF;

            SELECT count(*) INTO migration_count FROM drizzle.__drizzle_migrations;
            IF migration_count <> 13 THEN
              RAISE EXCEPTION 'Expected 13 Drizzle migration records, found %', migration_count;
            END IF;

            SELECT count(*) INTO request_enum_count
              FROM pg_type t JOIN pg_enum e ON e.enumtypid=t.oid
             WHERE t.typname='transport_request_status'
               AND e.enumlabel IN ('draft','ready_for_quote','in_negotiation','contracted','cancelled');
            IF request_enum_count <> 5 THEN
              RAISE EXCEPTION 'Expected five transport request status values, found %', request_enum_count;
            END IF;

            SELECT count(*) INTO stop_enum_count
              FROM pg_type t JOIN pg_enum e ON e.enumtypid=t.oid
             WHERE t.typname='transport_stop_type'
               AND e.enumlabel IN ('pickup','delivery','support');
            IF stop_enum_count <> 3 THEN
              RAISE EXCEPTION 'Expected three transport stop type values, found %', stop_enum_count;
            END IF;

            SELECT count(*) INTO commercial_enum_count
              FROM pg_type t JOIN pg_enum e ON e.enumtypid=t.oid
             WHERE t.typname='commercial_terms_status'
               AND e.enumlabel IN ('draft','pending_approval','approved','rejected');
            IF commercial_enum_count <> 4 THEN
              RAISE EXCEPTION 'Expected four commercial terms status values, found %', commercial_enum_count;
            END IF;

            SELECT count(*) INTO driver_registration_enum_count
              FROM pg_type t JOIN pg_enum e ON e.enumtypid=t.oid
             WHERE t.typname='driver_registration_status'
               AND e.enumlabel IN ('pending','qualified','blocked','inactive');
            IF driver_registration_enum_count <> 4 THEN
              RAISE EXCEPTION 'Expected four driver registration status values, found %', driver_registration_enum_count;
            END IF;

            SELECT count(*) INTO driver_operational_enum_count
              FROM pg_type t JOIN pg_enum e ON e.enumtypid=t.oid
             WHERE t.typname='driver_operational_status'
               AND e.enumlabel IN ('active','blocked','inactive');
            IF driver_operational_enum_count <> 3 THEN
              RAISE EXCEPTION 'Expected three driver operational status values, found %', driver_operational_enum_count;
            END IF;

            SELECT count(*) INTO capacity_asset_kind_enum_count
              FROM pg_type t JOIN pg_enum e ON e.enumtypid=t.oid
             WHERE t.typname='capacity_asset_kind'
               AND e.enumlabel IN ('vehicle','implement');
            IF capacity_asset_kind_enum_count <> 2 THEN
              RAISE EXCEPTION 'Expected two capacity asset kind values, found %', capacity_asset_kind_enum_count;
            END IF;

            SELECT count(*) INTO capacity_asset_status_enum_count
              FROM pg_type t JOIN pg_enum e ON e.enumtypid=t.oid
             WHERE t.typname='capacity_asset_status'
               AND e.enumlabel IN ('active','blocked','inactive');
            IF capacity_asset_status_enum_count <> 3 THEN
              RAISE EXCEPTION 'Expected three capacity asset status values, found %', capacity_asset_status_enum_count;
            END IF;

            SELECT count(*) INTO capacity_assignment_enum_count
              FROM pg_type t JOIN pg_enum e ON e.enumtypid=t.oid
             WHERE t.typname='capacity_assignment_status'
               AND e.enumlabel IN ('active','ended','cancelled');
            IF capacity_assignment_enum_count <> 3 THEN
              RAISE EXCEPTION 'Expected three capacity assignment status values, found %', capacity_assignment_enum_count;
            END IF;

            SELECT count(*) INTO freight_proposal_kind_enum_count
              FROM pg_type t JOIN pg_enum e ON e.enumtypid=t.oid
             WHERE t.typname='freight_proposal_kind'
               AND e.enumlabel IN ('proposal','counterproposal');
            IF freight_proposal_kind_enum_count <> 2 THEN
              RAISE EXCEPTION 'Expected two freight proposal kind values, found %', freight_proposal_kind_enum_count;
            END IF;

            SELECT count(*) INTO freight_proposal_status_enum_count
              FROM pg_type t JOIN pg_enum e ON e.enumtypid=t.oid
             WHERE t.typname='freight_proposal_status'
               AND e.enumlabel IN ('open','accepted','rejected','expired');
            IF freight_proposal_status_enum_count <> 4 THEN
              RAISE EXCEPTION 'Expected four freight proposal status values, found %', freight_proposal_status_enum_count;
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_roles
               WHERE rolname='nexora_app' AND rolcanlogin AND NOT rolbypassrls
            ) THEN
              RAISE EXCEPTION 'nexora_app must be LOGIN and must not BYPASSRLS';
            END IF;

            IF EXISTS (
              SELECT 1
                FROM pg_class c
                JOIN pg_namespace n ON n.oid=c.relnamespace
                JOIN pg_roles r ON r.oid=c.relowner
               WHERE n.nspname='public'
                 AND c.relname IN (
                   'tenants','organizations','business_units','memberships','roles',
                   'business_parties','business_party_roles','business_party_audit',
                   'business_party_addresses','business_party_contacts','transport_requests',
                   'transport_request_stops','transport_request_cargo_profiles',
                   'transport_request_commercial_terms','transport_request_commercial_history','drivers','driver_audit','capacity_assets','capacity_asset_audit','capacity_assignments','freight_proposals','freight_proposal_events'
                 )
                 AND r.rolname='nexora_app'
            ) THEN
              RAISE EXCEPTION 'nexora_app must not own application tables';
            END IF;

            IF NOT has_table_privilege('nexora_app','public.tenants','SELECT')
               OR has_table_privilege('nexora_app','public.tenants','INSERT')
               OR NOT has_table_privilege('nexora_app','public.business_parties','SELECT')
               OR NOT has_table_privilege('nexora_app','public.business_parties','INSERT')
               OR NOT has_table_privilege('nexora_app','public.business_parties','UPDATE')
               OR has_table_privilege('nexora_app','public.business_parties','DELETE')
               OR NOT has_table_privilege('nexora_app','public.business_party_addresses','SELECT')
               OR NOT has_table_privilege('nexora_app','public.business_party_addresses','INSERT')
               OR NOT has_table_privilege('nexora_app','public.business_party_addresses','UPDATE')
               OR has_table_privilege('nexora_app','public.business_party_addresses','DELETE')
               OR NOT has_table_privilege('nexora_app','public.business_party_contacts','SELECT')
               OR NOT has_table_privilege('nexora_app','public.business_party_contacts','INSERT')
               OR NOT has_table_privilege('nexora_app','public.business_party_contacts','UPDATE')
               OR has_table_privilege('nexora_app','public.business_party_contacts','DELETE')
               OR NOT has_table_privilege('nexora_app','public.transport_requests','SELECT')
               OR NOT has_table_privilege('nexora_app','public.transport_requests','INSERT')
               OR NOT has_table_privilege('nexora_app','public.transport_requests','UPDATE')
               OR has_table_privilege('nexora_app','public.transport_requests','DELETE')
               OR NOT has_table_privilege('nexora_app','public.transport_request_stops','SELECT')
               OR NOT has_table_privilege('nexora_app','public.transport_request_stops','INSERT')
               OR NOT has_table_privilege('nexora_app','public.transport_request_stops','UPDATE')
               OR NOT has_table_privilege('nexora_app','public.transport_request_stops','DELETE')
               OR NOT has_table_privilege('nexora_app','public.transport_request_cargo_profiles','SELECT')
               OR NOT has_table_privilege('nexora_app','public.transport_request_cargo_profiles','INSERT')
               OR NOT has_table_privilege('nexora_app','public.transport_request_cargo_profiles','UPDATE')
               OR has_table_privilege('nexora_app','public.transport_request_cargo_profiles','DELETE')
               OR NOT has_table_privilege('nexora_app','public.transport_request_commercial_terms','SELECT')
               OR NOT has_table_privilege('nexora_app','public.transport_request_commercial_terms','INSERT')
               OR NOT has_table_privilege('nexora_app','public.transport_request_commercial_terms','UPDATE')
               OR has_table_privilege('nexora_app','public.transport_request_commercial_terms','DELETE')
               OR NOT has_table_privilege('nexora_app','public.transport_request_commercial_history','SELECT')
               OR NOT has_table_privilege('nexora_app','public.transport_request_commercial_history','INSERT')
               OR has_table_privilege('nexora_app','public.transport_request_commercial_history','UPDATE')
               OR has_table_privilege('nexora_app','public.transport_request_commercial_history','DELETE')
               OR NOT has_table_privilege('nexora_app','public.drivers','SELECT')
               OR NOT has_table_privilege('nexora_app','public.drivers','INSERT')
               OR NOT has_table_privilege('nexora_app','public.drivers','UPDATE')
               OR has_table_privilege('nexora_app','public.drivers','DELETE')
               OR NOT has_table_privilege('nexora_app','public.driver_audit','SELECT')
               OR NOT has_table_privilege('nexora_app','public.driver_audit','INSERT')
               OR has_table_privilege('nexora_app','public.driver_audit','UPDATE')
               OR has_table_privilege('nexora_app','public.driver_audit','DELETE')
               OR NOT has_table_privilege('nexora_app','public.capacity_assets','SELECT')
               OR NOT has_table_privilege('nexora_app','public.capacity_assets','INSERT')
               OR NOT has_table_privilege('nexora_app','public.capacity_assets','UPDATE')
               OR has_table_privilege('nexora_app','public.capacity_assets','DELETE')
               OR NOT has_table_privilege('nexora_app','public.capacity_asset_audit','SELECT')
               OR NOT has_table_privilege('nexora_app','public.capacity_asset_audit','INSERT')
               OR has_table_privilege('nexora_app','public.capacity_asset_audit','UPDATE')
               OR has_table_privilege('nexora_app','public.capacity_asset_audit','DELETE')
               OR NOT has_table_privilege('nexora_app','public.capacity_assignments','SELECT')
               OR NOT has_table_privilege('nexora_app','public.capacity_assignments','INSERT')
               OR has_table_privilege('nexora_app','public.capacity_assignments','UPDATE')
               OR has_table_privilege('nexora_app','public.capacity_assignments','DELETE')
               OR NOT has_column_privilege('nexora_app','public.capacity_assignments','status','UPDATE')
               OR NOT has_column_privilege('nexora_app','public.capacity_assignments','ends_at','UPDATE')
               OR NOT has_column_privilege('nexora_app','public.capacity_assignments','status_reason','UPDATE')
               OR NOT has_column_privilege('nexora_app','public.capacity_assignments','updated_by_user_id','UPDATE')
               OR NOT has_column_privilege('nexora_app','public.capacity_assignments','updated_at','UPDATE')
               OR has_column_privilege('nexora_app','public.capacity_assignments','tenant_id','UPDATE')
               OR has_column_privilege('nexora_app','public.capacity_assignments','driver_id','UPDATE')
               OR has_column_privilege('nexora_app','public.capacity_assignments','vehicle_id','UPDATE')
               OR has_column_privilege('nexora_app','public.capacity_assignments','carrier_party_id','UPDATE')
               OR has_column_privilege('nexora_app','public.capacity_assignments','starts_at','UPDATE')
               OR NOT has_table_privilege('nexora_app','public.freight_proposals','SELECT')
               OR NOT has_table_privilege('nexora_app','public.freight_proposals','INSERT')
               OR has_table_privilege('nexora_app','public.freight_proposals','UPDATE')
               OR has_table_privilege('nexora_app','public.freight_proposals','DELETE')
               OR NOT has_table_privilege('nexora_app','public.freight_proposal_events','SELECT')
               OR NOT has_table_privilege('nexora_app','public.freight_proposal_events','INSERT')
               OR has_table_privilege('nexora_app','public.freight_proposal_events','UPDATE')
               OR has_table_privilege('nexora_app','public.freight_proposal_events','DELETE') THEN
              RAISE EXCEPTION 'nexora_app runtime privilege matrix is incorrect';
            END IF;
          END $$;
          SQL

      - name: Seed isolated tenant fixtures
        shell: bash
        run: |
          set -euo pipefail
          psql "$OWNER_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
