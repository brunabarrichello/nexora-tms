          if [[ "$contact_fk_status" -eq 0 ]] || ! grep -qi "transport_request_stops_contact_fk" <<<"$contact_fk_output"; then
            echo "Cross-party route contact FK rejection did not behave as expected." >&2
            echo "$contact_fk_output" >&2
            exit 1
          fi

      - name: Gate summary
        run: echo "Neon database gate passed through NEX-38 append-only freight proposal negotiation history."

      - name: Delete isolated Neon branch
        if: always()
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: ${{ env.NEON_TEST_BRANCH }}
          api_key: ${{ secrets.NEON_API_KEY }}
